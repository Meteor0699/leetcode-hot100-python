  <div class="body" id="body-200" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">给 &#96;0/1&#96; 网格，&#96;1&#96; 连成一块算一个岛，求岛的数量（上下左右相邻）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">扫每个格子，遇到一个没访问过的 &#96;1&#96; 就答案 +1，然后用 BFS 把整块「淹掉」（改成 &#96;0&#96;），这样同一块不会被重复计数。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(mn)&#96;；空间 &#96;O(mn)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-200',this)">复制</button></div><pre id="code-200"><code>␀<span class="syn-num">1</span>␀ collections ␀<span class="syn-num">2</span>␀ deque

␀<span class="syn-num">3</span>␀ Solution:
    ␀<span class="syn-num">4</span>␀ numIslands(␀<span class="syn-num">5</span>␀, grid):
        ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀ grid ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀ grid[<span class="syn-num">0</span>]:
            ␀<span class="syn-num">10</span>␀ <span class="syn-num">0</span>
        m, n = ␀<span class="syn-num">24</span>␀(grid), ␀<span class="syn-num">25</span>␀(grid[<span class="syn-num">0</span>])
        dirs = [(<span class="syn-num">0</span>, <span class="syn-num">1</span>), (<span class="syn-num">0</span>, -<span class="syn-num">1</span>), (<span class="syn-num">1</span>, <span class="syn-num">0</span>), (-<span class="syn-num">1</span>, <span class="syn-num">0</span>)]
        cnt = <span class="syn-num">0</span>
        ␀<span class="syn-num">11</span>␀ r ␀<span class="syn-num">12</span>␀ ␀<span class="syn-num">26</span>␀(m):
            ␀<span class="syn-num">13</span>␀ c ␀<span class="syn-num">14</span>␀ ␀<span class="syn-num">27</span>␀(n):
                ␀<span class="syn-num">15</span>␀ grid[r][c] != &quot;<span class="syn-num">1</span>&quot;:
                    ␀<span class="syn-num">16</span>␀
                cnt += <span class="syn-num">1</span>
                q = deque([(r, c)])
                grid[r][c] = &quot;<span class="syn-num">0</span>&quot;           ␀<span class="syn-num">0</span>␀
                ␀<span class="syn-num">17</span>␀ q:
                    x, y = q.popleft()
                    ␀<span class="syn-num">18</span>␀ dx, dy ␀<span class="syn-num">19</span>␀ dirs:
                        nx, ny = x + dx, y + dy
                        ␀<span class="syn-num">20</span>␀ <span class="syn-num">0</span> &lt;= nx &lt; m ␀<span class="syn-num">21</span>␀ <span class="syn-num">0</span> &lt;= ny &lt; n ␀<span class="syn-num">22</span>␀ grid[nx][ny] == &quot;<span class="syn-num">1</span>&quot;:
                            grid[nx][ny] = &quot;<span class="syn-num">0</span>&quot;
                            q.append((nx, ny))
        ␀<span class="syn-num">23</span>␀ cnt</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">**入队时就要标记**，等出队才标记会让同一个格子被多个邻居重复入队。</div></div>
  </div>
</article>
<article class="card" data-num="206" data-diff="简单" data-topic="链表与树" data-search="反转链表反转单链表，返回新的头节点。">

    <div class="blk"><div class="lbl">题意</div><div class="txt">反转单链表，返回新的头节点。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">三个变量 &#96;pre&#96;（已经反转好的部分）、&#96;cur&#96;（当前处理的）、&#96;nxt&#96;（临时存住下一个）。每轮先把 &#96;cur.next&#96; 改指向 &#96;pre&#96;，然后三个一起往前挪。 手动模拟 &#96;1 -&gt; 2 -&gt; 3&#96;： | 轮 | cur | nxt | 改完后 cur.next | pre | 新 cur | |---|---|---|---|---|---| | 1 | 1 | 2 | None | 1 | 2 | | 2 | 2 | 3 | 1 | 2 | 3 | | 3 | 3 | None | 2 | 3 | None |</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-206',this)">复制</button></div><pre id="code-206"><code>␀<span class="syn-num">2</span>␀ Solution:
    ␀<span class="syn-num">3</span>␀ reverseList(␀<span class="syn-num">4</span>␀, head):
        pre = ␀<span class="syn-num">5</span>␀
        cur = head
        ␀<span class="syn-num">6</span>␀ cur ␀<span class="syn-num">7</span>␀ ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀:
            nxt = cur.next      ␀<span class="syn-num">0</span>␀
            cur.next = pre
            pre, cur = cur, nxt
        ␀<span class="syn-num">10</span>␀ pre              ␀<span class="syn-num">1</span>␀</code></pre></div>
    
  </div>
</article>
<article class="card" data-num="207" data-diff="中等" data-topic="回溯图论DP" data-search="课程表有 n 门课，先修关系 &#96;[a, b]&#96; 表示「学 a 之前要学 b」，判断能否修完所有课。">
  <div class="head" onclick="tog(207)">
    <span class="num">0207</span>
    <span class="ttl">课程表</span>
    <span class="badge b-中等">中等</span>

  <div class="body" id="body-207" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">有 n 门课，先修关系 &#96;[a, b]&#96; 表示「学 a 之前要学 b」，判断能否修完所有课。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">**拓扑排序**。把关系看成有向边 &#96;b -&gt; a&#96;。维护每个节点的「入度」（还有几门先修课没学），把所有入度为 0 的课入队；每学完一门，就把依赖它的课的入度减一，减到 0 就入队。最后学完的门数等于 n 才说明没有环。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n + e)&#96;（e 是先修关系条数）；空间 &#96;O(n + e)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-207',this)">复制</button></div><pre id="code-207"><code>␀<span class="syn-num">0</span>␀ collections ␀<span class="syn-num">1</span>␀ defaultdict, deque

␀<span class="syn-num">2</span>␀ Solution:
    ␀<span class="syn-num">3</span>␀ canFinish(␀<span class="syn-num">4</span>␀, numCourses, prerequisites):
        g = defaultdict(␀<span class="syn-num">15</span>␀)
        indeg = [<span class="syn-num">0</span>] * numCourses
        ␀<span class="syn-num">5</span>␀ a, b ␀<span class="syn-num">6</span>␀ prerequisites:
            g[b].append(a)
            indeg[a] += <span class="syn-num">1</span>
        q = deque(i ␀<span class="syn-num">7</span>␀ i ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">16</span>␀(numCourses) ␀<span class="syn-num">9</span>␀ indeg[i] == <span class="syn-num">0</span>)
        learned = <span class="syn-num">0</span>
        ␀<span class="syn-num">10</span>␀ q:
            u = q.popleft()
            learned += <span class="syn-num">1</span>
            ␀<span class="syn-num">11</span>␀ v ␀<span class="syn-num">12</span>␀ g[u]:
                indeg[v] -= <span class="syn-num">1</span>
                ␀<span class="syn-num">13</span>␀ indeg[v] == <span class="syn-num">0</span>:
                    q.append(v)
        ␀<span class="syn-num">14</span>␀ learned == numCourses</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">边方向别搞反（&#96;b -&gt; a&#96;）；有环时环上节点入度永远降不到 0，&#96;learned &lt; n&#96; 自然返回 False。</div></div>
  </div>
</article>
<article class="card" data-num="208" data-diff="中等" data-topic="回溯图论DP" data-search="实现 trie实现前缀树，支持插入、查找完整单词、查找前缀。">
  <div class="head" onclick="tog(208)">
    <span class="num">0208</span>
    <span class="ttl">实现 Trie</span>
    <span class="badge b-中等">中等</span>

  <div class="body" id="body-208" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">实现前缀树，支持插入、查找完整单词、查找前缀。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">每个节点用字典存「字符 → 子节点」，再加一个 &#96;is_end&#96; 标记「是否有单词在这里结束」。插入就是顺着字符一路建节点。 &#96;insert&#96; / &#96;search&#96; / &#96;startsWith&#96; 都是 &#96;O(长度)&#96;，空间 &#96;O(所有单词总字符数)&#96;。</div></div>
    <div class="meta"><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-208',this)">复制</button></div><pre id="code-208"><code>␀<span class="syn-num">0</span>␀ TrieNode:
    ␀<span class="syn-num">1</span>␀ __init__(␀<span class="syn-num">2</span>␀):
        ␀<span class="syn-num">3</span>␀.children = {}
        ␀<span class="syn-num">4</span>␀.is_end = ␀<span class="syn-num">5</span>␀

␀<span class="syn-num">6</span>␀ Trie:
    ␀<span class="syn-num">7</span>␀ __init__(␀<span class="syn-num">8</span>␀):
        ␀<span class="syn-num">9</span>␀.root = TrieNode()

    ␀<span class="syn-num">10</span>␀ insert(␀<span class="syn-num">11</span>␀, word):
        cur = ␀<span class="syn-num">12</span>␀.root
        ␀<span class="syn-num">13</span>␀ ch ␀<span class="syn-num">14</span>␀ word:
            ␀<span class="syn-num">15</span>␀ ch ␀<span class="syn-num">16</span>␀ ␀<span class="syn-num">17</span>␀ cur.children:
                cur.children[ch] = TrieNode()
            cur = cur.children[ch]
        cur.is_end = ␀<span class="syn-num">18</span>␀

    ␀<span class="syn-num">19</span>␀ _walk(␀<span class="syn-num">20</span>␀, s):
        cur = ␀<span class="syn-num">21</span>␀.root
        ␀<span class="syn-num">22</span>␀ ch ␀<span class="syn-num">23</span>␀ s:
            ␀<span class="syn-num">24</span>␀ ch ␀<span class="syn-num">25</span>␀ ␀<span class="syn-num">26</span>␀ cur.children:
                ␀<span class="syn-num">27</span>␀ ␀<span class="syn-num">28</span>␀
            cur = cur.children[ch]
        ␀<span class="syn-num">29</span>␀ cur

    ␀<span class="syn-num">30</span>␀ search(␀<span class="syn-num">31</span>␀, word):
        node = ␀<span class="syn-num">32</span>␀._walk(word)
        ␀<span class="syn-num">33</span>␀ node ␀<span class="syn-num">34</span>␀ ␀<span class="syn-num">35</span>␀ ␀<span class="syn-num">36</span>␀ ␀<span class="syn-num">37</span>␀ node.is_end

    ␀<span class="syn-num">38</span>␀ startsWith(␀<span class="syn-num">39</span>␀, prefix):
        ␀<span class="syn-num">40</span>␀ ␀<span class="syn-num">41</span>␀._walk(prefix) ␀<span class="syn-num">42</span>␀ ␀<span class="syn-num">43</span>␀ ␀<span class="syn-num">44</span>␀</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;search&#96; 必须检查 &#96;is_end&#96;——插入过 &#96;&quot;apple&quot;&#96; 时 &#96;search(&quot;app&quot;)&#96; 应该是 False，但 &#96;startsWith(&quot;app&quot;)&#96; 是 True。</div></div>
  </div>
</article>
<article class="card" data-num="215" data-diff="中等" data-topic="二分栈堆贪心" data-search="数组中的第 k 个最大元素找数组里第 k 大的元素。">
  <div class="head" onclick="tog(215)">

  </div>
  <div class="body" id="body-215" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">找数组里第 K 大的元素。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">维护一个大小恰好为 K 的**小根堆**。遍历时堆没满就放，满了且新数比堆顶大就替换堆顶。最后堆里就是最大的 K 个数，堆顶是这 K 个里最小的，正好是全体第 K 大。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n log k)&#96;；空间 &#96;O(k)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-215',this)">复制</button></div><pre id="code-215"><code>␀<span class="syn-num">0</span>␀ heapq

␀<span class="syn-num">1</span>␀ Solution:
    ␀<span class="syn-num">2</span>␀ findKthLargest(␀<span class="syn-num">3</span>␀, nums, k):
        h = []
        ␀<span class="syn-num">4</span>␀ x ␀<span class="syn-num">5</span>␀ nums:
            ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">9</span>␀(h) &lt; k:
                heapq.heappush(h, x)
            ␀<span class="syn-num">7</span>␀ x &gt; h[<span class="syn-num">0</span>]:
                heapq.heapreplace(h, x)
        ␀<span class="syn-num">8</span>␀ h[<span class="syn-num">0</span>]</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">别把整个数组堆化再弹 n-k 次（&#96;O(n log n)&#96;）；&#96;heapreplace&#96; 前一定要先判断 &#96;x &gt; h[0]&#96;。</div></div>
  </div>
</article>
<article class="card" data-num="226" data-diff="简单" data-topic="链表与树" data-search="翻转二叉树翻转一棵二叉树（每个节点的左右子树互换）。">

    <div class="blk"><div class="lbl">题意</div><div class="txt">翻转一棵二叉树（每个节点的左右子树互换）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">翻转一棵树 = 交换它的左右子树，再各自递归翻转。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(h)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-226',this)">复制</button></div><pre id="code-226"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ invertTree(␀<span class="syn-num">2</span>␀, root):
        ␀<span class="syn-num">3</span>␀ root ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">5</span>␀:
            ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀
        root.left, root.right = ␀<span class="syn-num">8</span>␀.invertTree(root.right), ␀<span class="syn-num">9</span>␀.invertTree(root.left)
        ␀<span class="syn-num">10</span>␀ root</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">右边整体先求值，所以 &#96;self.invertTree(root.right)&#96; 拿到的是交换前的右子树，正好。</div></div>

<article class="card" data-num="230" data-diff="中等" data-topic="链表与树" data-search="二叉搜索树中第 k 小的元素二叉搜索树里找第 k 小的元素。">
  <div class="head" onclick="tog(230)">
    <span class="num">0230</span>
    <span class="ttl">二叉搜索树中第 K 小的元素</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(230)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-230" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">二叉搜索树里找第 K 小的元素。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">中序遍历是升序，数到第 K 个就是答案。用一个计数变量，到 K 就记住答案并提前停。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(h + k)&#96;；空间 &#96;O(h)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-230',this)">复制</button></div><pre id="code-230"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ kthSmallest(␀<span class="syn-num">2</span>␀, root, k):
        ␀<span class="syn-num">3</span>␀.k = k
        ␀<span class="syn-num">4</span>␀.ans = ␀<span class="syn-num">5</span>␀
        ␀<span class="syn-num">6</span>␀ dfs(node):
            ␀<span class="syn-num">7</span>␀ node ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀ ␀<span class="syn-num">10</span>␀ ␀<span class="syn-num">11</span>␀.ans ␀<span class="syn-num">12</span>␀ ␀<span class="syn-num">13</span>␀ ␀<span class="syn-num">14</span>␀:
                ␀<span class="syn-num">15</span>␀
            dfs(node.left)
            ␀<span class="syn-num">16</span>␀.k -= <span class="syn-num">1</span>
            ␀<span class="syn-num">17</span>␀ ␀<span class="syn-num">18</span>␀.k == <span class="syn-num">0</span>:
                ␀<span class="syn-num">19</span>␀.ans = node.val
                ␀<span class="syn-num">20</span>␀
            dfs(node.right)
        dfs(root)
        ␀<span class="syn-num">21</span>␀ ␀<span class="syn-num">22</span>␀.ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">计数要放在「访问左子树之后、递归右子树之前」，那正是中序的位置；找到后靠 &#96;self.ans is not None&#96; 提前剪枝。</div></div>
  </div>
</article>
<article class="card" data-num="234" data-diff="简单" data-topic="链表与树" data-search="回文链表判断链表是不是回文，要求 &#96;o(1)&#96; 额外空间。">
  <div class="head" onclick="tog(234)">
    <span class="num">0234</span>
    <span class="ttl">回文链表</span>
    <span class="badge b-简单">简单</span>
    <span class="topic">链表与树</span>

    <span class="arrow">▾</span>

  <div class="body" id="body-234" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">判断链表是不是回文，要求 &#96;O(1)&#96; 额外空间。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">① 快慢指针找到中点；② 把后半段反转；③ 从头和从后半段头一起走，逐个比值。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-234',this)">复制</button></div><pre id="code-234"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ isPalindrome(␀<span class="syn-num">2</span>␀, head):
        slow = fast = head
        ␀<span class="syn-num">3</span>␀ fast ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀ fast.next ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀ ␀<span class="syn-num">10</span>␀:
            slow, fast = slow.next, fast.next.next
        pre, cur = ␀<span class="syn-num">11</span>␀, slow
        ␀<span class="syn-num">12</span>␀ cur ␀<span class="syn-num">13</span>␀ ␀<span class="syn-num">14</span>␀ ␀<span class="syn-num">15</span>␀:
            nxt = cur.next
            cur.next = pre
            pre, cur = cur, nxt
        ␀<span class="syn-num">16</span>␀ pre ␀<span class="syn-num">17</span>␀ ␀<span class="syn-num">18</span>␀ ␀<span class="syn-num">19</span>␀:
            ␀<span class="syn-num">20</span>␀ pre.val != head.val:
                ␀<span class="syn-num">21</span>␀ ␀<span class="syn-num">22</span>␀
            pre, head = pre.next, head.next
        ␀<span class="syn-num">23</span>␀ ␀<span class="syn-num">24</span>␀</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">奇数长度时中点那个元素会被前半段包含，但后半段比完就停，不影响结果。</div></div>
  </div>
</article>
<article class="card" data-num="236" data-diff="中等" data-topic="链表与树" data-search="二叉树的最近公共祖先找两个节点最近的一个共同祖先。">
  <div class="head" onclick="tog(236)">
    <span class="num">0236</span>
    <span class="ttl">二叉树的最近公共祖先</span>
    <span class="badge b-中等">中等</span>

    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(236)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-236" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">找两个节点最近的一个共同祖先。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">递归问左右子树。如果某一侧返回了 &#96;None&#96;，说明两个节点都在另一侧；如果**两侧都返回了非空**，说明当前节点就是分叉点，即答案。如果当前节点本身就是 p 或 q，直接返回它。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(h)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-236',this)">复制</button></div><pre id="code-236"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ lowestCommonAncestor(␀<span class="syn-num">2</span>␀, root, p, q):
        ␀<span class="syn-num">3</span>␀ root ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀ root ␀<span class="syn-num">7</span>␀ p ␀<span class="syn-num">8</span>␀ root ␀<span class="syn-num">9</span>␀ q:
            ␀<span class="syn-num">10</span>␀ root
        left = ␀<span class="syn-num">11</span>␀.lowestCommonAncestor(root.left, p, q)
        right = ␀<span class="syn-num">12</span>␀.lowestCommonAncestor(root.right, p, q)
        ␀<span class="syn-num">13</span>␀ left ␀<span class="syn-num">14</span>␀ ␀<span class="syn-num">15</span>␀ ␀<span class="syn-num">16</span>␀ ␀<span class="syn-num">17</span>␀ right ␀<span class="syn-num">18</span>␀ ␀<span class="syn-num">19</span>␀ ␀<span class="syn-num">20</span>␀:
            ␀<span class="syn-num">21</span>␀ root
        ␀<span class="syn-num">22</span>␀ left ␀<span class="syn-num">23</span>␀ left ␀<span class="syn-num">24</span>␀ ␀<span class="syn-num">25</span>␀ ␀<span class="syn-num">26</span>␀ ␀<span class="syn-num">27</span>␀ right</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">判断「是不是同一个节点」用 &#96;is&#96;（这里比的是对象身份，是 &#96;is&#96; 少数正当用途之一）；返回值可能为空，用 &#96;is not None&#96; 判断。</div></div>
  </div>
</article>
<article class="card" data-num="238" data-diff="中等" data-topic="数组与哈希" data-search="除自身以外数组的乘积返回数组，每个位置是「除了自己以外所有数的乘积」，不许用除法。">
  <div class="head" onclick="tog(238)">
    <span class="num">0238</span>
    <span class="ttl">除自身以外数组的乘积</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(238)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-238" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">返回数组，每个位置是「除了自己以外所有数的乘积」，不许用除法。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">每个位置的答案 = 它左边所有数的积 × 它右边所有数的积。两遍扫描分别把前缀积、后缀积累乘进去。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-238',this)">复制</button></div><pre id="code-238"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ productExceptSelf(␀<span class="syn-num">2</span>␀, nums):
        n = ␀<span class="syn-num">8</span>␀(nums)
        ans = [<span class="syn-num">1</span>] * n
        p = <span class="syn-num">1</span>
        ␀<span class="syn-num">3</span>␀ i ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">9</span>␀(n):
            ans[i] = p
            p *= nums[i]
        p = <span class="syn-num">1</span>
        ␀<span class="syn-num">5</span>␀ i ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">10</span>␀(n - <span class="syn-num">1</span>, -<span class="syn-num">1</span>, -<span class="syn-num">1</span>):
            ans[i] *= p
            p *= nums[i]
        ␀<span class="syn-num">7</span>␀ ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">第二遍是 &#96;ans[i] *= p&#96;，别写成赋值把前缀积丢掉。</div></div>
  </div>
</article>
<article class="card" data-num="239" data-diff="困难" data-topic="数组与哈希" data-search="滑动窗口最大值返回每个长度为 k 的窗口里的最大值。">
  <div class="head" onclick="tog(239)">
    <span class="num">0239</span>
    <span class="ttl">滑动窗口最大值</span>
    <span class="badge b-困难">困难</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(239)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-239" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">返回每个长度为 k 的窗口里的最大值。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">用一个**单调队列**（&#96;deque&#96;，里面存下标，对应的值从大到小）。新元素进来前，把队尾所有比它小的都弹掉——它们既比新元素小、又比新元素早出窗口，永远不可能成为最大值。队首就是当前窗口最大。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;（每个下标最多进队出队各一次）；空间 &#96;O(k)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-239',this)">复制</button></div><pre id="code-239"><code>␀<span class="syn-num">1</span>␀ collections ␀<span class="syn-num">2</span>␀ deque

␀<span class="syn-num">3</span>␀ Solution:
    ␀<span class="syn-num">4</span>␀ maxSlidingWindow(␀<span class="syn-num">5</span>␀, nums, k):
        q = deque()
        ans = []
        ␀<span class="syn-num">6</span>␀ i, x ␀<span class="syn-num">7</span>␀ ␀<span class="syn-num">13</span>␀(nums):
            ␀<span class="syn-num">8</span>␀ q ␀<span class="syn-num">9</span>␀ nums[q[-<span class="syn-num">1</span>]] &lt;= x:
                q.pop()
            q.append(i)
            ␀<span class="syn-num">10</span>␀ q[<span class="syn-num">0</span>] &lt;= i - k:          ␀<span class="syn-num">0</span>␀
                q.popleft()
            ␀<span class="syn-num">11</span>␀ i &gt;= k - <span class="syn-num">1</span>:
                ans.append(nums[q[<span class="syn-num">0</span>]])
        ␀<span class="syn-num">12</span>␀ ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">队列里存**下标**而不是值，否则无法判断「队首是否已滑出窗口」；用 &#96;list.pop(0)&#96; 会超时，必须 &#96;deque&#96;。</div></div>
  </div>
</article>
<article class="card" data-num="240" data-diff="中等" data-topic="数组与哈希" data-search="搜索二维矩阵 ii矩阵每行、每列都升序，判断目标值在不在。">
  <div class="head" onclick="tog(240)">
    <span class="num">0240</span>
    <span class="ttl">搜索二维矩阵 II</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(240)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-240" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">矩阵每行、每列都升序，判断目标值在不在。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">从**右上角**开始。当前值比目标大，说明这一列下面都更大，可以整列排除（左移）；比目标小，说明这一行左边都更小，整行排除（下移）。每步砍掉一行或一列。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(m + n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-240',this)">复制</button></div><pre id="code-240"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ searchMatrix(␀<span class="syn-num">2</span>␀, matrix, target):
        m, n = ␀<span class="syn-num">12</span>␀(matrix), ␀<span class="syn-num">13</span>␀(matrix[<span class="syn-num">0</span>])
        r, c = <span class="syn-num">0</span>, n - <span class="syn-num">1</span>
        ␀<span class="syn-num">3</span>␀ r &lt; m ␀<span class="syn-num">4</span>␀ c &gt;= <span class="syn-num">0</span>:
            ␀<span class="syn-num">5</span>␀ matrix[r][c] == target:
                ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀
            ␀<span class="syn-num">8</span>␀ matrix[r][c] &gt; target:
                c -= <span class="syn-num">1</span>
            ␀<span class="syn-num">9</span>␀:
                r += <span class="syn-num">1</span>
        ␀<span class="syn-num">10</span>␀ ␀<span class="syn-num">11</span>␀</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">只能从右上（或左下）开始；从左上角开始，两个方向都是「变大」，无法确定排除哪边。</div></div>
  </div>
</article>
<article class="card" data-num="279" data-diff="中等" data-topic="回溯图论DP" data-search="完全平方数求最少用几个完全平方数（1,4,9…）相加得到 n。">
  <div class="head" onclick="tog(279)">
    <span class="num">0279</span>
    <span class="ttl">完全平方数</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(279)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-279" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">求最少用几个完全平方数（1,4,9…）相加得到 n。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">&#96;dp[i]&#96; = 凑出 i 需要的最少个数。对每个 &#96;i&#96;，试所有 &#96;j*j &lt;= i&#96;，取 &#96;dp[i - j*j] + 1&#96; 的最小值。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n√n)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-279',this)">复制</button></div><pre id="code-279"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ numSquares(␀<span class="syn-num">2</span>␀, n):
        dp = [<span class="syn-num">0</span>] + [␀<span class="syn-num">7</span>␀(&quot;inf&quot;)] * n
        ␀<span class="syn-num">3</span>␀ i ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">8</span>␀(<span class="syn-num">1</span>, n + <span class="syn-num">1</span>):
            j = <span class="syn-num">1</span>
            ␀<span class="syn-num">5</span>␀ j * j &lt;= i:
                dp[i] = ␀<span class="syn-num">9</span>␀(dp[i], dp[i - j * j] + <span class="syn-num">1</span>)
                j += <span class="syn-num">1</span>
        ␀<span class="syn-num">6</span>␀ dp[n]</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">初始值是 &#96;inf&#96; 不是 0（除了 &#96;dp[0] = 0&#96;），否则 &#96;min&#96; 永远取不到正确值。</div></div>
  </div>
</article>
<article class="card" data-num="283" data-diff="简单" data-topic="数组与哈希" data-search="移动零把数组里所有 0 移到末尾，其他数字保持相对顺序，要求原地改。">
  <div class="head" onclick="tog(283)">
    <span class="num">0283</span>
    <span class="ttl">移动零</span>
    <span class="badge b-简单">简单</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(283)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-283" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">把数组里所有 0 移到末尾，其他数字保持相对顺序，要求原地改。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">设一个 &#96;k&#96; 表示「下一个非零数该放哪」。遍历时遇到非零就写到 &#96;nums[k]&#96;，&#96;k&#96; 前进。因为 &#96;k&#96; 永远不超过当前读到的位置，不会覆盖还没读的数据。最后把 &#96;k&#96; 之后全填 0。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-283',this)">复制</button></div><pre id="code-283"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ moveZeroes(␀<span class="syn-num">2</span>␀, nums):
        k = <span class="syn-num">0</span>
        ␀<span class="syn-num">3</span>␀ x ␀<span class="syn-num">4</span>␀ nums:
            ␀<span class="syn-num">5</span>␀ x != <span class="syn-num">0</span>:
                nums[k] = x
                k += <span class="syn-num">1</span>
        ␀<span class="syn-num">6</span>␀ i ␀<span class="syn-num">7</span>␀ ␀<span class="syn-num">8</span>␀(k, ␀<span class="syn-num">9</span>␀(nums)):
            nums[i] = <span class="syn-num">0</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">别在遍历时 &#96;remove(0)&#96;——边遍历边删会漏元素，而且 &#96;remove&#96; 本身是 &#96;O(n)&#96;。</div></div>
  </div>
</article>
<article class="card" data-num="287" data-diff="中等" data-topic="数组与哈希" data-search="寻找重复数n+1 个数，值都在 1～n 之间，只有一个数重复，不改数组、空间 &#96;o(1)&#96; 找出它。">
  <div class="head" onclick="tog(287)">
    <span class="num">0287</span>
    <span class="ttl">寻找重复数</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(287)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-287" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">n+1 个数，值都在 1～n 之间，只有一个数重复，不改数组、空间 &#96;O(1)&#96; 找出它。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">把数组看成「链表」——下标 &#96;i&#96; 的下一个位置是 &#96;nums[i]&#96;。因为有重复值，必然有环，环的入口就是重复的数。用快慢指针找环入口：先让快慢相遇，再让一个指针回到起点，两者同速前进，再次相遇处即入口。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-287',this)">复制</button></div><pre id="code-287"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ findDuplicate(␀<span class="syn-num">2</span>␀, nums):
        slow = fast = <span class="syn-num">0</span>
        ␀<span class="syn-num">3</span>␀ ␀<span class="syn-num">4</span>␀:
            slow = nums[slow]
            fast = nums[nums[fast]]
            ␀<span class="syn-num">5</span>␀ slow == fast:
                ␀<span class="syn-num">6</span>␀
        p = <span class="syn-num">0</span>
        ␀<span class="syn-num">7</span>␀ p != slow:
            p = nums[p]
            slow = nums[slow]
        ␀<span class="syn-num">8</span>␀ p</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">初始都从 0 出发；第二段循环是「先走再比」还是「先比再走」要一致，这里用 &#96;while p != slow&#96; 保证相遇时返回入口。</div></div>
  </div>
</article>
<article class="card" data-num="295" data-diff="困难" data-topic="二分栈堆贪心" data-search="数据流的中位数不断来新数，随时要能返回当前所有数的中位数。">
  <div class="head" onclick="tog(295)">
    <span class="num">0295</span>
    <span class="ttl">数据流的中位数</span>
    <span class="badge b-困难">困难</span>
    <span class="topic">二分栈堆贪心</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(295)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-295" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">不断来新数，随时要能返回当前所有数的中位数。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">**双堆**。&#96;small&#96; 存较小的一半（用负数模拟大根堆），&#96;large&#96; 存较大的一半（小根堆）。始终保持两边数量差不超过 1，那么中位数就是两边堆顶的平均（或 &#96;small&#96; 堆顶）。 &#96;addNum&#96; 是 &#96;O(log n)&#96;，&#96;findMedian&#96; 是 &#96;O(1)&#96;，空间 &#96;O(n)&#96;。</div></div>
    <div class="meta"><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-295',this)">复制</button></div><pre id="code-295"><code>␀<span class="syn-num">2</span>␀ heapq

␀<span class="syn-num">3</span>␀ MedianFinder:
    ␀<span class="syn-num">4</span>␀ __init__(␀<span class="syn-num">5</span>␀):
        ␀<span class="syn-num">6</span>␀.small = []      ␀<span class="syn-num">0</span>␀
        ␀<span class="syn-num">7</span>␀.large = []      ␀<span class="syn-num">1</span>␀

    ␀<span class="syn-num">8</span>␀ addNum(␀<span class="syn-num">9</span>␀, num):
        heapq.heappush(␀<span class="syn-num">10</span>␀.small, -num)
        heapq.heappush(␀<span class="syn-num">11</span>␀.large, -heapq.heappop(␀<span class="syn-num">12</span>␀.small))
        ␀<span class="syn-num">13</span>␀ ␀<span class="syn-num">28</span>␀(␀<span class="syn-num">14</span>␀.large) &gt; ␀<span class="syn-num">29</span>␀(␀<span class="syn-num">15</span>␀.small):
            heapq.heappush(␀<span class="syn-num">16</span>␀.small, -heapq.heappop(␀<span class="syn-num">17</span>␀.large))

    ␀<span class="syn-num">18</span>␀ findMedian(␀<span class="syn-num">19</span>␀):
        ␀<span class="syn-num">20</span>␀ ␀<span class="syn-num">30</span>␀(␀<span class="syn-num">21</span>␀.small) &gt; ␀<span class="syn-num">31</span>␀(␀<span class="syn-num">22</span>␀.large):
            ␀<span class="syn-num">23</span>␀ ␀<span class="syn-num">32</span>␀(-␀<span class="syn-num">24</span>␀.small[<span class="syn-num">0</span>])
        ␀<span class="syn-num">25</span>␀ (-␀<span class="syn-num">26</span>␀.small[<span class="syn-num">0</span>] + ␀<span class="syn-num">27</span>␀.large[<span class="syn-num">0</span>]) / <span class="syn-num">2</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">每次从 &#96;small&#96; 顶移到 &#96;large&#96; 时记得取负号还原；平衡条件是 &#96;large&#96; 不能比 &#96;small&#96; 多。</div></div>
  </div>
</article>
<article class="card" data-num="300" data-diff="中等" data-topic="回溯图论DP" data-search="最长递增子序列找出最长的**严格递增**子序列长度（子序列不要求连续）。">
  <div class="head" onclick="tog(300)">
    <span class="num">0300</span>
    <span class="ttl">最长递增子序列</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(300)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-300" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">找出最长的**严格递增**子序列长度（子序列不要求连续）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">&#96;dp[i]&#96; = 以第 i 个元素**结尾**的最长递增子序列长度。对每个 i，往前找所有比它小的 j，取 &#96;dp[j] + 1&#96; 的最大值。答案是整个 &#96;dp&#96; 里的最大值（不一定以最后一个元素结尾）。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n²)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-300',this)">复制</button></div><pre id="code-300"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ lengthOfLIS(␀<span class="syn-num">2</span>␀, nums):
        n = ␀<span class="syn-num">9</span>␀(nums)
        dp = [<span class="syn-num">1</span>] * n
        ␀<span class="syn-num">3</span>␀ i ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">10</span>␀(n):
            ␀<span class="syn-num">5</span>␀ j ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">11</span>␀(i):
                ␀<span class="syn-num">7</span>␀ nums[j] &lt; nums[i]:
                    dp[i] = ␀<span class="syn-num">12</span>␀(dp[i], dp[j] + <span class="syn-num">1</span>)
        ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">13</span>␀(dp)</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;dp&#96; 初值全是 1（每个元素自己就是一个长度 1 的子序列）；&#96;n = 0&#96; 时 &#96;max(dp)&#96; 会报错，题目保证非空，自己写测试时要留意。这题还有 &#96;O(n log n)&#96; 的 &#96;bisect&#96; 解法，[L04 §3](L04-toolbox.md) 提过思路，学有余力可以再查。</div></div>
  </div>
</article>
<article class="card" data-num="322" data-diff="中等" data-topic="回溯图论DP" data-search="零钱兑换给硬币面额（每种无限个），求凑出 amount 的最少硬币数，凑不出返回 -1。">
  <div class="head" onclick="tog(322)">
    <span class="num">0322</span>
    <span class="ttl">零钱兑换</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(322)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-322" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">给硬币面额（每种无限个），求凑出 amount 的最少硬币数，凑不出返回 -1。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">和 279 同构，&#96;dp[i]&#96; = 凑出 i 的最少硬币数。这是**完全背包**：每个面额可以无限用，所以金额要**正序**遍历（让同一个面额能被反复使用）。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(amount × 硬币种类)&#96;；空间 &#96;O(amount)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-322',this)">复制</button></div><pre id="code-322"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ coinChange(␀<span class="syn-num">2</span>␀, coins, amount):
        dp = [<span class="syn-num">0</span>] + [␀<span class="syn-num">11</span>␀(&quot;inf&quot;)] * amount
        ␀<span class="syn-num">3</span>␀ c ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">12</span>␀(<span class="syn-num">1</span>, amount + <span class="syn-num">1</span>):
            ␀<span class="syn-num">5</span>␀ coin ␀<span class="syn-num">6</span>␀ coins:
                ␀<span class="syn-num">7</span>␀ coin &lt;= c:
                    dp[c] = ␀<span class="syn-num">13</span>␀(dp[c], dp[c - coin] + <span class="syn-num">1</span>)
        ␀<span class="syn-num">8</span>␀ dp[amount] ␀<span class="syn-num">9</span>␀ dp[amount] != ␀<span class="syn-num">14</span>␀(&quot;inf&quot;) ␀<span class="syn-num">10</span>␀ -<span class="syn-num">1</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">返回前要判断「是不是 inf」，inf 表示凑不出。</div></div>
  </div>
</article>
<article class="card" data-num="347" data-diff="中等" data-topic="二分栈堆贪心" data-search="前 k 个高频元素返回出现频次最高的 k 个元素。">
  <div class="head" onclick="tog(347)">
    <span class="num">0347</span>
    <span class="ttl">前 K 个高频元素</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">二分栈堆贪心</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(347)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-347" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">返回出现频次最高的 K 个元素。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">先用 &#96;Counter&#96; 数频次，再维护大小为 K 的小根堆，元素放 &#96;(频次, 值)&#96;，按频次比。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n log k)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-347',this)">复制</button></div><pre id="code-347"><code>␀<span class="syn-num">0</span>␀ heapq
␀<span class="syn-num">1</span>␀ collections ␀<span class="syn-num">2</span>␀ Counter

␀<span class="syn-num">3</span>␀ Solution:
    ␀<span class="syn-num">4</span>␀ topKFrequent(␀<span class="syn-num">5</span>␀, nums, k):
        h = []
        ␀<span class="syn-num">6</span>␀ val, freq ␀<span class="syn-num">7</span>␀ Counter(nums).items():
            ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">13</span>␀(h) &lt; k:
                heapq.heappush(h, (freq, val))
            ␀<span class="syn-num">9</span>␀ freq &gt; h[<span class="syn-num">0</span>][<span class="syn-num">0</span>]:
                heapq.heapreplace(h, (freq, val))
        ␀<span class="syn-num">10</span>␀ [val ␀<span class="syn-num">11</span>␀ freq, val ␀<span class="syn-num">12</span>␀ h]</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">元组入堆按第一项比较，所以频次必须放前面；如果第二项是无法比较的对象且频次可能相同，要插一个序号（见 [L04 §2](L04-toolbox.md)）。</div></div>
  </div>
</article>
<article class="card" data-num="394" data-diff="中等" data-topic="二分栈堆贪心" data-search="字符串解码&#96;3[a2[c]]&#96; 展开成 &#96;accaccacc&#96;。">
  <div class="head" onclick="tog(394)">
    <span class="num">0394</span>
    <span class="ttl">字符串解码</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">二分栈堆贪心</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(394)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-394" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">&#96;3[a2[c]]&#96; 展开成 &#96;accaccacc&#96;。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">遇到 &#96;[&#96; 时，把「之前的字符串」和「重复次数」一起压栈，然后清空重新攒；遇到 &#96;]&#96; 时弹出来拼接。&#96;num&#96; 可能是多位数，要逐位累加。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(展开后长度)&#96;；空间 &#96;O(嵌套深度)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-394',this)">复制</button></div><pre id="code-394"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ decodeString(␀<span class="syn-num">2</span>␀, s):
        stack = []
        cur = &quot;&quot;
        num = <span class="syn-num">0</span>
        ␀<span class="syn-num">3</span>␀ c ␀<span class="syn-num">4</span>␀ s:
            ␀<span class="syn-num">5</span>␀ c.isdigit():
                num = num * <span class="syn-num">10</span> + ␀<span class="syn-num">10</span>␀(c)
            ␀<span class="syn-num">6</span>␀ c == &quot;[&quot;:
                stack.append((cur, num))
                cur = &quot;&quot;
                num = <span class="syn-num">0</span>
            ␀<span class="syn-num">7</span>␀ c == &quot;]&quot;:
                prev, k = stack.pop()
                cur = prev + cur * k
            ␀<span class="syn-num">8</span>␀:
                cur += c
        ␀<span class="syn-num">9</span>␀ cur</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;num&#96; 在 &#96;[&#96; 之后必须清零，否则下一层数字会接在旧数字后面。</div></div>
  </div>
</article>
<article class="card" data-num="416" data-diff="中等" data-topic="回溯图论DP" data-search="分割等和子集判断数组能否分成两个子集，使两边和相等。">
  <div class="head" onclick="tog(416)">
    <span class="num">0416</span>
    <span class="ttl">分割等和子集</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(416)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-416" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">判断数组能否分成两个子集，使两边和相等。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">总和必须是偶数，问题变成「能不能挑出一些数，和恰好等于总和的一半」。这是 **0-1 背包**：每个数只能选一次，所以金额必须**倒序**遍历（正序会让同一个数被重复使用）。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n × target)&#96;；空间 &#96;O(target)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-416',this)">复制</button></div><pre id="code-416"><code>␀<span class="syn-num">1</span>␀ Solution:
    ␀<span class="syn-num">2</span>␀ canPartition(␀<span class="syn-num">3</span>␀, nums):
        total = ␀<span class="syn-num">15</span>␀(nums)
        ␀<span class="syn-num">4</span>␀ total % <span class="syn-num">2</span>:
            ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀
        target = total // <span class="syn-num">2</span>
        dp = [␀<span class="syn-num">7</span>␀] * (target + <span class="syn-num">1</span>)
        dp[<span class="syn-num">0</span>] = ␀<span class="syn-num">8</span>␀
        ␀<span class="syn-num">9</span>␀ x ␀<span class="syn-num">10</span>␀ nums:
            ␀<span class="syn-num">11</span>␀ c ␀<span class="syn-num">12</span>␀ ␀<span class="syn-num">16</span>␀(target, x - <span class="syn-num">1</span>, -<span class="syn-num">1</span>):   ␀<span class="syn-num">0</span>␀
                dp[c] = dp[c] ␀<span class="syn-num">13</span>␀ dp[c - x]
        ␀<span class="syn-num">14</span>␀ dp[target]</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">倒序是本题的命根子，写成正序就变成「每个数无限用」，答案会错但样例常常还能过——务必用对拍验证。</div></div>
  </div>
</article>
<article class="card" data-num="437" data-diff="中等" data-topic="链表与树" data-search="路径总和 iii统计有多少条**向下**的路径，节点值之和等于 &#96;targetsum&#96;（路径不必从根开始、不必到叶子结束）。">
  <div class="head" onclick="tog(437)">
    <span class="num">0437</span>
    <span class="ttl">路径总和 III</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(437)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-437" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">统计有多少条**向下**的路径，节点值之和等于 &#96;targetSum&#96;（路径不必从根开始、不必到叶子结束）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">和 [L06 · 560 题](L06-array-and-hash.md) 是同一个套路。记从根到当前节点的前缀和 &#96;pre&#96;，若之前某处的前缀和是 &#96;pre - targetSum&#96;，那中间这一段就符合。用字典数前缀和出现次数；**离开当前节点时要撤销它的贡献**（回溯），否则会把别的分支的前缀和算进来。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(h)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-437',this)">复制</button></div><pre id="code-437"><code>␀<span class="syn-num">1</span>␀ collections ␀<span class="syn-num">2</span>␀ defaultdict

␀<span class="syn-num">3</span>␀ Solution:
    ␀<span class="syn-num">4</span>␀ pathSum(␀<span class="syn-num">5</span>␀, root, targetSum):
        cnt = defaultdict(␀<span class="syn-num">15</span>␀)
        cnt[<span class="syn-num">0</span>] = <span class="syn-num">1</span>
        ␀<span class="syn-num">6</span>␀.ans = <span class="syn-num">0</span>
        ␀<span class="syn-num">7</span>␀ dfs(node, pre):
            ␀<span class="syn-num">8</span>␀ node ␀<span class="syn-num">9</span>␀ ␀<span class="syn-num">10</span>␀:
                ␀<span class="syn-num">11</span>␀
            pre += node.val
            ␀<span class="syn-num">12</span>␀.ans += cnt[pre - targetSum]
            cnt[pre] += <span class="syn-num">1</span>
            dfs(node.left, pre)
            dfs(node.right, pre)
            cnt[pre] -= <span class="syn-num">1</span>          ␀<span class="syn-num">0</span>␀
        dfs(root, <span class="syn-num">0</span>)
        ␀<span class="syn-num">13</span>␀ ␀<span class="syn-num">14</span>␀.ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;cnt[0] = 1&#96; 和最后的 &#96;cnt[pre] -= 1&#96; 都不能少；&#96;self.ans&#96; 要在入口处重置。</div></div>
  </div>
</article>
<article class="card" data-num="438" data-diff="中等" data-topic="数组与哈希" data-search="找到字符串中所有字母异位词在 &#96;s&#96; 里找出所有和 &#96;p&#96; 字母组成相同的连续子串，返回起始下标。">
  <div class="head" onclick="tog(438)">
    <span class="num">0438</span>
    <span class="ttl">找到字符串中所有字母异位词</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(438)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-438" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">在 &#96;s&#96; 里找出所有和 &#96;p&#96; 字母组成相同的连续子串，返回起始下标。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">维护一个长度恰好为 &#96;len(p)&#96; 的窗口，和一个 26 长度的计数数组。窗口里每个字母的「还差多少」凑齐后，就是一次命中。用 &#96;diff&#96; 表示「有多少个字母的数量还不匹配」，避免每轮都去比较整个数组。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(26n)&#96; 即 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-438',this)">复制</button></div><pre id="code-438"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ findAnagrams(␀<span class="syn-num">2</span>␀, s, p):
        ␀<span class="syn-num">3</span>␀ ␀<span class="syn-num">13</span>␀(s) &lt; ␀<span class="syn-num">14</span>␀(p):
            ␀<span class="syn-num">4</span>␀ []
        need = [<span class="syn-num">0</span>] * <span class="syn-num">26</span>
        ␀<span class="syn-num">5</span>␀ c ␀<span class="syn-num">6</span>␀ p:
            need[␀<span class="syn-num">15</span>␀(c) - <span class="syn-num">97</span>] += <span class="syn-num">1</span>
        win = [<span class="syn-num">0</span>] * <span class="syn-num">26</span>
        ans = []
        k = ␀<span class="syn-num">16</span>␀(p)
        ␀<span class="syn-num">7</span>␀ i, c ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">17</span>␀(s):
            win[␀<span class="syn-num">18</span>␀(c) - <span class="syn-num">97</span>] += <span class="syn-num">1</span>
            ␀<span class="syn-num">9</span>␀ i &gt;= k:
                win[␀<span class="syn-num">19</span>␀(s[i - k]) - <span class="syn-num">97</span>] -= <span class="syn-num">1</span>
            ␀<span class="syn-num">10</span>␀ i &gt;= k - <span class="syn-num">1</span> ␀<span class="syn-num">11</span>␀ win == need:
                ans.append(i - k + <span class="syn-num">1</span>)
        ␀<span class="syn-num">12</span>␀ ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;ord(c) - 97&#96; 里的 97 是 &#96;&#x27;a&#x27;&#96; 的编号，更清楚的写法是 &#96;ord(c) - ord(&#x27;a&#x27;)&#96;；列表相等比较 &#96;win == need&#96; 是逐项比，长度只有 26 所以很便宜。</div></div>
  </div>
</article>
<article class="card" data-num="543" data-diff="简单" data-topic="链表与树" data-search="二叉树的直径直径 = 任意两点间最长路径的**边数**。">
  <div class="head" onclick="tog(543)">
    <span class="num">0543</span>
    <span class="ttl">二叉树的直径</span>
    <span class="badge b-简单">简单</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(543)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-543" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">直径 = 任意两点间最长路径的**边数**。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">一条最长路径一定经过某个节点，长度 = 它左子树深度 + 右子树深度。递归函数返回「深度」给父节点用，同时用一个全局的 &#96;self.ans&#96; 记「目前见过的最长路径」。这是树题里非常常见的「返回值和全局答案分离」结构。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(h)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-543',this)">复制</button></div><pre id="code-543"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ diameterOfBinaryTree(␀<span class="syn-num">2</span>␀, root):
        ␀<span class="syn-num">3</span>␀.ans = <span class="syn-num">0</span>
        ␀<span class="syn-num">4</span>␀ depth(node):
            ␀<span class="syn-num">5</span>␀ node ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀:
                ␀<span class="syn-num">8</span>␀ <span class="syn-num">0</span>
            l, r = depth(node.left), depth(node.right)
            ␀<span class="syn-num">9</span>␀.ans = ␀<span class="syn-num">14</span>␀(␀<span class="syn-num">10</span>␀.ans, l + r)
            ␀<span class="syn-num">11</span>␀ ␀<span class="syn-num">15</span>␀(l, r) + <span class="syn-num">1</span>
        depth(root)
        ␀<span class="syn-num">12</span>␀ ␀<span class="syn-num">13</span>␀.ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;self.ans = 0&#96; 必须在入口方法里写，不能放进递归函数（那样每轮都被清零）；而且平台可能复用同一个对象跑多组测试，入口处重置是必须的。</div></div>
  </div>
</article>
<article class="card" data-num="560" data-diff="中等" data-topic="数组与哈希" data-search="和为 k 的子数组统计有多少个连续子数组的和恰好等于 k，**数组里可能有负数**。">
  <div class="head" onclick="tog(560)">
    <span class="num">0560</span>
    <span class="ttl">和为 K 的子数组</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(560)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-560" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">统计有多少个连续子数组的和恰好等于 K，**数组里可能有负数**。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">记 &#96;pre[i]&#96; 为「从开头到第 i 个的和」。那么「第 j+1 到 i 的和 = pre[i] - pre[j]」。要让这段等于 K，就得 &#96;pre[j] = pre[i] - K&#96;。于是边算前缀和，边用字典查「之前出现过多少个这样的 &#96;pre[j]&#96;」。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-560',this)">复制</button></div><pre id="code-560"><code>␀<span class="syn-num">1</span>␀ collections ␀<span class="syn-num">2</span>␀ defaultdict

␀<span class="syn-num">3</span>␀ Solution:
    ␀<span class="syn-num">4</span>␀ subarraySum(␀<span class="syn-num">5</span>␀, nums, k):
        cnt = defaultdict(␀<span class="syn-num">9</span>␀)
        cnt[<span class="syn-num">0</span>] = <span class="syn-num">1</span>                  ␀<span class="syn-num">0</span>␀
        pre = ans = <span class="syn-num">0</span>
        ␀<span class="syn-num">6</span>␀ x ␀<span class="syn-num">7</span>␀ nums:
            pre += x
            ans += cnt[pre - k]
            cnt[pre] += <span class="syn-num">1</span>
        ␀<span class="syn-num">8</span>␀ ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;cnt[0] = 1&#96; 不能漏，否则「从第一个元素开始、和正好是 K」的情况会被漏掉。另外**别用滑动窗口**，有负数时窗口不成立。</div></div>
  </div>
</article>
<article class="card" data-num="739" data-diff="中等" data-topic="二分栈堆贪心" data-search="每日温度对每个位置，求还要等几天才出现更高的温度，没有就 0。">
  <div class="head" onclick="tog(739)">
    <span class="num">0739</span>
    <span class="ttl">每日温度</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">二分栈堆贪心</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(739)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-739" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">对每个位置，求还要等几天才出现更高的温度，没有就 0。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">用**单调栈**存「还没找到更高温度的日子」的下标，对应温度从栈底到栈顶递减。新温度比栈顶高时，栈顶这些日子终于等到了，弹出来算天数。**每个下标最多进栈、出栈各一次**，所以整体 &#96;O(n)&#96;。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-739',this)">复制</button></div><pre id="code-739"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ dailyTemperatures(␀<span class="syn-num">2</span>␀, temperatures):
        st = []
        ans = [<span class="syn-num">0</span>] * ␀<span class="syn-num">8</span>␀(temperatures)
        ␀<span class="syn-num">3</span>␀ i, x ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">9</span>␀(temperatures):
            ␀<span class="syn-num">5</span>␀ st ␀<span class="syn-num">6</span>␀ temperatures[st[-<span class="syn-num">1</span>]] &lt; x:
                j = st.pop()
                ans[j] = i - j
            st.append(i)
        ␀<span class="syn-num">7</span>␀ ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">栈里存**下标**，不是温度值——答案要的是天数差。</div></div>
  </div>
</article>
<article class="card" data-num="763" data-diff="中等" data-topic="二分栈堆贪心" data-search="划分字母区间把字符串切成尽可能多的片段，要求同一个字母只出现在一个片段里。">
  <div class="head" onclick="tog(763)">
    <span class="num">0763</span>
    <span class="ttl">划分字母区间</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">二分栈堆贪心</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(763)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-763" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">把字符串切成尽可能多的片段，要求同一个字母只出现在一个片段里。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">先记录每个字母**最后出现的位置**。扫描时不断把当前片段的右端点 &#96;end&#96; 推到「片段内所有字母的最远位置」；一旦扫到 &#96;i == end&#96;，说明这个片段里所有字母都不会再出现在后面，可以在这里切一刀。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(字符集)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-763',this)">复制</button></div><pre id="code-763"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ partitionLabels(␀<span class="syn-num">2</span>␀, s):
        last = {c: i ␀<span class="syn-num">3</span>␀ i, c ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">9</span>␀(s)}
        start = end = <span class="syn-num">0</span>
        res = []
        ␀<span class="syn-num">5</span>␀ i, c ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">10</span>␀(s):
            end = ␀<span class="syn-num">11</span>␀(end, last[c])
            ␀<span class="syn-num">7</span>␀ i == end:
                res.append(i - start + <span class="syn-num">1</span>)
                start = i + <span class="syn-num">1</span>
        ␀<span class="syn-num">8</span>␀ res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;start&#96; 要在切完后更新；字典推导式 &#96;{c: i for ...}&#96; 天然保留每个字母最后一次的下标。</div></div>
  </div>
</article>
<article class="card" data-num="994" data-diff="中等" data-topic="回溯图论DP" data-search="腐烂的橘子网格里 &#96;0&#96; 空、&#96;1&#96; 好橘子、&#96;2&#96; 烂橘子。每分钟烂橘子会把上下左右的好橘子变烂，求全部变烂要几分钟，不可能返回 -1。">
  <div class="head" onclick="tog(994)">
    <span class="num">0994</span>
    <span class="ttl">腐烂的橘子</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(994)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-994" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">网格里 &#96;0&#96; 空、&#96;1&#96; 好橘子、&#96;2&#96; 烂橘子。每分钟烂橘子会把上下左右的好橘子变烂，求全部变烂要几分钟，不可能返回 -1。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">**多源 BFS**——把所有初始烂橘子一起入队，按「层」扩散，每层就是一分钟。同时记好橘子数量，最后没减到 0 说明有孤岛。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(mn)&#96;；空间 &#96;O(mn)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-994',this)">复制</button></div><pre id="code-994"><code>␀<span class="syn-num">1</span>␀ collections ␀<span class="syn-num">2</span>␀ deque

␀<span class="syn-num">3</span>␀ Solution:
    ␀<span class="syn-num">4</span>␀ orangesRotting(␀<span class="syn-num">5</span>␀, grid):
        m, n = ␀<span class="syn-num">24</span>␀(grid), ␀<span class="syn-num">25</span>␀(grid[<span class="syn-num">0</span>])
        q = deque()
        fresh = <span class="syn-num">0</span>
        ␀<span class="syn-num">6</span>␀ i ␀<span class="syn-num">7</span>␀ ␀<span class="syn-num">26</span>␀(m):
            ␀<span class="syn-num">8</span>␀ j ␀<span class="syn-num">9</span>␀ ␀<span class="syn-num">27</span>␀(n):
                ␀<span class="syn-num">10</span>␀ grid[i][j] == <span class="syn-num">2</span>:
                    q.append((i, j))
                ␀<span class="syn-num">11</span>␀ grid[i][j] == <span class="syn-num">1</span>:
                    fresh += <span class="syn-num">1</span>
        minutes = <span class="syn-num">0</span>
        dirs = [(<span class="syn-num">0</span>, <span class="syn-num">1</span>), (<span class="syn-num">0</span>, -<span class="syn-num">1</span>), (<span class="syn-num">1</span>, <span class="syn-num">0</span>), (-<span class="syn-num">1</span>, <span class="syn-num">0</span>)]
        ␀<span class="syn-num">12</span>␀ q ␀<span class="syn-num">13</span>␀ fresh:
            ␀<span class="syn-num">14</span>␀ _ ␀<span class="syn-num">15</span>␀ ␀<span class="syn-num">28</span>␀(␀<span class="syn-num">29</span>␀(q)):        ␀<span class="syn-num">0</span>␀
                r, c = q.popleft()
                ␀<span class="syn-num">16</span>␀ dr, dc ␀<span class="syn-num">17</span>␀ dirs:
                    nr, nc = r + dr, c + dc
                    ␀<span class="syn-num">18</span>␀ <span class="syn-num">0</span> &lt;= nr &lt; m ␀<span class="syn-num">19</span>␀ <span class="syn-num">0</span> &lt;= nc &lt; n ␀<span class="syn-num">20</span>␀ grid[nr][nc] == <span class="syn-num">1</span>:
                        grid[nr][nc] = <span class="syn-num">2</span>
                        fresh -= <span class="syn-num">1</span>
                        q.append((nr, nc))
            minutes += <span class="syn-num">1</span>
        ␀<span class="syn-num">21</span>␀ minutes ␀<span class="syn-num">22</span>␀ fresh == <span class="syn-num">0</span> ␀<span class="syn-num">23</span>␀ -<span class="syn-num">1</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;while q and fresh&#96; 而不是 &#96;while q&#96;——好橘子为 0 时不用再计分钟；初始就没有好橘子要返回 0。</div></div>
  </div>
</article>
<article class="card" data-num="1143" data-diff="中等" data-topic="回溯图论DP" data-search="最长公共子序列两个字符串的最长公共子序列长度（不要求连续）。">
  <div class="head" onclick="tog(1143)">
    <span class="num">1143</span>
    <span class="ttl">最长公共子序列</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">回溯图论DP</span>

  <div class="body" id="body-1143" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">两个字符串的最长公共子序列长度（不要求连续）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">&#96;dp[i][j]&#96; = &#96;a&#96; 的前 i 个字符和 &#96;b&#96; 的前 j 个字符的 LCS 长度。若 &#96;a[i-1] == b[j-1]&#96;，可以一起用上：&#96;dp[i-1][j-1] + 1&#96;；否则取「去掉 a 最后一个」和「去掉 b 最后一个」里较大的。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(mn)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-1143',this)">复制</button></div><pre id="code-1143"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ longestCommonSubsequence(␀<span class="syn-num">2</span>␀, text1, text2):
        m, n = ␀<span class="syn-num">10</span>␀(text1), ␀<span class="syn-num">11</span>␀(text2)
        prev = [<span class="syn-num">0</span>] * (n + <span class="syn-num">1</span>)
        ␀<span class="syn-num">3</span>␀ i ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">12</span>␀(<span class="syn-num">1</span>, m + <span class="syn-num">1</span>):
            cur = [<span class="syn-num">0</span>] * (n + <span class="syn-num">1</span>)
            ␀<span class="syn-num">5</span>␀ j ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">13</span>␀(<span class="syn-num">1</span>, n + <span class="syn-num">1</span>):
                ␀<span class="syn-num">7</span>␀ text1[i - <span class="syn-num">1</span>] == text2[j - <span class="syn-num">1</span>]:
                    cur[j] = prev[j - <span class="syn-num">1</span>] + <span class="syn-num">1</span>
                ␀<span class="syn-num">8</span>␀:
                    cur[j] = ␀<span class="syn-num">14</span>␀(prev[j], cur[j - <span class="syn-num">1</span>])
            prev = cur
        ␀<span class="syn-num">9</span>␀ prev[n]</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">字符相等时用的是**左上角** &#96;prev[j-1]&#96;，不是 &#96;prev[j]&#96;；二维表第 0 行第 0 列全是 0，用滚动数组时 &#96;cur = [0]*(n+1)&#96; 正好承担这个角色。</div></div>
  </div>
</article>`;

function tog(n){
  const b=document.getElementById('body-'+n), c=b.closest('.card');
  b.hidden=!b.hidden; c.classList.toggle('open',!b.hidden);
}
function expandAll(open){
  document.querySelectorAll('.card').forEach(c=>{
    if(c.style.display==='none')return;
    const b=c.querySelector('.body'); b.hidden=!open; c.classList.toggle('open',open);
  });
}
function mark(n){
  seen.has(n)?seen.delete(n):seen.add(n);
  localStorage.setItem(KEY,JSON.stringify([...seen]));
  const c=document.querySelector('.card[data-num="'+n+'"]');
  c.classList.toggle('is-done',seen.has(n));
  c.querySelector('.done').textContent=seen.has(n)?'●':'○';
  updateProgress();
  if(onlyUnseen)render();
}
function updateProgress(){
  const s=seen.size;
  document.getElementById('seenCount').textContent=s;
  document.getElementById('pct').textContent=Math.round(s)+'%';
  document.getElementById('fill').style.width=s+'%';
}
function toggleUnseen(){
  onlyUnseen=!onlyUnseen;
  const b=document.getElementById('onlyUnseen');
  b.classList.toggle('on',onlyUnseen);
  b.style.background=onlyUnseen?'var(--accent)':'#fff';
  b.style.color=onlyUnseen?'#fff':'var(--ink)';
  render();
}
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  let shown=0;
  document.querySelectorAll('.card').forEach(c=>{
    const n=+c.dataset.num;
    const okTopic=activeTopic==='全部'||c.dataset.topic===activeTopic;
    const okDiff=activeDiff==='全部'||c.dataset.diff===activeDiff;
    const okQ=!q||c.dataset.search.includes(q)||String(n).includes(q);
    const okSeen=!onlyUnseen||!seen.has(n);
    const show=okTopic&&okDiff&&okQ&&okSeen;
    c.style.display=show?'':'none';
    if(show)shown++;
  });
  let empty=document.getElementById('empty');
  if(!shown){
    if(!empty){empty=document.createElement('div');empty.id='empty';empty.className='empty';empty.textContent='没有匹配的题目';list.appendChild(empty)}
  }else if(empty)empty.remove();
}
document.getElementById('q').addEventListener('input',render);
function cp(id,btn){
  const t=document.getElementById(id).innerText;
  navigator.clipboard.writeText(t).then(()=>{btn.textContent='已复制';setTimeout(()=>btn.textContent='复制',1200)})
   .catch(()=>{btn.textContent='请手动复制';setTimeout(()=>btn.textContent='复制',1200)});
}
seen.forEach(n=>{const c=document.querySelector('.card[data-num="'+n+'"]');if(c){c.classList.add('is-done');c.querySelector('.done').textContent='●'}});
updateProgress();
</script>
