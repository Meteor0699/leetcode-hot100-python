<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>LeetCode 热题 100 · 题目与答案</title>
<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --line:#e5e7eb; --ink:#1f2328; --sub:#656d76;
  --accent:#0969da; --accent-soft:#ddf4ff; --done:#1a7f37; --shadow:0 1px 3px rgba(0,0,0,.06);
  --kw:#cf222e; --str:#0a3069; --cmt:#6e7781; --fn:#8250df; --num:#0550ae;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.3px}
.lead{color:var(--sub);margin:0 0 20px;font-size:14px}
.stat{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:22px}
.stat b{color:var(--ink);font-size:15px}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px;box-shadow:var(--shadow);position:sticky;top:12px;z-index:5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
input[type=search]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--accent);color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:13px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--sub)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.progress{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--sub)}
.track{flex:1;height:7px;background:var(--line);border-radius:10px;overflow:hidden}
.fill{height:100%;width:0;background:var(--done);transition:width .2s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden}
.card.is-done{border-left:3px solid var(--done)}
.head{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;user-select:none}
.head:hover{background:#fafbfc}
.num{font:600 13px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--sub);min-width:38px}
.ttl{flex:1;font-weight:600;font-size:15px}
.badge{font-size:12px;padding:2px 9px;border-radius:12px;font-weight:600}
.b-简单{background:#dafbe1;color:#1a7f37}
.b-中等{background:#fff8c5;color:#9a6700}
.b-困难{background:#ffebe9;color:#cf222e}
.topic{font-size:12px;color:var(--sub);min-width:84px;text-align:right}
.done{font-size:17px;line-height:1;padding:2px 7px;color:var(--sub);border:none;background:transparent}
.done:hover{background:transparent;color:var(--done)}
.is-done .done{color:var(--done)}
.arrow{color:var(--sub);font-size:12px;transition:transform .15s}
.card.open .arrow{transform:rotate(180deg)}
.body{padding:2px 15px 18px;border-top:1px solid var(--line)}
.blk{margin-top:14px}
.lbl{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.5px;margin-bottom:3px}
.blk.err .lbl{color:#cf222e}
.txt{font-size:14px;color:#30363d}
.meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--sub)}
.cost{background:#f0f3f6;padding:2px 8px;border-radius:6px;font-family:ui-monospace,Consolas,monospace}
.codewrap{margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.codebar{display:flex;justify-content:space-between;align-items:center;background:#f6f8fa;padding:6px 12px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line)}
.codebar button{padding:3px 10px;font-size:12px}
pre{margin:0;padding:14px;background:#fff;overflow-x:auto;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
.syn-kw{color:var(--kw);font-weight:600}.syn-str{color:var(--str)}.syn-comment{color:var(--cmt);font-style:italic}.syn-fn{color:var(--fn)}.syn-num{color:var(--num)}
.empty{text-align:center;color:var(--sub);padding:60px 0}
.tip{font-size:13px;color:var(--sub);margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
@media print{.bar{position:static}.body{display:block!important}.done,.arrow,.codebar button{display:none}}
</style>
