  </div>
  <div class="body" id="body-2" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">两个链表各自表示一个数字（低位在前），返回它们和的链表。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">像手算加法一样逐位加，维护进位 &#96;carry&#96;。两条链表长度可能不同，短的那条没了就当 0。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(max(m,n))&#96;；空间 &#96;O(max(m,n))&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-2',this)">复制</button></div><pre id="code-2"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ addTwoNumbers(␀<span class="syn-num">2</span>␀, l1, l2):
        dummy = cur = ListNode(<span class="syn-num">0</span>)
        carry = <span class="syn-num">0</span>
        ␀<span class="syn-num">3</span>␀ l1 ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀ l2 ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀ ␀<span class="syn-num">10</span>␀ ␀<span class="syn-num">11</span>␀ carry:
            s = carry + (l1.val ␀<span class="syn-num">12</span>␀ l1 ␀<span class="syn-num">13</span>␀ <span class="syn-num">0</span>) + (l2.val ␀<span class="syn-num">14</span>␀ l2 ␀<span class="syn-num">15</span>␀ <span class="syn-num">0</span>)
            carry, v = ␀<span class="syn-num">25</span>␀(s, <span class="syn-num">10</span>)
            cur.next = ListNode(v)
            cur = cur.next
            ␀<span class="syn-num">16</span>␀ l1 ␀<span class="syn-num">17</span>␀ ␀<span class="syn-num">18</span>␀ ␀<span class="syn-num">19</span>␀:
                l1 = l1.next
            ␀<span class="syn-num">20</span>␀ l2 ␀<span class="syn-num">21</span>␀ ␀<span class="syn-num">22</span>␀ ␀<span class="syn-num">23</span>␀:
                l2 = l2.next
        ␀<span class="syn-num">24</span>␀ dummy.next</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">循环条件里必须有 &#96;or carry&#96;，否则最后多出的一位（如 &#96;5+5=10&#96;）会丢。</div></div>
  </div>
</article>
<article class="card" data-num="3" data-diff="中等" data-topic="数组与哈希" data-search="无重复字符的最长子串找字符串里不含重复字符的最长子串的长度。">
  <div class="head" onclick="tog(3)">
    <span class="num">0003</span>
    <span class="ttl">无重复字符的最长子串</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(3)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-3" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">找字符串里不含重复字符的最长子串的长度。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">用字典记每个字符最后一次出现的位置。右端 &#96;r&#96; 遇到重复字符时，把左端 &#96;l&#96; 直接跳到「上次出现位置 + 1」。**必须判断 &#96;last[c] &gt;= l&#96;**：如果那个重复字符已经在窗口外了，就不能让 &#96;l&#96; 往回退。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(字符集大小)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-3',this)">复制</button></div><pre id="code-3"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ lengthOfLongestSubstring(␀<span class="syn-num">2</span>␀, s):
        last = {}
        l = ans = <span class="syn-num">0</span>
        ␀<span class="syn-num">3</span>␀ r, c ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">9</span>␀(s):
            ␀<span class="syn-num">5</span>␀ c ␀<span class="syn-num">6</span>␀ last ␀<span class="syn-num">7</span>␀ last[c] &gt;= l:
                l = last[c] + <span class="syn-num">1</span>
            last[c] = r
            ans = ␀<span class="syn-num">10</span>␀(ans, r - l + <span class="syn-num">1</span>)
        ␀<span class="syn-num">8</span>␀ ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;s = &quot;abba&quot;&#96; 是专门卡「漏掉 &#96;&gt;= l&#96;」的用例，r=3 时 &#96;a&#96; 的上次位置 0 已在窗口外，若把 &#96;l&#96; 拉回 1，答案会错成 3。</div></div>
  </div>
</article>
<article class="card" data-num="4" data-diff="困难" data-topic="二分栈堆贪心" data-search="寻找两个正序数组的中位数两个有序数组，找合并后的中位数，要求 &#96;o(log(m+n))&#96;。">
  <div class="head" onclick="tog(4)">
    <span class="num">0004</span>
    <span class="ttl">寻找两个正序数组的中位数</span>
    <span class="badge b-困难">困难</span>
    <span class="topic">二分栈堆贪心</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(4)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-4" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">两个有序数组，找合并后的中位数，要求 &#96;O(log(m+n))&#96;。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">中位数把数据分成左右两半，左边个数等于（或多一个）右边。只要在较短数组里二分一个「切分点 i」，另一个数组的切分点 &#96;j&#96; 就自动确定。当「左边最大值 ≤ 右边最小值」时，切分正确，中位数就在四个边界数里。边界之外用 &#96;±inf&#96; 兜底。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(log(min(m,n)))&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-4',this)">复制</button></div><pre id="code-4"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ findMedianSortedArrays(␀<span class="syn-num">2</span>␀, nums1, nums2):
        ␀<span class="syn-num">3</span>␀ ␀<span class="syn-num">20</span>␀(nums1) &gt; ␀<span class="syn-num">21</span>␀(nums2):
            nums1, nums2 = nums2, nums1
        m, n = ␀<span class="syn-num">22</span>␀(nums1), ␀<span class="syn-num">23</span>␀(nums2)
        total = m + n
        half = (total + <span class="syn-num">1</span>) // <span class="syn-num">2</span>
        lo, hi = <span class="syn-num">0</span>, m
        ␀<span class="syn-num">4</span>␀ lo &lt;= hi:
            i = (lo + hi) // <span class="syn-num">2</span>
            j = half - i
            l1 = ␀<span class="syn-num">24</span>␀(&quot;-inf&quot;) ␀<span class="syn-num">5</span>␀ i == <span class="syn-num">0</span> ␀<span class="syn-num">6</span>␀ nums1[i - <span class="syn-num">1</span>]
            r1 = ␀<span class="syn-num">25</span>␀(&quot;inf&quot;) ␀<span class="syn-num">7</span>␀ i == m ␀<span class="syn-num">8</span>␀ nums1[i]
            l2 = ␀<span class="syn-num">26</span>␀(&quot;-inf&quot;) ␀<span class="syn-num">9</span>␀ j == <span class="syn-num">0</span> ␀<span class="syn-num">10</span>␀ nums2[j - <span class="syn-num">1</span>]
            r2 = ␀<span class="syn-num">27</span>␀(&quot;inf&quot;) ␀<span class="syn-num">11</span>␀ j == n ␀<span class="syn-num">12</span>␀ nums2[j]
            ␀<span class="syn-num">13</span>␀ l1 &lt;= r2 ␀<span class="syn-num">14</span>␀ l2 &lt;= r1:
                ␀<span class="syn-num">15</span>␀ total % <span class="syn-num">2</span>:
                    ␀<span class="syn-num">16</span>␀ ␀<span class="syn-num">28</span>␀(␀<span class="syn-num">29</span>␀(l1, l2))
                ␀<span class="syn-num">17</span>␀ (␀<span class="syn-num">30</span>␀(l1, l2) + ␀<span class="syn-num">31</span>␀(r1, r2)) / <span class="syn-num">2</span>
            ␀<span class="syn-num">18</span>␀ l1 &gt; r2:
                hi = i - <span class="syn-num">1</span>
            ␀<span class="syn-num">19</span>␀:
                lo = i + <span class="syn-num">1</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">一定要在**较短**数组上二分，否则 &#96;j&#96; 可能超出范围；&#96;half = (total+1)//2&#96; 让奇数时左边多一个，中位数直接是 &#96;max(l1,l2)&#96;。</div></div>
  </div>
</article>
<article class="card" data-num="5" data-diff="中等" data-topic="回溯图论DP" data-search="最长回文子串找字符串里最长的回文子串。">
  <div class="head" onclick="tog(5)">
    <span class="num">0005</span>
    <span class="ttl">最长回文子串</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(5)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-5" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">找字符串里最长的回文子串。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">回文可以从中心往两边扩。每个位置都可能是中心：奇数长度中心是 1 个字符，偶数长度中心是 2 个字符之间的缝。枚举 n 个位置 × 2 种中心。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n²)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-5',this)">复制</button></div><pre id="code-5"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ longestPalindrome(␀<span class="syn-num">2</span>␀, s):
        ␀<span class="syn-num">3</span>␀ expand(l, r):
            ␀<span class="syn-num">4</span>␀ l &gt;= <span class="syn-num">0</span> ␀<span class="syn-num">5</span>␀ r &lt; ␀<span class="syn-num">14</span>␀(s) ␀<span class="syn-num">6</span>␀ s[l] == s[r]:
                l -= <span class="syn-num">1</span>
                r += <span class="syn-num">1</span>
            ␀<span class="syn-num">7</span>␀ s[l + <span class="syn-num">1</span>:r]
        ans = &quot;&quot;
        ␀<span class="syn-num">8</span>␀ i ␀<span class="syn-num">9</span>␀ ␀<span class="syn-num">15</span>␀(␀<span class="syn-num">16</span>␀(s)):
            ␀<span class="syn-num">10</span>␀ a, b ␀<span class="syn-num">11</span>␀ ((i, i), (i, i + <span class="syn-num">1</span>)):
                cand = expand(a, b)
                ␀<span class="syn-num">12</span>␀ ␀<span class="syn-num">17</span>␀(cand) &gt; ␀<span class="syn-num">18</span>␀(ans):
                    ans = cand
        ␀<span class="syn-num">13</span>␀ ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">退出 &#96;while&#96; 时 &#96;l, r&#96; 已经越界或不匹配，所以切片要回退一格 &#96;s[l+1:r]&#96;。这题也能用二维区间 DP 做（状态是 &#96;dp[i][j]&#96; = s[i:j+1] 是否回文），但中心扩展更省空间。</div></div>
  </div>
</article>
<article class="card" data-num="11" data-diff="中等" data-topic="数组与哈希" data-search="盛最多水的容器找两条竖线，使它们和 x 轴围成的面积最大。面积 = 两边距离 × 较矮的高度。">
  <div class="head" onclick="tog(11)">
    <span class="num">0011</span>
    <span class="ttl">盛最多水的容器</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(11)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-11" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">找两条竖线，使它们和 x 轴围成的面积最大。面积 = 两边距离 × 较矮的高度。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">笨办法试遍所有两两组合（&#96;O(n²)&#96;）。用对撞指针从最宽的开始，每次**移动较矮的那一边**：宽度已经变小了，只有换掉矮的那根、让高度有可能变大，面积才可能变大。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-11',this)">复制</button></div><pre id="code-11"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ maxArea(␀<span class="syn-num">2</span>␀, height):
        l, r = <span class="syn-num">0</span>, ␀<span class="syn-num">7</span>␀(height) - <span class="syn-num">1</span>
        ans = <span class="syn-num">0</span>
        ␀<span class="syn-num">3</span>␀ l &lt; r:
            ans = ␀<span class="syn-num">8</span>␀(ans, (r - l) * ␀<span class="syn-num">9</span>␀(height[l], height[r]))
            ␀<span class="syn-num">4</span>␀ height[l] &lt; height[r]:
                l += <span class="syn-num">1</span>
            ␀<span class="syn-num">5</span>␀:
                r -= <span class="syn-num">1</span>
        ␀<span class="syn-num">6</span>␀ ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">面积要用 &#96;min(两边)&#96; 的高度，不是随便挑一个；两边相等时移哪边都行。</div></div>
  </div>
</article>
<article class="card" data-num="15" data-diff="中等" data-topic="数组与哈希" data-search="三数之和找出所有和为 0 且不重复的三元组。">
  <div class="head" onclick="tog(15)">
    <span class="num">0015</span>
    <span class="ttl">三数之和</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(15)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-15" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">找出所有和为 0 且不重复的三元组。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">先排序，然后固定第一个数 &#96;i&#96;，剩下两个数用对撞指针找（有序数组才能根据和的大小决定移动哪边）。**去重**全靠「排序后相同值相邻」：跳过重复的 &#96;i&#96;，命中后也跳过重复的 &#96;l&#96;。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n²)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-15',this)">复制</button></div><pre id="code-15"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ threeSum(␀<span class="syn-num">2</span>␀, nums):
        nums.sort()
        res, n = [], ␀<span class="syn-num">17</span>␀(nums)
        ␀<span class="syn-num">3</span>␀ i ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">18</span>␀(n - <span class="syn-num">2</span>):
            ␀<span class="syn-num">5</span>␀ nums[i] &gt; <span class="syn-num">0</span>:
                ␀<span class="syn-num">6</span>␀
            ␀<span class="syn-num">7</span>␀ i &gt; <span class="syn-num">0</span> ␀<span class="syn-num">8</span>␀ nums[i] == nums[i - <span class="syn-num">1</span>]:
                ␀<span class="syn-num">9</span>␀
            l, r = i + <span class="syn-num">1</span>, n - <span class="syn-num">1</span>
            ␀<span class="syn-num">10</span>␀ l &lt; r:
                s = nums[i] + nums[l] + nums[r]
                ␀<span class="syn-num">11</span>␀ s &lt; <span class="syn-num">0</span>:
                    l += <span class="syn-num">1</span>
                ␀<span class="syn-num">12</span>␀ s &gt; <span class="syn-num">0</span>:
                    r -= <span class="syn-num">1</span>
                ␀<span class="syn-num">13</span>␀:
                    res.append([nums[i], nums[l], nums[r]])
                    l += <span class="syn-num">1</span>
                    r -= <span class="syn-num">1</span>
                    ␀<span class="syn-num">14</span>␀ l &lt; r ␀<span class="syn-num">15</span>␀ nums[l] == nums[l - <span class="syn-num">1</span>]:
                        l += <span class="syn-num">1</span>
        ␀<span class="syn-num">16</span>␀ res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">两处去重 &#96;while&#96; 都不能省；&#96;nums.sort()&#96; 返回 &#96;None&#96;，别写成 &#96;nums = nums.sort()&#96;。</div></div>
  </div>
</article>
<article class="card" data-num="17" data-diff="中等" data-topic="回溯图论DP" data-search="电话号码的字母组合数字 &#96;2~9&#96; 各对应几个字母，给一串数字，返回所有可能的字母组合。 时间 &#96;o(4ⁿ × n)&#96;，空间 &#96;o(n)&#96;。**易错**：空字符串要返回 &#96;[]&#96; 而不是 &#96;[[]]&#96; 或 &#96;[&quot;&quot;]&#96;；字符串用 &#96;join&#96; 收集，不能直接 &#96;append&#96; 到结果。">

  <div class="body" id="body-17" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">数字 &#96;2~9&#96; 各对应几个字母，给一串数字，返回所有可能的字母组合。 时间 &#96;O(4ⁿ × n)&#96;，空间 &#96;O(n)&#96;。**易错**：空字符串要返回 &#96;[]&#96; 而不是 &#96;[[]]&#96; 或 &#96;[&quot;&quot;]&#96;；字符串用 &#96;join&#96; 收集，不能直接 &#96;append&#96; 到结果。</div></div>
    
    <div class="meta"><span class="cost">时间 &#96;O(4ⁿ × n)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-17',this)">复制</button></div><pre id="code-17"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ letterCombinations(␀<span class="syn-num">2</span>␀, digits):
        ␀<span class="syn-num">3</span>␀ ␀<span class="syn-num">4</span>␀ digits:
            ␀<span class="syn-num">5</span>␀ []
        mp = {&quot;<span class="syn-num">2</span>&quot;: &quot;abc&quot;, &quot;<span class="syn-num">3</span>&quot;: &quot;␀<span class="syn-num">6</span>␀&quot;, &quot;<span class="syn-num">4</span>&quot;: &quot;ghi&quot;, &quot;<span class="syn-num">5</span>&quot;: &quot;jkl&quot;,
              &quot;<span class="syn-num">6</span>&quot;: &quot;mno&quot;, &quot;<span class="syn-num">7</span>&quot;: &quot;pqrs&quot;, &quot;<span class="syn-num">8</span>&quot;: &quot;tuv&quot;, &quot;<span class="syn-num">9</span>&quot;: &quot;wxyz&quot;}
        res, path = [], []
        ␀<span class="syn-num">7</span>␀ dfs(i):
            ␀<span class="syn-num">8</span>␀ i == ␀<span class="syn-num">13</span>␀(digits):
                res.append(&quot;&quot;.join(path))
                ␀<span class="syn-num">9</span>␀
            ␀<span class="syn-num">10</span>␀ c ␀<span class="syn-num">11</span>␀ mp[digits[i]]:
                path.append(c)
                dfs(i + <span class="syn-num">1</span>)
                path.pop()
        dfs(<span class="syn-num">0</span>)
        ␀<span class="syn-num">12</span>␀ res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">空字符串要返回 &#96;[]&#96; 而不是 &#96;[[]]&#96; 或 &#96;[&quot;&quot;]&#96;；字符串用 &#96;join&#96; 收集，不能直接 &#96;append&#96; 到结果。</div></div>

</article>
<article class="card" data-num="19" data-diff="中等" data-topic="链表与树" data-search="删除倒数第 n 个结点删除链表中倒数第 n 个节点，返回链表头。">
  <div class="head" onclick="tog(19)">
    <span class="num">0019</span>
    <span class="ttl">删除倒数第 N 个结点</span>
    <span class="badge b-中等">中等</span>

    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(19)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-19" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">删除链表中倒数第 N 个节点，返回链表头。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">让 &#96;fast&#96; 先走 N 步，然后 &#96;fast&#96;、&#96;slow&#96; 一起走。&#96;fast&#96; 走到最后一个节点时，&#96;slow&#96; 正好停在要删节点的前一个。用虚拟头节点可以统一处理「删的是头节点」的情况。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-19',this)">复制</button></div><pre id="code-19"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ removeNthFromEnd(␀<span class="syn-num">2</span>␀, head, n):
        dummy = ListNode(<span class="syn-num">0</span>, head)
        fast = slow = dummy
        ␀<span class="syn-num">3</span>␀ _ ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">10</span>␀(n):
            fast = fast.next
        ␀<span class="syn-num">5</span>␀ fast.next ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀ ␀<span class="syn-num">8</span>␀:
            fast = fast.next
            slow = slow.next
        slow.next = slow.next.next
        ␀<span class="syn-num">9</span>␀ dummy.next</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;while fast.next is not None&#96; 而不是 &#96;fast is not None&#96;，这样 &#96;slow&#96; 才能停在待删节点的前一位。</div></div>
  </div>
</article>
<article class="card" data-num="20" data-diff="简单" data-topic="二分栈堆贪心" data-search="有效的括号判断括号串是否合法（&#96;()[]{}&#96;，要正确嵌套）。">
  <div class="head" onclick="tog(20)">

    <div class="blk"><div class="lbl">题意</div><div class="txt">判断括号串是否合法（&#96;()[]{}&#96;，要正确嵌套）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">遇到左括号先把「期待的右括号」压栈；遇到右括号就看它是不是栈顶期待的那个。最后栈必须是空的。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-20',this)">复制</button></div><pre id="code-20"><code>␀<span class="syn-num">1</span>␀ Solution:
    ␀<span class="syn-num">2</span>␀ isValid(␀<span class="syn-num">3</span>␀, s):
        pairs = {&␀<span class="syn-num">0</span>␀
        st = []
        ␀<span class="syn-num">4</span>␀ c ␀<span class="syn-num">5</span>␀ s:
            ␀<span class="syn-num">6</span>␀ c ␀<span class="syn-num">7</span>␀ pairs:
                ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀ st ␀<span class="syn-num">10</span>␀ st[-<span class="syn-num">1</span>] != pairs[c]:
                    ␀<span class="syn-num">11</span>␀ ␀<span class="syn-num">12</span>␀
                st.pop()
            ␀<span class="syn-num">13</span>␀:
                st.append(c)
        ␀<span class="syn-num">14</span>␀ ␀<span class="syn-num">15</span>␀ st</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;&quot;]&quot;&#96; 这种一上来就是右括号的，要先判 &#96;not st&#96;，否则 &#96;st[-1]&#96; 越界。</div></div>
  </div>
</article>
<article class="card" data-num="21" data-diff="简单" data-topic="链表与树" data-search="合并两个有序链表把两个升序链表合并成一个升序链表。">
  <div class="head" onclick="tog(21)">
    <span class="num">0021</span>
    <span class="ttl">合并两个有序链表</span>
    <span class="badge b-简单">简单</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(21)">○</button>

  <div class="body" id="body-21" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">把两个升序链表合并成一个升序链表。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">用虚拟头节点 &#96;dummy&#96;，每次挑两个链表头里较小的那个接上去，被挑中的往后走一步。最后把没走完的那条整段接上。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(m+n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-21',this)">复制</button></div><pre id="code-21"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ mergeTwoLists(␀<span class="syn-num">2</span>␀, list1, list2):
        dummy = cur = ListNode(<span class="syn-num">0</span>)
        ␀<span class="syn-num">3</span>␀ list1 ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀ list2 ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀ ␀<span class="syn-num">10</span>␀:
            ␀<span class="syn-num">11</span>␀ list1.val &lt;= list2.val:
                cur.next, list1 = list1, list1.next
            ␀<span class="syn-num">12</span>␀:
                cur.next, list2 = list2, list2.next
            cur = cur.next
        cur.next = list1 ␀<span class="syn-num">13</span>␀ list1 ␀<span class="syn-num">14</span>␀ ␀<span class="syn-num">15</span>␀ ␀<span class="syn-num">16</span>␀ ␀<span class="syn-num">17</span>␀ list2
        ␀<span class="syn-num">18</span>␀ dummy.next</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;cur.next, list1 = list1, list1.next&#96; 右侧先整体求值，所以 &#96;list1.next&#96; 是**原来的**下一个节点，不会被覆盖。&#96;dummy&#96; 本身不存有效数据，最后返回 &#96;dummy.next&#96;。</div></div>
  </div>
</article>
<article class="card" data-num="22" data-diff="中等" data-topic="回溯图论DP" data-search="括号生成生成 n 对括号的所有合法组合。">
  <div class="head" onclick="tog(22)">
    <span class="num">0022</span>
    <span class="ttl">括号生成</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(22)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-22" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">生成 n 对括号的所有合法组合。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">两个剪枝条件就能保证任意前缀合法——左括号最多 n 个；右括号数量**不能超过**左括号数量。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(卡特兰数 × n)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-22',this)">复制</button></div><pre id="code-22"><code>␀<span class="syn-num">1</span>␀ Solution:
    ␀<span class="syn-num">2</span>␀ generateParenthesis(␀<span class="syn-num">3</span>␀, n):
        res, path = [], []
        ␀<span class="syn-num">4</span>␀ dfs(left, right):
            ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">10</span>␀(path) == <span class="syn-num">2</span> * n:
                res.append(&quot;&quot;.join(path))
                ␀<span class="syn-num">6</span>␀
            ␀<span class="syn-num">7</span>␀ left &lt; n:
                path.append(&quot;(&quot;)
                dfs(left + <span class="syn-num">1</span>, right)
                path.pop()
            ␀<span class="syn-num">8</span>␀ right &lt; left:                 ␀<span class="syn-num">0</span>␀
                path.append(&quot;)&quot;)
                dfs(left, right + <span class="syn-num">1</span>)
                path.pop()
        dfs(<span class="syn-num">0</span>, <span class="syn-num">0</span>)
        ␀<span class="syn-num">9</span>␀ res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;right &lt; left&#96; 这个条件是「合法括号串」的核心，漏掉会产生 &#96;())(&#96; 这类非法串。</div></div>
  </div>
</article>
<article class="card" data-num="23" data-diff="困难" data-topic="链表与树" data-search="合并 k 个升序链表把 k 个升序链表合并成一个升序链表。">
  <div class="head" onclick="tog(23)">
    <span class="num">0023</span>
    <span class="ttl">合并 K 个升序链表</span>
    <span class="badge b-困难">困难</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(23)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-23" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">把 K 个升序链表合并成一个升序链表。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">把每条链表当前的头放进小根堆，每次弹出最小的接进答案，再把那条链表的下一个节点补进堆。因为节点对象不能直接比较，堆里放 &#96;(值, 序号, 节点)&#96;，序号保证永远不会比到节点本身。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(N log k)&#96;（N 总节点数、k 链表条数）；空间 &#96;O(k)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-23',this)">复制</button></div><pre id="code-23"><code>␀<span class="syn-num">0</span>␀ heapq

␀<span class="syn-num">1</span>␀ Solution:
    ␀<span class="syn-num">2</span>␀ mergeKLists(␀<span class="syn-num">3</span>␀, lists):
        h = []
        seq = <span class="syn-num">0</span>
        ␀<span class="syn-num">4</span>␀ node ␀<span class="syn-num">5</span>␀ lists:
            ␀<span class="syn-num">6</span>␀ node ␀<span class="syn-num">7</span>␀ ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀:
                heapq.heappush(h, (node.val, seq, node))
                seq += <span class="syn-num">1</span>
        dummy = cur = ListNode(<span class="syn-num">0</span>)
        ␀<span class="syn-num">10</span>␀ h:
            _, _, node = heapq.heappop(h)
            cur.next = node
            cur = cur.next
            ␀<span class="syn-num">11</span>␀ node.next ␀<span class="syn-num">12</span>␀ ␀<span class="syn-num">13</span>␀ ␀<span class="syn-num">14</span>␀:
                heapq.heappush(h, (node.next.val, seq, node.next))
                seq += <span class="syn-num">1</span>
        ␀<span class="syn-num">15</span>␀ dummy.next</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">不插 &#96;seq&#96; 的话，两条链表头值相同时 Python 会去比较 &#96;ListNode&#96; 对象，直接 &#96;TypeError&#96;。</div></div>
  </div>
</article>
<article class="card" data-num="24" data-diff="中等" data-topic="链表与树" data-search="两两交换链表中的节点两两交换链表里相邻的节点，返回新的头。">
  <div class="head" onclick="tog(24)">
    <span class="num">0024</span>
    <span class="ttl">两两交换链表中的节点</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(24)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-24" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">两两交换链表里相邻的节点，返回新的头。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">每次处理一对 &#96;(a, b)&#96;，把 &#96;prev -&gt; a -&gt; b -&gt; next&#96; 改成 &#96;prev -&gt; b -&gt; a -&gt; next&#96;，然后 &#96;prev&#96; 挪到 &#96;a&#96;（它现在是这一对的尾）。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-24',this)">复制</button></div><pre id="code-24"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ swapPairs(␀<span class="syn-num">2</span>␀, head):
        dummy = ListNode(<span class="syn-num">0</span>, head)
        prev = dummy
        ␀<span class="syn-num">3</span>␀ prev.next ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀ prev.next.next ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀ ␀<span class="syn-num">10</span>␀:
            a, b = prev.next, prev.next.next
            prev.next, b.next, a.next = b, a, b.next
            prev = a
        ␀<span class="syn-num">11</span>␀ dummy.next</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">那个三路赋值右边先整体求值，&#96;b.next&#96; 取的是**交换前** b 的下一个节点，正好是下一组的开头。写成三行分开的赋值反而容易错，因为 &#96;b.next&#96; 已经被改过了。</div></div>
  </div>
</article>
<article class="card" data-num="25" data-diff="困难" data-topic="链表与树" data-search="k 个一组翻转链表每 k 个节点翻转一组，不足 k 个的保持原样。">
  <div class="head" onclick="tog(25)">
    <span class="num">0025</span>
    <span class="ttl">K 个一组翻转链表</span>
    <span class="badge b-困难">困难</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(25)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-25" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">每 K 个节点翻转一组，不足 K 个的保持原样。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">先探路，从 &#96;group_prev&#96; 往前数 K 个找到 &#96;kth&#96;；数不够就结束。够的话记录 &#96;group_next = kth.next&#96;，用 206 题的反转手法把这一段翻转（注意反转的初始 &#96;prev&#96; 要设成 &#96;group_next&#96;，这样尾能自动接上后半段），最后把上一组的尾接到新头。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-25',this)">复制</button></div><pre id="code-25"><code>␀<span class="syn-num">1</span>␀ Solution:
    ␀<span class="syn-num">2</span>␀ reverseKGroup(␀<span class="syn-num">3</span>␀, head, k):
        ␀<span class="syn-num">4</span>␀ kth_after(node, k):
            ␀<span class="syn-num">5</span>␀ _ ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">23</span>␀(k):
                ␀<span class="syn-num">7</span>␀ node ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀:
                    ␀<span class="syn-num">10</span>␀ ␀<span class="syn-num">11</span>␀
                node = node.next
            ␀<span class="syn-num">12</span>␀ node

        dummy = ListNode(<span class="syn-num">0</span>, head)
        group_prev = dummy
        ␀<span class="syn-num">13</span>␀ ␀<span class="syn-num">14</span>␀:
            kth = kth_after(group_prev, k)
            ␀<span class="syn-num">15</span>␀ kth ␀<span class="syn-num">16</span>␀ ␀<span class="syn-num">17</span>␀:
                ␀<span class="syn-num">18</span>␀
            group_next = kth.next
            prev, cur = group_next, group_prev.next
            ␀<span class="syn-num">19</span>␀ cur ␀<span class="syn-num">20</span>␀ ␀<span class="syn-num">21</span>␀ group_next:
                nxt = cur.next
                cur.next = prev
                prev, cur = cur, nxt
            old_head = group_prev.next       ␀<span class="syn-num">0</span>␀
            group_prev.next = kth
            group_prev = old_head
        ␀<span class="syn-num">22</span>␀ dummy.next</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;kth_after(group_prev, k)&#96; 从虚拟头开始数 K 步才正好落在本组最后一个节点；反转时 &#96;prev&#96; 初值必须是 &#96;group_next&#96;。</div></div>
  </div>
</article>
<article class="card" data-num="31" data-diff="中等" data-topic="数组与哈希" data-search="下一个排列把数组当成排列，原地改成字典序的下一个排列；若已是最大，改成最小。">
  <div class="head" onclick="tog(31)">
    <span class="num">0031</span>
    <span class="ttl">下一个排列</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(31)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-31" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">把数组当成排列，原地改成字典序的下一个排列；若已是最大，改成最小。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">三步。① 从右往左找第一个「比右边小」的位置 &#96;i&#96;（这是还能变大的最靠右位置）。② 再从右往左找第一个比 &#96;nums[i]&#96; 大的数，和它交换。③ 把 &#96;i&#96; 之后的部分反转（原来是降序，反转后变成最小升序）。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-31',this)">复制</button></div><pre id="code-31"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ nextPermutation(␀<span class="syn-num">2</span>␀, nums):
        n = ␀<span class="syn-num">8</span>␀(nums)
        i = n - <span class="syn-num">2</span>
        ␀<span class="syn-num">3</span>␀ i &gt;= <span class="syn-num">0</span> ␀<span class="syn-num">4</span>␀ nums[i] &gt;= nums[i + <span class="syn-num">1</span>]:
            i -= <span class="syn-num">1</span>
        ␀<span class="syn-num">5</span>␀ i &gt;= <span class="syn-num">0</span>:
            j = n - <span class="syn-num">1</span>
            ␀<span class="syn-num">6</span>␀ nums[j] &lt;= nums[i]:
                j -= <span class="syn-num">1</span>
            nums[i], nums[j] = nums[j], nums[i]
        l, r = i + <span class="syn-num">1</span>, n - <span class="syn-num">1</span>
        ␀<span class="syn-num">7</span>␀ l &lt; r:
            nums[l], nums[r] = nums[r], nums[l]
            l += <span class="syn-num">1</span>
            r -= <span class="syn-num">1</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;i = -1&#96; 表示整个数组是降序（最大排列），此时跳过交换、直接整体反转。</div></div>
  </div>
</article>
<article class="card" data-num="32" data-diff="困难" data-topic="回溯图论DP" data-search="最长有效括号找最长的**连续合法括号子串**的长度。">
  <div class="head" onclick="tog(32)">
    <span class="num">0032</span>
    <span class="ttl">最长有效括号</span>
    <span class="badge b-困难">困难</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(32)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-32" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">找最长的**连续合法括号子串**的长度。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">用栈存下标，栈底始终放「上一个无法匹配的位置」。遇到 &#96;(&#96; 压下标；遇到 &#96;)&#96; 先弹一个，若栈空了说明这个 &#96;)&#96; 无法匹配，把它自己当新的栈底；否则当前合法长度 = 当前下标 − 栈顶。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-32',this)">复制</button></div><pre id="code-32"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ longestValidParentheses(␀<span class="syn-num">2</span>␀, s):
        stack = [-<span class="syn-num">1</span>]
        ans = <span class="syn-num">0</span>
        ␀<span class="syn-num">3</span>␀ i, c ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">11</span>␀(s):
            ␀<span class="syn-num">5</span>␀ c == &quot;(&quot;:
                stack.append(i)
            ␀<span class="syn-num">6</span>␀:
                stack.pop()
                ␀<span class="syn-num">7</span>␀ ␀<span class="syn-num">8</span>␀ stack:
                    stack.append(i)
                ␀<span class="syn-num">9</span>␀:
                    ans = ␀<span class="syn-num">12</span>␀(ans, i - stack[-<span class="syn-num">1</span>])
        ␀<span class="syn-num">10</span>␀ ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">栈初始放 &#96;-1&#96;（不是空），这样第一个合法段能算出完整长度；每遇到一个多余的 &#96;)&#96; 就把它的位置设为新基准。</div></div>
  </div>
</article>
<article class="card" data-num="33" data-diff="中等" data-topic="二分栈堆贪心" data-search="搜索旋转排序数组原本有序的数组被「旋转」过（如 &#96;[4,5,6,7,0,1,2]&#96;），找 target 的下标。">
  <div class="head" onclick="tog(33)">
    <span class="num">0033</span>
    <span class="ttl">搜索旋转排序数组</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">二分栈堆贪心</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(33)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-33" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">原本有序的数组被「旋转」过（如 &#96;[4,5,6,7,0,1,2]&#96;），找 target 的下标。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">数组不再是整体有序，但**从中间劈开，一定有一半是有序的**。判断哪半有序，再看 target 是否落在那一半里，就能决定砍掉哪边。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(log n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-33',this)">复制</button></div><pre id="code-33"><code>␀<span class="syn-num">2</span>␀ Solution:
    ␀<span class="syn-num">3</span>␀ search(␀<span class="syn-num">4</span>␀, nums, target):
        l, r = <span class="syn-num">0</span>, ␀<span class="syn-num">15</span>␀(nums) - <span class="syn-num">1</span>
        ␀<span class="syn-num">5</span>␀ l &lt;= r:
            mid = (l + r) // <span class="syn-num">2</span>
            ␀<span class="syn-num">6</span>␀ nums[mid] == target:
                ␀<span class="syn-num">7</span>␀ mid
            ␀<span class="syn-num">8</span>␀ nums[l] &lt;= nums[mid]:          ␀<span class="syn-num">0</span>␀
                ␀<span class="syn-num">9</span>␀ nums[l] &lt;= target &lt; nums[mid]:
                    r = mid - <span class="syn-num">1</span>
                ␀<span class="syn-num">10</span>␀:
                    l = mid + <span class="syn-num">1</span>
            ␀<span class="syn-num">11</span>␀:                             ␀<span class="syn-num">1</span>␀
                ␀<span class="syn-num">12</span>␀ nums[mid] &lt; target &lt;= nums[r]:
                    l = mid + <span class="syn-num">1</span>
                ␀<span class="syn-num">13</span>␀:
                    r = mid - <span class="syn-num">1</span>
        ␀<span class="syn-num">14</span>␀ -<span class="syn-num">1</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">判断「左半有序」用 &#96;&lt;=&#96; 而不是 &#96;&lt;&#96;，因为区间可能只剩两个元素。</div></div>
  </div>
</article>
<article class="card" data-num="34" data-diff="中等" data-topic="二分栈堆贪心" data-search="找第一个和最后一个位置有序数组里找 target 第一次和最后一次出现的下标，没有返回 &#96;[-1, -1]&#96;。">
  <div class="head" onclick="tog(34)">
    <span class="num">0034</span>
    <span class="ttl">找第一个和最后一个位置</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">二分栈堆贪心</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(34)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-34" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">有序数组里找 target 第一次和最后一次出现的下标，没有返回 &#96;[-1, -1]&#96;。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">两次「找边界」。第一次找「第一个 ≥ target」的位置；第二次找「第一个 ≥ target+1」的位置，减 1 就是最后一个 target。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(log n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-34',this)">复制</button></div><pre id="code-34"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ searchRange(␀<span class="syn-num">2</span>␀, nums, target):
        ␀<span class="syn-num">3</span>␀ lower(x):
            l, r = <span class="syn-num">0</span>, ␀<span class="syn-num">11</span>␀(nums)
            ␀<span class="syn-num">4</span>␀ l &lt; r:
                mid = (l + r) // <span class="syn-num">2</span>
                ␀<span class="syn-num">5</span>␀ nums[mid] &gt;= x:
                    r = mid
                ␀<span class="syn-num">6</span>␀:
                    l = mid + <span class="syn-num">1</span>
            ␀<span class="syn-num">7</span>␀ l
        a = lower(target)
        b = lower(target + <span class="syn-num">1</span>) - <span class="syn-num">1</span>
        ␀<span class="syn-num">8</span>␀ a &lt;= b:
            ␀<span class="syn-num">9</span>␀ [a, b]
        ␀<span class="syn-num">10</span>␀ [-<span class="syn-num">1</span>, -<span class="syn-num">1</span>]</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;a == len(nums)&#96;（target 比所有数都大）时 &#96;a &gt; b&#96;，靠这个判断返回 &#96;[-1,-1]&#96;，不用额外判空。</div></div>
  </div>
</article>
<article class="card" data-num="35" data-diff="简单" data-topic="二分栈堆贪心" data-search="搜索插入位置有序数组里找 target，找到返回下标，没找到返回它该插入的位置。就是骨架 b。 时间 &#96;o(log n)&#96;，空间 &#96;o(1)&#96;。**易错**：右端是 &#96;len(nums)&#96; 不是 &#96;len(nums)-1&#96;，因为插入位置可能是末尾。">
  <div class="head" onclick="tog(35)">
    <span class="num">0035</span>

    <span class="badge b-简单">简单</span>
    <span class="topic">二分栈堆贪心</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(35)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-35" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">有序数组里找 target，找到返回下标，没找到返回它该插入的位置。就是骨架 B。 时间 &#96;O(log n)&#96;，空间 &#96;O(1)&#96;。**易错**：右端是 &#96;len(nums)&#96; 不是 &#96;len(nums)-1&#96;，因为插入位置可能是末尾。</div></div>
    
    <div class="meta"><span class="cost">时间 &#96;O(log n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-35',this)">复制</button></div><pre id="code-35"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ searchInsert(␀<span class="syn-num">2</span>␀, nums, target):
        l, r = <span class="syn-num">0</span>, ␀<span class="syn-num">7</span>␀(nums)
        ␀<span class="syn-num">3</span>␀ l &lt; r:
            mid = (l + r) // <span class="syn-num">2</span>
            ␀<span class="syn-num">4</span>␀ nums[mid] &gt;= target:
                r = mid
            ␀<span class="syn-num">5</span>␀:
                l = mid + <span class="syn-num">1</span>
        ␀<span class="syn-num">6</span>␀ l</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">右端是 &#96;len(nums)&#96; 不是 &#96;len(nums)-1&#96;，因为插入位置可能是末尾。</div></div>
  </div>
</article>
<article class="card" data-num="39" data-diff="中等" data-topic="回溯图论DP" data-search="组合总和给一组**无重复**的正数，找出所有和等于 target 的组合，每个数字可以**无限次**使用。">
  <div class="head" onclick="tog(39)">
    <span class="num">0039</span>
    <span class="ttl">组合总和</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(39)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-39" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">给一组**无重复**的正数，找出所有和等于 target 的组合，每个数字可以**无限次**使用。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">&#96;start&#96; 表示「本层往下只能从下标 start 开始选」，避免顺序不同的重复组合；因为可以重复选自己，递归时传 &#96;i&#96; 而不是 &#96;i + 1&#96;。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(答案个数 × 答案长度)&#96;；空间 &#96;O(target)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-39',this)">复制</button></div><pre id="code-39"><code>␀<span class="syn-num">1</span>␀ Solution:
    ␀<span class="syn-num">2</span>␀ combinationSum(␀<span class="syn-num">3</span>␀, candidates, target):
        res, path = [], []
        ␀<span class="syn-num">4</span>␀ dfs(start, remain):
            ␀<span class="syn-num">5</span>␀ remain == <span class="syn-num">0</span>:
                res.append(path[:])
                ␀<span class="syn-num">6</span>␀
            ␀<span class="syn-num">7</span>␀ i ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">12</span>␀(start, ␀<span class="syn-num">13</span>␀(candidates)):
                ␀<span class="syn-num">9</span>␀ candidates[i] &gt; remain:
                    ␀<span class="syn-num">10</span>␀
                path.append(candidates[i])
                dfs(i, remain - candidates[i])   ␀<span class="syn-num">0</span>␀
                path.pop()
        dfs(<span class="syn-num">0</span>, target)
        ␀<span class="syn-num">11</span>␀ res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;dfs(i, ...)&#96; 里的 &#96;i&#96; 是关键，写成 &#96;i+1&#96; 就变成「每个数只能用一次」。</div></div>
  </div>
</article>
<article class="card" data-num="41" data-diff="困难" data-topic="数组与哈希" data-search="缺失的第一个正数找出数组里没出现的最小正整数，要求 &#96;o(n)&#96; 时间、常数空间。">
  <div class="head" onclick="tog(41)">
    <span class="num">0041</span>
    <span class="ttl">缺失的第一个正数</span>
    <span class="badge b-困难">困难</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(41)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-41" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">找出数组里没出现的最小正整数，要求 &#96;O(n)&#96; 时间、常数空间。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">答案是 1～n+1 中的某一个。利用「原地哈希」：把值 &#96;x&#96;（1 ≤ x ≤ n）交换到下标 &#96;x-1&#96; 的位置上。换完再扫一遍，第一个「位置 i 上不是 i+1」的就是答案。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;（每个数最多被换到自己位置一次）；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-41',this)">复制</button></div><pre id="code-41"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ firstMissingPositive(␀<span class="syn-num">2</span>␀, nums):
        n = ␀<span class="syn-num">12</span>␀(nums)
        ␀<span class="syn-num">3</span>␀ i ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">13</span>␀(n):
            ␀<span class="syn-num">5</span>␀ <span class="syn-num">1</span> &lt;= nums[i] &lt;= n ␀<span class="syn-num">6</span>␀ nums[nums[i] - <span class="syn-num">1</span>] != nums[i]:
                j = nums[i] - <span class="syn-num">1</span>
                nums[i], nums[j] = nums[j], nums[i]
        ␀<span class="syn-num">7</span>␀ i ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">14</span>␀(n):
            ␀<span class="syn-num">9</span>␀ nums[i] != i + <span class="syn-num">1</span>:
                ␀<span class="syn-num">10</span>␀ i + <span class="syn-num">1</span>
        ␀<span class="syn-num">11</span>␀ n + <span class="syn-num">1</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;while&#96; 不能写成 &#96;if&#96;，换过来的新值可能还需要继续交换；&#96;nums[nums[i]-1] != nums[i]&#96; 这个判断防止两个相同值无限交换。</div></div>
  </div>
</article>
<article class="card" data-num="42" data-diff="困难" data-topic="数组与哈希" data-search="接雨水给一排柱子的高度，求能接多少雨水。">
  <div class="head" onclick="tog(42)">
    <span class="num">0042</span>
    <span class="ttl">接雨水</span>
    <span class="badge b-困难">困难</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(42)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-42" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">给一排柱子的高度，求能接多少雨水。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">每个位置能存多少水，取决于「它左边最高的」和「右边最高的」里较矮的那个，减去自己的高度。用对撞指针从两端往中间走，同时维护 &#96;left_max&#96; 和 &#96;right_max&#96;：哪边当前较矮，就处理哪边（因为它能存多少已经由这一侧的最大值决定了，另一侧肯定更高）。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-42',this)">复制</button></div><pre id="code-42"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ trap(␀<span class="syn-num">2</span>␀, height):
        l, r = <span class="syn-num">0</span>, ␀<span class="syn-num">7</span>␀(height) - <span class="syn-num">1</span>
        left_max = right_max = <span class="syn-num">0</span>
        ans = <span class="syn-num">0</span>
        ␀<span class="syn-num">3</span>␀ l &lt; r:
            ␀<span class="syn-num">4</span>␀ height[l] &lt; height[r]:
                left_max = ␀<span class="syn-num">8</span>␀(left_max, height[l])
                ans += left_max - height[l]
                l += <span class="syn-num">1</span>
            ␀<span class="syn-num">5</span>␀:
                right_max = ␀<span class="syn-num">9</span>␀(right_max, height[r])
                ans += right_max - height[r]
                r -= <span class="syn-num">1</span>
        ␀<span class="syn-num">6</span>␀ ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">先更新最大值再算这一格的水，顺序反了会得到 0。</div></div>
  </div>
</article>
<article class="card" data-num="45" data-diff="中等" data-topic="二分栈堆贪心" data-search="跳跃游戏 ii保证能到达终点，求最少跳几次。">
  <div class="head" onclick="tog(45)">
    <span class="num">0045</span>
    <span class="ttl">跳跃游戏 II</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">二分栈堆贪心</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(45)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-45" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">保证能到达终点，求最少跳几次。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">把「跳 k 次能到的范围」看成一个区间。当前这一跳的范围内，记录下一步最远能到哪；走到当前范围边界时，就必须再跳一次，同时把边界推到刚记录的最远处。像一层一层往外扩。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-45',this)">复制</button></div><pre id="code-45"><code>␀<span class="syn-num">2</span>␀ Solution:
    ␀<span class="syn-num">3</span>␀ jump(␀<span class="syn-num">4</span>␀, nums):
        ans = <span class="syn-num">0</span>
        cur_end = <span class="syn-num">0</span>        ␀<span class="syn-num">0</span>␀
        farthest = <span class="syn-num">0</span>       ␀<span class="syn-num">1</span>␀
        ␀<span class="syn-num">5</span>␀ i ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">9</span>␀(␀<span class="syn-num">10</span>␀(nums) - <span class="syn-num">1</span>):
            farthest = ␀<span class="syn-num">11</span>␀(farthest, i + nums[i])
            ␀<span class="syn-num">7</span>␀ i == cur_end:
                ans += <span class="syn-num">1</span>
                cur_end = farthest
        ␀<span class="syn-num">8</span>␀ ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">循环到 &#96;len(nums)-2&#96; 就停（站在最后一个位置不用再跳）；只有一个元素时循环不执行，返回 0，正确。</div></div>
  </div>
</article>
<article class="card" data-num="46" data-diff="中等" data-topic="回溯图论DP" data-search="全排列给不含重复数字的数组，返回所有排列。 时间 &#96;o(n × n!)&#96;，空间 &#96;o(n)&#96;（不含结果）。**易错**：&#96;used&#96; 也要在递归后恢复，否则下一条路会以为这个元素被占用了。">
  <div class="head" onclick="tog(46)">
    <span class="num">0046</span>
    <span class="ttl">全排列</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(46)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-46" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">给不含重复数字的数组，返回所有排列。 时间 &#96;O(n × n!)&#96;，空间 &#96;O(n)&#96;（不含结果）。**易错**：&#96;used&#96; 也要在递归后恢复，否则下一条路会以为这个元素被占用了。</div></div>
    
    <div class="meta"><span class="cost">时间 &#96;O(n × n!)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-46',this)">复制</button></div><pre id="code-46"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ permute(␀<span class="syn-num">2</span>␀, nums):
        res, path = [], []
        used = [␀<span class="syn-num">3</span>␀] * ␀<span class="syn-num">14</span>␀(nums)
        ␀<span class="syn-num">4</span>␀ dfs():
            ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">15</span>␀(path) == ␀<span class="syn-num">16</span>␀(nums):
                res.append(path[:])
                ␀<span class="syn-num">6</span>␀
            ␀<span class="syn-num">7</span>␀ i, x ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">17</span>␀(nums):
                ␀<span class="syn-num">9</span>␀ used[i]:
                    ␀<span class="syn-num">10</span>␀
                used[i] = ␀<span class="syn-num">11</span>␀
                path.append(x)
                dfs()
                path.pop()
                used[i] = ␀<span class="syn-num">12</span>␀
        dfs()
        ␀<span class="syn-num">13</span>␀ res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;used&#96; 也要在递归后恢复，否则下一条路会以为这个元素被占用了。</div></div>
  </div>
</article>
<article class="card" data-num="48" data-diff="中等" data-topic="数组与哈希" data-search="旋转图像把 n×n 矩阵顺时针旋转 90 度，原地改。">
  <div class="head" onclick="tog(48)">
    <span class="num">0048</span>

    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-48',this)">复制</button></div><pre id="code-48"><code>␀<span class="syn-num">0</span>␀ Solution:

    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-49',this)">复制</button></div><pre id="code-49"><code>␀<span class="syn-num">0</span>␀ collections ␀<span class="syn-num">1</span>␀ defaultdict

␀<span class="syn-num">2</span>␀ Solution:

<article class="card" data-num="51" data-diff="困难" data-topic="回溯图论DP" data-search="n 皇后在 n×n 棋盘放 n 个皇后，互不攻击，返回所有摆法。">
  <div class="head" onclick="tog(51)">
    <span class="num">0051</span>
    <span class="ttl">N 皇后</span>
    <span class="badge b-困难">困难</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(51)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-51" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">在 n×n 棋盘放 n 个皇后，互不攻击，返回所有摆法。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">一行一行放，每行只放一个。用三个集合记「已被占用的列」「已被占用的主对角线」「副对角线」。主对角线上的格子满足 &#96;行 - 列&#96; 相同，副对角线满足 &#96;行 + 列&#96; 相同。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n!)&#96;；空间 &#96;O(n²)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-51',this)">复制</button></div><pre id="code-51"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ solveNQueens(␀<span class="syn-num">2</span>␀, n):
        res = []
        board = [[&quot;.&quot;] * n ␀<span class="syn-num">3</span>␀ _ ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">20</span>␀(n)]
        cols, diag1, diag2 = ␀<span class="syn-num">21</span>␀(), ␀<span class="syn-num">22</span>␀(), ␀<span class="syn-num">23</span>␀()
        ␀<span class="syn-num">5</span>␀ dfs(r):
            ␀<span class="syn-num">6</span>␀ r == n:
                res.append([&quot;&quot;.join(row) ␀<span class="syn-num">7</span>␀ row ␀<span class="syn-num">8</span>␀ board])
                ␀<span class="syn-num">9</span>␀
            ␀<span class="syn-num">10</span>␀ c ␀<span class="syn-num">11</span>␀ ␀<span class="syn-num">24</span>␀(n):
                ␀<span class="syn-num">12</span>␀ c ␀<span class="syn-num">13</span>␀ cols ␀<span class="syn-num">14</span>␀ (r - c) ␀<span class="syn-num">15</span>␀ diag1 ␀<span class="syn-num">16</span>␀ (r + c) ␀<span class="syn-num">17</span>␀ diag2:
                    ␀<span class="syn-num">18</span>␀
                board[r][c] = &quot;Q&quot;
                cols.add(c); diag1.add(r - c); diag2.add(r + c)
                dfs(r + <span class="syn-num">1</span>)
                cols.remove(c); diag1.remove(r - c); diag2.remove(r + c)
                board[r][c] = &quot;.&quot;
        dfs(<span class="syn-num">0</span>)
        ␀<span class="syn-num">19</span>␀ res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">棋盘必须用推导式建（&#96;[[&quot;.&quot;]*n for _ in range(n)]&#96;），写成 &#96;[[&quot;.&quot;]*n]*n&#96; 会让所有行共享同一行；收集答案时要逐行 &#96;join&#96; 成字符串快照。</div></div>
  </div>
</article>
<article class="card" data-num="53" data-diff="中等" data-topic="数组与哈希" data-search="最大子数组和找连续一段，使它的和最大（数组里可能有负数）。">
  <div class="head" onclick="tog(53)">
    <span class="num">0053</span>
    <span class="ttl">最大子数组和</span>
    <span class="badge b-中等">中等</span>

  </div>
  <div class="body" id="body-53" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">找连续一段，使它的和最大（数组里可能有负数）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">笨办法枚举所有起点终点（&#96;O(n²)&#96;）。扫的时候想：如果「以当前位置结尾的最大和」已经算出来是 &#96;cur&#96;，那下一个位置有两种选择——接在 &#96;cur&#96; 后面，或者干脆从自己重新开始。取较大的那个。**如果 &#96;cur&#96; 是负数，接上只会更差，必定重新开始**。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-53',this)">复制</button></div><pre id="code-53"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ maxSubArray(␀<span class="syn-num">2</span>␀, nums):
        cur = best = nums[<span class="syn-num">0</span>]
        ␀<span class="syn-num">3</span>␀ x ␀<span class="syn-num">4</span>␀ nums[<span class="syn-num">1</span>:]:
            cur = ␀<span class="syn-num">6</span>␀(x, cur + x)
            best = ␀<span class="syn-num">7</span>␀(best, cur)
        ␀<span class="syn-num">5</span>␀ best</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">初始值设成 0 会在全负数数组上错；要用第一个元素或 &#96;float(&quot;-inf&quot;)&#96;。</div></div>
  </div>
</article>
<article class="card" data-num="54" data-diff="中等" data-topic="数组与哈希" data-search="螺旋矩阵按顺时针螺旋顺序输出矩阵所有元素。">
  <div class="head" onclick="tog(54)">
    <span class="num">0054</span>
    <span class="ttl">螺旋矩阵</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(54)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-54" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">按顺时针螺旋顺序输出矩阵所有元素。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">设四个边界 &#96;top/bottom/left/right&#96;，每走完一圈就往里缩一格。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(mn)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-54',this)">复制</button></div><pre id="code-54"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ spiralOrder(␀<span class="syn-num">2</span>␀, matrix):
        m, n = ␀<span class="syn-num">16</span>␀(matrix), ␀<span class="syn-num">17</span>␀(matrix[<span class="syn-num">0</span>])
        top, bottom = <span class="syn-num">0</span>, m - <span class="syn-num">1</span>
        left, right = <span class="syn-num">0</span>, n - <span class="syn-num">1</span>
        res = []
        ␀<span class="syn-num">3</span>␀ top &lt;= bottom ␀<span class="syn-num">4</span>␀ left &lt;= right:
            ␀<span class="syn-num">5</span>␀ j ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">18</span>␀(left, right + <span class="syn-num">1</span>):
                res.append(matrix[top][j])
            top += <span class="syn-num">1</span>
            ␀<span class="syn-num">7</span>␀ i ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">19</span>␀(top, bottom + <span class="syn-num">1</span>):
                res.append(matrix[i][right])
            right -= <span class="syn-num">1</span>
            ␀<span class="syn-num">9</span>␀ top &lt;= bottom:
                ␀<span class="syn-num">10</span>␀ j ␀<span class="syn-num">11</span>␀ ␀<span class="syn-num">20</span>␀(right, left - <span class="syn-num">1</span>, -<span class="syn-num">1</span>):
                    res.append(matrix[bottom][j])
                bottom -= <span class="syn-num">1</span>
            ␀<span class="syn-num">12</span>␀ left &lt;= right:
                ␀<span class="syn-num">13</span>␀ i ␀<span class="syn-num">14</span>␀ ␀<span class="syn-num">21</span>␀(bottom, top - <span class="syn-num">1</span>, -<span class="syn-num">1</span>):
                    res.append(matrix[i][left])
                left += <span class="syn-num">1</span>
        ␀<span class="syn-num">15</span>␀ res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">下面两个 &#96;if&#96; 是防止只有一行/一列时重复遍历，漏掉会在 &#96;[[1,2,3]]&#96; 上输出重复元素。</div></div>
  </div>
</article>
<article class="card" data-num="55" data-diff="中等" data-topic="二分栈堆贪心" data-search="跳跃游戏数组每个位置表示最多能往后跳几步，判断能不能到最后一个位置。">

  <div class="body" id="body-55" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">数组每个位置表示最多能往后跳几步，判断能不能到最后一个位置。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">不需要真的模拟「跳到哪」，只要维护「目前能到达的最远位置 &#96;far&#96;」。扫到位置 &#96;i&#96; 时如果 &#96;i &gt; far&#96;，说明连这里都到不了，后面更到不了。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-55',this)">复制</button></div><pre id="code-55"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ canJump(␀<span class="syn-num">2</span>␀, nums):
        far = <span class="syn-num">0</span>
        ␀<span class="syn-num">3</span>␀ i, step ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">10</span>␀(nums):
            ␀<span class="syn-num">5</span>␀ i &gt; far:
                ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀
            far = ␀<span class="syn-num">11</span>␀(far, i + step)
        ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">判断 &#96;i &gt; far&#96; 要在更新 &#96;far&#96; **之前**。</div></div>
  </div>
</article>
<article class="card" data-num="56" data-diff="中等" data-topic="数组与哈希" data-search="合并区间把所有重叠的区间合并。">
  <div class="head" onclick="tog(56)">
    <span class="num">0056</span>
    <span class="ttl">合并区间</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(56)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-56" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">把所有重叠的区间合并。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">先按左端点排序（Python 对列表默认按字典序，&#96;sorted(intervals)&#96; 正好先比左端点）。之后扫描：如果当前区间的左端点 ≤ 上一个区间的右端点，就延长上一个；否则新开一段。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n log n)&#96;（花在排序）；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-56',this)">复制</button></div><pre id="code-56"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ merge(␀<span class="syn-num">2</span>␀, intervals):
        intervals.sort()
        res = []
        ␀<span class="syn-num">3</span>␀ l, r ␀<span class="syn-num">4</span>␀ intervals:
            ␀<span class="syn-num">5</span>␀ res ␀<span class="syn-num">6</span>␀ l &lt;= res[-<span class="syn-num">1</span>][<span class="syn-num">1</span>]:
                res[-<span class="syn-num">1</span>][<span class="syn-num">1</span>] = ␀<span class="syn-num">9</span>␀(res[-<span class="syn-num">1</span>][<span class="syn-num">1</span>], r)
            ␀<span class="syn-num">7</span>␀:
                res.append([l, r])
        ␀<span class="syn-num">8</span>␀ res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">合并时右端点要取 &#96;max&#96;，因为当前区间可能完全被上一个包住。</div></div>
  </div>
</article>
<article class="card" data-num="62" data-diff="中等" data-topic="回溯图论DP" data-search="不同路径机器人从左上走到右下，只能向右或向下，有多少条路。">
  <div class="head" onclick="tog(62)">
    <span class="num">0062</span>
    <span class="ttl">不同路径</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(62)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-62" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">机器人从左上走到右下，只能向右或向下，有多少条路。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">&#96;dp[i][j]&#96; = 走到第 i 行第 j 列的路径数。只能从上方或左方来，所以 &#96;dp[i][j] = dp[i-1][j] + dp[i][j-1]&#96;。第一行和第一列都只有 1 条路。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(mn)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-62',this)">复制</button></div><pre id="code-62"><code>␀<span class="syn-num">1</span>␀ Solution:
    ␀<span class="syn-num">2</span>␀ uniquePaths(␀<span class="syn-num">3</span>␀, m, n):
        dp = [<span class="syn-num">1</span>] * n              ␀<span class="syn-num">0</span>␀
        ␀<span class="syn-num">4</span>␀ _ ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">9</span>␀(<span class="syn-num">1</span>, m):
            ␀<span class="syn-num">6</span>␀ j ␀<span class="syn-num">7</span>␀ ␀<span class="syn-num">10</span>␀(<span class="syn-num">1</span>, n):
                dp[j] += dp[j - <span class="syn-num">1</span>]
        ␀<span class="syn-num">8</span>␀ dp[n - <span class="syn-num">1</span>]</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;dp[j] += dp[j-1]&#96; 里，更新前的 &#96;dp[j]&#96; 就是「上方来的」，&#96;dp[j-1]&#96; 是刚更新的「左方来的」，正好。</div></div>
  </div>
</article>
<article class="card" data-num="64" data-diff="中等" data-topic="回溯图论DP" data-search="最小路径和网格每格有代价，找从左上到右下路径的最小总代价。 时间 &#96;o(mn)&#96;，空间 &#96;o(n)&#96;。**易错**：&#96;dp[0] = 0&#96; 让起点只加上自己的代价；第一行没有「上方」，靠 &#96;j == 0&#96; 分支处理。">
  <div class="head" onclick="tog(64)">
    <span class="num">0064</span>

    <span class="badge b-中等">中等</span>

  <div class="body" id="body-64" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">网格每格有代价，找从左上到右下路径的最小总代价。 时间 &#96;O(mn)&#96;，空间 &#96;O(n)&#96;。**易错**：&#96;dp[0] = 0&#96; 让起点只加上自己的代价；第一行没有「上方」，靠 &#96;j == 0&#96; 分支处理。</div></div>
    
    <div class="meta"><span class="cost">时间 &#96;O(mn)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-64',this)">复制</button></div><pre id="code-64"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ minPathSum(␀<span class="syn-num">2</span>␀, grid):
        m, n = ␀<span class="syn-num">10</span>␀(grid), ␀<span class="syn-num">11</span>␀(grid[<span class="syn-num">0</span>])
        dp = [␀<span class="syn-num">12</span>␀(&quot;inf&quot;)] * n
        dp[<span class="syn-num">0</span>] = <span class="syn-num">0</span>
        ␀<span class="syn-num">3</span>␀ i ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">13</span>␀(m):
            ␀<span class="syn-num">5</span>␀ j ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">14</span>␀(n):
                ␀<span class="syn-num">7</span>␀ j == <span class="syn-num">0</span>:
                    dp[j] = dp[j] + grid[i][j]
                ␀<span class="syn-num">8</span>␀:
                    dp[j] = ␀<span class="syn-num">15</span>␀(dp[j], dp[j - <span class="syn-num">1</span>]) + grid[i][j]
        ␀<span class="syn-num">9</span>␀ dp[n - <span class="syn-num">1</span>]</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;dp[0] = 0&#96; 让起点只加上自己的代价；第一行没有「上方」，靠 &#96;j == 0&#96; 分支处理。</div></div>
  </div>
</article>
<article class="card" data-num="70" data-diff="简单" data-topic="回溯图论DP" data-search="爬楼梯每次可以爬 1 阶或 2 阶，爬到第 n 阶共有多少种不同的方法。">

    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-70',this)">复制</button></div><pre id="code-70"><code>␀<span class="syn-num">0</span>␀ Solution:
