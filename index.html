<script>
const DATA = [{"num":1,"title":"两数之和","diff":"简单","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"给数组 `nums` 和 `target`，找出两个数使它们的和为 `target`，返回下标。","think":"笨办法是试遍每一对（`O(n²)`）。慢在「每来一个数，都要翻一遍前面找补数」。用字典把见过的值和下标记下来，查补数就变成一瞬间。注意**先查后存**，否则同一个元素会配自己。","cost":"时间 `O(n)`；空间 `O(n)`","easy":"`[3]`, `target=6` 时不能返回 `[0,0]`，所以 `seen[x] = i` 必须在 `if` 之后。","code":"class Solution:\n    def twoSum(self, nums, target):\n        seen = {}                        # 值 -> 下标\n        for i, x in enumerate(nums):\n            need = target - x\n            if need in seen:\n                return [seen[need], i]\n            seen[x] = i\n        return []"},{"num":2,"title":"两数相加","diff":"中等","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"两个链表各自表示一个数字（低位在前），返回它们和的链表。","think":"像手算加法一样逐位加，维护进位 `carry`。两条链表长度可能不同，短的那条没了就当 0。","cost":"时间 `O(max(m,n))`；空间 `O(max(m,n))`","easy":"循环条件里必须有 `or carry`，否则最后多出的一位（如 `5+5=10`）会丢。","code":"class Solution:\n    def addTwoNumbers(self, l1, l2):\n        dummy = cur = ListNode(0)\n        carry = 0\n        while l1 is not None or l2 is not None or carry:\n            s = carry + (l1.val if l1 else 0) + (l2.val if l2 else 0)\n            carry, v = divmod(s, 10)\n            cur.next = ListNode(v)\n            cur = cur.next\n            if l1 is not None:\n                l1 = l1.next\n            if l2 is not None:\n                l2 = l2.next\n        return dummy.next"},{"num":3,"title":"无重复字符的最长子串","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"找字符串里不含重复字符的最长子串的长度。","think":"用字典记每个字符最后一次出现的位置。右端 `r` 遇到重复字符时，把左端 `l` 直接跳到「上次出现位置 + 1」。**必须判断 `last[c] >= l`**：如果那个重复字符已经在窗口外了，就不能让 `l` 往回退。","cost":"时间 `O(n)`；空间 `O(字符集大小)`","easy":"`s = \"abba\"` 是专门卡「漏掉 `>= l`」的用例，r=3 时 `a` 的上次位置 0 已在窗口外，若把 `l` 拉回 1，答案会错成 3。","code":"class Solution:\n    def lengthOfLongestSubstring(self, s):\n        last = {}\n        l = ans = 0\n        for r, c in enumerate(s):\n            if c in last and last[c] >= l:\n                l = last[c] + 1\n            last[c] = r\n            ans = max(ans, r - l + 1)\n        return ans"},{"num":4,"title":"寻找两个正序数组的中位数","diff":"困难","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"两个有序数组，找合并后的中位数，要求 `O(log(m+n))`。","think":"中位数把数据分成左右两半，左边个数等于（或多一个）右边。只要在较短数组里二分一个「切分点 i」，另一个数组的切分点 `j` 就自动确定。当「左边最大值 ≤ 右边最小值」时，切分正确，中位数就在四个边界数里。边界之外用 `±inf` 兜底。","cost":"时间 `O(log(min(m,n)))`；空间 `O(1)`","easy":"一定要在**较短**数组上二分，否则 `j` 可能超出范围；`half = (total+1)//2` 让奇数时左边多一个，中位数直接是 `max(l1,l2)`。","code":"class Solution:\n    def findMedianSortedArrays(self, nums1, nums2):\n        if len(nums1) > len(nums2):\n            nums1, nums2 = nums2, nums1\n        m, n = len(nums1), len(nums2)\n        total = m + n\n        half = (total + 1) // 2\n        lo, hi = 0, m\n        while lo <= hi:\n            i = (lo + hi) // 2\n            j = half - i\n            l1 = float(\"-inf\") if i == 0 else nums1[i - 1]\n            r1 = float(\"inf\") if i == m else nums1[i]\n            l2 = float(\"-inf\") if j == 0 else nums2[j - 1]\n            r2 = float(\"inf\") if j == n else nums2[j]\n            if l1 <= r2 and l2 <= r1:\n                if total % 2:\n                    return float(max(l1, l2))\n                return (max(l1, l2) + min(r1, r2)) / 2\n            elif l1 > r2:\n                hi = i - 1\n            else:\n                lo = i + 1"},{"num":5,"title":"最长回文子串","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"找字符串里最长的回文子串。","think":"回文可以从中心往两边扩。每个位置都可能是中心：奇数长度中心是 1 个字符，偶数长度中心是 2 个字符之间的缝。枚举 n 个位置 × 2 种中心。","cost":"时间 `O(n²)`；空间 `O(1)`","easy":"退出 `while` 时 `l, r` 已经越界或不匹配，所以切片要回退一格 `s[l+1:r]`。这题也能用二维区间 DP 做（状态是 `dp[i][j]` = s[i:j+1] 是否回文），但中心扩展更省空间。","code":"class Solution:\n    def longestPalindrome(self, s):\n        def expand(l, r):\n            while l >= 0 and r < len(s) and s[l] == s[r]:\n                l -= 1\n                r += 1\n            return s[l + 1:r]\n        ans = \"\"\n        for i in range(len(s)):\n            for a, b in ((i, i), (i, i + 1)):\n                cand = expand(a, b)\n                if len(cand) > len(ans):\n                    ans = cand\n        return ans"},{"num":11,"title":"盛最多水的容器","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"找两条竖线，使它们和 x 轴围成的面积最大。面积 = 两边距离 × 较矮的高度。","think":"笨办法试遍所有两两组合（`O(n²)`）。用对撞指针从最宽的开始，每次**移动较矮的那一边**：宽度已经变小了，只有换掉矮的那根、让高度有可能变大，面积才可能变大。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"面积要用 `min(两边)` 的高度，不是随便挑一个；两边相等时移哪边都行。","code":"class Solution:\n    def maxArea(self, height):\n        l, r = 0, len(height) - 1\n        ans = 0\n        while l < r:\n            ans = max(ans, (r - l) * min(height[l], height[r]))\n            if height[l] < height[r]:\n                l += 1\n            else:\n                r -= 1\n        return ans"},{"num":15,"title":"三数之和","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"找出所有和为 0 且不重复的三元组。","think":"先排序，然后固定第一个数 `i`，剩下两个数用对撞指针找（有序数组才能根据和的大小决定移动哪边）。**去重**全靠「排序后相同值相邻」：跳过重复的 `i`，命中后也跳过重复的 `l`。","cost":"时间 `O(n²)`；空间 `O(1)`","easy":"两处去重 `while` 都不能省；`nums.sort()` 返回 `None`，别写成 `nums = nums.sort()`。","code":"class Solution:\n    def threeSum(self, nums):\n        nums.sort()\n        res, n = [], len(nums)\n        for i in range(n - 2):\n            if nums[i] > 0:\n                break\n            if i > 0 and nums[i] == nums[i - 1]:\n                continue\n            l, r = i + 1, n - 1\n            while l < r:\n                s = nums[i] + nums[l] + nums[r]\n                if s < 0:\n                    l += 1\n                elif s > 0:\n                    r -= 1\n                else:\n                    res.append([nums[i], nums[l], nums[r]])\n                    l += 1\n                    r -= 1\n                    while l < r and nums[l] == nums[l - 1]:\n                        l += 1\n        return res"},{"num":17,"title":"电话号码的字母组合","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"数字 `2~9` 各对应几个字母，给一串数字，返回所有可能的字母组合。 时间 `O(4ⁿ × n)`，空间 `O(n)`。**易错**：空字符串要返回 `[]` 而不是 `[[]]` 或 `[\"\"]`；字符串用 `join` 收集，不能直接 `append` 到结果。","think":"","cost":"时间 `O(4ⁿ × n)`；空间 `O(n)`","easy":"空字符串要返回 `[]` 而不是 `[[]]` 或 `[\"\"]`；字符串用 `join` 收集，不能直接 `append` 到结果。","code":"class Solution:\n    def letterCombinations(self, digits):\n        if not digits:\n            return []\n        mp = {\"2\": \"abc\", \"3\": \"def\", \"4\": \"ghi\", \"5\": \"jkl\",\n              \"6\": \"mno\", \"7\": \"pqrs\", \"8\": \"tuv\", \"9\": \"wxyz\"}\n        res, path = [], []\n        def dfs(i):\n            if i == len(digits):\n                res.append(\"\".join(path))\n                return\n            for c in mp[digits[i]]:\n                path.append(c)\n                dfs(i + 1)\n                path.pop()\n        dfs(0)\n        return res"},{"num":19,"title":"删除倒数第 N 个结点","diff":"中等","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"删除链表中倒数第 N 个节点，返回链表头。","think":"让 `fast` 先走 N 步，然后 `fast`、`slow` 一起走。`fast` 走到最后一个节点时，`slow` 正好停在要删节点的前一个。用虚拟头节点可以统一处理「删的是头节点」的情况。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"`while fast.next is not None` 而不是 `fast is not None`，这样 `slow` 才能停在待删节点的前一位。","code":"class Solution:\n    def removeNthFromEnd(self, head, n):\n        dummy = ListNode(0, head)\n        fast = slow = dummy\n        for _ in range(n):\n            fast = fast.next\n        while fast.next is not None:\n            fast = fast.next\n            slow = slow.next\n        slow.next = slow.next.next\n        return dummy.next"},{"num":20,"title":"有效的括号","diff":"简单","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"判断括号串是否合法（`()[]{}`，要正确嵌套）。","think":"遇到左括号先把「期待的右括号」压栈；遇到右括号就看它是不是栈顶期待的那个。最后栈必须是空的。","cost":"时间 `O(n)`；空间 `O(n)`","easy":"`\"]\"` 这种一上来就是右括号的，要先判 `not st`，否则 `st[-1]` 越界。","code":"class Solution:\n    def isValid(self, s):\n        pairs = {')': '(', ']': '[', '}': '{'}\n        st = []\n        for c in s:\n            if c in pairs:\n                if not st or st[-1] != pairs[c]:\n                    return False\n                st.pop()\n            else:\n                st.append(c)\n        return not st"},{"num":21,"title":"合并两个有序链表","diff":"简单","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"把两个升序链表合并成一个升序链表。","think":"用虚拟头节点 `dummy`，每次挑两个链表头里较小的那个接上去，被挑中的往后走一步。最后把没走完的那条整段接上。","cost":"时间 `O(m+n)`；空间 `O(1)`","easy":"`cur.next, list1 = list1, list1.next` 右侧先整体求值，所以 `list1.next` 是**原来的**下一个节点，不会被覆盖。`dummy` 本身不存有效数据，最后返回 `dummy.next`。","code":"class Solution:\n    def mergeTwoLists(self, list1, list2):\n        dummy = cur = ListNode(0)\n        while list1 is not None and list2 is not None:\n            if list1.val <= list2.val:\n                cur.next, list1 = list1, list1.next\n            else:\n                cur.next, list2 = list2, list2.next\n            cur = cur.next\n        cur.next = list1 if list1 is not None else list2\n        return dummy.next"},{"num":22,"title":"括号生成","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"生成 n 对括号的所有合法组合。","think":"两个剪枝条件就能保证任意前缀合法——左括号最多 n 个；右括号数量**不能超过**左括号数量。","cost":"时间 `O(卡特兰数 × n)`；空间 `O(n)`","easy":"`right < left` 这个条件是「合法括号串」的核心，漏掉会产生 `())(` 这类非法串。","code":"class Solution:\n    def generateParenthesis(self, n):\n        res, path = [], []\n        def dfs(left, right):\n            if len(path) == 2 * n:\n                res.append(\"\".join(path))\n                return\n            if left < n:\n                path.append(\"(\")\n                dfs(left + 1, right)\n                path.pop()\n            if right < left:                 # 剪枝：保证前缀合法\n                path.append(\")\")\n                dfs(left, right + 1)\n                path.pop()\n        dfs(0, 0)\n        return res"},{"num":23,"title":"合并 K 个升序链表","diff":"困难","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"把 K 个升序链表合并成一个升序链表。","think":"把每条链表当前的头放进小根堆，每次弹出最小的接进答案，再把那条链表的下一个节点补进堆。因为节点对象不能直接比较，堆里放 `(值, 序号, 节点)`，序号保证永远不会比到节点本身。","cost":"时间 `O(N log k)`（N 总节点数、k 链表条数）；空间 `O(k)`","easy":"不插 `seq` 的话，两条链表头值相同时 Python 会去比较 `ListNode` 对象，直接 `TypeError`。","code":"import heapq\n\nclass Solution:\n    def mergeKLists(self, lists):\n        h = []\n        seq = 0\n        for node in lists:\n            if node is not None:\n                heapq.heappush(h, (node.val, seq, node))\n                seq += 1\n        dummy = cur = ListNode(0)\n        while h:\n            _, _, node = heapq.heappop(h)\n            cur.next = node\n            cur = cur.next\n            if node.next is not None:\n                heapq.heappush(h, (node.next.val, seq, node.next))\n                seq += 1\n        return dummy.next"},{"num":24,"title":"两两交换链表中的节点","diff":"中等","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"两两交换链表里相邻的节点，返回新的头。","think":"每次处理一对 `(a, b)`，把 `prev -> a -> b -> next` 改成 `prev -> b -> a -> next`，然后 `prev` 挪到 `a`（它现在是这一对的尾）。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"那个三路赋值右边先整体求值，`b.next` 取的是**交换前** b 的下一个节点，正好是下一组的开头。写成三行分开的赋值反而容易错，因为 `b.next` 已经被改过了。","code":"class Solution:\n    def swapPairs(self, head):\n        dummy = ListNode(0, head)\n        prev = dummy\n        while prev.next is not None and prev.next.next is not None:\n            a, b = prev.next, prev.next.next\n            prev.next, b.next, a.next = b, a, b.next\n            prev = a\n        return dummy.next"},{"num":25,"title":"K 个一组翻转链表","diff":"困难","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"每 K 个节点翻转一组，不足 K 个的保持原样。","think":"先探路，从 `group_prev` 往前数 K 个找到 `kth`；数不够就结束。够的话记录 `group_next = kth.next`，用 206 题的反转手法把这一段翻转（注意反转的初始 `prev` 要设成 `group_next`，这样尾能自动接上后半段），最后把上一组的尾接到新头。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"`kth_after(group_prev, k)` 从虚拟头开始数 K 步才正好落在本组最后一个节点；反转时 `prev` 初值必须是 `group_next`。","code":"class Solution:\n    def reverseKGroup(self, head, k):\n        def kth_after(node, k):\n            for _ in range(k):\n                if node is None:\n                    return None\n                node = node.next\n            return node\n\n        dummy = ListNode(0, head)\n        group_prev = dummy\n        while True:\n            kth = kth_after(group_prev, k)\n            if kth is None:\n                break\n            group_next = kth.next\n            prev, cur = group_next, group_prev.next\n            while cur is not group_next:\n                nxt = cur.next\n                cur.next = prev\n                prev, cur = cur, nxt\n            old_head = group_prev.next       # 翻转后它成了这组尾巴\n            group_prev.next = kth\n            group_prev = old_head\n        return dummy.next"},{"num":31,"title":"下一个排列","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"把数组当成排列，原地改成字典序的下一个排列；若已是最大，改成最小。","think":"三步。① 从右往左找第一个「比右边小」的位置 `i`（这是还能变大的最靠右位置）。② 再从右往左找第一个比 `nums[i]` 大的数，和它交换。③ 把 `i` 之后的部分反转（原来是降序，反转后变成最小升序）。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"`i = -1` 表示整个数组是降序（最大排列），此时跳过交换、直接整体反转。","code":"class Solution:\n    def nextPermutation(self, nums):\n        n = len(nums)\n        i = n - 2\n        while i >= 0 and nums[i] >= nums[i + 1]:\n            i -= 1\n        if i >= 0:\n            j = n - 1\n            while nums[j] <= nums[i]:\n                j -= 1\n            nums[i], nums[j] = nums[j], nums[i]\n        l, r = i + 1, n - 1\n        while l < r:\n            nums[l], nums[r] = nums[r], nums[l]\n            l += 1\n            r -= 1"},{"num":32,"title":"最长有效括号","diff":"困难","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"找最长的**连续合法括号子串**的长度。","think":"用栈存下标，栈底始终放「上一个无法匹配的位置」。遇到 `(` 压下标；遇到 `)` 先弹一个，若栈空了说明这个 `)` 无法匹配，把它自己当新的栈底；否则当前合法长度 = 当前下标 − 栈顶。","cost":"时间 `O(n)`；空间 `O(n)`","easy":"栈初始放 `-1`（不是空），这样第一个合法段能算出完整长度；每遇到一个多余的 `)` 就把它的位置设为新基准。","code":"class Solution:\n    def longestValidParentheses(self, s):\n        stack = [-1]\n        ans = 0\n        for i, c in enumerate(s):\n            if c == \"(\":\n                stack.append(i)\n            else:\n                stack.pop()\n                if not stack:\n                    stack.append(i)\n                else:\n                    ans = max(ans, i - stack[-1])\n        return ans"},{"num":33,"title":"搜索旋转排序数组","diff":"中等","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"原本有序的数组被「旋转」过（如 `[4,5,6,7,0,1,2]`），找 target 的下标。","think":"数组不再是整体有序，但**从中间劈开，一定有一半是有序的**。判断哪半有序，再看 target 是否落在那一半里，就能决定砍掉哪边。","cost":"时间 `O(log n)`；空间 `O(1)`","easy":"判断「左半有序」用 `<=` 而不是 `<`，因为区间可能只剩两个元素。","code":"class Solution:\n    def search(self, nums, target):\n        l, r = 0, len(nums) - 1\n        while l <= r:\n            mid = (l + r) // 2\n            if nums[mid] == target:\n                return mid\n            if nums[l] <= nums[mid]:          # 左半有序\n                if nums[l] <= target < nums[mid]:\n                    r = mid - 1\n                else:\n                    l = mid + 1\n            else:                             # 右半有序\n                if nums[mid] < target <= nums[r]:\n                    l = mid + 1\n                else:\n                    r = mid - 1\n        return -1"},{"num":34,"title":"找第一个和最后一个位置","diff":"中等","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"有序数组里找 target 第一次和最后一次出现的下标，没有返回 `[-1, -1]`。","think":"两次「找边界」。第一次找「第一个 ≥ target」的位置；第二次找「第一个 ≥ target+1」的位置，减 1 就是最后一个 target。","cost":"时间 `O(log n)`；空间 `O(1)`","easy":"`a == len(nums)`（target 比所有数都大）时 `a > b`，靠这个判断返回 `[-1,-1]`，不用额外判空。","code":"class Solution:\n    def searchRange(self, nums, target):\n        def lower(x):\n            l, r = 0, len(nums)\n            while l < r:\n                mid = (l + r) // 2\n                if nums[mid] >= x:\n                    r = mid\n                else:\n                    l = mid + 1\n            return l\n        a = lower(target)\n        b = lower(target + 1) - 1\n        if a <= b:\n            return [a, b]\n        return [-1, -1]"},{"num":35,"title":"搜索插入位置","diff":"简单","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"有序数组里找 target，找到返回下标，没找到返回它该插入的位置。就是骨架 B。 时间 `O(log n)`，空间 `O(1)`。**易错**：右端是 `len(nums)` 不是 `len(nums)-1`，因为插入位置可能是末尾。","think":"","cost":"时间 `O(log n)`；空间 `O(1)`","easy":"右端是 `len(nums)` 不是 `len(nums)-1`，因为插入位置可能是末尾。","code":"class Solution:\n    def searchInsert(self, nums, target):\n        l, r = 0, len(nums)\n        while l < r:\n            mid = (l + r) // 2\n            if nums[mid] >= target:\n                r = mid\n            else:\n                l = mid + 1\n        return l"},{"num":39,"title":"组合总和","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"给一组**无重复**的正数，找出所有和等于 target 的组合，每个数字可以**无限次**使用。","think":"`start` 表示「本层往下只能从下标 start 开始选」，避免顺序不同的重复组合；因为可以重复选自己，递归时传 `i` 而不是 `i + 1`。","cost":"时间 `O(答案个数 × 答案长度)`；空间 `O(target)`","easy":"`dfs(i, ...)` 里的 `i` 是关键，写成 `i+1` 就变成「每个数只能用一次」。","code":"class Solution:\n    def combinationSum(self, candidates, target):\n        res, path = [], []\n        def dfs(start, remain):\n            if remain == 0:\n                res.append(path[:])\n                return\n            for i in range(start, len(candidates)):\n                if candidates[i] > remain:\n                    continue\n                path.append(candidates[i])\n                dfs(i, remain - candidates[i])   # 仍是 i，允许重复选\n                path.pop()\n        dfs(0, target)\n        return res"},{"num":41,"title":"缺失的第一个正数","diff":"困难","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"找出数组里没出现的最小正整数，要求 `O(n)` 时间、常数空间。","think":"答案是 1～n+1 中的某一个。利用「原地哈希」：把值 `x`（1 ≤ x ≤ n）交换到下标 `x-1` 的位置上。换完再扫一遍，第一个「位置 i 上不是 i+1」的就是答案。","cost":"时间 `O(n)`（每个数最多被换到自己位置一次）；空间 `O(1)`","easy":"`while` 不能写成 `if`，换过来的新值可能还需要继续交换；`nums[nums[i]-1] != nums[i]` 这个判断防止两个相同值无限交换。","code":"class Solution:\n    def firstMissingPositive(self, nums):\n        n = len(nums)\n        for i in range(n):\n            while 1 <= nums[i] <= n and nums[nums[i] - 1] != nums[i]:\n                j = nums[i] - 1\n                nums[i], nums[j] = nums[j], nums[i]\n        for i in range(n):\n            if nums[i] != i + 1:\n                return i + 1\n        return n + 1"},{"num":42,"title":"接雨水","diff":"困难","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"给一排柱子的高度，求能接多少雨水。","think":"每个位置能存多少水，取决于「它左边最高的」和「右边最高的」里较矮的那个，减去自己的高度。用对撞指针从两端往中间走，同时维护 `left_max` 和 `right_max`：哪边当前较矮，就处理哪边（因为它能存多少已经由这一侧的最大值决定了，另一侧肯定更高）。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"先更新最大值再算这一格的水，顺序反了会得到 0。","code":"class Solution:\n    def trap(self, height):\n        l, r = 0, len(height) - 1\n        left_max = right_max = 0\n        ans = 0\n        while l < r:\n            if height[l] < height[r]:\n                left_max = max(left_max, height[l])\n                ans += left_max - height[l]\n                l += 1\n            else:\n                right_max = max(right_max, height[r])\n                ans += right_max - height[r]\n                r -= 1\n        return ans"},{"num":45,"title":"跳跃游戏 II","diff":"中等","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"保证能到达终点，求最少跳几次。","think":"把「跳 k 次能到的范围」看成一个区间。当前这一跳的范围内，记录下一步最远能到哪；走到当前范围边界时，就必须再跳一次，同时把边界推到刚记录的最远处。像一层一层往外扩。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"循环到 `len(nums)-2` 就停（站在最后一个位置不用再跳）；只有一个元素时循环不执行，返回 0，正确。","code":"class Solution:\n    def jump(self, nums):\n        ans = 0\n        cur_end = 0        # 当前这一跳能到的最远位置\n        farthest = 0       # 下一跳能到的最远位置\n        for i in range(len(nums) - 1):\n            farthest = max(farthest, i + nums[i])\n            if i == cur_end:\n                ans += 1\n                cur_end = farthest\n        return ans"},{"num":46,"title":"全排列","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"给不含重复数字的数组，返回所有排列。 时间 `O(n × n!)`，空间 `O(n)`（不含结果）。**易错**：`used` 也要在递归后恢复，否则下一条路会以为这个元素被占用了。","think":"","cost":"时间 `O(n × n!)`；空间 `O(n)`","easy":"`used` 也要在递归后恢复，否则下一条路会以为这个元素被占用了。","code":"class Solution:\n    def permute(self, nums):\n        res, path = [], []\n        used = [False] * len(nums)\n        def dfs():\n            if len(path) == len(nums):\n                res.append(path[:])\n                return\n            for i, x in enumerate(nums):\n                if used[i]:\n                    continue\n                used[i] = True\n                path.append(x)\n                dfs()\n                path.pop()\n                used[i] = False\n        dfs()\n        return res"},{"num":48,"title":"旋转图像","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"把 n×n 矩阵顺时针旋转 90 度，原地改。","think":"先沿主对角线转置，再把每一行左右翻转。两步合起来正好等于顺时针 90 度。","cost":"时间 `O(n²)`；空间 `O(1)`","easy":"转置时 `j` 从 `i+1` 开始，从 0 开始会把每个位置换两次、等于没换。","code":"class Solution:\n    def rotate(self, matrix):\n        n = len(matrix)\n        for i in range(n):\n            for j in range(i + 1, n):\n                matrix[i][j], matrix[j][i] = matrix[j][i], matrix[i][j]\n        for row in matrix:\n            row.reverse()"},{"num":49,"title":"字母异位词分组","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"把字母组成相同（顺序可以不同）的单词放到一组。","think":"关键是给每组找一个「共同的身份证」。把单词的字母排序后，`\"eat\"`、`\"tea\"`、`\"ate\"` 都变成 `\"aet\"`，用它当字典的键即可。","cost":"","easy":"`sorted(s)` 返回的是字符列表，必须 `join` 回字符串才能当键。","code":"from collections import defaultdict\n\nclass Solution:\n    def groupAnagrams(self, strs):\n        groups = defaultdict(list)\n        for s in strs:\n            key = \"\".join(sorted(s))\n            groups[key].append(s)\n        return list(groups.values())"},{"num":51,"title":"N 皇后","diff":"困难","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"在 n×n 棋盘放 n 个皇后，互不攻击，返回所有摆法。","think":"一行一行放，每行只放一个。用三个集合记「已被占用的列」「已被占用的主对角线」「副对角线」。主对角线上的格子满足 `行 - 列` 相同，副对角线满足 `行 + 列` 相同。","cost":"时间 `O(n!)`；空间 `O(n²)`","easy":"棋盘必须用推导式建（`[[\".\"]*n for _ in range(n)]`），写成 `[[\".\"]*n]*n` 会让所有行共享同一行；收集答案时要逐行 `join` 成字符串快照。","code":"class Solution:\n    def solveNQueens(self, n):\n        res = []\n        board = [[\".\"] * n for _ in range(n)]\n        cols, diag1, diag2 = set(), set(), set()\n        def dfs(r):\n            if r == n:\n                res.append([\"\".join(row) for row in board])\n                return\n            for c in range(n):\n                if c in cols or (r - c) in diag1 or (r + c) in diag2:\n                    continue\n                board[r][c] = \"Q\"\n                cols.add(c); diag1.add(r - c); diag2.add(r + c)\n                dfs(r + 1)\n                cols.remove(c); diag1.remove(r - c); diag2.remove(r + c)\n                board[r][c] = \".\"\n        dfs(0)\n        return res"},{"num":53,"title":"最大子数组和","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"找连续一段，使它的和最大（数组里可能有负数）。","think":"笨办法枚举所有起点终点（`O(n²)`）。扫的时候想：如果「以当前位置结尾的最大和」已经算出来是 `cur`，那下一个位置有两种选择——接在 `cur` 后面，或者干脆从自己重新开始。取较大的那个。**如果 `cur` 是负数，接上只会更差，必定重新开始**。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"初始值设成 0 会在全负数数组上错；要用第一个元素或 `float(\"-inf\")`。","code":"class Solution:\n    def maxSubArray(self, nums):\n        cur = best = nums[0]\n        for x in nums[1:]:\n            cur = max(x, cur + x)\n            best = max(best, cur)\n        return best"},{"num":54,"title":"螺旋矩阵","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"按顺时针螺旋顺序输出矩阵所有元素。","think":"设四个边界 `top/bottom/left/right`，每走完一圈就往里缩一格。","cost":"时间 `O(mn)`；空间 `O(1)`","easy":"下面两个 `if` 是防止只有一行/一列时重复遍历，漏掉会在 `[[1,2,3]]` 上输出重复元素。","code":"class Solution:\n    def spiralOrder(self, matrix):\n        m, n = len(matrix), len(matrix[0])\n        top, bottom = 0, m - 1\n        left, right = 0, n - 1\n        res = []\n        while top <= bottom and left <= right:\n            for j in range(left, right + 1):\n                res.append(matrix[top][j])\n            top += 1\n            for i in range(top, bottom + 1):\n                res.append(matrix[i][right])\n            right -= 1\n            if top <= bottom:\n                for j in range(right, left - 1, -1):\n                    res.append(matrix[bottom][j])\n                bottom -= 1\n            if left <= right:\n                for i in range(bottom, top - 1, -1):\n                    res.append(matrix[i][left])\n                left += 1\n        return res"},{"num":55,"title":"跳跃游戏","diff":"中等","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"数组每个位置表示最多能往后跳几步，判断能不能到最后一个位置。","think":"不需要真的模拟「跳到哪」，只要维护「目前能到达的最远位置 `far`」。扫到位置 `i` 时如果 `i > far`，说明连这里都到不了，后面更到不了。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"判断 `i > far` 要在更新 `far` **之前**。","code":"class Solution:\n    def canJump(self, nums):\n        far = 0\n        for i, step in enumerate(nums):\n            if i > far:\n                return False\n            far = max(far, i + step)\n        return True"},{"num":56,"title":"合并区间","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"把所有重叠的区间合并。","think":"先按左端点排序（Python 对列表默认按字典序，`sorted(intervals)` 正好先比左端点）。之后扫描：如果当前区间的左端点 ≤ 上一个区间的右端点，就延长上一个；否则新开一段。","cost":"时间 `O(n log n)`（花在排序）；空间 `O(n)`","easy":"合并时右端点要取 `max`，因为当前区间可能完全被上一个包住。","code":"class Solution:\n    def merge(self, intervals):\n        intervals.sort()\n        res = []\n        for l, r in intervals:\n            if res and l <= res[-1][1]:\n                res[-1][1] = max(res[-1][1], r)\n            else:\n                res.append([l, r])\n        return res"},{"num":62,"title":"不同路径","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"机器人从左上走到右下，只能向右或向下，有多少条路。","think":"`dp[i][j]` = 走到第 i 行第 j 列的路径数。只能从上方或左方来，所以 `dp[i][j] = dp[i-1][j] + dp[i][j-1]`。第一行和第一列都只有 1 条路。","cost":"时间 `O(mn)`；空间 `O(n)`","easy":"`dp[j] += dp[j-1]` 里，更新前的 `dp[j]` 就是「上方来的」，`dp[j-1]` 是刚更新的「左方来的」，正好。","code":"class Solution:\n    def uniquePaths(self, m, n):\n        dp = [1] * n              # 滚动成一行\n        for _ in range(1, m):\n            for j in range(1, n):\n                dp[j] += dp[j - 1]\n        return dp[n - 1]"},{"num":64,"title":"最小路径和","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"网格每格有代价，找从左上到右下路径的最小总代价。 时间 `O(mn)`，空间 `O(n)`。**易错**：`dp[0] = 0` 让起点只加上自己的代价；第一行没有「上方」，靠 `j == 0` 分支处理。","think":"","cost":"时间 `O(mn)`；空间 `O(n)`","easy":"`dp[0] = 0` 让起点只加上自己的代价；第一行没有「上方」，靠 `j == 0` 分支处理。","code":"class Solution:\n    def minPathSum(self, grid):\n        m, n = len(grid), len(grid[0])\n        dp = [float(\"inf\")] * n\n        dp[0] = 0\n        for i in range(m):\n            for j in range(n):\n                if j == 0:\n                    dp[j] = dp[j] + grid[i][j]\n                else:\n                    dp[j] = min(dp[j], dp[j - 1]) + grid[i][j]\n        return dp[n - 1]"},{"num":70,"title":"爬楼梯","diff":"简单","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"每次可以爬 1 阶或 2 阶，爬到第 n 阶共有多少种不同的方法。","think":"","cost":"时间 `O(n)`；空间 `O(1)`","easy":"`n = 1` 时循环不执行，返回 `b = 1`，正确。","code":"class Solution:\n    def climbStairs(self, n):\n        a = b = 1\n        for _ in range(2, n + 1):\n            a, b = b, a + b\n        return b"},{"num":72,"title":"编辑距离","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"把 word1 变成 word2，可以插入、删除、替换一个字符，求最少操作数。","think":"`dp[i][j]` = 把 `a` 的前 i 个字符变成 `b` 的前 j 个字符的最少操作数。字符相同则不用操作，直接继承 `dp[i-1][j-1]`；否则取「删」「插」「替换」三种里最小的 +1。","cost":"时间 `O(mn)`；空间 `O(n)`","easy":"第 0 行是 `0,1,2,...,n`（空串变成长度 j 的串要插 j 次），第 0 列是 `0,1,2,...,i`，初始化错整张表都错。","code":"class Solution:\n    def minDistance(self, word1, word2):\n        m, n = len(word1), len(word2)\n        prev = list(range(n + 1))          # a 为空时，只能一直插入\n        for i in range(1, m + 1):\n            cur = [i] + [0] * n            # b 为空时，只能一直删除\n            for j in range(1, n + 1):\n                if word1[i - 1] == word2[j - 1]:\n                    cur[j] = prev[j - 1]\n                else:\n                    cur[j] = min(prev[j],      # 删\n                                 cur[j - 1],   # 插\n                                 prev[j - 1]   # 替换\n                                 ) + 1\n            prev = cur\n        return prev[n]"},{"num":73,"title":"矩阵置零","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"某个元素是 0，就把它所在的行和列全设为 0，要求原地、尽量省空间。","think":"用**第一行和第一列当标记本**，另外用两个变量记「第一行/第一列自己原本有没有 0」。先扫描打标记，再按标记置零，最后处理第一行第一列。","cost":"时间 `O(mn)`；空间 `O(1)`","easy":"`first_row` / `first_col` 必须**在打标记之前**算，否则标记会污染判断。","code":"class Solution:\n    def setZeroes(self, matrix):\n        m, n = len(matrix), len(matrix[0])\n        first_row = any(matrix[0][j] == 0 for j in range(n))\n        first_col = any(matrix[i][0] == 0 for i in range(m))\n        for i in range(1, m):\n            for j in range(1, n):\n                if matrix[i][j] == 0:\n                    matrix[i][0] = 0\n                    matrix[0][j] = 0\n        for i in range(1, m):\n            for j in range(1, n):\n                if matrix[i][0] == 0 or matrix[0][j] == 0:\n                    matrix[i][j] = 0\n        if first_row:\n            for j in range(n):\n                matrix[0][j] = 0\n        if first_col:\n            for i in range(m):\n                matrix[i][0] = 0"},{"num":74,"title":"搜索二维矩阵","diff":"中等","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"矩阵每行升序，且下一行第一个数大于上一行最后一个数——整体其实就是一条拉直的有序数组。","think":"把「一维下标 mid」换算成「第 `mid // n` 行、第 `mid % n` 列」，然后照骨架 A 二分。","cost":"时间 `O(log(mn))`；空间 `O(1)`","easy":"`m*n` 可能很大，但 Python 整数不溢出，直接算没问题。","code":"class Solution:\n    def searchMatrix(self, matrix, target):\n        m, n = len(matrix), len(matrix[0])\n        l, r = 0, m * n - 1\n        while l <= r:\n            mid = (l + r) // 2\n            v = matrix[mid // n][mid % n]\n            if v == target:\n                return True\n            elif v < target:\n                l = mid + 1\n            else:\n                r = mid - 1\n        return False"},{"num":75,"title":"颜色分类","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"数组里只有 0、1、2，原地排成 0 在前、2 在后。","think":"三指针荷兰国旗。`l` 是「下一个 0 该放的位置」，`r` 是「下一个 2 该放的位置」，`i` 是当前检查的。遇到 0 和 `l` 交换并让 `i` 前进；遇到 2 和 `r` 交换，但 **`i` 不能前进**（换过来的还没检查过）。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"`i <= r` 不是 `i < len(nums)`；2 的分支里 `i` 不动。","code":"class Solution:\n    def sortColors(self, nums):\n        l = i = 0\n        r = len(nums) - 1\n        while i <= r:\n            if nums[i] == 0:\n                nums[l], nums[i] = nums[i], nums[l]\n                l += 1\n                i += 1\n            elif nums[i] == 2:\n                nums[r], nums[i] = nums[i], nums[r]\n                r -= 1\n            else:\n                i += 1"},{"num":76,"title":"最小覆盖子串","diff":"困难","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"在 `s` 里找最短的一段，包含 `t` 里所有字符（含重复次数）。","think":"`need` 记还缺什么，`window` 记窗口里有什么，`valid` 记「已经满足数量的字符种类数」。右端一直扩，一旦 `valid == len(need)` 说明覆盖了，就试着缩左端找更短的，并记录答案。","cost":"时间 `O(n)`；空间 `O(字符集)`","easy":"`valid` 只在「数量刚好达标」时 +1，超过不算；缩窗口时只在「刚好从达标掉下来」时 -1。切片 `s[l:r+1]` 每次花一段长度，数据大时能改成只记下标、最后切一次。","code":"from collections import Counter\n\nclass Solution:\n    def minWindow(self, s, t):\n        if not t or not s:\n            return \"\"\n        need = Counter(t)\n        window = {}\n        valid = 0\n        l = 0\n        best_len = float(\"inf\")\n        best = \"\"\n        for r, c in enumerate(s):\n            if c in need:\n                window[c] = window.get(c, 0) + 1\n                if window[c] == need[c]:\n                    valid += 1\n            while valid == len(need):\n                if r - l + 1 < best_len:\n                    best_len = r - l + 1\n                    best = s[l:r + 1]\n                out = s[l]\n                if out in need:\n                    if window[out] == need[out]:\n                        valid -= 1\n                    window[out] -= 1\n                l += 1\n        return best"},{"num":78,"title":"子集","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"返回数组的所有子集（包括空集）。","think":"对每个位置，决定「选它」还是「不选它」。用 `start` 保证只往後看，避免 `[1,2]` 和 `[2,1]` 重复。","cost":"时间 `O(n × 2ⁿ)`；空间 `O(n)`","easy":"`res.append` 放在函数开头（不是只在叶子），因为每个节点都算一个子集。","code":"class Solution:\n    def subsets(self, nums):\n        res, path = [], []\n        def dfs(start):\n            res.append(path[:])          # 每个节点都是一个合法子集\n            for i in range(start, len(nums)):\n                path.append(nums[i])\n                dfs(i + 1)\n                path.pop()\n        dfs(0)\n        return res"},{"num":79,"title":"单词搜索","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"在字符网格里，判断能否沿上下左右相邻的路径连出给定单词（同一格不能重复用）。","think":"对每个格子当起点做 DFS。用一个临时标记 `'#'` 原地表示「这个格子本条路径已用过」，递归返回前恢复。这就是回溯里的「做选择 / 撤销」。","cost":"时间 `O(mn × 3^L)`（L 是单词长度）；空间 `O(L)`","easy":"无论成功还是失败，返回前都要把格子恢复；找到答案时也要恢复再 `return True`。","code":"class Solution:\n    def exist(self, board, word):\n        m, n = len(board), len(board[0])\n        dirs = [(0, 1), (0, -1), (1, 0), (-1, 0)]\n        def dfs(r, c, k):\n            if board[r][c] != word[k]:\n                return False\n            if k == len(word) - 1:\n                return True\n            tmp = board[r][c]\n            board[r][c] = \"#\"                 # 标记已用\n            for dr, dc in dirs:\n                nr, nc = r + dr, c + dc\n                if 0 <= nr < m and 0 <= nc < n and board[nr][nc] != \"#\":\n                    if dfs(nr, nc, k + 1):\n                        board[r][c] = tmp\n                        return True\n            board[r][c] = tmp                 # 恢复现场\n            return False\n        for i in range(m):\n            for j in range(n):\n                if dfs(i, j, 0):\n                    return True\n        return False"},{"num":84,"title":"柱状图中最大的矩形","diff":"困难","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"找相邻柱子能框出的最大矩形面积。","think":"对每根柱子，需要知道「左边第一个比它矮的」和「右边第一个比它矮的」，两者之间就是以它的高度为高的最大宽度。单调栈（高度递增）能一次找出来：遇到比栈顶矮的柱子时，栈顶的右边界就确定了，弹出来算面积。末尾加一个高度 0 的**哨兵**，保证最后所有柱子都能被弹出。","cost":"时间 `O(n)`；空间 `O(n)`","easy":"`width = i - left - 1` 里的 `left` 是弹出后新的栈顶；没有哨兵时最后一段递增的柱子永远不会被结算。","code":"class Solution:\n    def largestRectangleArea(self, heights):\n        h = heights + [0]           # 哨兵\n        st = []\n        ans = 0\n        for i, x in enumerate(h):\n            while st and h[st[-1]] > x:\n                height = h[st.pop()]\n                left = st[-1] if st else -1\n                width = i - left - 1\n                ans = max(ans, height * width)\n            st.append(i)\n        return ans"},{"num":94,"title":"二叉树的中序遍历","diff":"简单","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"按「左 → 根 → 右」的顺序输出所有值。","think":"递归三问——返回值：无（把值加进结果列表）；单层：先遍历左、记录自己、再遍历右；终止：节点是 `None` 就返回。","cost":"时间 `O(n)`；空间 `O(h)`","easy":"`dfs` 定义在方法内部时，`res` 是外层变量，读它没问题；若要修改计数变量得用 `nonlocal` 或改成返回值。","code":"class Solution:\n    def inorderTraversal(self, root):\n        res = []\n        def dfs(node):\n            if node is None:\n                return\n            dfs(node.left)\n            res.append(node.val)\n            dfs(node.right)\n        dfs(root)\n        return res"},{"num":98,"title":"验证二叉搜索树","diff":"中等","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"判断一棵二叉树是不是合法的二叉搜索树。","think":"不能只比较「根和左右孩子」——某个深层节点可能违反和祖先的大小关系。给递归带上「允许的范围 `(lo, hi)`」，每往左走就把上界收紧到当前值，往右走就把下界收紧。","cost":"时间 `O(n)`；空间 `O(h)`","easy":"用 `float(\"±inf\")` 做初始界，别用 `-1`/`10**9` 这种具体数（节点值可能超出）；比较是严格的 `<`，BST 不允许相等。","code":"class Solution:\n    def isValidBST(self, root):\n        def dfs(node, lo, hi):\n            if node is None:\n                return True\n            if not (lo < node.val < hi):\n                return False\n            return dfs(node.left, lo, node.val) and dfs(node.right, node.val, hi)\n        return dfs(root, float(\"-inf\"), float(\"inf\"))"},{"num":101,"title":"对称二叉树","diff":"简单","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"判断一棵树是否左右镜像对称。","think":"不是「判断左子树等于右子树」，而是「左子树的左 对 右子树的右、左子树的右 对 右子树的左」都相等。写一个比较两棵树的辅助函数。","cost":"时间 `O(n)`；空间 `O(h)`","easy":"两个都为空是 `True`，只有一个为空是 `False`，顺序别反。","code":"class Solution:\n    def isSymmetric(self, root):\n        def same(a, b):\n            if a is None and b is None:\n                return True\n            if a is None or b is None:\n                return False\n            return a.val == b.val and same(a.left, b.right) and same(a.right, b.left)\n        return root is None or same(root.left, root.right)"},{"num":102,"title":"二叉树的层序遍历","diff":"中等","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"按层从上到下、每层从左到右输出。","think":"用队列（`deque`）。关键是**先记下当前队列长度**，这个长度就是当前层的节点数，然后只处理这么多个——即使处理过程中往队列里加了下一层的节点，也不会混进本层。","cost":"时间 `O(n)`；空间 `O(n)`","easy":"`for _ in range(len(q))` 里的 `len(q)` 在循环开始时求值一次；用 `list.pop(0)` 会超时，必须 `deque`。","code":"from collections import deque\n\nclass Solution:\n    def levelOrder(self, root):\n        if root is None:\n            return []\n        q = deque([root])\n        res = []\n        while q:\n            level = []\n            for _ in range(len(q)):\n                node = q.popleft()\n                level.append(node.val)\n                if node.left is not None:\n                    q.append(node.left)\n                if node.right is not None:\n                    q.append(node.right)\n            res.append(level)\n        return res"},{"num":104,"title":"二叉树的最大深度","diff":"简单","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"求二叉树的最大深度。","think":"一棵树的深度 = 左右子树里较深的那个 + 1。空树深度 0。","cost":"时间 `O(n)`；空间 `O(h)`","easy":"别漏 `+ 1`（算上自己这一层）。","code":"class Solution:\n    def maxDepth(self, root):\n        if root is None:\n            return 0\n        return max(self.maxDepth(root.left), self.maxDepth(root.right)) + 1"},{"num":105,"title":"从前序与中序遍历序列构造二叉树","diff":"中等","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"用前序和中序遍历结果构造出原来的二叉树。","think":"前序第一个一定是根。在中序里找到根的位置，左边就是左子树的节点、右边是右子树的节点；由左子树长度可以切出前序里两段的范围，递归构造。用字典记「值 → 中序下标」，避免每次线性查找。","cost":"时间 `O(n)`；空间 `O(n)`","easy":"`left_len = k - il`（中序里根左边的个数），前序里左段就是 `pl+1 ~ pl+left_len`，右段从 `pl+left_len+1` 开始。","code":"class Solution:\n    def buildTree(self, preorder, inorder):\n        idx = {v: i for i, v in enumerate(inorder)}\n        def build(pl, pr, il, ir):\n            if pl > pr:\n                return None\n            v = preorder[pl]\n            k = idx[v]\n            left_len = k - il\n            root = TreeNode(v)\n            root.left = build(pl + 1, pl + left_len, il, k - 1)\n            root.right = build(pl + left_len + 1, pr, k + 1, ir)\n            return root\n        return build(0, len(preorder) - 1, 0, len(inorder) - 1)"},{"num":108,"title":"将有序数组转换为二叉搜索树","diff":"简单","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"把升序数组转成一棵高度平衡的 BST。","think":"取中间元素当根（两边节点数最接近，自然平衡），左半递归造左子树、右半递归造右子树。","cost":"时间 `O(n)`；空间 `O(log n)`","easy":"`//` 不能写成 `/`，否则下标变小数会报错。","code":"class Solution:\n    def sortedArrayToBST(self, nums):\n        def build(l, r):\n            if l > r:\n                return None\n            mid = (l + r) // 2\n            root = TreeNode(nums[mid])\n            root.left = build(l, mid - 1)\n            root.right = build(mid + 1, r)\n            return root\n        return build(0, len(nums) - 1)"},{"num":114,"title":"二叉树展开为链表","diff":"中等","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"把树按前序顺序原地拉成一条「只有右孩子」的链。","think":"对每个节点，如果它有左子树，就把左子树接到「右子树之前」——具体做法：找到左子树最右边的节点（前序里左子树的最后一个），把原来的右子树挂到它的 `right` 上，然后把整棵左子树搬到 `right`，左孩子置空。一路往右走。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"`cur.left = None` 不能漏，否则不是「链表」；找 `pre` 时只沿 `right` 走。","code":"class Solution:\n    def flatten(self, root):\n        cur = root\n        while cur is not None:\n            if cur.left is not None:\n                pre = cur.left\n                while pre.right is not None:\n                    pre = pre.right\n                pre.right = cur.right\n                cur.right = cur.left\n                cur.left = None\n            cur = cur.right"},{"num":118,"title":"杨辉三角","diff":"简单","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"生成前 numRows 行，每个数等于上一行左右两数之和。 时间 `O(n²)`，空间 `O(n²)`。**易错**：每行首尾都是 1，中间才用加法；`range(1, i)` 的右端取不到，正好不算最后一个。","think":"","cost":"时间 `O(n²)`；空间 `O(n²)`","easy":"每行首尾都是 1，中间才用加法；`range(1, i)` 的右端取不到，正好不算最后一个。","code":"class Solution:\n    def generate(self, numRows):\n        res = [[1]]\n        for i in range(1, numRows):\n            prev = res[-1]\n            row = [1] * (i + 1)\n            for j in range(1, i):\n                row[j] = prev[j - 1] + prev[j]\n            res.append(row)\n        return res"},{"num":121,"title":"买卖股票的最佳时机","diff":"简单","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"只能买卖一次，求最大利润。","think":"扫一遍，始终记住「到今天为止最低的买入价」，然后算「今天卖出能赚多少」，取最大。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"`low` 必须初始化成正无穷，不能是 0（价格可能是任意正数）；先更新 `low` 再算利润，同一天买卖利润为 0，不影响结果。","code":"class Solution:\n    def maxProfit(self, prices):\n        low = float(\"inf\")\n        ans = 0\n        for p in prices:\n            low = min(low, p)\n            ans = max(ans, p - low)\n        return ans"},{"num":124,"title":"二叉树中的最大路径和","diff":"困难","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"任意一条路径（可以从任意节点到任意节点）的最大节点值之和，可能有负数。","think":"递归函数返回「从当前节点**往下走单边**能给父节点贡献的最大值」——负值贡献直接砍成 0（不要也罢）。同时在每层用「左贡献 + 右贡献 + 自己」更新全局答案，那条是穿过当前节点的完整路径，不能再往上延伸。","cost":"时间 `O(n)`；空间 `O(h)`","easy":"返回值是**单边**（`node.val + max(l,r)`），全局更新用**双边**（`+ l + r`），两者别混；初始答案必须是 `-inf`，全负数树才对。","code":"class Solution:\n    def maxPathSum(self, root):\n        self.ans = float(\"-inf\")\n        def dfs(node):\n            if node is None:\n                return 0\n            l = max(0, dfs(node.left))\n            r = max(0, dfs(node.right))\n            self.ans = max(self.ans, node.val + l + r)\n            return node.val + max(l, r)\n        dfs(root)\n        return self.ans"},{"num":128,"title":"最长连续序列","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"找出数组里最长的一段连续数字的长度，如 `[100,4,200,1,3,2]` → `4`（1,2,3,4）。要求 `O(n)`。","think":"先全部放进集合（查存在一瞬间）。然后**只从「一段的起点」开始数**——如果 `x-1` 也在集合里，说明 x 不是起点，跳过它。这样每个数字最多被内层循环访问一次，整体仍是 `O(n)`。","cost":"时间 `O(n)`；空间 `O(n)`","easy":"漏掉 `if x - 1 not in s`，每个数都会把整段重新数一遍，退化成 `O(n²)`。","code":"class Solution:\n    def longestConsecutive(self, nums):\n        s = set(nums)\n        best = 0\n        for x in s:\n            if x - 1 not in s:          # 只从起点出发\n                y = x\n                while y + 1 in s:\n                    y += 1\n                best = max(best, y - x + 1)\n        return best"},{"num":131,"title":"分割回文串","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"把字符串切成若干段，要求每段都是回文，返回所有切法。","think":"`start` 表示「从哪开始切下一段」，枚举这一段的所有可能终点 `end`，只有 `s[start:end]` 是回文才继续往下切。","cost":"时间 `O(n × 2ⁿ)`；空间 `O(n)`","easy":"`end` 要取到 `n`（`range(start+1, n+1)`），因为切片右端取不到；`t == t[::-1]` 每次切片花一段时间，数据大时可预先算好回文表。","code":"class Solution:\n    def partition(self, s):\n        res, path = [], []\n        n = len(s)\n        def dfs(start):\n            if start == n:\n                res.append(path[:])\n                return\n            for end in range(start + 1, n + 1):\n                t = s[start:end]\n                if t == t[::-1]:\n                    path.append(t)\n                    dfs(end)\n                    path.pop()\n        dfs(0)\n        return res"},{"num":136,"title":"只出现一次的数字","diff":"简单","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"所有数都出现两次，只有一个出现一次，找出来。","think":"`a ^ a = 0`、`a ^ 0 = a`，而且异或满足交换律。把全部数异或起来，成对的全抵消，剩下的就是答案。`^` 是异或，不是乘方（乘方是 `**`）。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"","code":"class Solution:\n    def singleNumber(self, nums):\n        ans = 0\n        for x in nums:\n            ans ^= x\n        return ans"},{"num":138,"title":"随机链表的复制","diff":"中等","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"每个节点除了 `next` 还有一个 `random` 指向任意节点，要深拷贝整条链。","think":"两遍哈希表。第一遍给每个原节点造一个新节点，存映射；第二遍照映射把 `next` 和 `random` 接上。字典里预存 `{None: None}` 这个哨兵，能省掉每处判空。","cost":"时间 `O(n)`；空间 `O(n)`","easy":"不能一遍做完——第二遍接 `random` 时，目标节点可能还没被创建，所以必须先全部造好。节点对象能当字典的键（自定义类默认可哈希）。","code":"class Solution:\n    def copyRandomList(self, head):\n        if head is None:\n            return None\n        d = {None: None}\n        cur = head\n        while cur is not None:\n            d[cur] = Node(cur.val)      # Node 是平台定义的类型\n            cur = cur.next\n        cur = head\n        while cur is not None:\n            d[cur].next = d[cur.next]\n            d[cur].random = d[cur.random]\n            cur = cur.next\n        return d[head]"},{"num":139,"title":"单词拆分","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"判断字符串能否拆成字典里的单词（单词可重复使用）。","think":"`dp[i]` = 前 i 个字符能否被拆开。枚举最后一个单词的起点 `j`，若 `dp[j]` 为真且 `s[j:i]` 在字典里，则 `dp[i]` 为真。把字典转成集合，查找才快。","cost":"时间 `O(n²)`（切片本身也花时间）；空间 `O(n)`","easy":"`dp[0] = True` 表示「空串可以被拆」，是递推的起点；`dp[i]` 对应前 i 个字符（不含 i）。","code":"class Solution:\n    def wordBreak(self, s, wordDict):\n        words = set(wordDict)\n        n = len(s)\n        dp = [False] * (n + 1)\n        dp[0] = True\n        for i in range(1, n + 1):\n            for j in range(i):\n                if dp[j] and s[j:i] in words:\n                    dp[i] = True\n                    break\n        return dp[n]"},{"num":141,"title":"环形链表","diff":"简单","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"判断链表里有没有环。","think":"快慢指针，慢的每次走一步、快的每次走两步。有环的话快的迟早从后面追上慢的；没环的话快的会先走到 `None`。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"判「是不是同一个节点」用 `is`，不是 `==`；循环条件要同时保证 `fast` 和 `fast.next` 都不是 `None`。","code":"class Solution:\n    def hasCycle(self, head):\n        slow = fast = head\n        while fast is not None and fast.next is not None:\n            slow = slow.next\n            fast = fast.next.next\n            if slow is fast:\n                return True\n        return False"},{"num":142,"title":"环形链表 II","diff":"中等","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"有环的话，返回环的入口节点。","think":"先用快慢指针找到相遇点，然后让一个指针回到链表头，两个指针**同速**前进，再次相遇处就是环入口。（背后的数学：设头到入口距离为 a、入口到相遇点为 b，快指针走的路是慢指针两倍，可推出「头到入口」等于「相遇点再走到入口」。）","cost":"时间 `O(n)`；空间 `O(1)`","easy":"第二段循环两个指针都走一步，别再让其中一个走两步。","code":"class Solution:\n    def detectCycle(self, head):\n        slow = fast = head\n        while fast is not None and fast.next is not None:\n            slow = slow.next\n            fast = fast.next.next\n            if slow is fast:\n                p = head\n                while p is not slow:\n                    p = p.next\n                    slow = slow.next\n                return p\n        return None"},{"num":146,"title":"LRU 缓存","diff":"中等","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"设计缓存：`get` / `put` 都是 `O(1)`，容量满时淘汰最久没用过的。","think":"哈希表保证查找快，还要维护「谁最旧」。`OrderedDict` 正好提供了 `move_to_end()`（标记为最新）和 `popitem(last=False)`（弹出最旧）。 两个操作均 `O(1)`，空间 `O(capacity)`。","cost":"","easy":"`get` 命中时也要 `move_to_end`，否则「最近使用」的信息就错了。面试有时会要求手写双向链表 + 哈希表，那时不能用这个偷懒版，但 LeetCode 上提交没问题。","code":"from collections import OrderedDict\n\nclass LRUCache:\n    def __init__(self, capacity):\n        self.d = OrderedDict()\n        self.cap = capacity\n\n    def get(self, key):\n        if key not in self.d:\n            return -1\n        self.d.move_to_end(key)\n        return self.d[key]\n\n    def put(self, key, value):\n        if key in self.d:\n            self.d.move_to_end(key)\n        self.d[key] = value\n        if len(self.d) > self.cap:\n            self.d.popitem(last=False)"},{"num":148,"title":"排序链表","diff":"中等","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"给链表排序，要求 `O(n log n)`。","think":"归并排序。用快慢指针找到中点、把链表断成两半，各自递归排序，再用 21 题的「合并两个有序链表」拼回去。","cost":"时间 `O(n log n)`；空间 `O(log n)`","easy":"`prev.next = None` 不能漏，否则左半尾巴还连着右半，递归会无限循环。","code":"class Solution:\n    def sortList(self, head):\n        if head is None or head.next is None:\n            return head\n        slow = fast = head\n        prev = None\n        while fast is not None and fast.next is not None:\n            prev = slow\n            slow = slow.next\n            fast = fast.next.next\n        prev.next = None                # 断成两半\n        left = self.sortList(head)\n        right = self.sortList(slow)\n        return self.merge(left, right)\n\n    def merge(self, l1, l2):\n        dummy = cur = ListNode(0)\n        while l1 is not None and l2 is not None:\n            if l1.val <= l2.val:\n                cur.next, l1 = l1, l1.next\n            else:\n                cur.next, l2 = l2, l2.next\n            cur = cur.next\n        cur.next = l1 if l1 is not None else l2\n        return dummy.next"},{"num":152,"title":"乘积最大子数组","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"找连续一段，使乘积最大（可能有负数和 0）。","think":"和 53 题类似，但乘法有个陷阱——**一个很小的负数乘上另一个负数会变成很大的正数**。所以要同时维护「以当前结尾的最大值」和「最小值」，遇到负数时两者交换。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"算 `hi` 和 `lo` 必须都用**同一组旧值**（所以先存 `old_hi, old_lo`）。如果先更新 `hi` 再用新 `hi` 去算 `lo`，结果就串了。另一种写法是 `hi, lo = max(x, hi*x, lo*x), min(x, hi*x, lo*x)`，利用 Python「右边先整体求值」一次赋值，效果相同。","code":"class Solution:\n    def maxProduct(self, nums):\n        hi = lo = ans = nums[0]       # 以当前位置结尾的最大/最小乘积\n        for x in nums[1:]:\n            old_hi, old_lo = hi, lo\n            hi = max(x, old_hi * x, old_lo * x)\n            lo = min(x, old_hi * x, old_lo * x)\n            ans = max(ans, hi)\n        return ans"},{"num":153,"title":"寻找旋转排序数组中的最小值","diff":"中等","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"在旋转过的升序数组里找最小的元素。","think":"拿 `nums[mid]` 和 `nums[r]` 比。如果 `nums[mid] > nums[r]`，说明最小值一定在 mid 右边（因为左半是从大到小的跳变之前）；否则最小值在 mid 左边或就是 mid。","cost":"时间 `O(log n)`；空间 `O(1)`","easy":"和 `nums[r]` 比，不是 `nums[l]`；用 `r = mid` 保留 mid 本身。","code":"class Solution:\n    def findMin(self, nums):\n        l, r = 0, len(nums) - 1\n        while l < r:\n            mid = (l + r) // 2\n            if nums[mid] > nums[r]:\n                l = mid + 1\n            else:\n                r = mid\n        return nums[l]"},{"num":155,"title":"最小栈","diff":"中等","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"设计一个栈，除了常规操作，还要能 `O(1)` 返回当前最小值。","think":"再用一个「最小值栈」，只在**新值 ≤ 当前最小值**时压入。弹出时如果弹的正好是当前最小值，就从最小值栈也弹一个。这样两个栈顶永远对得上。 每个操作 `O(1)`，空间 `O(n)`。","cost":"","easy":"`push` 里用 `<=` 而不是 `<`，否则重复的最小值弹出时会出错。","code":"class MinStack:\n    def __init__(self):\n        self.stack = []\n        self.mins = []\n\n    def push(self, val):\n        self.stack.append(val)\n        if not self.mins or val <= self.mins[-1]:\n            self.mins.append(val)\n\n    def pop(self):\n        x = self.stack.pop()\n        if x == self.mins[-1]:\n            self.mins.pop()\n\n    def top(self):\n        return self.stack[-1]\n\n    def getMin(self):\n        return self.mins[-1]"},{"num":160,"title":"相交链表","diff":"简单","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"给两条链表的头，找它们第一个公共节点，没有返回 `None`。","think":"两条链可能不一样长，同时从头走会错开。让两个指针各自走完自己那条后，**切换到另一条的头继续走**——这样两者走的总路程都是「A 长 + B 长」，必然在公共节点（或同时走到 `None`）相遇。","cost":"时间 `O(m+n)`；空间 `O(1)`","easy":"判断「走完了」用 `a is None`，切换后不能立刻又切回来；不相交时两者会同时变成 `None`，循环自然结束。","code":"class Solution:\n    def getIntersectionNode(self, headA, headB):\n        a, b = headA, headB\n        while a != b:\n            a = a.next if a is not None else headB\n            b = b.next if b is not None else headA\n        return a"},{"num":169,"title":"多数元素","diff":"简单","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"找出出现次数超过一半的元素。","think":"**摩尔投票**。假设当前候选人是 `cand`，票数 `cnt`。遇到同样的就 +1，不同的就 -1，票归零就换候选人。因为真正的多数元素比「其他所有元素加起来」还多，两两抵消后它一定活到最后。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"题目保证存在多数元素，所以不用再验一遍；不保证的话要补一次计数确认。","code":"class Solution:\n    def majorityElement(self, nums):\n        cand = None\n        cnt = 0\n        for x in nums:\n            if cnt == 0:\n                cand = x\n            cnt += 1 if x == cand else -1\n        return cand"},{"num":189,"title":"轮转数组","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"把数组向右轮转 k 位，要求原地改。","think":"三次反转——整体反转、前 k 个反转、剩下反转。也可以用切片赋值一行搞定：","cost":"时间 `O(n)`；空间 `O(n)`","easy":"左边必须是 `nums[:]`。写 `nums = ...` 只是让函数里的变量指向新列表，外面看到的原数组根本没变。`k=0` 时 `nums[-0:]` 是整个列表、`nums[:-0]` 是空，结果碰巧正确。","code":"class Solution:\n    def rotate(self, nums, k):\n        n = len(nums)\n        k %= n\n        nums[:] = nums[-k:] + nums[:-k]"},{"num":198,"title":"打家劫舍","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"一排房子，不能偷相邻的，求最大金额。","think":"`dp[i]` = 偷到第 i 间为止的最大金额。对第 i 间只有两种选择：偷（那么 i-1 不能偷，拿 `dp[i-2] + nums[i]`）或不偷（拿 `dp[i-1]`）。只依赖前两格，用两个变量滚动。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"`prev2, prev1 = prev1, max(...)` 右边先整体求值，用的都是旧值，不需要临时变量。","code":"class Solution:\n    def rob(self, nums):\n        prev2 = prev1 = 0        # dp[i-2], dp[i-1]\n        for x in nums:\n            prev2, prev1 = prev1, max(prev1, prev2 + x)\n        return prev1"},{"num":199,"title":"二叉树的右视图","diff":"中等","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"从右边看这棵树，输出每层能看到的那个节点。","think":"层序遍历，每一层取**最后一个**节点。循环开始前队列里正好是当前层所有节点，所以 `q[-1]` 就是它。","cost":"时间 `O(n)`；空间 `O(n)`","easy":"`q[-1]` 要在 `for` 循环**之前**取，那时队列还没混入下一层。","code":"from collections import deque\n\nclass Solution:\n    def rightSideView(self, root):\n        if root is None:\n            return []\n        q = deque([root])\n        res = []\n        while q:\n            res.append(q[-1].val)\n            for _ in range(len(q)):\n                node = q.popleft()\n                if node.left is not None:\n                    q.append(node.left)\n                if node.right is not None:\n                    q.append(node.right)\n        return res"},{"num":200,"title":"岛屿数量","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"给 `0/1` 网格，`1` 连成一块算一个岛，求岛的数量（上下左右相邻）。","think":"扫每个格子，遇到一个没访问过的 `1` 就答案 +1，然后用 BFS 把整块「淹掉」（改成 `0`），这样同一块不会被重复计数。","cost":"时间 `O(mn)`；空间 `O(mn)`","easy":"**入队时就要标记**，等出队才标记会让同一个格子被多个邻居重复入队。","code":"from collections import deque\n\nclass Solution:\n    def numIslands(self, grid):\n        if not grid or not grid[0]:\n            return 0\n        m, n = len(grid), len(grid[0])\n        dirs = [(0, 1), (0, -1), (1, 0), (-1, 0)]\n        cnt = 0\n        for r in range(m):\n            for c in range(n):\n                if grid[r][c] != \"1\":\n                    continue\n                cnt += 1\n                q = deque([(r, c)])\n                grid[r][c] = \"0\"           # 入队时就标记\n                while q:\n                    x, y = q.popleft()\n                    for dx, dy in dirs:\n                        nx, ny = x + dx, y + dy\n                        if 0 <= nx < m and 0 <= ny < n and grid[nx][ny] == \"1\":\n                            grid[nx][ny] = \"0\"\n                            q.append((nx, ny))\n        return cnt"},{"num":206,"title":"反转链表","diff":"简单","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"反转单链表，返回新的头节点。","think":"三个变量 `pre`（已经反转好的部分）、`cur`（当前处理的）、`nxt`（临时存住下一个）。每轮先把 `cur.next` 改指向 `pre`，然后三个一起往前挪。 手动模拟 `1 -> 2 -> 3`： | 轮 | cur | nxt | 改完后 cur.next | pre | 新 cur | |---|---|---|---|---|---| | 1 | 1 | 2 | None | 1 | 2 | | 2 | 2 | 3 | 1 | 2 | 3 | | 3 | 3 | None | 2 | 3 | None |","cost":"时间 `O(n)`；空间 `O(1)`","easy":"","code":"class Solution:\n    def reverseList(self, head):\n        pre = None\n        cur = head\n        while cur is not None:\n            nxt = cur.next      # 必须先存，改完就找不回来了\n            cur.next = pre\n            pre, cur = cur, nxt\n        return pre              # 循环结束时 pre 是新头"},{"num":207,"title":"课程表","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"有 n 门课，先修关系 `[a, b]` 表示「学 a 之前要学 b」，判断能否修完所有课。","think":"**拓扑排序**。把关系看成有向边 `b -> a`。维护每个节点的「入度」（还有几门先修课没学），把所有入度为 0 的课入队；每学完一门，就把依赖它的课的入度减一，减到 0 就入队。最后学完的门数等于 n 才说明没有环。","cost":"时间 `O(n + e)`（e 是先修关系条数）；空间 `O(n + e)`","easy":"边方向别搞反（`b -> a`）；有环时环上节点入度永远降不到 0，`learned < n` 自然返回 False。","code":"from collections import defaultdict, deque\n\nclass Solution:\n    def canFinish(self, numCourses, prerequisites):\n        g = defaultdict(list)\n        indeg = [0] * numCourses\n        for a, b in prerequisites:\n            g[b].append(a)\n            indeg[a] += 1\n        q = deque(i for i in range(numCourses) if indeg[i] == 0)\n        learned = 0\n        while q:\n            u = q.popleft()\n            learned += 1\n            for v in g[u]:\n                indeg[v] -= 1\n                if indeg[v] == 0:\n                    q.append(v)\n        return learned == numCourses"},{"num":208,"title":"实现 Trie","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"实现前缀树，支持插入、查找完整单词、查找前缀。","think":"每个节点用字典存「字符 → 子节点」，再加一个 `is_end` 标记「是否有单词在这里结束」。插入就是顺着字符一路建节点。 `insert` / `search` / `startsWith` 都是 `O(长度)`，空间 `O(所有单词总字符数)`。","cost":"","easy":"`search` 必须检查 `is_end`——插入过 `\"apple\"` 时 `search(\"app\")` 应该是 False，但 `startsWith(\"app\")` 是 True。","code":"class TrieNode:\n    def __init__(self):\n        self.children = {}\n        self.is_end = False\n\nclass Trie:\n    def __init__(self):\n        self.root = TrieNode()\n\n    def insert(self, word):\n        cur = self.root\n        for ch in word:\n            if ch not in cur.children:\n                cur.children[ch] = TrieNode()\n            cur = cur.children[ch]\n        cur.is_end = True\n\n    def _walk(self, s):\n        cur = self.root\n        for ch in s:\n            if ch not in cur.children:\n                return None\n            cur = cur.children[ch]\n        return cur\n\n    def search(self, word):\n        node = self._walk(word)\n        return node is not None and node.is_end\n\n    def startsWith(self, prefix):\n        return self._walk(prefix) is not None"},{"num":215,"title":"数组中的第 K 个最大元素","diff":"中等","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"找数组里第 K 大的元素。","think":"维护一个大小恰好为 K 的**小根堆**。遍历时堆没满就放，满了且新数比堆顶大就替换堆顶。最后堆里就是最大的 K 个数，堆顶是这 K 个里最小的，正好是全体第 K 大。","cost":"时间 `O(n log k)`；空间 `O(k)`","easy":"别把整个数组堆化再弹 n-k 次（`O(n log n)`）；`heapreplace` 前一定要先判断 `x > h[0]`。","code":"import heapq\n\nclass Solution:\n    def findKthLargest(self, nums, k):\n        h = []\n        for x in nums:\n            if len(h) < k:\n                heapq.heappush(h, x)\n            elif x > h[0]:\n                heapq.heapreplace(h, x)\n        return h[0]"},{"num":226,"title":"翻转二叉树","diff":"简单","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"翻转一棵二叉树（每个节点的左右子树互换）。","think":"翻转一棵树 = 交换它的左右子树，再各自递归翻转。","cost":"时间 `O(n)`；空间 `O(h)`","easy":"右边整体先求值，所以 `self.invertTree(root.right)` 拿到的是交换前的右子树，正好。","code":"class Solution:\n    def invertTree(self, root):\n        if root is None:\n            return None\n        root.left, root.right = self.invertTree(root.right), self.invertTree(root.left)\n        return root"},{"num":230,"title":"二叉搜索树中第 K 小的元素","diff":"中等","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"二叉搜索树里找第 K 小的元素。","think":"中序遍历是升序，数到第 K 个就是答案。用一个计数变量，到 K 就记住答案并提前停。","cost":"时间 `O(h + k)`；空间 `O(h)`","easy":"计数要放在「访问左子树之后、递归右子树之前」，那正是中序的位置；找到后靠 `self.ans is not None` 提前剪枝。","code":"class Solution:\n    def kthSmallest(self, root, k):\n        self.k = k\n        self.ans = None\n        def dfs(node):\n            if node is None or self.ans is not None:\n                return\n            dfs(node.left)\n            self.k -= 1\n            if self.k == 0:\n                self.ans = node.val\n                return\n            dfs(node.right)\n        dfs(root)\n        return self.ans"},{"num":234,"title":"回文链表","diff":"简单","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"判断链表是不是回文，要求 `O(1)` 额外空间。","think":"① 快慢指针找到中点；② 把后半段反转；③ 从头和从后半段头一起走，逐个比值。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"奇数长度时中点那个元素会被前半段包含，但后半段比完就停，不影响结果。","code":"class Solution:\n    def isPalindrome(self, head):\n        slow = fast = head\n        while fast is not None and fast.next is not None:\n            slow, fast = slow.next, fast.next.next\n        pre, cur = None, slow\n        while cur is not None:\n            nxt = cur.next\n            cur.next = pre\n            pre, cur = cur, nxt\n        while pre is not None:\n            if pre.val != head.val:\n                return False\n            pre, head = pre.next, head.next\n        return True"},{"num":236,"title":"二叉树的最近公共祖先","diff":"中等","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"找两个节点最近的一个共同祖先。","think":"递归问左右子树。如果某一侧返回了 `None`，说明两个节点都在另一侧；如果**两侧都返回了非空**，说明当前节点就是分叉点，即答案。如果当前节点本身就是 p 或 q，直接返回它。","cost":"时间 `O(n)`；空间 `O(h)`","easy":"判断「是不是同一个节点」用 `is`（这里比的是对象身份，是 `is` 少数正当用途之一）；返回值可能为空，用 `is not None` 判断。","code":"class Solution:\n    def lowestCommonAncestor(self, root, p, q):\n        if root is None or root is p or root is q:\n            return root\n        left = self.lowestCommonAncestor(root.left, p, q)\n        right = self.lowestCommonAncestor(root.right, p, q)\n        if left is not None and right is not None:\n            return root\n        return left if left is not None else right"},{"num":238,"title":"除自身以外数组的乘积","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"返回数组，每个位置是「除了自己以外所有数的乘积」，不许用除法。","think":"每个位置的答案 = 它左边所有数的积 × 它右边所有数的积。两遍扫描分别把前缀积、后缀积累乘进去。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"第二遍是 `ans[i] *= p`，别写成赋值把前缀积丢掉。","code":"class Solution:\n    def productExceptSelf(self, nums):\n        n = len(nums)\n        ans = [1] * n\n        p = 1\n        for i in range(n):\n            ans[i] = p\n            p *= nums[i]\n        p = 1\n        for i in range(n - 1, -1, -1):\n            ans[i] *= p\n            p *= nums[i]\n        return ans"},{"num":239,"title":"滑动窗口最大值","diff":"困难","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"返回每个长度为 k 的窗口里的最大值。","think":"用一个**单调队列**（`deque`，里面存下标，对应的值从大到小）。新元素进来前，把队尾所有比它小的都弹掉——它们既比新元素小、又比新元素早出窗口，永远不可能成为最大值。队首就是当前窗口最大。","cost":"时间 `O(n)`（每个下标最多进队出队各一次）；空间 `O(k)`","easy":"队列里存**下标**而不是值，否则无法判断「队首是否已滑出窗口」；用 `list.pop(0)` 会超时，必须 `deque`。","code":"from collections import deque\n\nclass Solution:\n    def maxSlidingWindow(self, nums, k):\n        q = deque()\n        ans = []\n        for i, x in enumerate(nums):\n            while q and nums[q[-1]] <= x:\n                q.pop()\n            q.append(i)\n            if q[0] <= i - k:          # 队首已滑出窗口\n                q.popleft()\n            if i >= k - 1:\n                ans.append(nums[q[0]])\n        return ans"},{"num":240,"title":"搜索二维矩阵 II","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"矩阵每行、每列都升序，判断目标值在不在。","think":"从**右上角**开始。当前值比目标大，说明这一列下面都更大，可以整列排除（左移）；比目标小，说明这一行左边都更小，整行排除（下移）。每步砍掉一行或一列。","cost":"时间 `O(m + n)`；空间 `O(1)`","easy":"只能从右上（或左下）开始；从左上角开始，两个方向都是「变大」，无法确定排除哪边。","code":"class Solution:\n    def searchMatrix(self, matrix, target):\n        m, n = len(matrix), len(matrix[0])\n        r, c = 0, n - 1\n        while r < m and c >= 0:\n            if matrix[r][c] == target:\n                return True\n            elif matrix[r][c] > target:\n                c -= 1\n            else:\n                r += 1\n        return False"},{"num":279,"title":"完全平方数","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"求最少用几个完全平方数（1,4,9…）相加得到 n。","think":"`dp[i]` = 凑出 i 需要的最少个数。对每个 `i`，试所有 `j*j <= i`，取 `dp[i - j*j] + 1` 的最小值。","cost":"时间 `O(n√n)`；空间 `O(n)`","easy":"初始值是 `inf` 不是 0（除了 `dp[0] = 0`），否则 `min` 永远取不到正确值。","code":"class Solution:\n    def numSquares(self, n):\n        dp = [0] + [float(\"inf\")] * n\n        for i in range(1, n + 1):\n            j = 1\n            while j * j <= i:\n                dp[i] = min(dp[i], dp[i - j * j] + 1)\n                j += 1\n        return dp[n]"},{"num":283,"title":"移动零","diff":"简单","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"把数组里所有 0 移到末尾，其他数字保持相对顺序，要求原地改。","think":"设一个 `k` 表示「下一个非零数该放哪」。遍历时遇到非零就写到 `nums[k]`，`k` 前进。因为 `k` 永远不超过当前读到的位置，不会覆盖还没读的数据。最后把 `k` 之后全填 0。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"别在遍历时 `remove(0)`——边遍历边删会漏元素，而且 `remove` 本身是 `O(n)`。","code":"class Solution:\n    def moveZeroes(self, nums):\n        k = 0\n        for x in nums:\n            if x != 0:\n                nums[k] = x\n                k += 1\n        for i in range(k, len(nums)):\n            nums[i] = 0"},{"num":287,"title":"寻找重复数","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"n+1 个数，值都在 1～n 之间，只有一个数重复，不改数组、空间 `O(1)` 找出它。","think":"把数组看成「链表」——下标 `i` 的下一个位置是 `nums[i]`。因为有重复值，必然有环，环的入口就是重复的数。用快慢指针找环入口：先让快慢相遇，再让一个指针回到起点，两者同速前进，再次相遇处即入口。","cost":"时间 `O(n)`；空间 `O(1)`","easy":"初始都从 0 出发；第二段循环是「先走再比」还是「先比再走」要一致，这里用 `while p != slow` 保证相遇时返回入口。","code":"class Solution:\n    def findDuplicate(self, nums):\n        slow = fast = 0\n        while True:\n            slow = nums[slow]\n            fast = nums[nums[fast]]\n            if slow == fast:\n                break\n        p = 0\n        while p != slow:\n            p = nums[p]\n            slow = nums[slow]\n        return p"},{"num":295,"title":"数据流的中位数","diff":"困难","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"不断来新数，随时要能返回当前所有数的中位数。","think":"**双堆**。`small` 存较小的一半（用负数模拟大根堆），`large` 存较大的一半（小根堆）。始终保持两边数量差不超过 1，那么中位数就是两边堆顶的平均（或 `small` 堆顶）。 `addNum` 是 `O(log n)`，`findMedian` 是 `O(1)`，空间 `O(n)`。","cost":"","easy":"每次从 `small` 顶移到 `large` 时记得取负号还原；平衡条件是 `large` 不能比 `small` 多。","code":"import heapq\n\nclass MedianFinder:\n    def __init__(self):\n        self.small = []      # 存负数 → 堆顶是较小半里最大的\n        self.large = []      # 小根堆 → 堆顶是较大半里最小的\n\n    def addNum(self, num):\n        heapq.heappush(self.small, -num)\n        heapq.heappush(self.large, -heapq.heappop(self.small))\n        if len(self.large) > len(self.small):\n            heapq.heappush(self.small, -heapq.heappop(self.large))\n\n    def findMedian(self):\n        if len(self.small) > len(self.large):\n            return float(-self.small[0])\n        return (-self.small[0] + self.large[0]) / 2"},{"num":300,"title":"最长递增子序列","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"找出最长的**严格递增**子序列长度（子序列不要求连续）。","think":"`dp[i]` = 以第 i 个元素**结尾**的最长递增子序列长度。对每个 i，往前找所有比它小的 j，取 `dp[j] + 1` 的最大值。答案是整个 `dp` 里的最大值（不一定以最后一个元素结尾）。","cost":"时间 `O(n²)`；空间 `O(n)`","easy":"`dp` 初值全是 1（每个元素自己就是一个长度 1 的子序列）；`n = 0` 时 `max(dp)` 会报错，题目保证非空，自己写测试时要留意。这题还有 `O(n log n)` 的 `bisect` 解法，[L04 §3](L04-toolbox.md) 提过思路，学有余力可以再查。","code":"class Solution:\n    def lengthOfLIS(self, nums):\n        n = len(nums)\n        dp = [1] * n\n        for i in range(n):\n            for j in range(i):\n                if nums[j] < nums[i]:\n                    dp[i] = max(dp[i], dp[j] + 1)\n        return max(dp)"},{"num":322,"title":"零钱兑换","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"给硬币面额（每种无限个），求凑出 amount 的最少硬币数，凑不出返回 -1。","think":"和 279 同构，`dp[i]` = 凑出 i 的最少硬币数。这是**完全背包**：每个面额可以无限用，所以金额要**正序**遍历（让同一个面额能被反复使用）。","cost":"时间 `O(amount × 硬币种类)`；空间 `O(amount)`","easy":"返回前要判断「是不是 inf」，inf 表示凑不出。","code":"class Solution:\n    def coinChange(self, coins, amount):\n        dp = [0] + [float(\"inf\")] * amount\n        for c in range(1, amount + 1):\n            for coin in coins:\n                if coin <= c:\n                    dp[c] = min(dp[c], dp[c - coin] + 1)\n        return dp[amount] if dp[amount] != float(\"inf\") else -1"},{"num":347,"title":"前 K 个高频元素","diff":"中等","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"返回出现频次最高的 K 个元素。","think":"先用 `Counter` 数频次，再维护大小为 K 的小根堆，元素放 `(频次, 值)`，按频次比。","cost":"时间 `O(n log k)`；空间 `O(n)`","easy":"元组入堆按第一项比较，所以频次必须放前面；如果第二项是无法比较的对象且频次可能相同，要插一个序号（见 [L04 §2](L04-toolbox.md)）。","code":"import heapq\nfrom collections import Counter\n\nclass Solution:\n    def topKFrequent(self, nums, k):\n        h = []\n        for val, freq in Counter(nums).items():\n            if len(h) < k:\n                heapq.heappush(h, (freq, val))\n            elif freq > h[0][0]:\n                heapq.heapreplace(h, (freq, val))\n        return [val for freq, val in h]"},{"num":394,"title":"字符串解码","diff":"中等","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"`3[a2[c]]` 展开成 `accaccacc`。","think":"遇到 `[` 时，把「之前的字符串」和「重复次数」一起压栈，然后清空重新攒；遇到 `]` 时弹出来拼接。`num` 可能是多位数，要逐位累加。","cost":"时间 `O(展开后长度)`；空间 `O(嵌套深度)`","easy":"`num` 在 `[` 之后必须清零，否则下一层数字会接在旧数字后面。","code":"class Solution:\n    def decodeString(self, s):\n        stack = []\n        cur = \"\"\n        num = 0\n        for c in s:\n            if c.isdigit():\n                num = num * 10 + int(c)\n            elif c == \"[\":\n                stack.append((cur, num))\n                cur = \"\"\n                num = 0\n            elif c == \"]\":\n                prev, k = stack.pop()\n                cur = prev + cur * k\n            else:\n                cur += c\n        return cur"},{"num":416,"title":"分割等和子集","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"判断数组能否分成两个子集，使两边和相等。","think":"总和必须是偶数，问题变成「能不能挑出一些数，和恰好等于总和的一半」。这是 **0-1 背包**：每个数只能选一次，所以金额必须**倒序**遍历（正序会让同一个数被重复使用）。","cost":"时间 `O(n × target)`；空间 `O(target)`","easy":"倒序是本题的命根子，写成正序就变成「每个数无限用」，答案会错但样例常常还能过——务必用对拍验证。","code":"class Solution:\n    def canPartition(self, nums):\n        total = sum(nums)\n        if total % 2:\n            return False\n        target = total // 2\n        dp = [False] * (target + 1)\n        dp[0] = True\n        for x in nums:\n            for c in range(target, x - 1, -1):   # 倒序！\n                dp[c] = dp[c] or dp[c - x]\n        return dp[target]"},{"num":437,"title":"路径总和 III","diff":"中等","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"统计有多少条**向下**的路径，节点值之和等于 `targetSum`（路径不必从根开始、不必到叶子结束）。","think":"和 [L06 · 560 题](L06-array-and-hash.md) 是同一个套路。记从根到当前节点的前缀和 `pre`，若之前某处的前缀和是 `pre - targetSum`，那中间这一段就符合。用字典数前缀和出现次数；**离开当前节点时要撤销它的贡献**（回溯），否则会把别的分支的前缀和算进来。","cost":"时间 `O(n)`；空间 `O(h)`","easy":"`cnt[0] = 1` 和最后的 `cnt[pre] -= 1` 都不能少；`self.ans` 要在入口处重置。","code":"from collections import defaultdict\n\nclass Solution:\n    def pathSum(self, root, targetSum):\n        cnt = defaultdict(int)\n        cnt[0] = 1\n        self.ans = 0\n        def dfs(node, pre):\n            if node is None:\n                return\n            pre += node.val\n            self.ans += cnt[pre - targetSum]\n            cnt[pre] += 1\n            dfs(node.left, pre)\n            dfs(node.right, pre)\n            cnt[pre] -= 1          # 离开这棵子树，撤销\n        dfs(root, 0)\n        return self.ans"},{"num":438,"title":"找到字符串中所有字母异位词","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"在 `s` 里找出所有和 `p` 字母组成相同的连续子串，返回起始下标。","think":"维护一个长度恰好为 `len(p)` 的窗口，和一个 26 长度的计数数组。窗口里每个字母的「还差多少」凑齐后，就是一次命中。用 `diff` 表示「有多少个字母的数量还不匹配」，避免每轮都去比较整个数组。","cost":"时间 `O(26n)` 即 `O(n)`；空间 `O(1)`","easy":"`ord(c) - 97` 里的 97 是 `'a'` 的编号，更清楚的写法是 `ord(c) - ord('a')`；列表相等比较 `win == need` 是逐项比，长度只有 26 所以很便宜。","code":"class Solution:\n    def findAnagrams(self, s, p):\n        if len(s) < len(p):\n            return []\n        need = [0] * 26\n        for c in p:\n            need[ord(c) - 97] += 1\n        win = [0] * 26\n        ans = []\n        k = len(p)\n        for i, c in enumerate(s):\n            win[ord(c) - 97] += 1\n            if i >= k:\n                win[ord(s[i - k]) - 97] -= 1\n            if i >= k - 1 and win == need:\n                ans.append(i - k + 1)\n        return ans"},{"num":543,"title":"二叉树的直径","diff":"简单","topic":"链表与树","book":"L08-linkedlist-tree.md","gist":"直径 = 任意两点间最长路径的**边数**。","think":"一条最长路径一定经过某个节点，长度 = 它左子树深度 + 右子树深度。递归函数返回「深度」给父节点用，同时用一个全局的 `self.ans` 记「目前见过的最长路径」。这是树题里非常常见的「返回值和全局答案分离」结构。","cost":"时间 `O(n)`；空间 `O(h)`","easy":"`self.ans = 0` 必须在入口方法里写，不能放进递归函数（那样每轮都被清零）；而且平台可能复用同一个对象跑多组测试，入口处重置是必须的。","code":"class Solution:\n    def diameterOfBinaryTree(self, root):\n        self.ans = 0\n        def depth(node):\n            if node is None:\n                return 0\n            l, r = depth(node.left), depth(node.right)\n            self.ans = max(self.ans, l + r)\n            return max(l, r) + 1\n        depth(root)\n        return self.ans"},{"num":560,"title":"和为 K 的子数组","diff":"中等","topic":"数组与哈希","book":"L06-array-and-hash.md","gist":"统计有多少个连续子数组的和恰好等于 K，**数组里可能有负数**。","think":"记 `pre[i]` 为「从开头到第 i 个的和」。那么「第 j+1 到 i 的和 = pre[i] - pre[j]」。要让这段等于 K，就得 `pre[j] = pre[i] - K`。于是边算前缀和，边用字典查「之前出现过多少个这样的 `pre[j]`」。","cost":"时间 `O(n)`；空间 `O(n)`","easy":"`cnt[0] = 1` 不能漏，否则「从第一个元素开始、和正好是 K」的情况会被漏掉。另外**别用滑动窗口**，有负数时窗口不成立。","code":"from collections import defaultdict\n\nclass Solution:\n    def subarraySum(self, nums, k):\n        cnt = defaultdict(int)\n        cnt[0] = 1                  # 前缀和恰好等于 k 的情况\n        pre = ans = 0\n        for x in nums:\n            pre += x\n            ans += cnt[pre - k]\n            cnt[pre] += 1\n        return ans"},{"num":739,"title":"每日温度","diff":"中等","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"对每个位置，求还要等几天才出现更高的温度，没有就 0。","think":"用**单调栈**存「还没找到更高温度的日子」的下标，对应温度从栈底到栈顶递减。新温度比栈顶高时，栈顶这些日子终于等到了，弹出来算天数。**每个下标最多进栈、出栈各一次**，所以整体 `O(n)`。","cost":"时间 `O(n)`；空间 `O(n)`","easy":"栈里存**下标**，不是温度值——答案要的是天数差。","code":"class Solution:\n    def dailyTemperatures(self, temperatures):\n        st = []\n        ans = [0] * len(temperatures)\n        for i, x in enumerate(temperatures):\n            while st and temperatures[st[-1]] < x:\n                j = st.pop()\n                ans[j] = i - j\n            st.append(i)\n        return ans"},{"num":763,"title":"划分字母区间","diff":"中等","topic":"二分栈堆贪心","book":"L07-search-stack-heap.md","gist":"把字符串切成尽可能多的片段，要求同一个字母只出现在一个片段里。","think":"先记录每个字母**最后出现的位置**。扫描时不断把当前片段的右端点 `end` 推到「片段内所有字母的最远位置」；一旦扫到 `i == end`，说明这个片段里所有字母都不会再出现在后面，可以在这里切一刀。","cost":"时间 `O(n)`；空间 `O(字符集)`","easy":"`start` 要在切完后更新；字典推导式 `{c: i for ...}` 天然保留每个字母最后一次的下标。","code":"class Solution:\n    def partitionLabels(self, s):\n        last = {c: i for i, c in enumerate(s)}\n        start = end = 0\n        res = []\n        for i, c in enumerate(s):\n            end = max(end, last[c])\n            if i == end:\n                res.append(i - start + 1)\n                start = i + 1\n        return res"},{"num":994,"title":"腐烂的橘子","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"网格里 `0` 空、`1` 好橘子、`2` 烂橘子。每分钟烂橘子会把上下左右的好橘子变烂，求全部变烂要几分钟，不可能返回 -1。","think":"**多源 BFS**——把所有初始烂橘子一起入队，按「层」扩散，每层就是一分钟。同时记好橘子数量，最后没减到 0 说明有孤岛。","cost":"时间 `O(mn)`；空间 `O(mn)`","easy":"`while q and fresh` 而不是 `while q`——好橘子为 0 时不用再计分钟；初始就没有好橘子要返回 0。","code":"from collections import deque\n\nclass Solution:\n    def orangesRotting(self, grid):\n        m, n = len(grid), len(grid[0])\n        q = deque()\n        fresh = 0\n        for i in range(m):\n            for j in range(n):\n                if grid[i][j] == 2:\n                    q.append((i, j))\n                elif grid[i][j] == 1:\n                    fresh += 1\n        minutes = 0\n        dirs = [(0, 1), (0, -1), (1, 0), (-1, 0)]\n        while q and fresh:\n            for _ in range(len(q)):        # 这一层 = 一分钟\n                r, c = q.popleft()\n                for dr, dc in dirs:\n                    nr, nc = r + dr, c + dc\n                    if 0 <= nr < m and 0 <= nc < n and grid[nr][nc] == 1:\n                        grid[nr][nc] = 2\n                        fresh -= 1\n                        q.append((nr, nc))\n            minutes += 1\n        return minutes if fresh == 0 else -1"},{"num":1143,"title":"最长公共子序列","diff":"中等","topic":"回溯图论DP","book":"L09-backtrack-graph-dp.md","gist":"两个字符串的最长公共子序列长度（不要求连续）。","think":"`dp[i][j]` = `a` 的前 i 个字符和 `b` 的前 j 个字符的 LCS 长度。若 `a[i-1] == b[j-1]`，可以一起用上：`dp[i-1][j-1] + 1`；否则取「去掉 a 最后一个」和「去掉 b 最后一个」里较大的。","cost":"时间 `O(mn)`；空间 `O(n)`","easy":"字符相等时用的是**左上角** `prev[j-1]`，不是 `prev[j]`；二维表第 0 行第 0 列全是 0，用滚动数组时 `cur = [0]*(n+1)` 正好承担这个角色。","code":"class Solution:\n    def longestCommonSubsequence(self, text1, text2):\n        m, n = len(text1), len(text2)\n        prev = [0] * (n + 1)\n        for i in range(1, m + 1):\n            cur = [0] * (n + 1)\n            for j in range(1, n + 1):\n                if text1[i - 1] == text2[j - 1]:\n                    cur[j] = prev[j - 1] + 1\n                else:\n                    cur[j] = max(prev[j], cur[j - 1])\n            prev = cur\n        return prev[n]"}];
const KEY='lc100-seen-v1';

const list=document.getElementById('list');
list.innerHTML=`<article class="card" data-num="1" data-diff="简单" data-topic="数组与哈希" data-search="两数之和给数组 &#96;nums&#96; 和 &#96;target&#96;，找出两个数使它们的和为 &#96;target&#96;，返回下标。">
  <div class="head" onclick="tog(1)">

    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(1)">○</button>

  <div class="body" id="body-1" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">给数组 &#96;nums&#96; 和 &#96;target&#96;，找出两个数使它们的和为 &#96;target&#96;，返回下标。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">笨办法是试遍每一对（&#96;O(n²)&#96;）。慢在「每来一个数，都要翻一遍前面找补数」。用字典把见过的值和下标记下来，查补数就变成一瞬间。注意**先查后存**，否则同一个元素会配自己。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-1',this)">复制</button></div><pre id="code-1"><code>␀<span class="syn-num">1</span>␀ Solution:
    ␀<span class="syn-num">2</span>␀ twoSum(␀<span class="syn-num">3</span>␀, nums, target):
        seen = {}                        ␀<span class="syn-num">0</span>␀
        ␀<span class="syn-num">4</span>␀ i, x ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">10</span>␀(nums):
            need = target - x
            ␀<span class="syn-num">6</span>␀ need ␀<span class="syn-num">7</span>␀ seen:
                ␀<span class="syn-num">8</span>␀ [seen[need], i]
            seen[x] = i
        ␀<span class="syn-num">9</span>␀ []</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;[3]&#96;, &#96;target=6&#96; 时不能返回 &#96;[0,0]&#96;，所以 &#96;seen[x] = i&#96; 必须在 &#96;if&#96; 之后。</div></div>
  </div>
</article>
<article class="card" data-num="2" data-diff="中等" data-topic="链表与树" data-search="两数相加两个链表各自表示一个数字（低位在前），返回它们和的链表。">
  <div class="head" onclick="tog(2)">
    <span class="num">0002</span>
    <span class="ttl">两数相加</span>
    <span class="badge b-中等">中等</span>

    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(2)">○</button>
