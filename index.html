<article class="card" data-num="72" data-diff="中等" data-topic="回溯图论DP" data-search="编辑距离把 word1 变成 word2，可以插入、删除、替换一个字符，求最少操作数。">
  <div class="head" onclick="tog(72)">
    <span class="num">0072</span>
    <span class="ttl">编辑距离</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(72)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-72" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">把 word1 变成 word2，可以插入、删除、替换一个字符，求最少操作数。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">&#96;dp[i][j]&#96; = 把 &#96;a&#96; 的前 i 个字符变成 &#96;b&#96; 的前 j 个字符的最少操作数。字符相同则不用操作，直接继承 &#96;dp[i-1][j-1]&#96;；否则取「删」「插」「替换」三种里最小的 +1。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(mn)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-72',this)">复制</button></div><pre id="code-72"><code>␀<span class="syn-num">5</span>␀ Solution:
    ␀<span class="syn-num">6</span>␀ minDistance(␀<span class="syn-num">7</span>␀, word1, word2):
        m, n = ␀<span class="syn-num">15</span>␀(word1), ␀<span class="syn-num">16</span>␀(word2)
        prev = ␀<span class="syn-num">17</span>␀(␀<span class="syn-num">18</span>␀(n + <span class="syn-num">1</span>))          ␀<span class="syn-num">0</span>␀
        ␀<span class="syn-num">8</span>␀ i ␀<span class="syn-num">9</span>␀ ␀<span class="syn-num">19</span>␀(<span class="syn-num">1</span>, m + <span class="syn-num">1</span>):
            cur = [i] + [<span class="syn-num">0</span>] * n            ␀<span class="syn-num">1</span>␀
            ␀<span class="syn-num">10</span>␀ j ␀<span class="syn-num">11</span>␀ ␀<span class="syn-num">20</span>␀(<span class="syn-num">1</span>, n + <span class="syn-num">1</span>):
                ␀<span class="syn-num">12</span>␀ word1[i - <span class="syn-num">1</span>] == word2[j - <span class="syn-num">1</span>]:
                    cur[j] = prev[j - <span class="syn-num">1</span>]
                ␀<span class="syn-num">13</span>␀:
                    cur[j] = ␀<span class="syn-num">21</span>␀(prev[j],      ␀<span class="syn-num">2</span>␀
                                 cur[j - <span class="syn-num">1</span>],   ␀<span class="syn-num">3</span>␀
                                 prev[j - <span class="syn-num">1</span>]   ␀<span class="syn-num">4</span>␀
                                 ) + <span class="syn-num">1</span>
            prev = cur
        ␀<span class="syn-num">14</span>␀ prev[n]</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">第 0 行是 &#96;0,1,2,...,n&#96;（空串变成长度 j 的串要插 j 次），第 0 列是 &#96;0,1,2,...,i&#96;，初始化错整张表都错。</div></div>
  </div>
</article>
<article class="card" data-num="73" data-diff="中等" data-topic="数组与哈希" data-search="矩阵置零某个元素是 0，就把它所在的行和列全设为 0，要求原地、尽量省空间。">
  <div class="head" onclick="tog(73)">
    <span class="num">0073</span>
    <span class="ttl">矩阵置零</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(73)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-73" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">某个元素是 0，就把它所在的行和列全设为 0，要求原地、尽量省空间。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">用**第一行和第一列当标记本**，另外用两个变量记「第一行/第一列自己原本有没有 0」。先扫描打标记，再按标记置零，最后处理第一行第一列。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(mn)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-73',this)">复制</button></div><pre id="code-73"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ setZeroes(␀<span class="syn-num">2</span>␀, matrix):
        m, n = ␀<span class="syn-num">24</span>␀(matrix), ␀<span class="syn-num">25</span>␀(matrix[<span class="syn-num">0</span>])
        first_row = ␀<span class="syn-num">26</span>␀(matrix[<span class="syn-num">0</span>][j] == <span class="syn-num">0</span> ␀<span class="syn-num">3</span>␀ j ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">27</span>␀(n))
        first_col = ␀<span class="syn-num">28</span>␀(matrix[i][<span class="syn-num">0</span>] == <span class="syn-num">0</span> ␀<span class="syn-num">5</span>␀ i ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">29</span>␀(m))
        ␀<span class="syn-num">7</span>␀ i ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">30</span>␀(<span class="syn-num">1</span>, m):
            ␀<span class="syn-num">9</span>␀ j ␀<span class="syn-num">10</span>␀ ␀<span class="syn-num">31</span>␀(<span class="syn-num">1</span>, n):
                ␀<span class="syn-num">11</span>␀ matrix[i][j] == <span class="syn-num">0</span>:
                    matrix[i][<span class="syn-num">0</span>] = <span class="syn-num">0</span>
                    matrix[<span class="syn-num">0</span>][j] = <span class="syn-num">0</span>
        ␀<span class="syn-num">12</span>␀ i ␀<span class="syn-num">13</span>␀ ␀<span class="syn-num">32</span>␀(<span class="syn-num">1</span>, m):
            ␀<span class="syn-num">14</span>␀ j ␀<span class="syn-num">15</span>␀ ␀<span class="syn-num">33</span>␀(<span class="syn-num">1</span>, n):
                ␀<span class="syn-num">16</span>␀ matrix[i][<span class="syn-num">0</span>] == <span class="syn-num">0</span> ␀<span class="syn-num">17</span>␀ matrix[<span class="syn-num">0</span>][j] == <span class="syn-num">0</span>:
                    matrix[i][j] = <span class="syn-num">0</span>
        ␀<span class="syn-num">18</span>␀ first_row:
            ␀<span class="syn-num">19</span>␀ j ␀<span class="syn-num">20</span>␀ ␀<span class="syn-num">34</span>␀(n):
                matrix[<span class="syn-num">0</span>][j] = <span class="syn-num">0</span>
        ␀<span class="syn-num">21</span>␀ first_col:
            ␀<span class="syn-num">22</span>␀ i ␀<span class="syn-num">23</span>␀ ␀<span class="syn-num">35</span>␀(m):
                matrix[i][<span class="syn-num">0</span>] = <span class="syn-num">0</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;first_row&#96; / &#96;first_col&#96; 必须**在打标记之前**算，否则标记会污染判断。</div></div>
  </div>
</article>
<article class="card" data-num="74" data-diff="中等" data-topic="二分栈堆贪心" data-search="搜索二维矩阵矩阵每行升序，且下一行第一个数大于上一行最后一个数——整体其实就是一条拉直的有序数组。">
  <div class="head" onclick="tog(74)">
    <span class="num">0074</span>
    <span class="ttl">搜索二维矩阵</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">二分栈堆贪心</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(74)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-74" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">矩阵每行升序，且下一行第一个数大于上一行最后一个数——整体其实就是一条拉直的有序数组。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">把「一维下标 mid」换算成「第 &#96;mid // n&#96; 行、第 &#96;mid % n&#96; 列」，然后照骨架 A 二分。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(log(mn))&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-74',this)">复制</button></div><pre id="code-74"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ searchMatrix(␀<span class="syn-num">2</span>␀, matrix, target):
        m, n = ␀<span class="syn-num">11</span>␀(matrix), ␀<span class="syn-num">12</span>␀(matrix[<span class="syn-num">0</span>])
        l, r = <span class="syn-num">0</span>, m * n - <span class="syn-num">1</span>
        ␀<span class="syn-num">3</span>␀ l &lt;= r:
            mid = (l + r) // <span class="syn-num">2</span>
            v = matrix[mid // n][mid % n]
            ␀<span class="syn-num">4</span>␀ v == target:
                ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀
            ␀<span class="syn-num">7</span>␀ v &lt; target:
                l = mid + <span class="syn-num">1</span>
            ␀<span class="syn-num">8</span>␀:
                r = mid - <span class="syn-num">1</span>
        ␀<span class="syn-num">9</span>␀ ␀<span class="syn-num">10</span>␀</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;m*n&#96; 可能很大，但 Python 整数不溢出，直接算没问题。</div></div>
  </div>
</article>
<article class="card" data-num="75" data-diff="中等" data-topic="数组与哈希" data-search="颜色分类数组里只有 0、1、2，原地排成 0 在前、2 在后。">
  <div class="head" onclick="tog(75)">
    <span class="num">0075</span>
    <span class="ttl">颜色分类</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(75)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-75" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">数组里只有 0、1、2，原地排成 0 在前、2 在后。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">三指针荷兰国旗。&#96;l&#96; 是「下一个 0 该放的位置」，&#96;r&#96; 是「下一个 2 该放的位置」，&#96;i&#96; 是当前检查的。遇到 0 和 &#96;l&#96; 交换并让 &#96;i&#96; 前进；遇到 2 和 &#96;r&#96; 交换，但 **&#96;i&#96; 不能前进**（换过来的还没检查过）。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-75',this)">复制</button></div><pre id="code-75"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ sortColors(␀<span class="syn-num">2</span>␀, nums):
        l = i = <span class="syn-num">0</span>
        r = ␀<span class="syn-num">7</span>␀(nums) - <span class="syn-num">1</span>
        ␀<span class="syn-num">3</span>␀ i &lt;= r:
            ␀<span class="syn-num">4</span>␀ nums[i] == <span class="syn-num">0</span>:
                nums[l], nums[i] = nums[i], nums[l]
                l += <span class="syn-num">1</span>
                i += <span class="syn-num">1</span>
            ␀<span class="syn-num">5</span>␀ nums[i] == <span class="syn-num">2</span>:
                nums[r], nums[i] = nums[i], nums[r]
                r -= <span class="syn-num">1</span>
            ␀<span class="syn-num">6</span>␀:
                i += <span class="syn-num">1</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;i &lt;= r&#96; 不是 &#96;i &lt; len(nums)&#96;；2 的分支里 &#96;i&#96; 不动。</div></div>
  </div>
</article>
<article class="card" data-num="76" data-diff="困难" data-topic="数组与哈希" data-search="最小覆盖子串在 &#96;s&#96; 里找最短的一段，包含 &#96;t&#96; 里所有字符（含重复次数）。">
  <div class="head" onclick="tog(76)">
    <span class="num">0076</span>
    <span class="ttl">最小覆盖子串</span>
    <span class="badge b-困难">困难</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(76)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-76" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">在 &#96;s&#96; 里找最短的一段，包含 &#96;t&#96; 里所有字符（含重复次数）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">&#96;need&#96; 记还缺什么，&#96;window&#96; 记窗口里有什么，&#96;valid&#96; 记「已经满足数量的字符种类数」。右端一直扩，一旦 &#96;valid == len(need)&#96; 说明覆盖了，就试着缩左端找更短的，并记录答案。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(字符集)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-76',this)">复制</button></div><pre id="code-76"><code>␀<span class="syn-num">0</span>␀ collections ␀<span class="syn-num">1</span>␀ Counter

␀<span class="syn-num">2</span>␀ Solution:
    ␀<span class="syn-num">3</span>␀ minWindow(␀<span class="syn-num">4</span>␀, s, t):
        ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀ t ␀<span class="syn-num">7</span>␀ ␀<span class="syn-num">8</span>␀ s:
            ␀<span class="syn-num">9</span>␀ &quot;&quot;
        need = Counter(t)
        window = {}
        valid = <span class="syn-num">0</span>
        l = <span class="syn-num">0</span>
        best_len = ␀<span class="syn-num">21</span>␀(&quot;inf&quot;)
        best = &quot;&quot;
        ␀<span class="syn-num">10</span>␀ r, c ␀<span class="syn-num">11</span>␀ ␀<span class="syn-num">22</span>␀(s):
            ␀<span class="syn-num">12</span>␀ c ␀<span class="syn-num">13</span>␀ need:
                window[c] = window.get(c, <span class="syn-num">0</span>) + <span class="syn-num">1</span>
                ␀<span class="syn-num">14</span>␀ window[c] == need[c]:
                    valid += <span class="syn-num">1</span>
            ␀<span class="syn-num">15</span>␀ valid == ␀<span class="syn-num">23</span>␀(need):
                ␀<span class="syn-num">16</span>␀ r - l + <span class="syn-num">1</span> &lt; best_len:
                    best_len = r - l + <span class="syn-num">1</span>
                    best = s[l:r + <span class="syn-num">1</span>]
                out = s[l]
                ␀<span class="syn-num">17</span>␀ out ␀<span class="syn-num">18</span>␀ need:
                    ␀<span class="syn-num">19</span>␀ window[out] == need[out]:
                        valid -= <span class="syn-num">1</span>
                    window[out] -= <span class="syn-num">1</span>
                l += <span class="syn-num">1</span>
        ␀<span class="syn-num">20</span>␀ best</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;valid&#96; 只在「数量刚好达标」时 +1，超过不算；缩窗口时只在「刚好从达标掉下来」时 -1。切片 &#96;s[l:r+1]&#96; 每次花一段长度，数据大时能改成只记下标、最后切一次。</div></div>
  </div>
</article>
<article class="card" data-num="78" data-diff="中等" data-topic="回溯图论DP" data-search="子集返回数组的所有子集（包括空集）。">

    <div class="blk"><div class="lbl">题意</div><div class="txt">返回数组的所有子集（包括空集）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">对每个位置，决定「选它」还是「不选它」。用 &#96;start&#96; 保证只往後看，避免 &#96;[1,2]&#96; 和 &#96;[2,1]&#96; 重复。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n × 2ⁿ)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-78',this)">复制</button></div><pre id="code-78"><code>␀<span class="syn-num">1</span>␀ Solution:
    ␀<span class="syn-num">2</span>␀ subsets(␀<span class="syn-num">3</span>␀, nums):
        res, path = [], []
        ␀<span class="syn-num">4</span>␀ dfs(start):
            res.append(path[:])          ␀<span class="syn-num">0</span>␀
            ␀<span class="syn-num">5</span>␀ i ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">8</span>␀(start, ␀<span class="syn-num">9</span>␀(nums)):
                path.append(nums[i])
                dfs(i + <span class="syn-num">1</span>)
                path.pop()
        dfs(<span class="syn-num">0</span>)
        ␀<span class="syn-num">7</span>␀ res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;res.append&#96; 放在函数开头（不是只在叶子），因为每个节点都算一个子集。</div></div>
  </div>
</article>
<article class="card" data-num="79" data-diff="中等" data-topic="回溯图论DP" data-search="单词搜索在字符网格里，判断能否沿上下左右相邻的路径连出给定单词（同一格不能重复用）。">
  <div class="head" onclick="tog(79)">
    <span class="num">0079</span>
    <span class="ttl">单词搜索</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(79)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-79" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">在字符网格里，判断能否沿上下左右相邻的路径连出给定单词（同一格不能重复用）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">对每个格子当起点做 DFS。用一个临时标记 &#96;&#x27;#&#x27;&#96; 原地表示「这个格子本条路径已用过」，递归返回前恢复。这就是回溯里的「做选择 / 撤销」。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(mn × 3^L)&#96;（L 是单词长度）；空间 &#96;O(L)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-79',this)">复制</button></div><pre id="code-79"><code>␀<span class="syn-num">3</span>␀ Solution:
    ␀<span class="syn-num">4</span>␀ exist(␀<span class="syn-num">5</span>␀, board, word):
        m, n = ␀<span class="syn-num">32</span>␀(board), ␀<span class="syn-num">33</span>␀(board[<span class="syn-num">0</span>])
        dirs = [(<span class="syn-num">0</span>, <span class="syn-num">1</span>), (<span class="syn-num">0</span>, -<span class="syn-num">1</span>), (<span class="syn-num">1</span>, <span class="syn-num">0</span>), (-<span class="syn-num">1</span>, <span class="syn-num">0</span>)]
        ␀<span class="syn-num">6</span>␀ dfs(r, c, k):
            ␀<span class="syn-num">7</span>␀ board[r][c] != word[k]:
                ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀
            ␀<span class="syn-num">10</span>␀ k == ␀<span class="syn-num">34</span>␀(word) - <span class="syn-num">1</span>:
                ␀<span class="syn-num">11</span>␀ ␀<span class="syn-num">12</span>␀
            tmp = board[r][c]
            board[r][c] = &quot;␀<span class="syn-num">0</span>␀
            ␀<span class="syn-num">13</span>␀ dr, dc ␀<span class="syn-num">14</span>␀ dirs:
                nr, nc = r + dr, c + dc
                ␀<span class="syn-num">15</span>␀ <span class="syn-num">0</span> &lt;= nr &lt; m ␀<span class="syn-num">16</span>␀ <span class="syn-num">0</span> &lt;= nc &lt; n ␀<span class="syn-num">17</span>␀ board[nr][nc] != &quot;␀<span class="syn-num">1</span>␀
                    ␀<span class="syn-num">18</span>␀ dfs(nr, nc, k + <span class="syn-num">1</span>):
                        board[r][c] = tmp
                        ␀<span class="syn-num">19</span>␀ ␀<span class="syn-num">20</span>␀
            board[r][c] = tmp                 ␀<span class="syn-num">2</span>␀
            ␀<span class="syn-num">21</span>␀ ␀<span class="syn-num">22</span>␀
        ␀<span class="syn-num">23</span>␀ i ␀<span class="syn-num">24</span>␀ ␀<span class="syn-num">35</span>␀(m):
            ␀<span class="syn-num">25</span>␀ j ␀<span class="syn-num">26</span>␀ ␀<span class="syn-num">36</span>␀(n):
                ␀<span class="syn-num">27</span>␀ dfs(i, j, <span class="syn-num">0</span>):
                    ␀<span class="syn-num">28</span>␀ ␀<span class="syn-num">29</span>␀
        ␀<span class="syn-num">30</span>␀ ␀<span class="syn-num">31</span>␀</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">无论成功还是失败，返回前都要把格子恢复；找到答案时也要恢复再 &#96;return True&#96;。</div></div>
  </div>
</article>
<article class="card" data-num="84" data-diff="困难" data-topic="二分栈堆贪心" data-search="柱状图中最大的矩形找相邻柱子能框出的最大矩形面积。">
  <div class="head" onclick="tog(84)">
    <span class="num">0084</span>
    <span class="ttl">柱状图中最大的矩形</span>
    <span class="badge b-困难">困难</span>
    <span class="topic">二分栈堆贪心</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(84)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-84" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">找相邻柱子能框出的最大矩形面积。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">对每根柱子，需要知道「左边第一个比它矮的」和「右边第一个比它矮的」，两者之间就是以它的高度为高的最大宽度。单调栈（高度递增）能一次找出来：遇到比栈顶矮的柱子时，栈顶的右边界就确定了，弹出来算面积。末尾加一个高度 0 的**哨兵**，保证最后所有柱子都能被弹出。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-84',this)">复制</button></div><pre id="code-84"><code>␀<span class="syn-num">1</span>␀ Solution:
    ␀<span class="syn-num">2</span>␀ largestRectangleArea(␀<span class="syn-num">3</span>␀, heights):
        h = heights + [<span class="syn-num">0</span>]           ␀<span class="syn-num">0</span>␀
        st = []
        ans = <span class="syn-num">0</span>
        ␀<span class="syn-num">4</span>␀ i, x ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">11</span>␀(h):
            ␀<span class="syn-num">6</span>␀ st ␀<span class="syn-num">7</span>␀ h[st[-<span class="syn-num">1</span>]] &gt; x:
                height = h[st.pop()]
                left = st[-<span class="syn-num">1</span>] ␀<span class="syn-num">8</span>␀ st ␀<span class="syn-num">9</span>␀ -<span class="syn-num">1</span>
                width = i - left - <span class="syn-num">1</span>
                ans = ␀<span class="syn-num">12</span>␀(ans, height * width)
            st.append(i)
        ␀<span class="syn-num">10</span>␀ ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;width = i - left - 1&#96; 里的 &#96;left&#96; 是弹出后新的栈顶；没有哨兵时最后一段递增的柱子永远不会被结算。</div></div>
  </div>
</article>
<article class="card" data-num="94" data-diff="简单" data-topic="链表与树" data-search="二叉树的中序遍历按「左 → 根 → 右」的顺序输出所有值。">
  <div class="head" onclick="tog(94)">
    <span class="num">0094</span>
    <span class="ttl">二叉树的中序遍历</span>
    <span class="badge b-简单">简单</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(94)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-94" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">按「左 → 根 → 右」的顺序输出所有值。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">递归三问——返回值：无（把值加进结果列表）；单层：先遍历左、记录自己、再遍历右；终止：节点是 &#96;None&#96; 就返回。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(h)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-94',this)">复制</button></div><pre id="code-94"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ inorderTraversal(␀<span class="syn-num">2</span>␀, root):
        res = []
        ␀<span class="syn-num">3</span>␀ dfs(node):
            ␀<span class="syn-num">4</span>␀ node ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀:
                ␀<span class="syn-num">7</span>␀
            dfs(node.left)
            res.append(node.val)
            dfs(node.right)
        dfs(root)
        ␀<span class="syn-num">8</span>␀ res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;dfs&#96; 定义在方法内部时，&#96;res&#96; 是外层变量，读它没问题；若要修改计数变量得用 &#96;nonlocal&#96; 或改成返回值。</div></div>
  </div>
</article>
<article class="card" data-num="98" data-diff="中等" data-topic="链表与树" data-search="验证二叉搜索树判断一棵二叉树是不是合法的二叉搜索树。">
  <div class="head" onclick="tog(98)">
    <span class="num">0098</span>
    <span class="ttl">验证二叉搜索树</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(98)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-98" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">判断一棵二叉树是不是合法的二叉搜索树。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">不能只比较「根和左右孩子」——某个深层节点可能违反和祖先的大小关系。给递归带上「允许的范围 &#96;(lo, hi)&#96;」，每往左走就把上界收紧到当前值，往右走就把下界收紧。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(h)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-98',this)">复制</button></div><pre id="code-98"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ isValidBST(␀<span class="syn-num">2</span>␀, root):
        ␀<span class="syn-num">3</span>␀ dfs(node, lo, hi):
            ␀<span class="syn-num">4</span>␀ node ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀:
                ␀<span class="syn-num">7</span>␀ ␀<span class="syn-num">8</span>␀
            ␀<span class="syn-num">9</span>␀ ␀<span class="syn-num">10</span>␀ (lo &lt; node.val &lt; hi):
                ␀<span class="syn-num">11</span>␀ ␀<span class="syn-num">12</span>␀
            ␀<span class="syn-num">13</span>␀ dfs(node.left, lo, node.val) ␀<span class="syn-num">14</span>␀ dfs(node.right, node.val, hi)
        ␀<span class="syn-num">15</span>␀ dfs(root, ␀<span class="syn-num">16</span>␀(&quot;-inf&quot;), ␀<span class="syn-num">17</span>␀(&quot;inf&quot;))</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">用 &#96;float(&quot;±inf&quot;)&#96; 做初始界，别用 &#96;-1&#96;/&#96;10**9&#96; 这种具体数（节点值可能超出）；比较是严格的 &#96;&lt;&#96;，BST 不允许相等。</div></div>
  </div>
</article>
<article class="card" data-num="101" data-diff="简单" data-topic="链表与树" data-search="对称二叉树判断一棵树是否左右镜像对称。">
  <div class="head" onclick="tog(101)">
    <span class="num">0101</span>
    <span class="ttl">对称二叉树</span>
    <span class="badge b-简单">简单</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(101)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-101" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">判断一棵树是否左右镜像对称。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">不是「判断左子树等于右子树」，而是「左子树的左 对 右子树的右、左子树的右 对 右子树的左」都相等。写一个比较两棵树的辅助函数。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(h)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-101',this)">复制</button></div><pre id="code-101"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ isSymmetric(␀<span class="syn-num">2</span>␀, root):
        ␀<span class="syn-num">3</span>␀ same(a, b):
            ␀<span class="syn-num">4</span>␀ a ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀ b ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀:
                ␀<span class="syn-num">10</span>␀ ␀<span class="syn-num">11</span>␀
            ␀<span class="syn-num">12</span>␀ a ␀<span class="syn-num">13</span>␀ ␀<span class="syn-num">14</span>␀ ␀<span class="syn-num">15</span>␀ b ␀<span class="syn-num">16</span>␀ ␀<span class="syn-num">17</span>␀:
                ␀<span class="syn-num">18</span>␀ ␀<span class="syn-num">19</span>␀
            ␀<span class="syn-num">20</span>␀ a.val == b.val ␀<span class="syn-num">21</span>␀ same(a.left, b.right) ␀<span class="syn-num">22</span>␀ same(a.right, b.left)
        ␀<span class="syn-num">23</span>␀ root ␀<span class="syn-num">24</span>␀ ␀<span class="syn-num">25</span>␀ ␀<span class="syn-num">26</span>␀ same(root.left, root.right)</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">两个都为空是 &#96;True&#96;，只有一个为空是 &#96;False&#96;，顺序别反。</div></div>
  </div>
</article>
<article class="card" data-num="102" data-diff="中等" data-topic="链表与树" data-search="二叉树的层序遍历按层从上到下、每层从左到右输出。">
  <div class="head" onclick="tog(102)">
    <span class="num">0102</span>
    <span class="ttl">二叉树的层序遍历</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(102)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-102" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">按层从上到下、每层从左到右输出。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">用队列（&#96;deque&#96;）。关键是**先记下当前队列长度**，这个长度就是当前层的节点数，然后只处理这么多个——即使处理过程中往队列里加了下一层的节点，也不会混进本层。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-102',this)">复制</button></div><pre id="code-102"><code>␀<span class="syn-num">0</span>␀ collections ␀<span class="syn-num">1</span>␀ deque

␀<span class="syn-num">2</span>␀ Solution:
    ␀<span class="syn-num">3</span>␀ levelOrder(␀<span class="syn-num">4</span>␀, root):
        ␀<span class="syn-num">5</span>␀ root ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀:
            ␀<span class="syn-num">8</span>␀ []
        q = deque([root])
        res = []
        ␀<span class="syn-num">9</span>␀ q:
            level = []
            ␀<span class="syn-num">10</span>␀ _ ␀<span class="syn-num">11</span>␀ ␀<span class="syn-num">21</span>␀(␀<span class="syn-num">22</span>␀(q)):
                node = q.popleft()
                level.append(node.val)
                ␀<span class="syn-num">12</span>␀ node.left ␀<span class="syn-num">13</span>␀ ␀<span class="syn-num">14</span>␀ ␀<span class="syn-num">15</span>␀:
                    q.append(node.left)
                ␀<span class="syn-num">16</span>␀ node.right ␀<span class="syn-num">17</span>␀ ␀<span class="syn-num">18</span>␀ ␀<span class="syn-num">19</span>␀:
                    q.append(node.right)
            res.append(level)
        ␀<span class="syn-num">20</span>␀ res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;for _ in range(len(q))&#96; 里的 &#96;len(q)&#96; 在循环开始时求值一次；用 &#96;list.pop(0)&#96; 会超时，必须 &#96;deque&#96;。</div></div>
  </div>
</article>
<article class="card" data-num="104" data-diff="简单" data-topic="链表与树" data-search="二叉树的最大深度求二叉树的最大深度。">

    <div class="blk"><div class="lbl">题意</div><div class="txt">求二叉树的最大深度。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">一棵树的深度 = 左右子树里较深的那个 + 1。空树深度 0。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(h)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-104',this)">复制</button></div><pre id="code-104"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ maxDepth(␀<span class="syn-num">2</span>␀, root):
        ␀<span class="syn-num">3</span>␀ root ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">5</span>␀:
            ␀<span class="syn-num">6</span>␀ <span class="syn-num">0</span>
        ␀<span class="syn-num">7</span>␀ ␀<span class="syn-num">10</span>␀(␀<span class="syn-num">8</span>␀.maxDepth(root.left), ␀<span class="syn-num">9</span>␀.maxDepth(root.right)) + <span class="syn-num">1</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">别漏 &#96;+ 1&#96;（算上自己这一层）。</div></div>
  </div>
</article>
<article class="card" data-num="105" data-diff="中等" data-topic="链表与树" data-search="从前序与中序遍历序列构造二叉树用前序和中序遍历结果构造出原来的二叉树。">
  <div class="head" onclick="tog(105)">
    <span class="num">0105</span>
    <span class="ttl">从前序与中序遍历序列构造二叉树</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(105)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-105" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">用前序和中序遍历结果构造出原来的二叉树。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">前序第一个一定是根。在中序里找到根的位置，左边就是左子树的节点、右边是右子树的节点；由左子树长度可以切出前序里两段的范围，递归构造。用字典记「值 → 中序下标」，避免每次线性查找。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-105',this)">复制</button></div><pre id="code-105"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ buildTree(␀<span class="syn-num">2</span>␀, preorder, inorder):
        idx = {v: i ␀<span class="syn-num">3</span>␀ i, v ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">11</span>␀(inorder)}
        ␀<span class="syn-num">5</span>␀ build(pl, pr, il, ir):
            ␀<span class="syn-num">6</span>␀ pl &gt; pr:
                ␀<span class="syn-num">7</span>␀ ␀<span class="syn-num">8</span>␀
            v = preorder[pl]
            k = idx[v]
            left_len = k - il
            root = TreeNode(v)
            root.left = build(pl + <span class="syn-num">1</span>, pl + left_len, il, k - <span class="syn-num">1</span>)
            root.right = build(pl + left_len + <span class="syn-num">1</span>, pr, k + <span class="syn-num">1</span>, ir)
            ␀<span class="syn-num">9</span>␀ root
        ␀<span class="syn-num">10</span>␀ build(<span class="syn-num">0</span>, ␀<span class="syn-num">12</span>␀(preorder) - <span class="syn-num">1</span>, <span class="syn-num">0</span>, ␀<span class="syn-num">13</span>␀(inorder) - <span class="syn-num">1</span>)</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;left_len = k - il&#96;（中序里根左边的个数），前序里左段就是 &#96;pl+1 ~ pl+left_len&#96;，右段从 &#96;pl+left_len+1&#96; 开始。</div></div>
  </div>
</article>
<article class="card" data-num="108" data-diff="简单" data-topic="链表与树" data-search="将有序数组转换为二叉搜索树把升序数组转成一棵高度平衡的 bst。">
  <div class="head" onclick="tog(108)">
    <span class="num">0108</span>
    <span class="ttl">将有序数组转换为二叉搜索树</span>
    <span class="badge b-简单">简单</span>

    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(108)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-108" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">把升序数组转成一棵高度平衡的 BST。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">取中间元素当根（两边节点数最接近，自然平衡），左半递归造左子树、右半递归造右子树。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(log n)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-108',this)">复制</button></div><pre id="code-108"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ sortedArrayToBST(␀<span class="syn-num">2</span>␀, nums):
        ␀<span class="syn-num">3</span>␀ build(l, r):
            ␀<span class="syn-num">4</span>␀ l &gt; r:
                ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀
            mid = (l + r) // <span class="syn-num">2</span>
            root = TreeNode(nums[mid])
            root.left = build(l, mid - <span class="syn-num">1</span>)
            root.right = build(mid + <span class="syn-num">1</span>, r)
            ␀<span class="syn-num">7</span>␀ root
        ␀<span class="syn-num">8</span>␀ build(<span class="syn-num">0</span>, ␀<span class="syn-num">9</span>␀(nums) - <span class="syn-num">1</span>)</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;//&#96; 不能写成 &#96;/&#96;，否则下标变小数会报错。</div></div>
  </div>
</article>
<article class="card" data-num="114" data-diff="中等" data-topic="链表与树" data-search="二叉树展开为链表把树按前序顺序原地拉成一条「只有右孩子」的链。">
  <div class="head" onclick="tog(114)">
    <span class="num">0114</span>
    <span class="ttl">二叉树展开为链表</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(114)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-114" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">把树按前序顺序原地拉成一条「只有右孩子」的链。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">对每个节点，如果它有左子树，就把左子树接到「右子树之前」——具体做法：找到左子树最右边的节点（前序里左子树的最后一个），把原来的右子树挂到它的 &#96;right&#96; 上，然后把整棵左子树搬到 &#96;right&#96;，左孩子置空。一路往右走。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-114',this)">复制</button></div><pre id="code-114"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ flatten(␀<span class="syn-num">2</span>␀, root):
        cur = root
        ␀<span class="syn-num">3</span>␀ cur ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀:
            ␀<span class="syn-num">7</span>␀ cur.left ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀ ␀<span class="syn-num">10</span>␀:
                pre = cur.left
                ␀<span class="syn-num">11</span>␀ pre.right ␀<span class="syn-num">12</span>␀ ␀<span class="syn-num">13</span>␀ ␀<span class="syn-num">14</span>␀:
                    pre = pre.right
                pre.right = cur.right
                cur.right = cur.left
                cur.left = ␀<span class="syn-num">15</span>␀
            cur = cur.right</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;cur.left = None&#96; 不能漏，否则不是「链表」；找 &#96;pre&#96; 时只沿 &#96;right&#96; 走。</div></div>
  </div>
</article>
<article class="card" data-num="118" data-diff="简单" data-topic="回溯图论DP" data-search="杨辉三角生成前 numrows 行，每个数等于上一行左右两数之和。 时间 &#96;o(n²)&#96;，空间 &#96;o(n²)&#96;。**易错**：每行首尾都是 1，中间才用加法；&#96;range(1, i)&#96; 的右端取不到，正好不算最后一个。">
  <div class="head" onclick="tog(118)">
    <span class="num">0118</span>
    <span class="ttl">杨辉三角</span>
    <span class="badge b-简单">简单</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(118)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-118" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">生成前 numRows 行，每个数等于上一行左右两数之和。 时间 &#96;O(n²)&#96;，空间 &#96;O(n²)&#96;。**易错**：每行首尾都是 1，中间才用加法；&#96;range(1, i)&#96; 的右端取不到，正好不算最后一个。</div></div>
    
    <div class="meta"><span class="cost">时间 &#96;O(n²)&#96;；空间 &#96;O(n²)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-118',this)">复制</button></div><pre id="code-118"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ generate(␀<span class="syn-num">2</span>␀, numRows):
        res = [[<span class="syn-num">1</span>]]
        ␀<span class="syn-num">3</span>␀ i ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">8</span>␀(<span class="syn-num">1</span>, numRows):
            prev = res[-<span class="syn-num">1</span>]
            row = [<span class="syn-num">1</span>] * (i + <span class="syn-num">1</span>)
            ␀<span class="syn-num">5</span>␀ j ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">9</span>␀(<span class="syn-num">1</span>, i):
                row[j] = prev[j - <span class="syn-num">1</span>] + prev[j]
            res.append(row)
        ␀<span class="syn-num">7</span>␀ res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">每行首尾都是 1，中间才用加法；&#96;range(1, i)&#96; 的右端取不到，正好不算最后一个。</div></div>
  </div>
</article>
<article class="card" data-num="121" data-diff="简单" data-topic="二分栈堆贪心" data-search="买卖股票的最佳时机只能买卖一次，求最大利润。">
  <div class="head" onclick="tog(121)">
    <span class="num">0121</span>
    <span class="ttl">买卖股票的最佳时机</span>
    <span class="badge b-简单">简单</span>
    <span class="topic">二分栈堆贪心</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(121)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-121" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">只能买卖一次，求最大利润。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">扫一遍，始终记住「到今天为止最低的买入价」，然后算「今天卖出能赚多少」，取最大。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-121',this)">复制</button></div><pre id="code-121"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ maxProfit(␀<span class="syn-num">2</span>␀, prices):
        low = ␀<span class="syn-num">6</span>␀(&quot;inf&quot;)
        ans = <span class="syn-num">0</span>
        ␀<span class="syn-num">3</span>␀ p ␀<span class="syn-num">4</span>␀ prices:
            low = ␀<span class="syn-num">7</span>␀(low, p)
            ans = ␀<span class="syn-num">8</span>␀(ans, p - low)
        ␀<span class="syn-num">5</span>␀ ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;low&#96; 必须初始化成正无穷，不能是 0（价格可能是任意正数）；先更新 &#96;low&#96; 再算利润，同一天买卖利润为 0，不影响结果。</div></div>
  </div>
</article>
<article class="card" data-num="124" data-diff="困难" data-topic="链表与树" data-search="二叉树中的最大路径和任意一条路径（可以从任意节点到任意节点）的最大节点值之和，可能有负数。">
  <div class="head" onclick="tog(124)">
    <span class="num">0124</span>
    <span class="ttl">二叉树中的最大路径和</span>
    <span class="badge b-困难">困难</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(124)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-124" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">任意一条路径（可以从任意节点到任意节点）的最大节点值之和，可能有负数。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">递归函数返回「从当前节点**往下走单边**能给父节点贡献的最大值」——负值贡献直接砍成 0（不要也罢）。同时在每层用「左贡献 + 右贡献 + 自己」更新全局答案，那条是穿过当前节点的完整路径，不能再往上延伸。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(h)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-124',this)">复制</button></div><pre id="code-124"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ maxPathSum(␀<span class="syn-num">2</span>␀, root):
        ␀<span class="syn-num">3</span>␀.ans = ␀<span class="syn-num">14</span>␀(&quot;-inf&quot;)
        ␀<span class="syn-num">4</span>␀ dfs(node):
            ␀<span class="syn-num">5</span>␀ node ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀:
                ␀<span class="syn-num">8</span>␀ <span class="syn-num">0</span>
            l = ␀<span class="syn-num">15</span>␀(<span class="syn-num">0</span>, dfs(node.left))
            r = ␀<span class="syn-num">16</span>␀(<span class="syn-num">0</span>, dfs(node.right))
            ␀<span class="syn-num">9</span>␀.ans = ␀<span class="syn-num">17</span>␀(␀<span class="syn-num">10</span>␀.ans, node.val + l + r)
            ␀<span class="syn-num">11</span>␀ node.val + ␀<span class="syn-num">18</span>␀(l, r)
        dfs(root)
        ␀<span class="syn-num">12</span>␀ ␀<span class="syn-num">13</span>␀.ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">返回值是**单边**（&#96;node.val + max(l,r)&#96;），全局更新用**双边**（&#96;+ l + r&#96;），两者别混；初始答案必须是 &#96;-inf&#96;，全负数树才对。</div></div>
  </div>
</article>
<article class="card" data-num="128" data-diff="中等" data-topic="数组与哈希" data-search="最长连续序列找出数组里最长的一段连续数字的长度，如 &#96;[100,4,200,1,3,2]&#96; → &#96;4&#96;（1,2,3,4）。要求 &#96;o(n)&#96;。">
  <div class="head" onclick="tog(128)">
    <span class="num">0128</span>
    <span class="ttl">最长连续序列</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(128)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-128" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">找出数组里最长的一段连续数字的长度，如 &#96;[100,4,200,1,3,2]&#96; → &#96;4&#96;（1,2,3,4）。要求 &#96;O(n)&#96;。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">先全部放进集合（查存在一瞬间）。然后**只从「一段的起点」开始数**——如果 &#96;x-1&#96; 也在集合里，说明 x 不是起点，跳过它。这样每个数字最多被内层循环访问一次，整体仍是 &#96;O(n)&#96;。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-128',this)">复制</button></div><pre id="code-128"><code>␀<span class="syn-num">1</span>␀ Solution:
    ␀<span class="syn-num">2</span>␀ longestConsecutive(␀<span class="syn-num">3</span>␀, nums):
        s = ␀<span class="syn-num">12</span>␀(nums)
        best = <span class="syn-num">0</span>
        ␀<span class="syn-num">4</span>␀ x ␀<span class="syn-num">5</span>␀ s:
            ␀<span class="syn-num">6</span>␀ x - <span class="syn-num">1</span> ␀<span class="syn-num">7</span>␀ ␀<span class="syn-num">8</span>␀ s:          ␀<span class="syn-num">0</span>␀
                y = x
                ␀<span class="syn-num">9</span>␀ y + <span class="syn-num">1</span> ␀<span class="syn-num">10</span>␀ s:
                    y += <span class="syn-num">1</span>
                best = ␀<span class="syn-num">13</span>␀(best, y - x + <span class="syn-num">1</span>)
        ␀<span class="syn-num">11</span>␀ best</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">漏掉 &#96;if x - 1 not in s&#96;，每个数都会把整段重新数一遍，退化成 &#96;O(n²)&#96;。</div></div>
  </div>
</article>
<article class="card" data-num="131" data-diff="中等" data-topic="回溯图论DP" data-search="分割回文串把字符串切成若干段，要求每段都是回文，返回所有切法。">
  <div class="head" onclick="tog(131)">
    <span class="num">0131</span>
    <span class="ttl">分割回文串</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(131)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-131" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">把字符串切成若干段，要求每段都是回文，返回所有切法。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">&#96;start&#96; 表示「从哪开始切下一段」，枚举这一段的所有可能终点 &#96;end&#96;，只有 &#96;s[start:end]&#96; 是回文才继续往下切。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n × 2ⁿ)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-131',this)">复制</button></div><pre id="code-131"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ partition(␀<span class="syn-num">2</span>␀, s):
        res, path = [], []
        n = ␀<span class="syn-num">10</span>␀(s)
        ␀<span class="syn-num">3</span>␀ dfs(start):
            ␀<span class="syn-num">4</span>␀ start == n:
                res.append(path[:])
                ␀<span class="syn-num">5</span>␀
            ␀<span class="syn-num">6</span>␀ end ␀<span class="syn-num">7</span>␀ ␀<span class="syn-num">11</span>␀(start + <span class="syn-num">1</span>, n + <span class="syn-num">1</span>):
                t = s[start:end]
                ␀<span class="syn-num">8</span>␀ t == t[::-<span class="syn-num">1</span>]:
                    path.append(t)
                    dfs(end)
                    path.pop()
        dfs(<span class="syn-num">0</span>)
        ␀<span class="syn-num">9</span>␀ res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;end&#96; 要取到 &#96;n&#96;（&#96;range(start+1, n+1)&#96;），因为切片右端取不到；&#96;t == t[::-1]&#96; 每次切片花一段时间，数据大时可预先算好回文表。</div></div>
  </div>
</article>
<article class="card" data-num="136" data-diff="简单" data-topic="数组与哈希" data-search="只出现一次的数字所有数都出现两次，只有一个出现一次，找出来。">
  <div class="head" onclick="tog(136)">
    <span class="num">0136</span>
    <span class="ttl">只出现一次的数字</span>
    <span class="badge b-简单">简单</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(136)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-136" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">所有数都出现两次，只有一个出现一次，找出来。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">&#96;a ^ a = 0&#96;、&#96;a ^ 0 = a&#96;，而且异或满足交换律。把全部数异或起来，成对的全抵消，剩下的就是答案。&#96;^&#96; 是异或，不是乘方（乘方是 &#96;**&#96;）。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-136',this)">复制</button></div><pre id="code-136"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ singleNumber(␀<span class="syn-num">2</span>␀, nums):
        ans = <span class="syn-num">0</span>
        ␀<span class="syn-num">3</span>␀ x ␀<span class="syn-num">4</span>␀ nums:
            ans ^= x
        ␀<span class="syn-num">5</span>␀ ans</code></pre></div>
    
  </div>
</article>
<article class="card" data-num="138" data-diff="中等" data-topic="链表与树" data-search="随机链表的复制每个节点除了 &#96;next&#96; 还有一个 &#96;random&#96; 指向任意节点，要深拷贝整条链。">
  <div class="head" onclick="tog(138)">
    <span class="num">0138</span>
    <span class="ttl">随机链表的复制</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(138)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-138" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">每个节点除了 &#96;next&#96; 还有一个 &#96;random&#96; 指向任意节点，要深拷贝整条链。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">两遍哈希表。第一遍给每个原节点造一个新节点，存映射；第二遍照映射把 &#96;next&#96; 和 &#96;random&#96; 接上。字典里预存 &#96;{None: None}&#96; 这个哨兵，能省掉每处判空。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-138',this)">复制</button></div><pre id="code-138"><code>␀<span class="syn-num">1</span>␀ Solution:
    ␀<span class="syn-num">2</span>␀ copyRandomList(␀<span class="syn-num">3</span>␀, head):
        ␀<span class="syn-num">4</span>␀ head ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀:
            ␀<span class="syn-num">7</span>␀ ␀<span class="syn-num">8</span>␀
        d = {␀<span class="syn-num">9</span>␀: ␀<span class="syn-num">10</span>␀}
        cur = head
        ␀<span class="syn-num">11</span>␀ cur ␀<span class="syn-num">12</span>␀ ␀<span class="syn-num">13</span>␀ ␀<span class="syn-num">14</span>␀:
            d[cur] = Node(cur.val)      ␀<span class="syn-num">0</span>␀
            cur = cur.next
        cur = head
        ␀<span class="syn-num">15</span>␀ cur ␀<span class="syn-num">16</span>␀ ␀<span class="syn-num">17</span>␀ ␀<span class="syn-num">18</span>␀:
            d[cur].next = d[cur.next]
            d[cur].random = d[cur.random]
            cur = cur.next
        ␀<span class="syn-num">19</span>␀ d[head]</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">不能一遍做完——第二遍接 &#96;random&#96; 时，目标节点可能还没被创建，所以必须先全部造好。节点对象能当字典的键（自定义类默认可哈希）。</div></div>
  </div>
</article>
<article class="card" data-num="139" data-diff="中等" data-topic="回溯图论DP" data-search="单词拆分判断字符串能否拆成字典里的单词（单词可重复使用）。">
  <div class="head" onclick="tog(139)">
    <span class="num">0139</span>
    <span class="ttl">单词拆分</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(139)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-139" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">判断字符串能否拆成字典里的单词（单词可重复使用）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">&#96;dp[i]&#96; = 前 i 个字符能否被拆开。枚举最后一个单词的起点 &#96;j&#96;，若 &#96;dp[j]&#96; 为真且 &#96;s[j:i]&#96; 在字典里，则 &#96;dp[i]&#96; 为真。把字典转成集合，查找才快。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n²)&#96;（切片本身也花时间）；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-139',this)">复制</button></div><pre id="code-139"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ wordBreak(␀<span class="syn-num">2</span>␀, s, wordDict):
        words = ␀<span class="syn-num">15</span>␀(wordDict)
        n = ␀<span class="syn-num">16</span>␀(s)
        dp = [␀<span class="syn-num">3</span>␀] * (n + <span class="syn-num">1</span>)
        dp[<span class="syn-num">0</span>] = ␀<span class="syn-num">4</span>␀
        ␀<span class="syn-num">5</span>␀ i ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">17</span>␀(<span class="syn-num">1</span>, n + <span class="syn-num">1</span>):
            ␀<span class="syn-num">7</span>␀ j ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">18</span>␀(i):
                ␀<span class="syn-num">9</span>␀ dp[j] ␀<span class="syn-num">10</span>␀ s[j:i] ␀<span class="syn-num">11</span>␀ words:
                    dp[i] = ␀<span class="syn-num">12</span>␀
                    ␀<span class="syn-num">13</span>␀
        ␀<span class="syn-num">14</span>␀ dp[n]</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;dp[0] = True&#96; 表示「空串可以被拆」，是递推的起点；&#96;dp[i]&#96; 对应前 i 个字符（不含 i）。</div></div>
  </div>
</article>
<article class="card" data-num="141" data-diff="简单" data-topic="链表与树" data-search="环形链表判断链表里有没有环。">
  <div class="head" onclick="tog(141)">
    <span class="num">0141</span>
    <span class="ttl">环形链表</span>
    <span class="badge b-简单">简单</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(141)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-141" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">判断链表里有没有环。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">快慢指针，慢的每次走一步、快的每次走两步。有环的话快的迟早从后面追上慢的；没环的话快的会先走到 &#96;None&#96;。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-141',this)">复制</button></div><pre id="code-141"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ hasCycle(␀<span class="syn-num">2</span>␀, head):
        slow = fast = head
        ␀<span class="syn-num">3</span>␀ fast ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀ fast.next ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀ ␀<span class="syn-num">10</span>␀:
            slow = slow.next
            fast = fast.next.next
            ␀<span class="syn-num">11</span>␀ slow ␀<span class="syn-num">12</span>␀ fast:
                ␀<span class="syn-num">13</span>␀ ␀<span class="syn-num">14</span>␀
        ␀<span class="syn-num">15</span>␀ ␀<span class="syn-num">16</span>␀</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">判「是不是同一个节点」用 &#96;is&#96;，不是 &#96;==&#96;；循环条件要同时保证 &#96;fast&#96; 和 &#96;fast.next&#96; 都不是 &#96;None&#96;。</div></div>
  </div>
</article>
<article class="card" data-num="142" data-diff="中等" data-topic="链表与树" data-search="环形链表 ii有环的话，返回环的入口节点。">
  <div class="head" onclick="tog(142)">
    <span class="num">0142</span>
    <span class="ttl">环形链表 II</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(142)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-142" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">有环的话，返回环的入口节点。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">先用快慢指针找到相遇点，然后让一个指针回到链表头，两个指针**同速**前进，再次相遇处就是环入口。（背后的数学：设头到入口距离为 a、入口到相遇点为 b，快指针走的路是慢指针两倍，可推出「头到入口」等于「相遇点再走到入口」。）</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-142',this)">复制</button></div><pre id="code-142"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ detectCycle(␀<span class="syn-num">2</span>␀, head):
        slow = fast = head
        ␀<span class="syn-num">3</span>␀ fast ␀<span class="syn-num">4</span>␀ ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀ fast.next ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀ ␀<span class="syn-num">10</span>␀:
            slow = slow.next
            fast = fast.next.next
            ␀<span class="syn-num">11</span>␀ slow ␀<span class="syn-num">12</span>␀ fast:
                p = head
                ␀<span class="syn-num">13</span>␀ p ␀<span class="syn-num">14</span>␀ ␀<span class="syn-num">15</span>␀ slow:
                    p = p.next
                    slow = slow.next
                ␀<span class="syn-num">16</span>␀ p
        ␀<span class="syn-num">17</span>␀ ␀<span class="syn-num">18</span>␀</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">第二段循环两个指针都走一步，别再让其中一个走两步。</div></div>
  </div>
</article>
<article class="card" data-num="146" data-diff="中等" data-topic="链表与树" data-search="lru 缓存设计缓存：&#96;get&#96; / &#96;put&#96; 都是 &#96;o(1)&#96;，容量满时淘汰最久没用过的。">
  <div class="head" onclick="tog(146)">
    <span class="num">0146</span>
    <span class="ttl">LRU 缓存</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(146)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-146" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">设计缓存：&#96;get&#96; / &#96;put&#96; 都是 &#96;O(1)&#96;，容量满时淘汰最久没用过的。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">哈希表保证查找快，还要维护「谁最旧」。&#96;OrderedDict&#96; 正好提供了 &#96;move_to_end()&#96;（标记为最新）和 &#96;popitem(last=False)&#96;（弹出最旧）。 两个操作均 &#96;O(1)&#96;，空间 &#96;O(capacity)&#96;。</div></div>
    <div class="meta"><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-146',this)">复制</button></div><pre id="code-146"><code>␀<span class="syn-num">0</span>␀ collections ␀<span class="syn-num">1</span>␀ OrderedDict

␀<span class="syn-num">2</span>␀ LRUCache:
    ␀<span class="syn-num">3</span>␀ __init__(␀<span class="syn-num">4</span>␀, capacity):
        ␀<span class="syn-num">5</span>␀.d = OrderedDict()
        ␀<span class="syn-num">6</span>␀.cap = capacity

    ␀<span class="syn-num">7</span>␀ get(␀<span class="syn-num">8</span>␀, key):
        ␀<span class="syn-num">9</span>␀ key ␀<span class="syn-num">10</span>␀ ␀<span class="syn-num">11</span>␀ ␀<span class="syn-num">12</span>␀.d:
            ␀<span class="syn-num">13</span>␀ -<span class="syn-num">1</span>
        ␀<span class="syn-num">14</span>␀.d.move_to_end(key)
        ␀<span class="syn-num">15</span>␀ ␀<span class="syn-num">16</span>␀.d[key]

    ␀<span class="syn-num">17</span>␀ put(␀<span class="syn-num">18</span>␀, key, value):
        ␀<span class="syn-num">19</span>␀ key ␀<span class="syn-num">20</span>␀ ␀<span class="syn-num">21</span>␀.d:
            ␀<span class="syn-num">22</span>␀.d.move_to_end(key)
        ␀<span class="syn-num">23</span>␀.d[key] = value
        ␀<span class="syn-num">24</span>␀ ␀<span class="syn-num">29</span>␀(␀<span class="syn-num">25</span>␀.d) &gt; ␀<span class="syn-num">26</span>␀.cap:
            ␀<span class="syn-num">27</span>␀.d.popitem(last=␀<span class="syn-num">28</span>␀)</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;get&#96; 命中时也要 &#96;move_to_end&#96;，否则「最近使用」的信息就错了。面试有时会要求手写双向链表 + 哈希表，那时不能用这个偷懒版，但 LeetCode 上提交没问题。</div></div>
  </div>
</article>
<article class="card" data-num="148" data-diff="中等" data-topic="链表与树" data-search="排序链表给链表排序，要求 &#96;o(n log n)&#96;。">
  <div class="head" onclick="tog(148)">
    <span class="num">0148</span>
    <span class="ttl">排序链表</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(148)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-148" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">给链表排序，要求 &#96;O(n log n)&#96;。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">归并排序。用快慢指针找到中点、把链表断成两半，各自递归排序，再用 21 题的「合并两个有序链表」拼回去。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n log n)&#96;；空间 &#96;O(log n)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-148',this)">复制</button></div><pre id="code-148"><code>␀<span class="syn-num">1</span>␀ Solution:
    ␀<span class="syn-num">2</span>␀ sortList(␀<span class="syn-num">3</span>␀, head):
        ␀<span class="syn-num">4</span>␀ head ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀ head.next ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀:
            ␀<span class="syn-num">10</span>␀ head
        slow = fast = head
        prev = ␀<span class="syn-num">11</span>␀
        ␀<span class="syn-num">12</span>␀ fast ␀<span class="syn-num">13</span>␀ ␀<span class="syn-num">14</span>␀ ␀<span class="syn-num">15</span>␀ ␀<span class="syn-num">16</span>␀ fast.next ␀<span class="syn-num">17</span>␀ ␀<span class="syn-num">18</span>␀ ␀<span class="syn-num">19</span>␀:
            prev = slow
            slow = slow.next
            fast = fast.next.next
        prev.next = ␀<span class="syn-num">20</span>␀                ␀<span class="syn-num">0</span>␀
        left = ␀<span class="syn-num">21</span>␀.sortList(head)
        right = ␀<span class="syn-num">22</span>␀.sortList(slow)
        ␀<span class="syn-num">23</span>␀ ␀<span class="syn-num">24</span>␀.merge(left, right)

    ␀<span class="syn-num">25</span>␀ merge(␀<span class="syn-num">26</span>␀, l1, l2):
        dummy = cur = ListNode(<span class="syn-num">0</span>)
        ␀<span class="syn-num">27</span>␀ l1 ␀<span class="syn-num">28</span>␀ ␀<span class="syn-num">29</span>␀ ␀<span class="syn-num">30</span>␀ ␀<span class="syn-num">31</span>␀ l2 ␀<span class="syn-num">32</span>␀ ␀<span class="syn-num">33</span>␀ ␀<span class="syn-num">34</span>␀:
            ␀<span class="syn-num">35</span>␀ l1.val &lt;= l2.val:
                cur.next, l1 = l1, l1.next
            ␀<span class="syn-num">36</span>␀:
                cur.next, l2 = l2, l2.next
            cur = cur.next
        cur.next = l1 ␀<span class="syn-num">37</span>␀ l1 ␀<span class="syn-num">38</span>␀ ␀<span class="syn-num">39</span>␀ ␀<span class="syn-num">40</span>␀ ␀<span class="syn-num">41</span>␀ l2
        ␀<span class="syn-num">42</span>␀ dummy.next</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;prev.next = None&#96; 不能漏，否则左半尾巴还连着右半，递归会无限循环。</div></div>
  </div>
</article>
<article class="card" data-num="152" data-diff="中等" data-topic="回溯图论DP" data-search="乘积最大子数组找连续一段，使乘积最大（可能有负数和 0）。">
  <div class="head" onclick="tog(152)">
    <span class="num">0152</span>
    <span class="ttl">乘积最大子数组</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">回溯图论DP</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(152)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-152" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">找连续一段，使乘积最大（可能有负数和 0）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">和 53 题类似，但乘法有个陷阱——**一个很小的负数乘上另一个负数会变成很大的正数**。所以要同时维护「以当前结尾的最大值」和「最小值」，遇到负数时两者交换。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-152',this)">复制</button></div><pre id="code-152"><code>␀<span class="syn-num">1</span>␀ Solution:
    ␀<span class="syn-num">2</span>␀ maxProduct(␀<span class="syn-num">3</span>␀, nums):
        hi = lo = ans = nums[<span class="syn-num">0</span>]       ␀<span class="syn-num">0</span>␀
        ␀<span class="syn-num">4</span>␀ x ␀<span class="syn-num">5</span>␀ nums[<span class="syn-num">1</span>:]:
            old_hi, old_lo = hi, lo
            hi = ␀<span class="syn-num">7</span>␀(x, old_hi * x, old_lo * x)
            lo = ␀<span class="syn-num">8</span>␀(x, old_hi * x, old_lo * x)
            ans = ␀<span class="syn-num">9</span>␀(ans, hi)
        ␀<span class="syn-num">6</span>␀ ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">算 &#96;hi&#96; 和 &#96;lo&#96; 必须都用**同一组旧值**（所以先存 &#96;old_hi, old_lo&#96;）。如果先更新 &#96;hi&#96; 再用新 &#96;hi&#96; 去算 &#96;lo&#96;，结果就串了。另一种写法是 &#96;hi, lo = max(x, hi*x, lo*x), min(x, hi*x, lo*x)&#96;，利用 Python「右边先整体求值」一次赋值，效果相同。</div></div>
  </div>
</article>
<article class="card" data-num="153" data-diff="中等" data-topic="二分栈堆贪心" data-search="寻找旋转排序数组中的最小值在旋转过的升序数组里找最小的元素。">
  <div class="head" onclick="tog(153)">
    <span class="num">0153</span>
    <span class="ttl">寻找旋转排序数组中的最小值</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">二分栈堆贪心</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(153)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-153" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">在旋转过的升序数组里找最小的元素。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">拿 &#96;nums[mid]&#96; 和 &#96;nums[r]&#96; 比。如果 &#96;nums[mid] &gt; nums[r]&#96;，说明最小值一定在 mid 右边（因为左半是从大到小的跳变之前）；否则最小值在 mid 左边或就是 mid。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(log n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-153',this)">复制</button></div><pre id="code-153"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ findMin(␀<span class="syn-num">2</span>␀, nums):
        l, r = <span class="syn-num">0</span>, ␀<span class="syn-num">7</span>␀(nums) - <span class="syn-num">1</span>
        ␀<span class="syn-num">3</span>␀ l &lt; r:
            mid = (l + r) // <span class="syn-num">2</span>
            ␀<span class="syn-num">4</span>␀ nums[mid] &gt; nums[r]:
                l = mid + <span class="syn-num">1</span>
            ␀<span class="syn-num">5</span>␀:
                r = mid
        ␀<span class="syn-num">6</span>␀ nums[l]</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">和 &#96;nums[r]&#96; 比，不是 &#96;nums[l]&#96;；用 &#96;r = mid&#96; 保留 mid 本身。</div></div>
  </div>
</article>
<article class="card" data-num="155" data-diff="中等" data-topic="二分栈堆贪心" data-search="最小栈设计一个栈，除了常规操作，还要能 &#96;o(1)&#96; 返回当前最小值。">
  <div class="head" onclick="tog(155)">
    <span class="num">0155</span>
    <span class="ttl">最小栈</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">二分栈堆贪心</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(155)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-155" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">设计一个栈，除了常规操作，还要能 &#96;O(1)&#96; 返回当前最小值。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">再用一个「最小值栈」，只在**新值 ≤ 当前最小值**时压入。弹出时如果弹的正好是当前最小值，就从最小值栈也弹一个。这样两个栈顶永远对得上。 每个操作 &#96;O(1)&#96;，空间 &#96;O(n)&#96;。</div></div>
    <div class="meta"><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-155',this)">复制</button></div><pre id="code-155"><code>␀<span class="syn-num">0</span>␀ MinStack:
    ␀<span class="syn-num">1</span>␀ __init__(␀<span class="syn-num">2</span>␀):
        ␀<span class="syn-num">3</span>␀.stack = []
        ␀<span class="syn-num">4</span>␀.mins = []

    ␀<span class="syn-num">5</span>␀ push(␀<span class="syn-num">6</span>␀, val):
        ␀<span class="syn-num">7</span>␀.stack.append(val)
        ␀<span class="syn-num">8</span>␀ ␀<span class="syn-num">9</span>␀ ␀<span class="syn-num">10</span>␀.mins ␀<span class="syn-num">11</span>␀ val &lt;= ␀<span class="syn-num">12</span>␀.mins[-<span class="syn-num">1</span>]:
            ␀<span class="syn-num">13</span>␀.mins.append(val)

    ␀<span class="syn-num">14</span>␀ pop(␀<span class="syn-num">15</span>␀):
        x = ␀<span class="syn-num">16</span>␀.stack.pop()
        ␀<span class="syn-num">17</span>␀ x == ␀<span class="syn-num">18</span>␀.mins[-<span class="syn-num">1</span>]:
            ␀<span class="syn-num">19</span>␀.mins.pop()

    ␀<span class="syn-num">20</span>␀ top(␀<span class="syn-num">21</span>␀):
        ␀<span class="syn-num">22</span>␀ ␀<span class="syn-num">23</span>␀.stack[-<span class="syn-num">1</span>]

    ␀<span class="syn-num">24</span>␀ getMin(␀<span class="syn-num">25</span>␀):
        ␀<span class="syn-num">26</span>␀ ␀<span class="syn-num">27</span>␀.mins[-<span class="syn-num">1</span>]</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;push&#96; 里用 &#96;&lt;=&#96; 而不是 &#96;&lt;&#96;，否则重复的最小值弹出时会出错。</div></div>
  </div>
</article>
<article class="card" data-num="160" data-diff="简单" data-topic="链表与树" data-search="相交链表给两条链表的头，找它们第一个公共节点，没有返回 &#96;none&#96;。">
  <div class="head" onclick="tog(160)">
    <span class="num">0160</span>
    <span class="ttl">相交链表</span>
    <span class="badge b-简单">简单</span>
    <span class="topic">链表与树</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(160)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-160" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">给两条链表的头，找它们第一个公共节点，没有返回 &#96;None&#96;。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">两条链可能不一样长，同时从头走会错开。让两个指针各自走完自己那条后，**切换到另一条的头继续走**——这样两者走的总路程都是「A 长 + B 长」，必然在公共节点（或同时走到 &#96;None&#96;）相遇。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(m+n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-160',this)">复制</button></div><pre id="code-160"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ getIntersectionNode(␀<span class="syn-num">2</span>␀, headA, headB):
        a, b = headA, headB
        ␀<span class="syn-num">3</span>␀ a != b:
            a = a.next ␀<span class="syn-num">4</span>␀ a ␀<span class="syn-num">5</span>␀ ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀ ␀<span class="syn-num">8</span>␀ headB
            b = b.next ␀<span class="syn-num">9</span>␀ b ␀<span class="syn-num">10</span>␀ ␀<span class="syn-num">11</span>␀ ␀<span class="syn-num">12</span>␀ ␀<span class="syn-num">13</span>␀ headA
        ␀<span class="syn-num">14</span>␀ a</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">判断「走完了」用 &#96;a is None&#96;，切换后不能立刻又切回来；不相交时两者会同时变成 &#96;None&#96;，循环自然结束。</div></div>
  </div>
</article>
<article class="card" data-num="169" data-diff="简单" data-topic="数组与哈希" data-search="多数元素找出出现次数超过一半的元素。">
  <div class="head" onclick="tog(169)">
    <span class="num">0169</span>
    <span class="ttl">多数元素</span>
    <span class="badge b-简单">简单</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(169)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-169" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">找出出现次数超过一半的元素。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">**摩尔投票**。假设当前候选人是 &#96;cand&#96;，票数 &#96;cnt&#96;。遇到同样的就 +1，不同的就 -1，票归零就换候选人。因为真正的多数元素比「其他所有元素加起来」还多，两两抵消后它一定活到最后。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(1)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-169',this)">复制</button></div><pre id="code-169"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ majorityElement(␀<span class="syn-num">2</span>␀, nums):
        cand = ␀<span class="syn-num">3</span>␀
        cnt = <span class="syn-num">0</span>
        ␀<span class="syn-num">4</span>␀ x ␀<span class="syn-num">5</span>␀ nums:
            ␀<span class="syn-num">6</span>␀ cnt == <span class="syn-num">0</span>:
                cand = x
            cnt += <span class="syn-num">1</span> ␀<span class="syn-num">7</span>␀ x == cand ␀<span class="syn-num">8</span>␀ -<span class="syn-num">1</span>
        ␀<span class="syn-num">9</span>␀ cand</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">题目保证存在多数元素，所以不用再验一遍；不保证的话要补一次计数确认。</div></div>
  </div>
</article>
<article class="card" data-num="189" data-diff="中等" data-topic="数组与哈希" data-search="轮转数组把数组向右轮转 k 位，要求原地改。">
  <div class="head" onclick="tog(189)">
    <span class="num">0189</span>
    <span class="ttl">轮转数组</span>
    <span class="badge b-中等">中等</span>
    <span class="topic">数组与哈希</span>
    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(189)">○</button>
    <span class="arrow">▾</span>
  </div>
  <div class="body" id="body-189" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">把数组向右轮转 k 位，要求原地改。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">三次反转——整体反转、前 k 个反转、剩下反转。也可以用切片赋值一行搞定：</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-189',this)">复制</button></div><pre id="code-189"><code>␀<span class="syn-num">0</span>␀ Solution:
    ␀<span class="syn-num">1</span>␀ rotate(␀<span class="syn-num">2</span>␀, nums, k):

    <div class="blk"><div class="lbl">思路</div><div class="txt">&#96;dp[i]&#96; = 偷到第 i 间为止的最大金额。对第 i 间只有两种选择：偷（那么 i-1 不能偷，拿 &#96;dp[i-2] + nums[i]&#96;）或不偷（拿 &#96;dp[i-1]&#96;）。只依赖前两格，用两个变量滚动。</div></div>

    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-198',this)">复制</button></div><pre id="code-198"><code>␀<span class="syn-num">1</span>␀ Solution:

        ␀<span class="syn-num">4</span>␀ x ␀<span class="syn-num">5</span>␀ nums:
            prev2, prev1 = prev1, ␀<span class="syn-num">7</span>␀(prev1, prev2 + x)

</article>
<article class="card" data-num="199" data-diff="中等" data-topic="链表与树" data-search="二叉树的右视图从右边看这棵树，输出每层能看到的那个节点。">

  <div class="body" id="body-199" hidden>
    <div class="blk"><div class="lbl">题意</div><div class="txt">从右边看这棵树，输出每层能看到的那个节点。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">层序遍历，每一层取**最后一个**节点。循环开始前队列里正好是当前层所有节点，所以 &#96;q[-1]&#96; 就是它。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-199',this)">复制</button></div><pre id="code-199"><code>␀<span class="syn-num">0</span>␀ collections ␀<span class="syn-num">1</span>␀ deque

␀<span class="syn-num">2</span>␀ Solution:
    ␀<span class="syn-num">3</span>␀ rightSideView(␀<span class="syn-num">4</span>␀, root):
        ␀<span class="syn-num">5</span>␀ root ␀<span class="syn-num">6</span>␀ ␀<span class="syn-num">7</span>␀:
            ␀<span class="syn-num">8</span>␀ []
        q = deque([root])
        res = []
        ␀<span class="syn-num">9</span>␀ q:
            res.append(q[-<span class="syn-num">1</span>].val)
            ␀<span class="syn-num">10</span>␀ _ ␀<span class="syn-num">11</span>␀ ␀<span class="syn-num">21</span>␀(␀<span class="syn-num">22</span>␀(q)):
                node = q.popleft()
                ␀<span class="syn-num">12</span>␀ node.left ␀<span class="syn-num">13</span>␀ ␀<span class="syn-num">14</span>␀ ␀<span class="syn-num">15</span>␀:
                    q.append(node.left)
                ␀<span class="syn-num">16</span>␀ node.right ␀<span class="syn-num">17</span>␀ ␀<span class="syn-num">18</span>␀ ␀<span class="syn-num">19</span>␀:
                    q.append(node.right)
        ␀<span class="syn-num">20</span>␀ res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;q[-1]&#96; 要在 &#96;for&#96; 循环**之前**取，那时队列还没混入下一层。</div></div>
  </div>
</article>
<article class="card" data-num="200" data-diff="中等" data-topic="回溯图论DP" data-search="岛屿数量给 &#96;0/1&#96; 网格，&#96;1&#96; 连成一块算一个岛，求岛的数量（上下左右相邻）。">
