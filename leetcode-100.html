    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">矩阵每行升序，且下一行第一个数大于上一行最后一个数——整体其实就是一条拉直的有序数组。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">把「一维下标 mid」换算成「第 <code>mid // n</code> 行、第 <code>mid % n</code> 列」，然后照骨架 A 二分。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(log(mn))</code>；空间 <code>O(1)</code></span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(74)">逐行解释 ▸</button><button onclick="cp('code-74',this)">复制</button></span></div><pre id="code-74"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> searchMatrix(<span class="syn-kw">self</span>, matrix, target):
        m, n = <span class="syn-fn">len</span>(matrix), <span class="syn-fn">len</span>(matrix[<span class="syn-num">0</span>])
        l, r = <span class="syn-num">0</span>, m * n - <span class="syn-num">1</span>
        <span class="syn-kw">while</span> l &lt;= r:
            mid = (l + r) // <span class="syn-num">2</span>
            v = matrix[mid // n][mid % n]
            <span class="syn-kw">if</span> v == target:
                <span class="syn-kw">return</span> <span class="syn-kw">True</span>
            <span class="syn-kw">elif</span> v &lt; target:
                l = mid + <span class="syn-num">1</span>
            <span class="syn-kw">else</span>:
                r = mid - <span class="syn-num">1</span>
        <span class="syn-kw">return</span> <span class="syn-kw">False</span></code></pre></div>

    <div class="blk"><div class="lbl">思路</div><div class="txt">三指针荷兰国旗。<code>l</code> 是「下一个 0 该放的位置」，<code>r</code> 是「下一个 2 该放的位置」，<code>i</code> 是当前检查的。遇到 0 和 <code>l</code> 交换并让 <code>i</code> 前进；遇到 2 和 <code>r</code> 交换，但 <strong><code>i</code> 不能前进</strong>（换过来的还没检查过）。</div></div>

    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(75)">逐行解释 ▸</button><button onclick="cp('code-75',this)">复制</button></span></div><pre id="code-75"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> sortColors(<span class="syn-kw">self</span>, nums):
        l = i = <span class="syn-num">0</span>
        r = <span class="syn-fn">len</span>(nums) - <span class="syn-num">1</span>
        <span class="syn-kw">while</span> i &lt;= r:
            <span class="syn-kw">if</span> nums[i] == <span class="syn-num">0</span>:
                nums[l], nums[i] = nums[i], nums[l]
                l += <span class="syn-num">1</span>
                i += <span class="syn-num">1</span>
            <span class="syn-kw">elif</span> nums[i] == <span class="syn-num">2</span>:
                nums[r], nums[i] = nums[i], nums[r]
                r -= <span class="syn-num">1</span>
            <span class="syn-kw">else</span>:
                i += <span class="syn-num">1</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt"><code>i &lt;= r</code> 不是 <code>i &lt; len(nums)</code>；2 的分支里 <code>i</code> 不动。</div></div>

<article class="card" data-num="76" data-diff="困难" data-topic="数组与哈希" data-search="最小覆盖子串在 &#96;s&#96; 里找最短的一段，包含 &#96;t&#96; 里所有字符（含重复次数）。给定两个字符串 s 和 t，长度分别是 m 和 n，返回 s 中的 最短窗口 子串，使得该子串包含 t 中的每一个字符（包括重复字符）。如果没有这样的子串，返回空字符串 &quot;&quot;。

测试用例保证答案唯一。

示例 1：

输入：s = &quot;adobecodebanc&quot;, t = &quot;abc&quot;
输出：&quot;banc&quot;
解释：最小覆盖子串 &quot;banc&quot; 包含来自字符串 t 的 &#x27;a&#x27;、&#x27;b&#x27; 和 &#x27;c&#x27;。

示例 2：

输入：s = &quot;a&quot;, t = &quot;a&quot;

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/minimum-window-substring/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给定两个字符串 s 和 t，长度分别是 m 和 n，返回 s 中的 最短窗口 子串，使得该子串包含 t 中的每一个字符（包括重复字符）。如果没有这样的子串，返回空字符串 &quot;&quot;。

测试用例保证答案唯一。

示例 1：

输入：s = &quot;ADOBECODEBANC&quot;, t = &quot;ABC&quot;
输出：&quot;BANC&quot;
解释：最小覆盖子串 &quot;BANC&quot; 包含来自字符串 t 的 &#x27;A&#x27;、&#x27;B&#x27; 和 &#x27;C&#x27;。

示例 2：

输入：s = &quot;a&quot;, t = &quot;a&quot;
输出：&quot;a&quot;
解释：整个字符串 s 是最小覆盖子串。

示例 3:

输入: s = &quot;a&quot;, t = &quot;aa&quot;
输出: &quot;&quot;
解释: t 中两个字符 &#x27;a&#x27; 均应包含在 s 的子串中，
因此没有符合条件的子字符串，返回空字符串。

提示：

• m == s.length

• n == t.length

• 1 &lt;= m, n &lt;= 105

• s 和 t 由英文字母组成

进阶：你能设计一个在 O(m + n) 时间内解决此问题的算法吗？</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">在 <code>s</code> 里找最短的一段，包含 <code>t</code> 里所有字符（含重复次数）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt"><code>need</code> 记还缺什么，<code>window</code> 记窗口里有什么，<code>valid</code> 记「已经满足数量的字符种类数」。右端一直扩，一旦 <code>valid == len(need)</code> 说明覆盖了，就试着缩左端找更短的，并记录答案。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(字符集)</code></span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(76)">逐行解释 ▸</button><button onclick="cp('code-76',this)">复制</button></span></div><pre id="code-76"><code><span class="syn-kw">from</span> collections <span class="syn-kw">import</span> Counter

<span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> minWindow(<span class="syn-kw">self</span>, s, t):
        <span class="syn-kw">if</span> <span class="syn-kw">not</span> t <span class="syn-kw">or</span> <span class="syn-kw">not</span> s:
            <span class="syn-kw">return</span> <span class="syn-str">&quot;&quot;</span>
        need = Counter(t)
        window = {}
        valid = <span class="syn-num">0</span>
        l = <span class="syn-num">0</span>
        best_len = <span class="syn-fn">float</span>(<span class="syn-str">&quot;inf&quot;</span>)
        best = <span class="syn-str">&quot;&quot;</span>
        <span class="syn-kw">for</span> r, c <span class="syn-kw">in</span> <span class="syn-fn">enumerate</span>(s):
            <span class="syn-kw">if</span> c <span class="syn-kw">in</span> need:
                window[c] = window.get(c, <span class="syn-num">0</span>) + <span class="syn-num">1</span>
                <span class="syn-kw">if</span> window[c] == need[c]:
                    valid += <span class="syn-num">1</span>
            <span class="syn-kw">while</span> valid == <span class="syn-fn">len</span>(need):
                <span class="syn-kw">if</span> r - l + <span class="syn-num">1</span> &lt; best_len:
                    best_len = r - l + <span class="syn-num">1</span>
                    best = s[l:r + <span class="syn-num">1</span>]
                out = s[l]
                <span class="syn-kw">if</span> out <span class="syn-kw">in</span> need:
                    <span class="syn-kw">if</span> window[out] == need[out]:
                        valid -= <span class="syn-num">1</span>
                    window[out] -= <span class="syn-num">1</span>
                l += <span class="syn-num">1</span>
        <span class="syn-kw">return</span> best</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt"><code>valid</code> 只在「数量刚好达标」时 +1，超过不算；缩窗口时只在「刚好从达标掉下来」时 -1。切片 <code>s[l:r+1]</code> 每次花一段长度，数据大时能改成只记下标、最后切一次。</div></div>
  </div>
</article>

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">返回数组的所有子集（包括空集）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">对每个位置，决定「选它」还是「不选它」。用 <code>start</code> 保证只往後看，避免 <code>[1,2]</code> 和 <code>[2,1]</code> 重复。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n × 2ⁿ)</code>；空间 <code>O(n)</code></span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>

    <span class="syn-kw">def</span> subsets(<span class="syn-kw">self</span>, nums):
        res, path = [], []
        <span class="syn-kw">def</span> dfs(start):
            res.append(path[:])          <span class="syn-comment"># 每个节点都是一个合法子集</span>
            <span class="syn-kw">for</span> i <span class="syn-kw">in</span> <span class="syn-fn">range</span>(start, <span class="syn-fn">len</span>(nums)):
                path.append(nums[i])
                dfs(i + <span class="syn-num">1</span>)
                path.pop()
        dfs(<span class="syn-num">0</span>)
        <span class="syn-kw">return</span> res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt"><code>res.append</code> 放在函数开头（不是只在叶子），因为每个节点都算一个子集。</div></div>

<article class="card" data-num="79" data-diff="中等" data-topic="回溯图论DP" data-search="单词搜索在字符网格里，判断能否沿上下左右相邻的路径连出给定单词（同一格不能重复用）。给定一个 m x n 二维字符网格 board 和一个字符串单词 word 。如果 word 存在于网格中，返回 true ；否则，返回 false 。

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">在字符网格里，判断能否沿上下左右相邻的路径连出给定单词（同一格不能重复用）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">对每个格子当起点做 DFS。用一个临时标记 <code>&#x27;#&#x27;</code> 原地表示「这个格子本条路径已用过」，递归返回前恢复。这就是回溯里的「做选择 / 撤销」。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(mn × 3^L)</code>（L 是单词长度）；空间 <code>O(L)</code></span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(79)">逐行解释 ▸</button><button onclick="cp('code-79',this)">复制</button></span></div><pre id="code-79"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> exist(<span class="syn-kw">self</span>, board, word):
        m, n = <span class="syn-fn">len</span>(board), <span class="syn-fn">len</span>(board[<span class="syn-num">0</span>])
        dirs = [(<span class="syn-num">0</span>, <span class="syn-num">1</span>), (<span class="syn-num">0</span>, -<span class="syn-num">1</span>), (<span class="syn-num">1</span>, <span class="syn-num">0</span>), (-<span class="syn-num">1</span>, <span class="syn-num">0</span>)]
        <span class="syn-kw">def</span> dfs(r, c, k):
            <span class="syn-kw">if</span> board[r][c] != word[k]:
                <span class="syn-kw">return</span> <span class="syn-kw">False</span>
            <span class="syn-kw">if</span> k == <span class="syn-fn">len</span>(word) - <span class="syn-num">1</span>:
                <span class="syn-kw">return</span> <span class="syn-kw">True</span>
            tmp = board[r][c]
            board[r][c] = <span class="syn-str">&quot;#&quot;</span>                 <span class="syn-comment"># 标记已用</span>
            <span class="syn-kw">for</span> dr, dc <span class="syn-kw">in</span> dirs:
                nr, nc = r + dr, c + dc
                <span class="syn-kw">if</span> <span class="syn-num">0</span> &lt;= nr &lt; m <span class="syn-kw">and</span> <span class="syn-num">0</span> &lt;= nc &lt; n <span class="syn-kw">and</span> board[nr][nc] != <span class="syn-str">&quot;#&quot;</span>:
                    <span class="syn-kw">if</span> dfs(nr, nc, k + <span class="syn-num">1</span>):
                        board[r][c] = tmp
                        <span class="syn-kw">return</span> <span class="syn-kw">True</span>
            board[r][c] = tmp                 <span class="syn-comment"># 恢复现场</span>
            <span class="syn-kw">return</span> <span class="syn-kw">False</span>
        <span class="syn-kw">for</span> i <span class="syn-kw">in</span> <span class="syn-fn">range</span>(m):
            <span class="syn-kw">for</span> j <span class="syn-kw">in</span> <span class="syn-fn">range</span>(n):
                <span class="syn-kw">if</span> dfs(i, j, <span class="syn-num">0</span>):
                    <span class="syn-kw">return</span> <span class="syn-kw">True</span>
        <span class="syn-kw">return</span> <span class="syn-kw">False</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">无论成功还是失败，返回前都要把格子恢复；找到答案时也要恢复再 <code>return True</code>。</div></div>

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">找相邻柱子能框出的最大矩形面积。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">对每根柱子，需要知道「左边第一个比它矮的」和「右边第一个比它矮的」，两者之间就是以它的高度为高的最大宽度。单调栈（高度递增）能一次找出来：遇到比栈顶矮的柱子时，栈顶的右边界就确定了，弹出来算面积。末尾加一个高度 0 的<strong>哨兵</strong>，保证最后所有柱子都能被弹出。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(n)</code></span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(84)">逐行解释 ▸</button><button onclick="cp('code-84',this)">复制</button></span></div><pre id="code-84"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> largestRectangleArea(<span class="syn-kw">self</span>, heights):
        h = heights + [<span class="syn-num">0</span>]           <span class="syn-comment"># 哨兵</span>
        st = []
        ans = <span class="syn-num">0</span>
        <span class="syn-kw">for</span> i, x <span class="syn-kw">in</span> <span class="syn-fn">enumerate</span>(h):
            <span class="syn-kw">while</span> st <span class="syn-kw">and</span> h[st[-<span class="syn-num">1</span>]] &gt; x:
                height = h[st.pop()]
                left = st[-<span class="syn-num">1</span>] <span class="syn-kw">if</span> st <span class="syn-kw">else</span> -<span class="syn-num">1</span>

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/binary-tree-inorder-traversal/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给定一个二叉树的根节点 root ，返回 它的 中序 遍历 。

    <div class="blk"><div class="lbl">思路</div><div class="txt">递归三问——返回值：无（把值加进结果列表）；单层：先遍历左、记录自己、再遍历右；终止：节点是 <code>None</code> 就返回。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(h)</code></span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(94)">逐行解释 ▸</button><button onclick="cp('code-94',this)">复制</button></span></div><pre id="code-94"><code><span class="syn-kw">class</span> Solution:

            <span class="syn-kw">if</span> node <span class="syn-kw">is</span> <span class="syn-kw">None</span>:
                <span class="syn-kw">return</span>
            dfs(node.left)
            res.append(node.val)
            dfs(node.right)
        dfs(root)
        <span class="syn-kw">return</span> res</code></pre></div>

<article class="card" data-num="98" data-diff="中等" data-topic="链表与树" data-search="验证二叉搜索树判断一棵二叉树是不是合法的二叉搜索树。给你一个二叉树的根节点 root ，判断其是否是一个有效的二叉搜索树。

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/validate-binary-search-tree/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你一个二叉树的根节点 root ，判断其是否是一个有效的二叉搜索树。

有效 二叉搜索树定义如下：

• 节点的左子树只包含 严格小于 当前节点的数。

• 节点的右子树只包含 严格大于 当前节点的数。

• 所有左子树和右子树自身必须也是二叉搜索树。

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">判断一棵二叉树是不是合法的二叉搜索树。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">不能只比较「根和左右孩子」——某个深层节点可能违反和祖先的大小关系。给递归带上「允许的范围 <code>(lo, hi)</code>」，每往左走就把上界收紧到当前值，往右走就把下界收紧。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(h)</code></span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(98)">逐行解释 ▸</button><button onclick="cp('code-98',this)">复制</button></span></div><pre id="code-98"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> isValidBST(<span class="syn-kw">self</span>, root):
        <span class="syn-kw">def</span> dfs(node, lo, hi):
            <span class="syn-kw">if</span> node <span class="syn-kw">is</span> <span class="syn-kw">None</span>:
                <span class="syn-kw">return</span> <span class="syn-kw">True</span>
            <span class="syn-kw">if</span> <span class="syn-kw">not</span> (lo &lt; node.val &lt; hi):
                <span class="syn-kw">return</span> <span class="syn-kw">False</span>
            <span class="syn-kw">return</span> dfs(node.left, lo, node.val) <span class="syn-kw">and</span> dfs(node.right, node.val, hi)
        <span class="syn-kw">return</span> dfs(root, <span class="syn-fn">float</span>(<span class="syn-str">&quot;-inf&quot;</span>), <span class="syn-fn">float</span>(<span class="syn-str">&quot;inf&quot;</span>))</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">用 <code>float(&quot;±inf&quot;)</code> 做初始界，别用 <code>-1</code>/<code>10**9</code> 这种具体数（节点值可能超出）；比较是严格的 <code>&lt;</code>，BST 不允许相等。</div></div>

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/symmetric-tree/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你一个二叉树的根节点 root ， 检查它是否轴对称。

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">判断一棵树是否左右镜像对称。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">不是「判断左子树等于右子树」，而是「左子树的左 对 右子树的右、左子树的右 对 右子树的左」都相等。写一个比较两棵树的辅助函数。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(h)</code></span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(101)">逐行解释 ▸</button><button onclick="cp('code-101',this)">复制</button></span></div><pre id="code-101"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> isSymmetric(<span class="syn-kw">self</span>, root):
        <span class="syn-kw">def</span> same(a, b):
            <span class="syn-kw">if</span> a <span class="syn-kw">is</span> <span class="syn-kw">None</span> <span class="syn-kw">and</span> b <span class="syn-kw">is</span> <span class="syn-kw">None</span>:
                <span class="syn-kw">return</span> <span class="syn-kw">True</span>
            <span class="syn-kw">if</span> a <span class="syn-kw">is</span> <span class="syn-kw">None</span> <span class="syn-kw">or</span> b <span class="syn-kw">is</span> <span class="syn-kw">None</span>:
                <span class="syn-kw">return</span> <span class="syn-kw">False</span>
            <span class="syn-kw">return</span> a.val == b.val <span class="syn-kw">and</span> same(a.left, b.right) <span class="syn-kw">and</span> same(a.right, b.left)
        <span class="syn-kw">return</span> root <span class="syn-kw">is</span> <span class="syn-kw">None</span> <span class="syn-kw">or</span> same(root.left, root.right)</code></pre></div>

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">按层从上到下、每层从左到右输出。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">用队列（<code>deque</code>）。关键是<strong>先记下当前队列长度</strong>，这个长度就是当前层的节点数，然后只处理这么多个——即使处理过程中往队列里加了下一层的节点，也不会混进本层。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(n)</code></span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(102)">逐行解释 ▸</button><button onclick="cp('code-102',this)">复制</button></span></div><pre id="code-102"><code><span class="syn-kw">from</span> collections <span class="syn-kw">import</span> deque

<span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> levelOrder(<span class="syn-kw">self</span>, root):
        <span class="syn-kw">if</span> root <span class="syn-kw">is</span> <span class="syn-kw">None</span>:
            <span class="syn-kw">return</span> []
        q = deque([root])
        res = []
        <span class="syn-kw">while</span> q:
            level = []
            <span class="syn-kw">for</span> _ <span class="syn-kw">in</span> <span class="syn-fn">range</span>(<span class="syn-fn">len</span>(q)):
                node = q.popleft()
                level.append(node.val)
                <span class="syn-kw">if</span> node.left <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span>:
                    q.append(node.left)
                <span class="syn-kw">if</span> node.right <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span>:
                    q.append(node.right)
            res.append(level)
        <span class="syn-kw">return</span> res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt"><code>for _ in range(len(q))</code> 里的 <code>len(q)</code> 在循环开始时求值一次；用 <code>list.pop(0)</code> 会超时，必须 <code>deque</code>。</div></div>

  <div class="body" id="body-105" hidden>
    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/construct-binary-tree-from-preorder-and-inorder-traversal/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给定两个整数数组 preorder 和 inorder ，其中 preorder 是二叉树的先序遍历， inorder 是同一棵树的中序遍历，请构造二叉树并返回其根节点。

示例 1:

输入: preorder = [3,9,20,15,7], inorder = [9,3,15,20,7]
输出: [3,9,20,null,null,15,7]

示例 2:

输入: preorder = [-1], inorder = [-1]
输出: [-1]

提示:

• 1 &lt;= preorder.length &lt;= 3000

• inorder.length == preorder.length

• -3000 &lt;= preorder[i], inorder[i] &lt;= 3000

• preorder 和 inorder 均 无重复 元素

• inorder 均出现在 preorder

• preorder 保证 为二叉树的前序遍历序列

• inorder 保证 为二叉树的中序遍历序列</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">用前序和中序遍历结果构造出原来的二叉树。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">前序第一个一定是根。在中序里找到根的位置，左边就是左子树的节点、右边是右子树的节点；由左子树长度可以切出前序里两段的范围，递归构造。用字典记「值 → 中序下标」，避免每次线性查找。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(n)</code></span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(105)">逐行解释 ▸</button><button onclick="cp('code-105',this)">复制</button></span></div><pre id="code-105"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> buildTree(<span class="syn-kw">self</span>, preorder, inorder):
        idx = {v: i <span class="syn-kw">for</span> i, v <span class="syn-kw">in</span> <span class="syn-fn">enumerate</span>(inorder)}
        <span class="syn-kw">def</span> build(pl, pr, il, ir):
            <span class="syn-kw">if</span> pl &gt; pr:
                <span class="syn-kw">return</span> <span class="syn-kw">None</span>
            v = preorder[pl]
            k = idx[v]
            left_len = k - il
            root = TreeNode(v)
            root.left = build(pl + <span class="syn-num">1</span>, pl + left_len, il, k - <span class="syn-num">1</span>)
            root.right = build(pl + left_len + <span class="syn-num">1</span>, pr, k + <span class="syn-num">1</span>, ir)
            <span class="syn-kw">return</span> root
        <span class="syn-kw">return</span> build(<span class="syn-num">0</span>, <span class="syn-fn">len</span>(preorder) - <span class="syn-num">1</span>, <span class="syn-num">0</span>, <span class="syn-fn">len</span>(inorder) - <span class="syn-num">1</span>)</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt"><code>left_len = k - il</code>（中序里根左边的个数），前序里左段就是 <code>pl+1 ~ pl+left_len</code>，右段从 <code>pl+left_len+1</code> 开始。</div></div>
  </div>
</article>

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/convert-sorted-array-to-binary-search-tree/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你一个整数数组 nums ，其中元素已经按 升序 排列，请你将其转换为一棵 平衡 二叉搜索树。

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">把升序数组转成一棵高度平衡的 BST。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">取中间元素当根（两边节点数最接近，自然平衡），左半递归造左子树、右半递归造右子树。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(log n)</code></span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(108)">逐行解释 ▸</button><button onclick="cp('code-108',this)">复制</button></span></div><pre id="code-108"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> sortedArrayToBST(<span class="syn-kw">self</span>, nums):
        <span class="syn-kw">def</span> build(l, r):
            <span class="syn-kw">if</span> l &gt; r:
                <span class="syn-kw">return</span> <span class="syn-kw">None</span>
            mid = (l + r) // <span class="syn-num">2</span>
            root = TreeNode(nums[mid])
            root.left = build(l, mid - <span class="syn-num">1</span>)
            root.right = build(mid + <span class="syn-num">1</span>, r)
            <span class="syn-kw">return</span> root
        <span class="syn-kw">return</span> build(<span class="syn-num">0</span>, <span class="syn-fn">len</span>(nums) - <span class="syn-num">1</span>)</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt"><code>//</code> 不能写成 <code>/</code>，否则下标变小数会报错。</div></div>

<article class="card" data-num="114" data-diff="中等" data-topic="链表与树" data-search="二叉树展开为链表把树按前序顺序原地拉成一条「只有右孩子」的链。给你二叉树的根结点 root ，请你将它展开为一个单链表：

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/flatten-binary-tree-to-linked-list/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你二叉树的根结点 root ，请你将它展开为一个单链表：

• 展开后的单链表应该同样使用 TreeNode ，其中 right 子指针指向链表中下一个结点，而左子指针始终为 null 。

示例 1：

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">把树按前序顺序原地拉成一条「只有右孩子」的链。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">对每个节点，如果它有左子树，就把左子树接到「右子树之前」——具体做法：找到左子树最右边的节点（前序里左子树的最后一个），把原来的右子树挂到它的 <code>right</code> 上，然后把整棵左子树搬到 <code>right</code>，左孩子置空。一路往右走。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(1)</code></span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(114)">逐行解释 ▸</button><button onclick="cp('code-114',this)">复制</button></span></div><pre id="code-114"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> flatten(<span class="syn-kw">self</span>, root):
        cur = root
        <span class="syn-kw">while</span> cur <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span>:
            <span class="syn-kw">if</span> cur.left <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span>:
                pre = cur.left
                <span class="syn-kw">while</span> pre.right <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span>:
                    pre = pre.right
                pre.right = cur.right
                cur.right = cur.left
                cur.left = <span class="syn-kw">None</span>
            cur = cur.right</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt"><code>cur.left = None</code> 不能漏，否则不是「链表」；找 <code>pre</code> 时只沿 <code>right</code> 走。</div></div>
  </div>
</article>

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">生成前 numRows 行，每个数等于上一行左右两数之和。 时间 <code>O(n²)</code>，空间 <code>O(n²)</code>。<strong>易错</strong>：每行首尾都是 1，中间才用加法；<code>range(1, i)</code> 的右端取不到，正好不算最后一个。</div></div>
    
    <div class="meta"><span class="cost">时间 <code>O(n²)</code>；空间 <code>O(n²)</code></span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(118)">逐行解释 ▸</button><button onclick="cp('code-118',this)">复制</button></span></div><pre id="code-118"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> generate(<span class="syn-kw">self</span>, numRows):
        res = [[<span class="syn-num">1</span>]]
        <span class="syn-kw">for</span> i <span class="syn-kw">in</span> <span class="syn-fn">range</span>(<span class="syn-num">1</span>, numRows):
            prev = res[-<span class="syn-num">1</span>]
            row = [<span class="syn-num">1</span>] * (i + <span class="syn-num">1</span>)
            <span class="syn-kw">for</span> j <span class="syn-kw">in</span> <span class="syn-fn">range</span>(<span class="syn-num">1</span>, i):
                row[j] = prev[j - <span class="syn-num">1</span>] + prev[j]
            res.append(row)
        <span class="syn-kw">return</span> res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">每行首尾都是 1，中间才用加法；<code>range(1, i)</code> 的右端取不到，正好不算最后一个。</div></div>
  </div>
</article>

你只能选择 某一天 买入这只股票，并选择在 未来的某一个不同的日子 卖出该股票。设计一个算法来计算你所能获取的最大利润。

注意利润不能是 7-1 = 6, 因为卖出价格需要大于买入价格；同时，你不能在买入前卖出股票。

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">只能买卖一次，求最大利润。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">扫一遍，始终记住「到今天为止最低的买入价」，然后算「今天卖出能赚多少」，取最大。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(1)</code></span><span class="src">讲解见 L07-search-stack-heap.md</span></div>

<article class="card" data-num="124" data-diff="困难" data-topic="链表与树" data-search="二叉树中的最大路径和任意一条路径（可以从任意节点到任意节点）的最大节点值之和，可能有负数。二叉树中的 路径 被定义为一条节点序列，序列中每对相邻节点之间都存在一条边。同一个节点在一条路径序列中 至多出现一次 。该路径 至少包含一个 节点，且不一定经过根节点。

给你一个二叉树的根节点 root ，返回其 最大路径和 。

示例 1：

输入：root = [1,2,3]

示例 2：

输入：root = [-10,9,20,null,null,15,7]
输出：42
解释：最优路径是 15 -&gt; 20 -&gt; 7 ，路径和为 15 + 20 + 7 = 42

  <div class="body" id="body-124" hidden>
    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/binary-tree-maximum-path-sum/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">二叉树中的 路径 被定义为一条节点序列，序列中每对相邻节点之间都存在一条边。同一个节点在一条路径序列中 至多出现一次 。该路径 至少包含一个 节点，且不一定经过根节点。

路径和 是路径中各节点值的总和。

给你一个二叉树的根节点 root ，返回其 最大路径和 。

示例 1：

输入：root = [1,2,3]
输出：6
解释：最优路径是 2 -&gt; 1 -&gt; 3 ，路径和为 2 + 1 + 3 = 6

示例 2：

输入：root = [-10,9,20,null,null,15,7]
输出：42
解释：最优路径是 15 -&gt; 20 -&gt; 7 ，路径和为 15 + 20 + 7 = 42

提示：

• 树中节点数目范围是 [1, 3 * 104]

• -1000 &lt;= Node.val &lt;= 1000</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">任意一条路径（可以从任意节点到任意节点）的最大节点值之和，可能有负数。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">递归函数返回「从当前节点<strong>往下走单边</strong>能给父节点贡献的最大值」——负值贡献直接砍成 0（不要也罢）。同时在每层用「左贡献 + 右贡献 + 自己」更新全局答案，那条是穿过当前节点的完整路径，不能再往上延伸。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(h)</code></span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(124)">逐行解释 ▸</button><button onclick="cp('code-124',this)">复制</button></span></div><pre id="code-124"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> maxPathSum(<span class="syn-kw">self</span>, root):
        <span class="syn-kw">self</span>.ans = <span class="syn-fn">float</span>(<span class="syn-str">&quot;-inf&quot;</span>)
        <span class="syn-kw">def</span> dfs(node):
            <span class="syn-kw">if</span> node <span class="syn-kw">is</span> <span class="syn-kw">None</span>:
                <span class="syn-kw">return</span> <span class="syn-num">0</span>
            l = <span class="syn-fn">max</span>(<span class="syn-num">0</span>, dfs(node.left))
            r = <span class="syn-fn">max</span>(<span class="syn-num">0</span>, dfs(node.right))
            <span class="syn-kw">self</span>.ans = <span class="syn-fn">max</span>(<span class="syn-kw">self</span>.ans, node.val + l + r)
            <span class="syn-kw">return</span> node.val + <span class="syn-fn">max</span>(l, r)
        dfs(root)
        <span class="syn-kw">return</span> <span class="syn-kw">self</span>.ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">返回值是<strong>单边</strong>（<code>node.val + max(l,r)</code>），全局更新用<strong>双边</strong>（<code>+ l + r</code>），两者别混；初始答案必须是 <code>-inf</code>，全负数树才对。</div></div>
  </div>
</article>
<article class="card" data-num="128" data-diff="中等" data-topic="数组与哈希" data-search="最长连续序列找出数组里最长的一段连续数字的长度，如 &#96;[100,4,200,1,3,2]&#96; → &#96;4&#96;（1,2,3,4）。要求 &#96;o(n)&#96;。给定一个未排序的整数数组 nums ，找出数字连续的最长序列（不要求序列元素在原数组中连续）的长度。

输入：nums = [100,4,200,1,3,2]

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/longest-consecutive-sequence/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给定一个未排序的整数数组 nums ，找出数字连续的最长序列（不要求序列元素在原数组中连续）的长度。

请你设计并实现时间复杂度为 O(n) 的算法解决此问题。

示例 1：

输入：nums = [100,4,200,1,3,2]
输出：4
解释：最长数字连续序列是 [1, 2, 3, 4]。它的长度为 4。

示例 2：

输入：nums = [0,3,7,2,5,8,4,6,0,1]
输出：9

提示：

• -109 &lt;= nums[i] &lt;= 109</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">找出数组里最长的一段连续数字的长度，如 <code>[100,4,200,1,3,2]</code> → <code>4</code>（1,2,3,4）。要求 <code>O(n)</code>。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">先全部放进集合（查存在一瞬间）。然后<strong>只从「一段的起点」开始数</strong>——如果 <code>x-1</code> 也在集合里，说明 x 不是起点，跳过它。这样每个数字最多被内层循环访问一次，整体仍是 <code>O(n)</code>。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(n)</code></span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(128)">逐行解释 ▸</button><button onclick="cp('code-128',this)">复制</button></span></div><pre id="code-128"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> longestConsecutive(<span class="syn-kw">self</span>, nums):
        s = <span class="syn-fn">set</span>(nums)
        best = <span class="syn-num">0</span>
        <span class="syn-kw">for</span> x <span class="syn-kw">in</span> s:
            <span class="syn-kw">if</span> x - <span class="syn-num">1</span> <span class="syn-kw">not</span> <span class="syn-kw">in</span> s:          <span class="syn-comment"># 只从起点出发</span>
                y = x
                <span class="syn-kw">while</span> y + <span class="syn-num">1</span> <span class="syn-kw">in</span> s:
                    y += <span class="syn-num">1</span>
                best = <span class="syn-fn">max</span>(best, y - x + <span class="syn-num">1</span>)
        <span class="syn-kw">return</span> best</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">漏掉 <code>if x - 1 not in s</code>，每个数都会把整段重新数一遍，退化成 <code>O(n²)</code>。</div></div>
  </div>
</article>

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/palindrome-partitioning/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你一个字符串 s，请你将 s 分割成一些 子串，使每个子串都是 回文串 。返回 s 所有可能的分割方案。

示例 1：

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">把字符串切成若干段，要求每段都是回文，返回所有切法。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt"><code>start</code> 表示「从哪开始切下一段」，枚举这一段的所有可能终点 <code>end</code>，只有 <code>s[start:end]</code> 是回文才继续往下切。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n × 2ⁿ)</code>；空间 <code>O(n)</code></span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(131)">逐行解释 ▸</button><button onclick="cp('code-131',this)">复制</button></span></div><pre id="code-131"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> partition(<span class="syn-kw">self</span>, s):
        res, path = [], []
        n = <span class="syn-fn">len</span>(s)
        <span class="syn-kw">def</span> dfs(start):
            <span class="syn-kw">if</span> start == n:
                res.append(path[:])
                <span class="syn-kw">return</span>
            <span class="syn-kw">for</span> end <span class="syn-kw">in</span> <span class="syn-fn">range</span>(start + <span class="syn-num">1</span>, n + <span class="syn-num">1</span>):
                t = s[start:end]
                <span class="syn-kw">if</span> t == t[::-<span class="syn-num">1</span>]:
                    path.append(t)
                    dfs(end)
                    path.pop()
        dfs(<span class="syn-num">0</span>)
        <span class="syn-kw">return</span> res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt"><code>end</code> 要取到 <code>n</code>（<code>range(start+1, n+1)</code>），因为切片右端取不到；<code>t == t[::-1]</code> 每次切片花一段时间，数据大时可预先算好回文表。</div></div>
  </div>
</article>
<article class="card" data-num="136" data-diff="简单" data-topic="数组与哈希" data-search="只出现一次的数字所有数都出现两次，只有一个出现一次，找出来。给你一个 非空 整数数组 nums ，除了某个元素只出现一次以外，其余每个元素均出现两次。找出那个只出现了一次的元素。

提示：

• 1 &lt;= nums.length &lt;= 3 * 104

  <div class="body" id="body-136" hidden>
    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/single-number/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你一个 非空 整数数组 nums ，除了某个元素只出现一次以外，其余每个元素均出现两次。找出那个只出现了一次的元素。

你必须设计并实现线性时间复杂度的算法来解决此问题，且该算法只使用常量额外空间。

示例 1 ：

输入：nums = [2,2,1]

输出：1

示例 2 ：

输入：nums = [4,1,2,1,2]

输出：4

示例 3 ：

输入：nums = [1]

输出：1

提示：

• 1 &lt;= nums.length &lt;= 3 * 104

• -3 * 104 &lt;= nums[i] &lt;= 3 * 104

• 除了某个元素只出现一次以外，其余每个元素均出现两次。</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">所有数都出现两次，只有一个出现一次，找出来。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt"><code>a ^ a = 0</code>、<code>a ^ 0 = a</code>，而且异或满足交换律。把全部数异或起来，成对的全抵消，剩下的就是答案。<code>^</code> 是异或，不是乘方（乘方是 <code>**</code>）。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(1)</code></span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(136)">逐行解释 ▸</button><button onclick="cp('code-136',this)">复制</button></span></div><pre id="code-136"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> singleNumber(<span class="syn-kw">self</span>, nums):
        ans = <span class="syn-num">0</span>
        <span class="syn-kw">for</span> x <span class="syn-kw">in</span> nums:
            ans ^= x
        <span class="syn-kw">return</span> ans</code></pre></div>

</article>
<article class="card" data-num="138" data-diff="中等" data-topic="链表与树" data-search="随机链表的复制每个节点除了 &#96;next&#96; 还有一个 &#96;random&#96; 指向任意节点，要深拷贝整条链。给你一个长度为 n 的链表，每个节点包含一个额外增加的随机指针 random ，该指针可以指向链表中的任何节点或空节点。

例如，如果原链表中有 x 和 y 两个节点，其中 x.random --&gt; y 。那么在复制链表中对应的两个节点 x 和 y ，同样有 x.random --&gt; y 。

返回复制链表的头节点。

用一个由 n 个节点组成的链表来表示输入/输出中的链表。每个节点用一个 [val, random_index] 表示：

• random_index：随机指针指向的节点索引（范围从 0 到 n-1）；如果不指向任何节点，则为 null 。

示例 1：

输入：head = [[7,null],[13,0],[11,4],[10,2],[1,0]]
输出：[[7,null],[13,0],[11,4],[10,2],[1,0]]

示例 2：

输入：head = [[1,1],[2,1]]
输出：[[1,1],[2,1]]

示例 3：

输入：head = [[3,null],[3,0],[3,null]]

提示：

• node.random 为 null 或指向链表中的节点。">

  <div class="body" id="body-138" hidden>
    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/copy-list-with-random-pointer/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你一个长度为 n 的链表，每个节点包含一个额外增加的随机指针 random ，该指针可以指向链表中的任何节点或空节点。

构造这个链表的 深拷贝。 深拷贝应该正好由 n 个 全新 节点组成，其中每个新节点的值都设为其对应的原节点的值。新节点的 next 指针和 random 指针也都应指向复制链表中的新节点，并使原链表和复制链表中的这些指针能够表示相同的链表状态。复制链表中的指针都不应指向原链表中的节点 。

例如，如果原链表中有 X 和 Y 两个节点，其中 X.random --&gt; Y 。那么在复制链表中对应的两个节点 x 和 y ，同样有 x.random --&gt; y 。

返回复制链表的头节点。

用一个由 n 个节点组成的链表来表示输入/输出中的链表。每个节点用一个 [val, random_index] 表示：

• val：一个表示 Node.val 的整数。

    <span class="syn-kw">def</span> copyRandomList(<span class="syn-kw">self</span>, head):
        <span class="syn-kw">if</span> head <span class="syn-kw">is</span> <span class="syn-kw">None</span>:
            <span class="syn-kw">return</span> <span class="syn-kw">None</span>
        d = {<span class="syn-kw">None</span>: <span class="syn-kw">None</span>}
        cur = head
        <span class="syn-kw">while</span> cur <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span>:
            d[cur] = Node(cur.val)      <span class="syn-comment"># Node 是平台定义的类型</span>
            cur = cur.next
        cur = head
        <span class="syn-kw">while</span> cur <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span>:

<article class="card" data-num="146" data-diff="中等" data-topic="链表与树" data-search="lru 缓存设计缓存：&#96;get&#96; / &#96;put&#96; 都是 &#96;o(1)&#96;，容量满时淘汰最久没用过的。请你设计并实现一个满足 lru (最近最少使用) 缓存 约束的数据结构。

实现 lrucache 类：

• lrucache(int capacity) 以 正整数 作为容量 capacity 初始化 lru 缓存

• int get(int key) 如果关键字 key 存在于缓存中，则返回关键字的值，否则返回 -1 。

• void put(int key, int value) 如果关键字 key 已经存在，则变更其数据值 value ；如果不存在，则向缓存中插入该组 key-value 。如果插入操作导致关键字数量超过 capacity ，则应该 逐出 最久未使用的关键字。

函数 get 和 put 必须以 o(1) 的平均时间复杂度运行。

示例：

输入
[&quot;lrucache&quot;, &quot;put&quot;, &quot;put&quot;, &quot;get&quot;, &quot;put&quot;, &quot;get&quot;, &quot;put&quot;, &quot;get&quot;, &quot;get&quot;, &quot;get&quot;]
[[2], [1, 1], [2, 2], [1], [3, 3], [2], [4, 4], [1], [3], [4]]
输出
[null, null, null, 1, null, -1, null, -1, 3, 4]

解释
lrucache lrucache = new lrucache(2);
lrucache.put(1, 1); // 缓存是 {1=1}

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/lru-cache/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">请你设计并实现一个满足 LRU (最近最少使用) 缓存 约束的数据结构。

实现 LRUCache 类：

• LRUCache(int capacity) 以 正整数 作为容量 capacity 初始化 LRU 缓存

• int get(int key) 如果关键字 key 存在于缓存中，则返回关键字的值，否则返回 -1 。

• void put(int key, int value) 如果关键字 key 已经存在，则变更其数据值 value ；如果不存在，则向缓存中插入该组 key-value 。如果插入操作导致关键字数量超过 capacity ，则应该 逐出 最久未使用的关键字。

函数 get 和 put 必须以 O(1) 的平均时间复杂度运行。

示例：

输入
[&quot;LRUCache&quot;, &quot;put&quot;, &quot;put&quot;, &quot;get&quot;, &quot;put&quot;, &quot;get&quot;, &quot;put&quot;, &quot;get&quot;, &quot;get&quot;, &quot;get&quot;]
[[2], [1, 1], [2, 2], [1], [3, 3], [2], [4, 4], [1], [3], [4]]
输出
[null, null, null, 1, null, -1, null, -1, 3, 4]

解释
LRUCache lRUCache = new LRUCache(2);
lRUCache.put(1, 1); // 缓存是 {1=1}
lRUCache.put(2, 2); // 缓存是 {1=1, 2=2}
lRUCache.get(1); // 返回 1
lRUCache.put(3, 3); // 该操作会使得关键字 2 作废，缓存是 {1=1, 3=3}
lRUCache.get(2); // 返回 -1 (未找到)
lRUCache.put(4, 4); // 该操作会使得关键字 1 作废，缓存是 {4=4, 3=3}
lRUCache.get(1); // 返回 -1 (未找到)
lRUCache.get(3); // 返回 3
lRUCache.get(4); // 返回 4

提示：

• 1 &lt;= capacity &lt;= 3000

• 0 &lt;= key &lt;= 10000

• 0 &lt;= value &lt;= 105

• 最多调用 2 * 105 次 get 和 put</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">设计缓存：<code>get</code> / <code>put</code> 都是 <code>O(1)</code>，容量满时淘汰最久没用过的。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">哈希表保证查找快，还要维护「谁最旧」。<code>OrderedDict</code> 正好提供了 <code>move_to_end()</code>（标记为最新）和 <code>popitem(last=False)</code>（弹出最旧）。 两个操作均 <code>O(1)</code>，空间 <code>O(capacity)</code>。</div></div>
    <div class="meta"><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(146)">逐行解释 ▸</button><button onclick="cp('code-146',this)">复制</button></span></div><pre id="code-146"><code><span class="syn-kw">from</span> collections <span class="syn-kw">import</span> OrderedDict

<span class="syn-kw">class</span> LRUCache:
    <span class="syn-kw">def</span> __init__(<span class="syn-kw">self</span>, capacity):
        <span class="syn-kw">self</span>.d = OrderedDict()
        <span class="syn-kw">self</span>.cap = capacity

    <span class="syn-kw">def</span> get(<span class="syn-kw">self</span>, key):
        <span class="syn-kw">if</span> key <span class="syn-kw">not</span> <span class="syn-kw">in</span> <span class="syn-kw">self</span>.d:
            <span class="syn-kw">return</span> -<span class="syn-num">1</span>
        <span class="syn-kw">self</span>.d.move_to_end(key)
        <span class="syn-kw">return</span> <span class="syn-kw">self</span>.d[key]

    <span class="syn-kw">def</span> put(<span class="syn-kw">self</span>, key, value):
        <span class="syn-kw">if</span> key <span class="syn-kw">in</span> <span class="syn-kw">self</span>.d:
            <span class="syn-kw">self</span>.d.move_to_end(key)
        <span class="syn-kw">self</span>.d[key] = value
        <span class="syn-kw">if</span> <span class="syn-fn">len</span>(<span class="syn-kw">self</span>.d) &gt; <span class="syn-kw">self</span>.cap:
            <span class="syn-kw">self</span>.d.popitem(last=<span class="syn-kw">False</span>)</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt"><code>get</code> 命中时也要 <code>move_to_end</code>，否则「最近使用」的信息就错了。面试有时会要求手写双向链表 + 哈希表，那时不能用这个偷懒版，但 LeetCode 上提交没问题。</div></div>
  </div>
</article>

    <div class="blk"><div class="lbl">思路</div><div class="txt">归并排序。用快慢指针找到中点、把链表断成两半，各自递归排序，再用 21 题的「合并两个有序链表」拼回去。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n log n)</code>；空间 <code>O(log n)</code></span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(148)">逐行解释 ▸</button><button onclick="cp('code-148',this)">复制</button></span></div><pre id="code-148"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> sortList(<span class="syn-kw">self</span>, head):
        <span class="syn-kw">if</span> head <span class="syn-kw">is</span> <span class="syn-kw">None</span> <span class="syn-kw">or</span> head.next <span class="syn-kw">is</span> <span class="syn-kw">None</span>:
            <span class="syn-kw">return</span> head
        slow = fast = head
        prev = <span class="syn-kw">None</span>
        <span class="syn-kw">while</span> fast <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span> <span class="syn-kw">and</span> fast.next <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span>:
            prev = slow
            slow = slow.next
            fast = fast.next.next
        prev.next = <span class="syn-kw">None</span>                <span class="syn-comment"># 断成两半</span>
        left = <span class="syn-kw">self</span>.sortList(head)
        right = <span class="syn-kw">self</span>.sortList(slow)
        <span class="syn-kw">return</span> <span class="syn-kw">self</span>.merge(left, right)

    <span class="syn-kw">def</span> merge(<span class="syn-kw">self</span>, l1, l2):
        dummy = cur = ListNode(<span class="syn-num">0</span>)
        <span class="syn-kw">while</span> l1 <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span> <span class="syn-kw">and</span> l2 <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span>:
            <span class="syn-kw">if</span> l1.val &lt;= l2.val:
                cur.next, l1 = l1, l1.next
            <span class="syn-kw">else</span>:
                cur.next, l2 = l2, l2.next
            cur = cur.next
        cur.next = l1 <span class="syn-kw">if</span> l1 <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span> <span class="syn-kw">else</span> l2
        <span class="syn-kw">return</span> dummy.next</code></pre></div>

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">找连续一段，使乘积最大（可能有负数和 0）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">和 53 题类似，但乘法有个陷阱——<strong>一个很小的负数乘上另一个负数会变成很大的正数</strong>。所以要同时维护「以当前结尾的最大值」和「最小值」，遇到负数时两者交换。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(1)</code></span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(152)">逐行解释 ▸</button><button onclick="cp('code-152',this)">复制</button></span></div><pre id="code-152"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> maxProduct(<span class="syn-kw">self</span>, nums):
        hi = lo = ans = nums[<span class="syn-num">0</span>]       <span class="syn-comment"># 以当前位置结尾的最大/最小乘积</span>
        <span class="syn-kw">for</span> x <span class="syn-kw">in</span> nums[<span class="syn-num">1</span>:]:
            old_hi, old_lo = hi, lo
            hi = <span class="syn-fn">max</span>(x, old_hi * x, old_lo * x)
            lo = <span class="syn-fn">min</span>(x, old_hi * x, old_lo * x)
            ans = <span class="syn-fn">max</span>(ans, hi)
        <span class="syn-kw">return</span> ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">算 <code>hi</code> 和 <code>lo</code> 必须都用<strong>同一组旧值</strong>（所以先存 <code>old_hi, old_lo</code>）。如果先更新 <code>hi</code> 再用新 <code>hi</code> 去算 <code>lo</code>，结果就串了。另一种写法是 <code>hi, lo = max(x, hi*x, lo*x), min(x, hi*x, lo*x)</code>，利用 Python「右边先整体求值」一次赋值，效果相同。</div></div>

    <div class="blk"><div class="lbl">思路</div><div class="txt">再用一个「最小值栈」，只在<strong>新值 ≤ 当前最小值</strong>时压入。弹出时如果弹的正好是当前最小值，就从最小值栈也弹一个。这样两个栈顶永远对得上。 每个操作 <code>O(1)</code>，空间 <code>O(n)</code>。</div></div>

    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(155)">逐行解释 ▸</button><button onclick="cp('code-155',this)">复制</button></span></div><pre id="code-155"><code><span class="syn-kw">class</span> MinStack:
    <span class="syn-kw">def</span> __init__(<span class="syn-kw">self</span>):
        <span class="syn-kw">self</span>.stack = []
        <span class="syn-kw">self</span>.mins = []

    <span class="syn-kw">def</span> push(<span class="syn-kw">self</span>, val):
        <span class="syn-kw">self</span>.stack.append(val)
        <span class="syn-kw">if</span> <span class="syn-kw">not</span> <span class="syn-kw">self</span>.mins <span class="syn-kw">or</span> val &lt;= <span class="syn-kw">self</span>.mins[-<span class="syn-num">1</span>]:
            <span class="syn-kw">self</span>.mins.append(val)

    <span class="syn-kw">def</span> pop(<span class="syn-kw">self</span>):
        x = <span class="syn-kw">self</span>.stack.pop()
        <span class="syn-kw">if</span> x == <span class="syn-kw">self</span>.mins[-<span class="syn-num">1</span>]:
            <span class="syn-kw">self</span>.mins.pop()

    <span class="syn-kw">def</span> top(<span class="syn-kw">self</span>):
        <span class="syn-kw">return</span> <span class="syn-kw">self</span>.stack[-<span class="syn-num">1</span>]

    <span class="syn-kw">def</span> getMin(<span class="syn-kw">self</span>):
        <span class="syn-kw">return</span> <span class="syn-kw">self</span>.mins[-<span class="syn-num">1</span>]</code></pre></div>

<article class="card" data-num="160" data-diff="简单" data-topic="链表与树" data-search="相交链表给两条链表的头，找它们第一个公共节点，没有返回 &#96;none&#96;。给你两个单链表的头节点 heada 和 headb ，请你找出并返回两个单链表相交的起始节点。如果两个链表不存在相交节点，返回 null 。

评测系统 的输入如下（你设计的程序 不适用 此输入）：

• intersectval - 相交的起始节点的值。如果不存在相交节点，这一值为 0

评测系统将根据这些输入创建链式数据结构，并将两个头节点 heada 和 headb 传递给你的程序。如果程序能够正确返回相交节点，那么你的解决方案将被 视作正确答案 。

示例 1：

输入：intersectval = 8, lista = [4,1,8,4,5], listb = [5,6,1,8,4,5], skipa = 2, skipb = 3
输出：intersected at &#x27;8&#x27;
解释：相交节点的值为 8 （注意，如果两个链表相交则不能为 0）。
从各自的表头开始算起，链表 a 为 [4,1,8,4,5]，链表 b 为 [5,6,1,8,4,5]。
在 a 中，相交节点前有 2 个节点；在 b 中，相交节点前有 3 个节点。
— 请注意相交节点的值不为 1，因为在链表 a 和链表 b 之中值为 1 的节点 (a 中第二个节点和 b 中第三个节点) 是不同的节点。换句话说，它们在内存中指向两个不同的位置，而链表 a 和链表 b 中值为 8 的节点 (a 中第三个节点，b 中第四个节点) 在内存中指向相同的位置。

示例 2：

输入：intersectval = 2, lista = [1,9,1,2,4], listb = [3,2,4], skipa = 3, skipb = 1
输出：intersected at &#x27;2&#x27;
解释：相交节点的值为 2 （注意，如果两个链表相交则不能为 0）。
从各自的表头开始算起，链表 a 为 [1,9,1,2,4]，链表 b 为 [3,2,4]。
在 a 中，相交节点前有 3 个节点；在 b 中，相交节点前有 1 个节点。

示例 3：

输入：intersectval = 0, lista = [2,6,4], listb = [1,5], skipa = 3, skipb = 2
输出：no intersection
解释：从各自的表头开始算起，链表 a 为 [2,6,4]，链表 b 为 [1,5]。
由于这两个链表不相交，所以 intersectval 必须为 0，而 skipa 和 skipb 可以是任意值。
这两个链表不相交，因此返回 null 。

提示：

• lista 中节点数目为 m

• listb 中节点数目为 n

• 1 &lt;= m, n &lt;= 3 * 104

• 1 &lt;= node.val &lt;= 105

• 0 &lt;= skipa &lt;= m

• 0 &lt;= skipb &lt;= n

• 如果 lista 和 listb 没有交点，intersectval 为 0

• 如果 lista 和 listb 有交点，intersectval == lista[skipa] == listb[skipb]

进阶：你能否设计一个时间复杂度 o(m + n) 、仅用 o(1) 内存的解决方案？">

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/intersection-of-two-linked-lists/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你两个单链表的头节点 headA 和 headB ，请你找出并返回两个单链表相交的起始节点。如果两个链表不存在相交节点，返回 null 。

    <div class="blk"><div class="lbl">思路</div><div class="txt">两条链可能不一样长，同时从头走会错开。让两个指针各自走完自己那条后，<strong>切换到另一条的头继续走</strong>——这样两者走的总路程都是「A 长 + B 长」，必然在公共节点（或同时走到 <code>None</code>）相遇。</div></div>

            a = a.next <span class="syn-kw">if</span> a <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span> <span class="syn-kw">else</span> headB
            b = b.next <span class="syn-kw">if</span> b <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span> <span class="syn-kw">else</span> headA
        <span class="syn-kw">return</span> a</code></pre></div>

<article class="card" data-num="169" data-diff="简单" data-topic="数组与哈希" data-search="多数元素找出出现次数超过一半的元素。给定一个大小为 n 的数组 nums ，返回其中的多数元素。多数元素是指在数组中出现次数 大于 ⌊ n/2 ⌋ 的元素。

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/majority-element/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给定一个大小为 n 的数组 nums ，返回其中的多数元素。多数元素是指在数组中出现次数 大于 ⌊ n/2 ⌋ 的元素。

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">找出出现次数超过一半的元素。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt"><strong>摩尔投票</strong>。假设当前候选人是 <code>cand</code>，票数 <code>cnt</code>。遇到同样的就 +1，不同的就 -1，票归零就换候选人。因为真正的多数元素比「其他所有元素加起来」还多，两两抵消后它一定活到最后。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(1)</code></span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(169)">逐行解释 ▸</button><button onclick="cp('code-169',this)">复制</button></span></div><pre id="code-169"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> majorityElement(<span class="syn-kw">self</span>, nums):
        cand = <span class="syn-kw">None</span>
        cnt = <span class="syn-num">0</span>
        <span class="syn-kw">for</span> x <span class="syn-kw">in</span> nums:
            <span class="syn-kw">if</span> cnt == <span class="syn-num">0</span>:
                cand = x
            cnt += <span class="syn-num">1</span> <span class="syn-kw">if</span> x == cand <span class="syn-kw">else</span> -<span class="syn-num">1</span>
        <span class="syn-kw">return</span> cand</code></pre></div>

</article>
<article class="card" data-num="189" data-diff="中等" data-topic="数组与哈希" data-search="轮转数组把数组向右轮转 k 位，要求原地改。给定一个整数数组 nums，将数组中的元素向右轮转 k 个位置，其中 k 是非负数。

        <span class="syn-kw">if</span> root <span class="syn-kw">is</span> <span class="syn-kw">None</span>:
            <span class="syn-kw">return</span> []
        q = deque([root])
        res = []
        <span class="syn-kw">while</span> q:
            res.append(q[-<span class="syn-num">1</span>].val)
            <span class="syn-kw">for</span> _ <span class="syn-kw">in</span> <span class="syn-fn">range</span>(<span class="syn-fn">len</span>(q)):
                node = q.popleft()
                <span class="syn-kw">if</span> node.left <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span>:
                    q.append(node.left)
                <span class="syn-kw">if</span> node.right <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span>:
                    q.append(node.right)

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">给 <code>0/1</code> 网格，<code>1</code> 连成一块算一个岛，求岛的数量（上下左右相邻）。</div></div>

<span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> numIslands(<span class="syn-kw">self</span>, grid):
        <span class="syn-kw">if</span> <span class="syn-kw">not</span> grid <span class="syn-kw">or</span> <span class="syn-kw">not</span> grid[<span class="syn-num">0</span>]:

        m, n = <span class="syn-fn">len</span>(grid), <span class="syn-fn">len</span>(grid[<span class="syn-num">0</span>])
        dirs = [(<span class="syn-num">0</span>, <span class="syn-num">1</span>), (<span class="syn-num">0</span>, -<span class="syn-num">1</span>), (<span class="syn-num">1</span>, <span class="syn-num">0</span>), (-<span class="syn-num">1</span>, <span class="syn-num">0</span>)]
        cnt = <span class="syn-num">0</span>
        <span class="syn-kw">for</span> r <span class="syn-kw">in</span> <span class="syn-fn">range</span>(m):
            <span class="syn-kw">for</span> c <span class="syn-kw">in</span> <span class="syn-fn">range</span>(n):
                <span class="syn-kw">if</span> grid[r][c] != <span class="syn-str">&quot;1&quot;</span>:
                    <span class="syn-kw">continue</span>
                cnt += <span class="syn-num">1</span>
                q = deque([(r, c)])
                grid[r][c] = <span class="syn-str">&quot;0&quot;</span>           <span class="syn-comment"># 入队时就标记</span>
                <span class="syn-kw">while</span> q:
                    x, y = q.popleft()
                    <span class="syn-kw">for</span> dx, dy <span class="syn-kw">in</span> dirs:
                        nx, ny = x + dx, y + dy
                        <span class="syn-kw">if</span> <span class="syn-num">0</span> &lt;= nx &lt; m <span class="syn-kw">and</span> <span class="syn-num">0</span> &lt;= ny &lt; n <span class="syn-kw">and</span> grid[nx][ny] == <span class="syn-str">&quot;1&quot;</span>:
                            grid[nx][ny] = <span class="syn-str">&quot;0&quot;</span>
                            q.append((nx, ny))
        <span class="syn-kw">return</span> cnt</code></pre></div>

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/reverse-linked-list/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你单链表的头节点 head ，请你反转链表，并返回反转后的链表。

示例 1：

输入：head = [1,2,3,4,5]
输出：[5,4,3,2,1]

示例 2：

输入：head = [1,2]
输出：[2,1]

示例 3：

输入：head = []
输出：[]

提示：

• 链表中节点的数目范围是 [0, 5000]

• -5000

进阶：链表可以选用迭代或递归方式完成反转。你能否用两种方法解决这道题？</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">反转单链表，返回新的头节点。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">三个变量 <code>pre</code>（已经反转好的部分）、<code>cur</code>（当前处理的）、<code>nxt</code>（临时存住下一个）。每轮先把 <code>cur.next</code> 改指向 <code>pre</code>，然后三个一起往前挪。 手动模拟 <code>1 -&gt; 2 -&gt; 3</code>： | 轮 | cur | nxt | 改完后 cur.next | pre | 新 cur | |---|---|---|---|---|---| | 1 | 1 | 2 | None | 1 | 2 | | 2 | 2 | 3 | 1 | 2 | 3 | | 3 | 3 | None | 2 | 3 | None |</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(1)</code></span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(206)">逐行解释 ▸</button><button onclick="cp('code-206',this)">复制</button></span></div><pre id="code-206"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> reverseList(<span class="syn-kw">self</span>, head):
        pre = <span class="syn-kw">None</span>
        cur = head
        <span class="syn-kw">while</span> cur <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span>:
            nxt = cur.next      <span class="syn-comment"># 必须先存，改完就找不回来了</span>
            cur.next = pre
            pre, cur = cur, nxt
        <span class="syn-kw">return</span> pre              <span class="syn-comment"># 循环结束时 pre 是新头</span></code></pre></div>
    
  </div>
</article>
<article class="card" data-num="207" data-diff="中等" data-topic="回溯图论DP" data-search="课程表有 n 门课，先修关系 &#96;[a, b]&#96; 表示「学 a 之前要学 b」，判断能否修完所有课。你这个学期必须选修 numcourses 门课程，记为 0 到 numcourses - 1 。

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/course-schedule/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">你这个学期必须选修 numCourses 门课程，记为 0 到 numCourses - 1 。

在选修某些课程之前需要一些先修课程。 先修课程按数组 prerequisites 给出，其中 prerequisites[i] = [ai, bi] ，表示如果要学习课程 ai 则 必须 先学习课程 bi 。

• 例如，先修课程对 [0, 1] 表示：想要学习课程 0 ，你需要先完成课程 1 。

请你判断是否可能完成所有课程的学习？如果可以，返回 true ；否则，返回 false 。

提示：

• 1 &lt;= numCourses &lt;= 2000

• 0 &lt;= prerequisites.length &lt;= 5000

• prerequisites[i].length == 2

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">有 n 门课，先修关系 <code>[a, b]</code> 表示「学 a 之前要学 b」，判断能否修完所有课。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt"><strong>拓扑排序</strong>。把关系看成有向边 <code>b -&gt; a</code>。维护每个节点的「入度」（还有几门先修课没学），把所有入度为 0 的课入队；每学完一门，就把依赖它的课的入度减一，减到 0 就入队。最后学完的门数等于 n 才说明没有环。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n + e)</code>（e 是先修关系条数）；空间 <code>O(n + e)</code></span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(207)">逐行解释 ▸</button><button onclick="cp('code-207',this)">复制</button></span></div><pre id="code-207"><code><span class="syn-kw">from</span> collections <span class="syn-kw">import</span> defaultdict, deque

<span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> canFinish(<span class="syn-kw">self</span>, numCourses, prerequisites):
        g = defaultdict(<span class="syn-fn">list</span>)
        indeg = [<span class="syn-num">0</span>] * numCourses
        <span class="syn-kw">for</span> a, b <span class="syn-kw">in</span> prerequisites:
            g[b].append(a)
            indeg[a] += <span class="syn-num">1</span>
        q = deque(i <span class="syn-kw">for</span> i <span class="syn-kw">in</span> <span class="syn-fn">range</span>(numCourses) <span class="syn-kw">if</span> indeg[i] == <span class="syn-num">0</span>)
        learned = <span class="syn-num">0</span>
        <span class="syn-kw">while</span> q:
            u = q.popleft()
            learned += <span class="syn-num">1</span>
            <span class="syn-kw">for</span> v <span class="syn-kw">in</span> g[u]:
                indeg[v] -= <span class="syn-num">1</span>
                <span class="syn-kw">if</span> indeg[v] == <span class="syn-num">0</span>:
                    q.append(v)
        <span class="syn-kw">return</span> learned == numCourses</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">边方向别搞反（<code>b -&gt; a</code>）；有环时环上节点入度永远降不到 0，<code>learned &lt; n</code> 自然返回 False。</div></div>
  </div>
</article>
<article class="card" data-num="208" data-diff="中等" data-topic="回溯图论DP" data-search="实现 trie实现前缀树，支持插入、查找完整单词、查找前缀。trie（发音类似 &quot;try&quot;）或者说 前缀树 是一种树形数据结构，用于高效地存储和检索字符串数据集中的键。这一数据结构有相当多的应用情景，例如自动补全和拼写检查。

请你实现 trie 类：

• trie() 初始化前缀树对象。

• void insert(string word) 向前缀树中插入字符串 word 。

• boolean search(string word) 如果字符串 word 在前缀树中，返回 true（即，在检索之前已经插入）；否则，返回 false 。

• boolean startswith(string prefix) 如果之前已经插入的字符串 word 的前缀之一为 prefix ，返回 true ；否则，返回 false 。

示例：

输入
[&quot;trie&quot;, &quot;insert&quot;, &quot;search&quot;, &quot;search&quot;, &quot;startswith&quot;, &quot;insert&quot;, &quot;search&quot;]
[[], [&quot;apple&quot;], [&quot;apple&quot;], [&quot;app&quot;], [&quot;app&quot;], [&quot;app&quot;], [&quot;app&quot;]]
输出
[null, null, true, false, true, null, true]

解释
trie trie = new trie();
trie.insert(&quot;apple&quot;);
trie.search(&quot;apple&quot;); // 返回 true
trie.search(&quot;app&quot;); // 返回 false
trie.startswith(&quot;app&quot;); // 返回 true
trie.insert(&quot;app&quot;);
trie.search(&quot;app&quot;); // 返回 true

提示：

• 1 &lt;= word.length, prefix.length &lt;= 2000

• word 和 prefix 仅由小写英文字母组成

• insert、search 和 startswith 调用次数 总计 不超过 3 * 104 次">

  <div class="body" id="body-208" hidden>
    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/implement-trie-prefix-tree/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">Trie（发音类似 &quot;try&quot;）或者说 前缀树 是一种树形数据结构，用于高效地存储和检索字符串数据集中的键。这一数据结构有相当多的应用情景，例如自动补全和拼写检查。

请你实现 Trie 类：

• Trie() 初始化前缀树对象。

• void insert(String word) 向前缀树中插入字符串 word 。

• boolean search(String word) 如果字符串 word 在前缀树中，返回 true（即，在检索之前已经插入）；否则，返回 false 。

• boolean startsWith(String prefix) 如果之前已经插入的字符串 word 的前缀之一为 prefix ，返回 true ；否则，返回 false 。

示例：

输入
[&quot;Trie&quot;, &quot;insert&quot;, &quot;search&quot;, &quot;search&quot;, &quot;startsWith&quot;, &quot;insert&quot;, &quot;search&quot;]
[[], [&quot;apple&quot;], [&quot;apple&quot;], [&quot;app&quot;], [&quot;app&quot;], [&quot;app&quot;], [&quot;app&quot;]]
输出
[null, null, true, false, true, null, true]

解释
Trie trie = new Trie();
trie.insert(&quot;apple&quot;);
trie.search(&quot;apple&quot;); // 返回 True
trie.search(&quot;app&quot;); // 返回 False
trie.startsWith(&quot;app&quot;); // 返回 True
trie.insert(&quot;app&quot;);
trie.search(&quot;app&quot;); // 返回 True

提示：

• 1 &lt;= word.length, prefix.length &lt;= 2000

• word 和 prefix 仅由小写英文字母组成

• insert、search 和 startsWith 调用次数 总计 不超过 3 * 104 次</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">实现前缀树，支持插入、查找完整单词、查找前缀。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">每个节点用字典存「字符 → 子节点」，再加一个 <code>is_end</code> 标记「是否有单词在这里结束」。插入就是顺着字符一路建节点。 <code>insert</code> / <code>search</code> / <code>startsWith</code> 都是 <code>O(长度)</code>，空间 <code>O(所有单词总字符数)</code>。</div></div>
    <div class="meta"><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(208)">逐行解释 ▸</button><button onclick="cp('code-208',this)">复制</button></span></div><pre id="code-208"><code><span class="syn-kw">class</span> TrieNode:
    <span class="syn-kw">def</span> __init__(<span class="syn-kw">self</span>):
        <span class="syn-kw">self</span>.children = {}
        <span class="syn-kw">self</span>.is_end = <span class="syn-kw">False</span>

<span class="syn-kw">class</span> Trie:
    <span class="syn-kw">def</span> __init__(<span class="syn-kw">self</span>):
        <span class="syn-kw">self</span>.root = TrieNode()

    <span class="syn-kw">def</span> insert(<span class="syn-kw">self</span>, word):
        cur = <span class="syn-kw">self</span>.root
        <span class="syn-kw">for</span> ch <span class="syn-kw">in</span> word:
            <span class="syn-kw">if</span> ch <span class="syn-kw">not</span> <span class="syn-kw">in</span> cur.children:
                cur.children[ch] = TrieNode()
            cur = cur.children[ch]
        cur.is_end = <span class="syn-kw">True</span>

    <span class="syn-kw">def</span> _walk(<span class="syn-kw">self</span>, s):
        cur = <span class="syn-kw">self</span>.root
        <span class="syn-kw">for</span> ch <span class="syn-kw">in</span> s:
            <span class="syn-kw">if</span> ch <span class="syn-kw">not</span> <span class="syn-kw">in</span> cur.children:
                <span class="syn-kw">return</span> <span class="syn-kw">None</span>
            cur = cur.children[ch]
        <span class="syn-kw">return</span> cur

    <span class="syn-kw">def</span> search(<span class="syn-kw">self</span>, word):
        node = <span class="syn-kw">self</span>._walk(word)
        <span class="syn-kw">return</span> node <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span> <span class="syn-kw">and</span> node.is_end

    <span class="syn-kw">def</span> startsWith(<span class="syn-kw">self</span>, prefix):
        <span class="syn-kw">return</span> <span class="syn-kw">self</span>._walk(prefix) <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt"><code>search</code> 必须检查 <code>is_end</code>——插入过 <code>&quot;apple&quot;</code> 时 <code>search(&quot;app&quot;)</code> 应该是 False，但 <code>startsWith(&quot;app&quot;)</code> 是 True。</div></div>
  </div>
</article>
<article class="card" data-num="215" data-diff="中等" data-topic="二分栈堆贪心" data-search="数组中的第 k 个最大元素找数组里第 k 大的元素。给定整数数组 nums 和整数 k，请返回数组中第 k 个最大的元素。

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/kth-largest-element-in-an-array/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给定整数数组 nums 和整数 k，请返回数组中第 k 个最大的元素。

请注意，你需要找的是数组排序后的第 k 个最大的元素，而不是第 k 个不同的元素。

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">找数组里第 K 大的元素。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">维护一个大小恰好为 K 的<strong>小根堆</strong>。遍历时堆没满就放，满了且新数比堆顶大就替换堆顶。最后堆里就是最大的 K 个数，堆顶是这 K 个里最小的，正好是全体第 K 大。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n log k)</code>；空间 <code>O(k)</code></span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(215)">逐行解释 ▸</button><button onclick="cp('code-215',this)">复制</button></span></div><pre id="code-215"><code><span class="syn-kw">import</span> heapq

<span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> findKthLargest(<span class="syn-kw">self</span>, nums, k):
        h = []
        <span class="syn-kw">for</span> x <span class="syn-kw">in</span> nums:
            <span class="syn-kw">if</span> <span class="syn-fn">len</span>(h) &lt; k:
                heapq.heappush(h, x)
            <span class="syn-kw">elif</span> x &gt; h[<span class="syn-num">0</span>]:
                heapq.heapreplace(h, x)
        <span class="syn-kw">return</span> h[<span class="syn-num">0</span>]</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">别把整个数组堆化再弹 n-k 次（<code>O(n log n)</code>）；<code>heapreplace</code> 前一定要先判断 <code>x &gt; h[0]</code>。</div></div>

</article>

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/kth-smallest-element-in-a-bst/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给定一个二叉搜索树的根节点 root ，和一个整数 k ，请你设计一个算法查找其中第 k 小的元素（k 从 1 开始计数）。

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">二叉搜索树里找第 K 小的元素。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">中序遍历是升序，数到第 K 个就是答案。用一个计数变量，到 K 就记住答案并提前停。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(h + k)</code>；空间 <code>O(h)</code></span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(230)">逐行解释 ▸</button><button onclick="cp('code-230',this)">复制</button></span></div><pre id="code-230"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> kthSmallest(<span class="syn-kw">self</span>, root, k):
        <span class="syn-kw">self</span>.k = k
        <span class="syn-kw">self</span>.ans = <span class="syn-kw">None</span>
        <span class="syn-kw">def</span> dfs(node):
            <span class="syn-kw">if</span> node <span class="syn-kw">is</span> <span class="syn-kw">None</span> <span class="syn-kw">or</span> <span class="syn-kw">self</span>.ans <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span>:
                <span class="syn-kw">return</span>
            dfs(node.left)
            <span class="syn-kw">self</span>.k -= <span class="syn-num">1</span>
            <span class="syn-kw">if</span> <span class="syn-kw">self</span>.k == <span class="syn-num">0</span>:
                <span class="syn-kw">self</span>.ans = node.val
                <span class="syn-kw">return</span>
            dfs(node.right)
        dfs(root)
        <span class="syn-kw">return</span> <span class="syn-kw">self</span>.ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">计数要放在「访问左子树之后、递归右子树之前」，那正是中序的位置；找到后靠 <code>self.ans is not None</code> 提前剪枝。</div></div>

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/palindrome-linked-list/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你一个单链表的头节点 head ，请你判断该链表是否为回文链表。如果是，返回 true ；否则，返回 false 。

进阶：你能否用 O(n) 时间复杂度和 O(1) 空间复杂度解决此题？</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">判断链表是不是回文，要求 <code>O(1)</code> 额外空间。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">① 快慢指针找到中点；② 把后半段反转；③ 从头和从后半段头一起走，逐个比值。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(1)</code></span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(234)">逐行解释 ▸</button><button onclick="cp('code-234',this)">复制</button></span></div><pre id="code-234"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> isPalindrome(<span class="syn-kw">self</span>, head):
        slow = fast = head
        <span class="syn-kw">while</span> fast <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span> <span class="syn-kw">and</span> fast.next <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span>:
            slow, fast = slow.next, fast.next.next
        pre, cur = <span class="syn-kw">None</span>, slow
        <span class="syn-kw">while</span> cur <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span>:
            nxt = cur.next
            cur.next = pre
            pre, cur = cur, nxt
        <span class="syn-kw">while</span> pre <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span>:
            <span class="syn-kw">if</span> pre.val != head.val:
                <span class="syn-kw">return</span> <span class="syn-kw">False</span>
            pre, head = pre.next, head.next
        <span class="syn-kw">return</span> <span class="syn-kw">True</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">奇数长度时中点那个元素会被前半段包含，但后半段比完就停，不影响结果。</div></div>
  </div>
</article>
<article class="card" data-num="236" data-diff="中等" data-topic="链表与树" data-search="二叉树的最近公共祖先找两个节点最近的一个共同祖先。给定一个二叉树, 找到该树中两个指定节点的最近公共祖先。

示例 3：

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/lowest-common-ancestor-of-a-binary-tree/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给定一个二叉树, 找到该树中两个指定节点的最近公共祖先。

百度百科中最近公共祖先的定义为：“对于有根树 T 的两个节点 p、q，最近公共祖先表示为一个节点 x，满足 x 是 p、q 的祖先且 x 的深度尽可能大（一个节点也可以是它自己的祖先）。”

示例 1：

输入：root = [3,5,1,6,2,0,8,null,null,7,4], p = 5, q = 1
输出：3
解释：节点 5 和节点 1 的最近公共祖先是节点 3 。

示例 2：

输入：root = [3,5,1,6,2,0,8,null,null,7,4], p = 5, q = 4
输出：5
解释：节点 5 和节点 4 的最近公共祖先是节点 5 。因为根据定义最近公共祖先节点可以为节点本身。

示例 3：

输入：root = [1,2], p = 1, q = 2
输出：1

提示：

• 树中节点数目在范围 [2, 105] 内。

• -109 9

• 所有 Node.val 互不相同 。

• p != q

• p 和 q 均存在于给定的二叉树中。</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">找两个节点最近的一个共同祖先。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">递归问左右子树。如果某一侧返回了 <code>None</code>，说明两个节点都在另一侧；如果<strong>两侧都返回了非空</strong>，说明当前节点就是分叉点，即答案。如果当前节点本身就是 p 或 q，直接返回它。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(h)</code></span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(236)">逐行解释 ▸</button><button onclick="cp('code-236',this)">复制</button></span></div><pre id="code-236"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> lowestCommonAncestor(<span class="syn-kw">self</span>, root, p, q):
        <span class="syn-kw">if</span> root <span class="syn-kw">is</span> <span class="syn-kw">None</span> <span class="syn-kw">or</span> root <span class="syn-kw">is</span> p <span class="syn-kw">or</span> root <span class="syn-kw">is</span> q:
            <span class="syn-kw">return</span> root
        left = <span class="syn-kw">self</span>.lowestCommonAncestor(root.left, p, q)
        right = <span class="syn-kw">self</span>.lowestCommonAncestor(root.right, p, q)
        <span class="syn-kw">if</span> left <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span> <span class="syn-kw">and</span> right <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span>:
            <span class="syn-kw">return</span> root
        <span class="syn-kw">return</span> left <span class="syn-kw">if</span> left <span class="syn-kw">is</span> <span class="syn-kw">not</span> <span class="syn-kw">None</span> <span class="syn-kw">else</span> right</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">判断「是不是同一个节点」用 <code>is</code>（这里比的是对象身份，是 <code>is</code> 少数正当用途之一）；返回值可能为空，用 <code>is not None</code> 判断。</div></div>
