  <div class="body" id="body-543" hidden>
    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/diameter-of-binary-tree/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你一棵二叉树的根节点，返回该树的 直径 。

二叉树的 直径 是指树中任意两个节点之间最长路径的 长度 。这条路径可能经过也可能不经过根节点 root 。

两节点之间路径的 长度 由它们之间边数表示。

示例 1：

输入：root = [1,2,3,4,5]
输出：3
解释：3 ，取路径 [4,2,1,3] 或 [5,2,1,3] 的长度。

示例 2：

输入：root = [1,2]
输出：1

提示：

• 树中节点数目在范围 [1, 104] 内

• -100 &lt;= Node.val &lt;= 100</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">直径 = 任意两点间最长路径的**边数**。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">一条最长路径一定经过某个节点，长度 = 它左子树深度 + 右子树深度。递归函数返回「深度」给父节点用，同时用一个全局的 &#96;self.ans&#96; 记「目前见过的最长路径」。这是树题里非常常见的「返回值和全局答案分离」结构。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(h)&#96;</span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-543',this)">复制</button></div><pre id="code-543"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> diameterOfBinaryTree(<span class="syn-kw">self</span>, root):
        <span class="syn-kw">self</span>.ans = <span class="syn-num">0</span>
        <span class="syn-kw">def</span> depth(node):
            <span class="syn-kw">if</span> node <span class="syn-kw">is</span> <span class="syn-kw">None</span>:
                <span class="syn-kw">return</span> <span class="syn-num">0</span>
            l, r = depth(node.left), depth(node.right)
            <span class="syn-kw">self</span>.ans = <span class="syn-fn">max</span>(<span class="syn-kw">self</span>.ans, l + r)
            <span class="syn-kw">return</span> <span class="syn-fn">max</span>(l, r) + <span class="syn-num">1</span>
        depth(root)
        <span class="syn-kw">return</span> <span class="syn-kw">self</span>.ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;self.ans = 0&#96; 必须在入口方法里写，不能放进递归函数（那样每轮都被清零）；而且平台可能复用同一个对象跑多组测试，入口处重置是必须的。</div></div>
  </div>
</article>
<article class="card" data-num="560" data-diff="中等" data-topic="数组与哈希" data-search="和为 k 的子数组统计有多少个连续子数组的和恰好等于 k，**数组里可能有负数**。给你一个整数数组 nums 和一个整数 k ，请你统计并返回 该数组中和为 k 的子数组的个数 。

子数组是数组中元素的连续非空序列。

示例 1：

输入：nums = [1,1,1], k = 2
输出：2

示例 2：

输入：nums = [1,2,3], k = 3
输出：2

提示：

• 1 &lt;= nums.length &lt;= 2 * 104

• -1000 &lt;= nums[i] &lt;= 1000

• -107 &lt;= k &lt;= 107">
  <div class="head" onclick="tog(560)">
    <span class="num">0560</span>
    <span class="ttl">和为 K 的子数组</span>
    <span class="badge b-中等">中等</span>

    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(560)">○</button>

  <div class="body" id="body-560" hidden>
    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/subarray-sum-equals-k/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你一个整数数组 nums 和一个整数 k ，请你统计并返回 该数组中和为 k 的子数组的个数 。

子数组是数组中元素的连续非空序列。

示例 1：

输入：nums = [1,1,1], k = 2
输出：2

示例 2：

输入：nums = [1,2,3], k = 3
输出：2

提示：

• 1 &lt;= nums.length &lt;= 2 * 104

• -1000 &lt;= nums[i] &lt;= 1000

• -107 &lt;= k &lt;= 107</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">统计有多少个连续子数组的和恰好等于 K，**数组里可能有负数**。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">记 &#96;pre[i]&#96; 为「从开头到第 i 个的和」。那么「第 j+1 到 i 的和 = pre[i] - pre[j]」。要让这段等于 K，就得 &#96;pre[j] = pre[i] - K&#96;。于是边算前缀和，边用字典查「之前出现过多少个这样的 &#96;pre[j]&#96;」。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-560',this)">复制</button></div><pre id="code-560"><code><span class="syn-kw">from</span> collections <span class="syn-kw">import</span> defaultdict

<span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> subarraySum(<span class="syn-kw">self</span>, nums, k):
        cnt = defaultdict(<span class="syn-fn">int</span>)
        cnt[<span class="syn-num">0</span>] = <span class="syn-num">1</span>                  <span class="syn-comment"># 前缀和恰好等于 k 的情况</span>
        pre = ans = <span class="syn-num">0</span>
        <span class="syn-kw">for</span> x <span class="syn-kw">in</span> nums:
            pre += x
            ans += cnt[pre - k]
            cnt[pre] += <span class="syn-num">1</span>
        <span class="syn-kw">return</span> ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;cnt[0] = 1&#96; 不能漏，否则「从第一个元素开始、和正好是 K」的情况会被漏掉。另外**别用滑动窗口**，有负数时窗口不成立。</div></div>
  </div>
</article>
<article class="card" data-num="739" data-diff="中等" data-topic="二分栈堆贪心" data-search="每日温度对每个位置，求还要等几天才出现更高的温度，没有就 0。给定一个整数数组 temperatures ，表示每天的温度，返回一个数组 answer ，其中 answer[i] 是指对于第 i 天，下一个更高温度出现在几天后。如果气温在这之后都不会升高，请在该位置用 0 来代替。

示例 1:

输入: temperatures = [73,74,75,71,69,72,76,73]
输出: [1,1,4,2,1,1,0,0]

示例 2:

输入: temperatures = [30,40,50,60]
输出: [1,1,1,0]

示例 3:

输入: temperatures = [30,60,90]
输出: [1,1,0]

提示：

• 1 &lt;= temperatures.length &lt;= 105

• 30 &lt;= temperatures[i] &lt;= 100">
  <div class="head" onclick="tog(739)">
    <span class="num">0739</span>
    <span class="ttl">每日温度</span>
    <span class="badge b-中等">中等</span>

  <div class="body" id="body-739" hidden>
    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/daily-temperatures/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给定一个整数数组 temperatures ，表示每天的温度，返回一个数组 answer ，其中 answer[i] 是指对于第 i 天，下一个更高温度出现在几天后。如果气温在这之后都不会升高，请在该位置用 0 来代替。

示例 1:

输入: temperatures = [73,74,75,71,69,72,76,73]
输出: [1,1,4,2,1,1,0,0]

示例 2:

输入: temperatures = [30,40,50,60]
输出: [1,1,1,0]

示例 3:

输入: temperatures = [30,60,90]
输出: [1,1,0]

提示：

• 1 &lt;= temperatures.length &lt;= 105

• 30 &lt;= temperatures[i] &lt;= 100</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">对每个位置，求还要等几天才出现更高的温度，没有就 0。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">用**单调栈**存「还没找到更高温度的日子」的下标，对应温度从栈底到栈顶递减。新温度比栈顶高时，栈顶这些日子终于等到了，弹出来算天数。**每个下标最多进栈、出栈各一次**，所以整体 &#96;O(n)&#96;。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-739',this)">复制</button></div><pre id="code-739"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> dailyTemperatures(<span class="syn-kw">self</span>, temperatures):
        st = []
        ans = [<span class="syn-num">0</span>] * <span class="syn-fn">len</span>(temperatures)
        <span class="syn-kw">for</span> i, x <span class="syn-kw">in</span> <span class="syn-fn">enumerate</span>(temperatures):
            <span class="syn-kw">while</span> st <span class="syn-kw">and</span> temperatures[st[-<span class="syn-num">1</span>]] &lt; x:
                j = st.pop()
                ans[j] = i - j
            st.append(i)
        <span class="syn-kw">return</span> ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">栈里存**下标**，不是温度值——答案要的是天数差。</div></div>
  </div>
</article>
<article class="card" data-num="763" data-diff="中等" data-topic="二分栈堆贪心" data-search="划分字母区间把字符串切成尽可能多的片段，要求同一个字母只出现在一个片段里。给你一个字符串 s 。我们要把这个字符串划分为尽可能多的片段，同一字母最多出现在一个片段中。例如，字符串 &quot;ababcc&quot; 能够被分为 [&quot;abab&quot;, &quot;cc&quot;]，但类似 [&quot;aba&quot;, &quot;bcc&quot;] 或 [&quot;ab&quot;, &quot;ab&quot;, &quot;cc&quot;] 的划分是非法的。

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/partition-labels/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你一个字符串 s 。我们要把这个字符串划分为尽可能多的片段，同一字母最多出现在一个片段中。例如，字符串 &quot;ababcc&quot; 能够被分为 [&quot;abab&quot;, &quot;cc&quot;]，但类似 [&quot;aba&quot;, &quot;bcc&quot;] 或 [&quot;ab&quot;, &quot;ab&quot;, &quot;cc&quot;] 的划分是非法的。

注意，划分结果需要满足：将所有划分结果按顺序连接，得到的字符串仍然是 s 。

输出：[9,7,8]
解释：
划分结果为 &quot;ababcbaca&quot;、&quot;defegde&quot;、&quot;hijhklij&quot; 。
每个字母最多出现在一个片段中。
像 &quot;ababcbacadefegde&quot;, &quot;hijhklij&quot; 这样的划分是错误的，因为划分的片段数较少。

示例 2：

输入：s = &quot;eccbbbbdec&quot;
输出：[10]

提示：

• s 仅由小写英文字母组成</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">把字符串切成尽可能多的片段，要求同一个字母只出现在一个片段里。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">先记录每个字母**最后出现的位置**。扫描时不断把当前片段的右端点 &#96;end&#96; 推到「片段内所有字母的最远位置」；一旦扫到 &#96;i == end&#96;，说明这个片段里所有字母都不会再出现在后面，可以在这里切一刀。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(n)&#96;；空间 &#96;O(字符集)&#96;</span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-763',this)">复制</button></div><pre id="code-763"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> partitionLabels(<span class="syn-kw">self</span>, s):
        last = {c: i <span class="syn-kw">for</span> i, c <span class="syn-kw">in</span> <span class="syn-fn">enumerate</span>(s)}
        start = end = <span class="syn-num">0</span>
        res = []
        <span class="syn-kw">for</span> i, c <span class="syn-kw">in</span> <span class="syn-fn">enumerate</span>(s):
            end = <span class="syn-fn">max</span>(end, last[c])
            <span class="syn-kw">if</span> i == end:
                res.append(i - start + <span class="syn-num">1</span>)
                start = i + <span class="syn-num">1</span>
        <span class="syn-kw">return</span> res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">&#96;start&#96; 要在切完后更新；字典推导式 &#96;{c: i for ...}&#96; 天然保留每个字母最后一次的下标。</div></div>

    <div class="blk"><div class="lbl">思路</div><div class="txt">**多源 BFS**——把所有初始烂橘子一起入队，按「层」扩散，每层就是一分钟。同时记好橘子数量，最后没减到 0 说明有孤岛。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(mn)&#96;；空间 &#96;O(mn)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-994',this)">复制</button></div><pre id="code-994"><code><span class="syn-kw">from</span> collections <span class="syn-kw">import</span> deque

<span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> orangesRotting(<span class="syn-kw">self</span>, grid):
        m, n = <span class="syn-fn">len</span>(grid), <span class="syn-fn">len</span>(grid[<span class="syn-num">0</span>])
        q = deque()
        fresh = <span class="syn-num">0</span>
        <span class="syn-kw">for</span> i <span class="syn-kw">in</span> <span class="syn-fn">range</span>(m):
            <span class="syn-kw">for</span> j <span class="syn-kw">in</span> <span class="syn-fn">range</span>(n):
                <span class="syn-kw">if</span> grid[i][j] == <span class="syn-num">2</span>:
                    q.append((i, j))
                <span class="syn-kw">elif</span> grid[i][j] == <span class="syn-num">1</span>:
                    fresh += <span class="syn-num">1</span>
        minutes = <span class="syn-num">0</span>
        dirs = [(<span class="syn-num">0</span>, <span class="syn-num">1</span>), (<span class="syn-num">0</span>, -<span class="syn-num">1</span>), (<span class="syn-num">1</span>, <span class="syn-num">0</span>), (-<span class="syn-num">1</span>, <span class="syn-num">0</span>)]
        <span class="syn-kw">while</span> q <span class="syn-kw">and</span> fresh:
            <span class="syn-kw">for</span> _ <span class="syn-kw">in</span> <span class="syn-fn">range</span>(<span class="syn-fn">len</span>(q)):        <span class="syn-comment"># 这一层 = 一分钟</span>
                r, c = q.popleft()
                <span class="syn-kw">for</span> dr, dc <span class="syn-kw">in</span> dirs:
                    nr, nc = r + dr, c + dc
                    <span class="syn-kw">if</span> <span class="syn-num">0</span> &lt;= nr &lt; m <span class="syn-kw">and</span> <span class="syn-num">0</span> &lt;= nc &lt; n <span class="syn-kw">and</span> grid[nr][nc] == <span class="syn-num">1</span>:
                        grid[nr][nc] = <span class="syn-num">2</span>
                        fresh -= <span class="syn-num">1</span>
                        q.append((nr, nc))
            minutes += <span class="syn-num">1</span>
        <span class="syn-kw">return</span> minutes <span class="syn-kw">if</span> fresh == <span class="syn-num">0</span> <span class="syn-kw">else</span> -<span class="syn-num">1</span></code></pre></div>

<article class="card" data-num="1143" data-diff="中等" data-topic="回溯图论DP" data-search="最长公共子序列两个字符串的最长公共子序列长度（不要求连续）。给定两个字符串 text1 和 text2，返回这两个字符串的最长 公共子序列 的长度。如果不存在 公共子序列 ，返回 0 。

一个字符串的 子序列 是指这样一个新的字符串：它是由原字符串在不改变字符的相对顺序的情况下删除某些字符（也可以不删除任何字符）后组成的新字符串。

• 例如，&quot;ace&quot; 是 &quot;abcde&quot; 的子序列，但 &quot;aec&quot; 不是 &quot;abcde&quot; 的子序列。

两个字符串的 公共子序列 是这两个字符串所共同拥有的子序列。

示例 1：

输入：text1 = &quot;abcde&quot;, text2 = &quot;ace&quot;
输出：3
解释：最长公共子序列是 &quot;ace&quot; ，它的长度为 3 。

示例 2：

输入：text1 = &quot;abc&quot;, text2 = &quot;abc&quot;
输出：3
解释：最长公共子序列是 &quot;abc&quot; ，它的长度为 3 。

示例 3：

输入：text1 = &quot;abc&quot;, text2 = &quot;def&quot;
输出：0
解释：两个字符串没有公共子序列，返回 0 。

    <div class="blk"><div class="lbl">思路</div><div class="txt">&#96;dp[i][j]&#96; = &#96;a&#96; 的前 i 个字符和 &#96;b&#96; 的前 j 个字符的 LCS 长度。若 &#96;a[i-1] == b[j-1]&#96;，可以一起用上：&#96;dp[i-1][j-1] + 1&#96;；否则取「去掉 a 最后一个」和「去掉 b 最后一个」里较大的。</div></div>
    <div class="meta"><span class="cost">时间 &#96;O(mn)&#96;；空间 &#96;O(n)&#96;</span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><button onclick="cp('code-1143',this)">复制</button></div><pre id="code-1143"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> longestCommonSubsequence(<span class="syn-kw">self</span>, text1, text2):
        m, n = <span class="syn-fn">len</span>(text1), <span class="syn-fn">len</span>(text2)
        prev = [<span class="syn-num">0</span>] * (n + <span class="syn-num">1</span>)
        <span class="syn-kw">for</span> i <span class="syn-kw">in</span> <span class="syn-fn">range</span>(<span class="syn-num">1</span>, m + <span class="syn-num">1</span>):
            cur = [<span class="syn-num">0</span>] * (n + <span class="syn-num">1</span>)
            <span class="syn-kw">for</span> j <span class="syn-kw">in</span> <span class="syn-fn">range</span>(<span class="syn-num">1</span>, n + <span class="syn-num">1</span>):
                <span class="syn-kw">if</span> text1[i - <span class="syn-num">1</span>] == text2[j - <span class="syn-num">1</span>]:
                    cur[j] = prev[j - <span class="syn-num">1</span>] + <span class="syn-num">1</span>
                <span class="syn-kw">else</span>:
                    cur[j] = <span class="syn-fn">max</span>(prev[j], cur[j - <span class="syn-num">1</span>])
            prev = cur
        <span class="syn-kw">return</span> prev[n]</code></pre></div>

function tog(n){
  const b=document.getElementById('body-'+n), c=b.closest('.card');
  b.hidden=!b.hidden; c.classList.toggle('open',!b.hidden);
}
function expandAll(open){
  document.querySelectorAll('.card').forEach(c=>{
    if(c.style.display==='none')return;
    const b=c.querySelector('.body'); b.hidden=!open; c.classList.toggle('open',open);
  });
}
function mark(n){
  seen.has(n)?seen.delete(n):seen.add(n);
  localStorage.setItem(KEY,JSON.stringify([...seen]));
  const c=document.querySelector('.card[data-num="'+n+'"]');
  c.classList.toggle('is-done',seen.has(n));
  c.querySelector('.done').textContent=seen.has(n)?'●':'○';
  updateProgress();
  if(onlyUnseen)render();
}
function updateProgress(){
  const s=seen.size;
  document.getElementById('seenCount').textContent=s;
  document.getElementById('pct').textContent=Math.round(s)+'%';
  document.getElementById('fill').style.width=s+'%';
}
function toggleUnseen(){
  onlyUnseen=!onlyUnseen;
  const b=document.getElementById('onlyUnseen');
  b.classList.toggle('on',onlyUnseen);
  b.style.background=onlyUnseen?'var(--accent)':'#fff';
  b.style.color=onlyUnseen?'#fff':'var(--ink)';
  render();
}
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  let shown=0;
  document.querySelectorAll('.card').forEach(c=>{
    const n=+c.dataset.num;
    const okTopic=activeTopic==='全部'||c.dataset.topic===activeTopic;
    const okDiff=activeDiff==='全部'||c.dataset.diff===activeDiff;
    const okQ=!q||c.dataset.search.includes(q)||String(n).includes(q);
    const okSeen=!onlyUnseen||!seen.has(n);
    const show=okTopic&&okDiff&&okQ&&okSeen;
    c.style.display=show?'':'none';
    if(show)shown++;
  });
  let empty=document.getElementById('empty');
  if(!shown){
    if(!empty){empty=document.createElement('div');empty.id='empty';empty.className='empty';empty.textContent='没有匹配的题目';list.appendChild(empty)}
  }else if(empty)empty.remove();
}
document.getElementById('q').addEventListener('input',render);
function cp(id,btn){
  const t=document.getElementById(id).innerText;
  navigator.clipboard.writeText(t).then(()=>{btn.textContent='已复制';setTimeout(()=>btn.textContent='复制',1200)})
   .catch(()=>{btn.textContent='请手动复制';setTimeout(()=>btn.textContent='复制',1200)});
}
seen.forEach(n=>{const c=document.querySelector('.card[data-num="'+n+'"]');if(c){c.classList.add('is-done');c.querySelector('.done').textContent='●'}});
updateProgress();
</script>
