    <span class="syn-kw">def</span> productExceptSelf(<span class="syn-kw">self</span>, nums):
        n = <span class="syn-fn">len</span>(nums)
        ans = [<span class="syn-num">1</span>] * n
        p = <span class="syn-num">1</span>
        <span class="syn-kw">for</span> i <span class="syn-kw">in</span> <span class="syn-fn">range</span>(n):
            ans[i] = p
            p *= nums[i]
        p = <span class="syn-num">1</span>
        <span class="syn-kw">for</span> i <span class="syn-kw">in</span> <span class="syn-fn">range</span>(n - <span class="syn-num">1</span>, -<span class="syn-num">1</span>, -<span class="syn-num">1</span>):
            ans[i] *= p
            p *= nums[i]
        <span class="syn-kw">return</span> ans</code></pre></div>

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/sliding-window-maximum/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你一个整数数组 nums，有一个大小为 k 的滑动窗口从数组的最左侧移动到数组的最右侧。你只可以看到在滑动窗口内的 k 个数字。滑动窗口每次只向右移动一位。

• -104 &lt;= nums[i] &lt;= 104

• 1 &lt;= k &lt;= nums.length</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">返回每个长度为 k 的窗口里的最大值。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">用一个<strong>单调队列</strong>（<code>deque</code>，里面存下标，对应的值从大到小）。新元素进来前，把队尾所有比它小的都弹掉——它们既比新元素小、又比新元素早出窗口，永远不可能成为最大值。队首就是当前窗口最大。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>（每个下标最多进队出队各一次）；空间 <code>O(k)</code></span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(239)">逐行解释 ▸</button><button onclick="cp('code-239',this)">复制</button></span></div><pre id="code-239"><code><span class="syn-kw">from</span> collections <span class="syn-kw">import</span> deque

<span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> maxSlidingWindow(<span class="syn-kw">self</span>, nums, k):
        q = deque()
        ans = []
        <span class="syn-kw">for</span> i, x <span class="syn-kw">in</span> <span class="syn-fn">enumerate</span>(nums):
            <span class="syn-kw">while</span> q <span class="syn-kw">and</span> nums[q[-<span class="syn-num">1</span>]] &lt;= x:
                q.pop()
            q.append(i)
            <span class="syn-kw">if</span> q[<span class="syn-num">0</span>] &lt;= i - k:          <span class="syn-comment"># 队首已滑出窗口</span>
                q.popleft()
            <span class="syn-kw">if</span> i &gt;= k - <span class="syn-num">1</span>:
                ans.append(nums[q[<span class="syn-num">0</span>]])
        <span class="syn-kw">return</span> ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">队列里存<strong>下标</strong>而不是值，否则无法判断「队首是否已滑出窗口」；用 <code>list.pop(0)</code> 会超时，必须 <code>deque</code>。</div></div>
  </div>
</article>

    <div class="blk"><div class="lbl">思路</div><div class="txt">从<strong>右上角</strong>开始。当前值比目标大，说明这一列下面都更大，可以整列排除（左移）；比目标小，说明这一行左边都更小，整行排除（下移）。每步砍掉一行或一列。</div></div>

    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(240)">逐行解释 ▸</button><button onclick="cp('code-240',this)">复制</button></span></div><pre id="code-240"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> searchMatrix(<span class="syn-kw">self</span>, matrix, target):
        m, n = <span class="syn-fn">len</span>(matrix), <span class="syn-fn">len</span>(matrix[<span class="syn-num">0</span>])
        r, c = <span class="syn-num">0</span>, n - <span class="syn-num">1</span>
        <span class="syn-kw">while</span> r &lt; m <span class="syn-kw">and</span> c &gt;= <span class="syn-num">0</span>:
            <span class="syn-kw">if</span> matrix[r][c] == target:
                <span class="syn-kw">return</span> <span class="syn-kw">True</span>
            <span class="syn-kw">elif</span> matrix[r][c] &gt; target:
                c -= <span class="syn-num">1</span>
            <span class="syn-kw">else</span>:
                r += <span class="syn-num">1</span>
        <span class="syn-kw">return</span> <span class="syn-kw">False</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">只能从右上（或左下）开始；从左上角开始，两个方向都是「变大」，无法确定排除哪边。</div></div>

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/perfect-squares/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你一个整数 n ，返回 和为 n 的完全平方数的最少数量 。

完全平方数 是一个整数，其值等于另一个整数的平方；换句话说，其值等于一个整数自乘的积。例如，1、4、9 和 16 都是完全平方数，而 3 和 11 不是。

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">求最少用几个完全平方数（1,4,9…）相加得到 n。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt"><code>dp[i]</code> = 凑出 i 需要的最少个数。对每个 <code>i</code>，试所有 <code>j*j &lt;= i</code>，取 <code>dp[i - j*j] + 1</code> 的最小值。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n√n)</code>；空间 <code>O(n)</code></span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(279)">逐行解释 ▸</button><button onclick="cp('code-279',this)">复制</button></span></div><pre id="code-279"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> numSquares(<span class="syn-kw">self</span>, n):
        dp = [<span class="syn-num">0</span>] + [<span class="syn-fn">float</span>(<span class="syn-str">&quot;inf&quot;</span>)] * n
        <span class="syn-kw">for</span> i <span class="syn-kw">in</span> <span class="syn-fn">range</span>(<span class="syn-num">1</span>, n + <span class="syn-num">1</span>):
            j = <span class="syn-num">1</span>
            <span class="syn-kw">while</span> j * j &lt;= i:
                dp[i] = <span class="syn-fn">min</span>(dp[i], dp[i - j * j] + <span class="syn-num">1</span>)
                j += <span class="syn-num">1</span>
        <span class="syn-kw">return</span> dp[n]</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">初始值是 <code>inf</code> 不是 0（除了 <code>dp[0] = 0</code>），否则 <code>min</code> 永远取不到正确值。</div></div>

</article>

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/move-zeroes/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给定一个数组 nums，编写一个函数将所有 0 移动到数组的末尾，同时保持非零元素的相对顺序。

请注意 ，必须在不复制数组的情况下原地对数组进行操作。

示例 1:

输入: nums = [0,1,0,3,12]

进阶：你能尽量减少完成的操作次数吗？</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">把数组里所有 0 移到末尾，其他数字保持相对顺序，要求原地改。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">设一个 <code>k</code> 表示「下一个非零数该放哪」。遍历时遇到非零就写到 <code>nums[k]</code>，<code>k</code> 前进。因为 <code>k</code> 永远不超过当前读到的位置，不会覆盖还没读的数据。最后把 <code>k</code> 之后全填 0。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(1)</code></span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(283)">逐行解释 ▸</button><button onclick="cp('code-283',this)">复制</button></span></div><pre id="code-283"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> moveZeroes(<span class="syn-kw">self</span>, nums):
        k = <span class="syn-num">0</span>
        <span class="syn-kw">for</span> x <span class="syn-kw">in</span> nums:
            <span class="syn-kw">if</span> x != <span class="syn-num">0</span>:
                nums[k] = x
                k += <span class="syn-num">1</span>
        <span class="syn-kw">for</span> i <span class="syn-kw">in</span> <span class="syn-fn">range</span>(k, <span class="syn-fn">len</span>(nums)):
            nums[i] = <span class="syn-num">0</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">别在遍历时 <code>remove(0)</code>——边遍历边删会漏元素，而且 <code>remove</code> 本身是 <code>O(n)</code>。</div></div>
  </div>
</article>

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">n+1 个数，值都在 1～n 之间，只有一个数重复，不改数组、空间 <code>O(1)</code> 找出它。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">把数组看成「链表」——下标 <code>i</code> 的下一个位置是 <code>nums[i]</code>。因为有重复值，必然有环，环的入口就是重复的数。用快慢指针找环入口：先让快慢相遇，再让一个指针回到起点，两者同速前进，再次相遇处即入口。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(1)</code></span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(287)">逐行解释 ▸</button><button onclick="cp('code-287',this)">复制</button></span></div><pre id="code-287"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> findDuplicate(<span class="syn-kw">self</span>, nums):
        slow = fast = <span class="syn-num">0</span>
        <span class="syn-kw">while</span> <span class="syn-kw">True</span>:
            slow = nums[slow]
            fast = nums[nums[fast]]
            <span class="syn-kw">if</span> slow == fast:
                <span class="syn-kw">break</span>
        p = <span class="syn-num">0</span>
        <span class="syn-kw">while</span> p != slow:
            p = nums[p]
            slow = nums[slow]
        <span class="syn-kw">return</span> p</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">初始都从 0 出发；第二段循环是「先走再比」还是「先比再走」要一致，这里用 <code>while p != slow</code> 保证相遇时返回入口。</div></div>
  </div>
</article>
<article class="card" data-num="295" data-diff="困难" data-topic="二分栈堆贪心" data-search="数据流的中位数不断来新数，随时要能返回当前所有数的中位数。中位数是有序整数列表中的中间值。如果列表的大小是偶数，则没有中间值，中位数是两个中间值的平均值。

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/find-median-from-data-stream/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">中位数是有序整数列表中的中间值。如果列表的大小是偶数，则没有中间值，中位数是两个中间值的平均值。

• 例如 arr = [2,3,4] 的中位数是 3 。

实现 MedianFinder 类:

•
MedianFinder() 初始化 MedianFinder 对象。

•
void addNum(int num) 将数据流中的整数 num 添加到数据结构中。

解释

medianFinder.addNum(2); // arr = [1, 2]
medianFinder.findMedian(); // 返回 1.5 ((1 + 2) / 2)

提示:

• -105 &lt;= num &lt;= 105

• 在调用 findMedian 之前，数据结构中至少有一个元素

• 最多 5 * 104 次调用 addNum 和 findMedian</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">不断来新数，随时要能返回当前所有数的中位数。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt"><strong>双堆</strong>。<code>small</code> 存较小的一半（用负数模拟大根堆），<code>large</code> 存较大的一半（小根堆）。始终保持两边数量差不超过 1，那么中位数就是两边堆顶的平均（或 <code>small</code> 堆顶）。 <code>addNum</code> 是 <code>O(log n)</code>，<code>findMedian</code> 是 <code>O(1)</code>，空间 <code>O(n)</code>。</div></div>
    <div class="meta"><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(295)">逐行解释 ▸</button><button onclick="cp('code-295',this)">复制</button></span></div><pre id="code-295"><code><span class="syn-kw">import</span> heapq

<span class="syn-kw">class</span> MedianFinder:
    <span class="syn-kw">def</span> __init__(<span class="syn-kw">self</span>):
        <span class="syn-kw">self</span>.small = []      <span class="syn-comment"># 存负数 → 堆顶是较小半里最大的</span>
        <span class="syn-kw">self</span>.large = []      <span class="syn-comment"># 小根堆 → 堆顶是较大半里最小的</span>

    <span class="syn-kw">def</span> addNum(<span class="syn-kw">self</span>, num):
        heapq.heappush(<span class="syn-kw">self</span>.small, -num)
        heapq.heappush(<span class="syn-kw">self</span>.large, -heapq.heappop(<span class="syn-kw">self</span>.small))
        <span class="syn-kw">if</span> <span class="syn-fn">len</span>(<span class="syn-kw">self</span>.large) &gt; <span class="syn-fn">len</span>(<span class="syn-kw">self</span>.small):
            heapq.heappush(<span class="syn-kw">self</span>.small, -heapq.heappop(<span class="syn-kw">self</span>.large))

    <span class="syn-kw">def</span> findMedian(<span class="syn-kw">self</span>):
        <span class="syn-kw">if</span> <span class="syn-fn">len</span>(<span class="syn-kw">self</span>.small) &gt; <span class="syn-fn">len</span>(<span class="syn-kw">self</span>.large):
            <span class="syn-kw">return</span> <span class="syn-fn">float</span>(-<span class="syn-kw">self</span>.small[<span class="syn-num">0</span>])
        <span class="syn-kw">return</span> (-<span class="syn-kw">self</span>.small[<span class="syn-num">0</span>] + <span class="syn-kw">self</span>.large[<span class="syn-num">0</span>]) / <span class="syn-num">2</span></code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">每次从 <code>small</code> 顶移到 <code>large</code> 时记得取负号还原；平衡条件是 <code>large</code> 不能比 <code>small</code> 多。</div></div>
  </div>
</article>

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/longest-increasing-subsequence/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你一个整数数组 nums ，找到其中最长严格递增子序列的长度。

子序列 是由数组派生而来的序列，删除（或不删除）数组中的元素而不改变其余元素的顺序。例如，[3,6,2,7] 是数组 [0,3,1,6,2,2,7] 的子序列。

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">找出最长的<strong>严格递增</strong>子序列长度（子序列不要求连续）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt"><code>dp[i]</code> = 以第 i 个元素<strong>结尾</strong>的最长递增子序列长度。对每个 i，往前找所有比它小的 j，取 <code>dp[j] + 1</code> 的最大值。答案是整个 <code>dp</code> 里的最大值（不一定以最后一个元素结尾）。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n²)</code>；空间 <code>O(n)</code></span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(300)">逐行解释 ▸</button><button onclick="cp('code-300',this)">复制</button></span></div><pre id="code-300"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> lengthOfLIS(<span class="syn-kw">self</span>, nums):
        n = <span class="syn-fn">len</span>(nums)
        dp = [<span class="syn-num">1</span>] * n
        <span class="syn-kw">for</span> i <span class="syn-kw">in</span> <span class="syn-fn">range</span>(n):
            <span class="syn-kw">for</span> j <span class="syn-kw">in</span> <span class="syn-fn">range</span>(i):
                <span class="syn-kw">if</span> nums[j] &lt; nums[i]:
                    dp[i] = <span class="syn-fn">max</span>(dp[i], dp[j] + <span class="syn-num">1</span>)
        <span class="syn-kw">return</span> <span class="syn-fn">max</span>(dp)</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt"><code>dp</code> 初值全是 1（每个元素自己就是一个长度 1 的子序列）；<code>n = 0</code> 时 <code>max(dp)</code> 会报错，题目保证非空，自己写测试时要留意。这题还有 <code>O(n log n)</code> 的 <code>bisect</code> 解法，<a href="L04-toolbox.md" target="_blank" rel="noopener">L04 §3</a> 提过思路，学有余力可以再查。</div></div>
  </div>
</article>

    <span class="syn-kw">def</span> coinChange(<span class="syn-kw">self</span>, coins, amount):

<span class="syn-kw">class</span> Solution:

    <div class="blk"><div class="lbl">思路</div><div class="txt">遇到 <code>[</code> 时，把「之前的字符串」和「重复次数」一起压栈，然后清空重新攒；遇到 <code>]</code> 时弹出来拼接。<code>num</code> 可能是多位数，要逐位累加。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(展开后长度)</code>；空间 <code>O(嵌套深度)</code></span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(394)">逐行解释 ▸</button><button onclick="cp('code-394',this)">复制</button></span></div><pre id="code-394"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> decodeString(<span class="syn-kw">self</span>, s):
        stack = []
        cur = <span class="syn-str">&quot;&quot;</span>
        num = <span class="syn-num">0</span>
        <span class="syn-kw">for</span> c <span class="syn-kw">in</span> s:
            <span class="syn-kw">if</span> c.isdigit():
                num = num * <span class="syn-num">10</span> + <span class="syn-fn">int</span>(c)
            <span class="syn-kw">elif</span> c == <span class="syn-str">&quot;[&quot;</span>:
                stack.append((cur, num))
                cur = <span class="syn-str">&quot;&quot;</span>
                num = <span class="syn-num">0</span>
            <span class="syn-kw">elif</span> c == <span class="syn-str">&quot;]&quot;</span>:
                prev, k = stack.pop()
                cur = prev + cur * k
            <span class="syn-kw">else</span>:
                cur += c
        <span class="syn-kw">return</span> cur</code></pre></div>

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">判断数组能否分成两个子集，使两边和相等。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">总和必须是偶数，问题变成「能不能挑出一些数，和恰好等于总和的一半」。这是 <strong>0-1 背包</strong>：每个数只能选一次，所以金额必须<strong>倒序</strong>遍历（正序会让同一个数被重复使用）。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n × target)</code>；空间 <code>O(target)</code></span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(416)">逐行解释 ▸</button><button onclick="cp('code-416',this)">复制</button></span></div><pre id="code-416"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> canPartition(<span class="syn-kw">self</span>, nums):
        total = <span class="syn-fn">sum</span>(nums)
        <span class="syn-kw">if</span> total % <span class="syn-num">2</span>:
            <span class="syn-kw">return</span> <span class="syn-kw">False</span>
        target = total // <span class="syn-num">2</span>
        dp = [<span class="syn-kw">False</span>] * (target + <span class="syn-num">1</span>)
        dp[<span class="syn-num">0</span>] = <span class="syn-kw">True</span>
        <span class="syn-kw">for</span> x <span class="syn-kw">in</span> nums:
            <span class="syn-kw">for</span> c <span class="syn-kw">in</span> <span class="syn-fn">range</span>(target, x - <span class="syn-num">1</span>, -<span class="syn-num">1</span>):   <span class="syn-comment"># 倒序！</span>
                dp[c] = dp[c] <span class="syn-kw">or</span> dp[c - x]
        <span class="syn-kw">return</span> dp[target]</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">倒序是本题的命根子，写成正序就变成「每个数无限用」，答案会错但样例常常还能过——务必用对拍验证。</div></div>

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">统计有多少条<strong>向下</strong>的路径，节点值之和等于 <code>targetSum</code>（路径不必从根开始、不必到叶子结束）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">和 <a href="L06-array-and-hash.md" target="_blank" rel="noopener">L06 · 560 题</a> 是同一个套路。记从根到当前节点的前缀和 <code>pre</code>，若之前某处的前缀和是 <code>pre - targetSum</code>，那中间这一段就符合。用字典数前缀和出现次数；<strong>离开当前节点时要撤销它的贡献</strong>（回溯），否则会把别的分支的前缀和算进来。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(h)</code></span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(437)">逐行解释 ▸</button><button onclick="cp('code-437',this)">复制</button></span></div><pre id="code-437"><code><span class="syn-kw">from</span> collections <span class="syn-kw">import</span> defaultdict

<span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> pathSum(<span class="syn-kw">self</span>, root, targetSum):
        cnt = defaultdict(<span class="syn-fn">int</span>)
        cnt[<span class="syn-num">0</span>] = <span class="syn-num">1</span>
        <span class="syn-kw">self</span>.ans = <span class="syn-num">0</span>
        <span class="syn-kw">def</span> dfs(node, pre):
            <span class="syn-kw">if</span> node <span class="syn-kw">is</span> <span class="syn-kw">None</span>:
                <span class="syn-kw">return</span>
            pre += node.val
            <span class="syn-kw">self</span>.ans += cnt[pre - targetSum]
            cnt[pre] += <span class="syn-num">1</span>
            dfs(node.left, pre)
            dfs(node.right, pre)
            cnt[pre] -= <span class="syn-num">1</span>          <span class="syn-comment"># 离开这棵子树，撤销</span>
        dfs(root, <span class="syn-num">0</span>)
        <span class="syn-kw">return</span> <span class="syn-kw">self</span>.ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt"><code>cnt[0] = 1</code> 和最后的 <code>cnt[pre] -= 1</code> 都不能少；<code>self.ans</code> 要在入口处重置。</div></div>

    <div class="blk"><div class="lbl">思路</div><div class="txt">维护一个长度恰好为 <code>len(p)</code> 的窗口，和一个 26 长度的计数数组。窗口里每个字母的「还差多少」凑齐后，就是一次命中。用 <code>diff</code> 表示「有多少个字母的数量还不匹配」，避免每轮都去比较整个数组。</div></div>

    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(438)">逐行解释 ▸</button><button onclick="cp('code-438',this)">复制</button></span></div><pre id="code-438"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> findAnagrams(<span class="syn-kw">self</span>, s, p):
        <span class="syn-kw">if</span> <span class="syn-fn">len</span>(s) &lt; <span class="syn-fn">len</span>(p):
            <span class="syn-kw">return</span> []
        need = [<span class="syn-num">0</span>] * <span class="syn-num">26</span>
        <span class="syn-kw">for</span> c <span class="syn-kw">in</span> p:
            need[<span class="syn-fn">ord</span>(c) - <span class="syn-num">97</span>] += <span class="syn-num">1</span>
        win = [<span class="syn-num">0</span>] * <span class="syn-num">26</span>
        ans = []
        k = <span class="syn-fn">len</span>(p)
        <span class="syn-kw">for</span> i, c <span class="syn-kw">in</span> <span class="syn-fn">enumerate</span>(s):
            win[<span class="syn-fn">ord</span>(c) - <span class="syn-num">97</span>] += <span class="syn-num">1</span>
            <span class="syn-kw">if</span> i &gt;= k:
                win[<span class="syn-fn">ord</span>(s[i - k]) - <span class="syn-num">97</span>] -= <span class="syn-num">1</span>
            <span class="syn-kw">if</span> i &gt;= k - <span class="syn-num">1</span> <span class="syn-kw">and</span> win == need:
                ans.append(i - k + <span class="syn-num">1</span>)
        <span class="syn-kw">return</span> ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt"><code>ord(c) - 97</code> 里的 97 是 <code>&#x27;a&#x27;</code> 的编号，更清楚的写法是 <code>ord(c) - ord(&#x27;a&#x27;)</code>；列表相等比较 <code>win == need</code> 是逐项比，长度只有 26 所以很便宜。</div></div>

<article class="card" data-num="543" data-diff="简单" data-topic="链表与树" data-search="二叉树的直径直径 = 任意两点间最长路径的**边数**。给你一棵二叉树的根节点，返回该树的 直径 。

二叉树的 直径 是指树中任意两个节点之间最长路径的 长度 。这条路径可能经过也可能不经过根节点 root 。

两节点之间路径的 长度 由它们之间边数表示。

示例 1：

输入：root = [1,2,3,4,5]
输出：3

示例 2：

输入：root = [1,2]
输出：1

提示：

• 树中节点数目在范围 [1, 104] 内

• -100 &lt;= node.val &lt;= 100">
  <div class="head" onclick="tog(543)">

  <div class="body" id="body-543" hidden>
    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/diameter-of-binary-tree/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你一棵二叉树的根节点，返回该树的 直径 。

二叉树的 直径 是指树中任意两个节点之间最长路径的 长度 。这条路径可能经过也可能不经过根节点 root 。

两节点之间路径的 长度 由它们之间边数表示。

示例 1：

输入：root = [1,2,3,4,5]
输出：3
解释：3 ，取路径 [4,2,1,3] 或 [5,2,1,3] 的长度。

示例 2：

输入：root = [1,2]
输出：1

提示：

• 树中节点数目在范围 [1, 104] 内

• -100 &lt;= Node.val &lt;= 100</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">直径 = 任意两点间最长路径的<strong>边数</strong>。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">一条最长路径一定经过某个节点，长度 = 它左子树深度 + 右子树深度。递归函数返回「深度」给父节点用，同时用一个全局的 <code>self.ans</code> 记「目前见过的最长路径」。这是树题里非常常见的「返回值和全局答案分离」结构。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(h)</code></span><span class="src">讲解见 L08-linkedlist-tree.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(543)">逐行解释 ▸</button><button onclick="cp('code-543',this)">复制</button></span></div><pre id="code-543"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> diameterOfBinaryTree(<span class="syn-kw">self</span>, root):
        <span class="syn-kw">self</span>.ans = <span class="syn-num">0</span>
        <span class="syn-kw">def</span> depth(node):
            <span class="syn-kw">if</span> node <span class="syn-kw">is</span> <span class="syn-kw">None</span>:
                <span class="syn-kw">return</span> <span class="syn-num">0</span>
            l, r = depth(node.left), depth(node.right)
            <span class="syn-kw">self</span>.ans = <span class="syn-fn">max</span>(<span class="syn-kw">self</span>.ans, l + r)
            <span class="syn-kw">return</span> <span class="syn-fn">max</span>(l, r) + <span class="syn-num">1</span>
        depth(root)
        <span class="syn-kw">return</span> <span class="syn-kw">self</span>.ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt"><code>self.ans = 0</code> 必须在入口方法里写，不能放进递归函数（那样每轮都被清零）；而且平台可能复用同一个对象跑多组测试，入口处重置是必须的。</div></div>
  </div>
</article>
<article class="card" data-num="560" data-diff="中等" data-topic="数组与哈希" data-search="和为 k 的子数组统计有多少个连续子数组的和恰好等于 k，**数组里可能有负数**。给你一个整数数组 nums 和一个整数 k ，请你统计并返回 该数组中和为 k 的子数组的个数 。

子数组是数组中元素的连续非空序列。

示例 1：

输入：nums = [1,1,1], k = 2
输出：2

示例 2：

输入：nums = [1,2,3], k = 3
输出：2

提示：

• 1 &lt;= nums.length &lt;= 2 * 104

• -1000 &lt;= nums[i] &lt;= 1000

• -107 &lt;= k &lt;= 107">
  <div class="head" onclick="tog(560)">

    <span class="badge b-中等">中等</span>

    <button class="done" title="标记已看" onclick="event.stopPropagation();mark(560)">○</button>

  <div class="body" id="body-560" hidden>
    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/subarray-sum-equals-k/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你一个整数数组 nums 和一个整数 k ，请你统计并返回 该数组中和为 k 的子数组的个数 。

子数组是数组中元素的连续非空序列。

示例 1：

输入：nums = [1,1,1], k = 2
输出：2

示例 2：

输入：nums = [1,2,3], k = 3
输出：2

提示：

• 1 &lt;= nums.length &lt;= 2 * 104

• -1000 &lt;= nums[i] &lt;= 1000

• -107 &lt;= k &lt;= 107</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">统计有多少个连续子数组的和恰好等于 K，<strong>数组里可能有负数</strong>。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">记 <code>pre[i]</code> 为「从开头到第 i 个的和」。那么「第 j+1 到 i 的和 = pre[i] - pre[j]」。要让这段等于 K，就得 <code>pre[j] = pre[i] - K</code>。于是边算前缀和，边用字典查「之前出现过多少个这样的 <code>pre[j]</code>」。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(n)</code></span><span class="src">讲解见 L06-array-and-hash.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(560)">逐行解释 ▸</button><button onclick="cp('code-560',this)">复制</button></span></div><pre id="code-560"><code><span class="syn-kw">from</span> collections <span class="syn-kw">import</span> defaultdict

<span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> subarraySum(<span class="syn-kw">self</span>, nums, k):
        cnt = defaultdict(<span class="syn-fn">int</span>)
        cnt[<span class="syn-num">0</span>] = <span class="syn-num">1</span>                  <span class="syn-comment"># 前缀和恰好等于 k 的情况</span>
        pre = ans = <span class="syn-num">0</span>
        <span class="syn-kw">for</span> x <span class="syn-kw">in</span> nums:
            pre += x
            ans += cnt[pre - k]
            cnt[pre] += <span class="syn-num">1</span>
        <span class="syn-kw">return</span> ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt"><code>cnt[0] = 1</code> 不能漏，否则「从第一个元素开始、和正好是 K」的情况会被漏掉。另外<strong>别用滑动窗口</strong>，有负数时窗口不成立。</div></div>
  </div>
</article>
<article class="card" data-num="739" data-diff="中等" data-topic="二分栈堆贪心" data-search="每日温度对每个位置，求还要等几天才出现更高的温度，没有就 0。给定一个整数数组 temperatures ，表示每天的温度，返回一个数组 answer ，其中 answer[i] 是指对于第 i 天，下一个更高温度出现在几天后。如果气温在这之后都不会升高，请在该位置用 0 来代替。

示例 1:

输入: temperatures = [73,74,75,71,69,72,76,73]
输出: [1,1,4,2,1,1,0,0]

输出: [1,1,1,0]

示例 3:

输入: temperatures = [30,60,90]
输出: [1,1,0]

提示：

• 1 &lt;= temperatures.length &lt;= 105

• 30 &lt;= temperatures[i] &lt;= 100">

  <div class="body" id="body-739" hidden>
    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/daily-temperatures/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给定一个整数数组 temperatures ，表示每天的温度，返回一个数组 answer ，其中 answer[i] 是指对于第 i 天，下一个更高温度出现在几天后。如果气温在这之后都不会升高，请在该位置用 0 来代替。

示例 1:

输入: temperatures = [73,74,75,71,69,72,76,73]
输出: [1,1,4,2,1,1,0,0]

示例 2:

输入: temperatures = [30,40,50,60]
输出: [1,1,1,0]

示例 3:

输入: temperatures = [30,60,90]
输出: [1,1,0]

提示：

• 1 &lt;= temperatures.length &lt;= 105

• 30 &lt;= temperatures[i] &lt;= 100</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">对每个位置，求还要等几天才出现更高的温度，没有就 0。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">用<strong>单调栈</strong>存「还没找到更高温度的日子」的下标，对应温度从栈底到栈顶递减。新温度比栈顶高时，栈顶这些日子终于等到了，弹出来算天数。<strong>每个下标最多进栈、出栈各一次</strong>，所以整体 <code>O(n)</code>。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(n)</code></span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(739)">逐行解释 ▸</button><button onclick="cp('code-739',this)">复制</button></span></div><pre id="code-739"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> dailyTemperatures(<span class="syn-kw">self</span>, temperatures):
        st = []
        ans = [<span class="syn-num">0</span>] * <span class="syn-fn">len</span>(temperatures)
        <span class="syn-kw">for</span> i, x <span class="syn-kw">in</span> <span class="syn-fn">enumerate</span>(temperatures):
            <span class="syn-kw">while</span> st <span class="syn-kw">and</span> temperatures[st[-<span class="syn-num">1</span>]] &lt; x:
                j = st.pop()
                ans[j] = i - j
            st.append(i)
        <span class="syn-kw">return</span> ans</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt">栈里存<strong>下标</strong>，不是温度值——答案要的是天数差。</div></div>
  </div>
</article>
<article class="card" data-num="763" data-diff="中等" data-topic="二分栈堆贪心" data-search="划分字母区间把字符串切成尽可能多的片段，要求同一个字母只出现在一个片段里。给你一个字符串 s 。我们要把这个字符串划分为尽可能多的片段，同一字母最多出现在一个片段中。例如，字符串 &quot;ababcc&quot; 能够被分为 [&quot;abab&quot;, &quot;cc&quot;]，但类似 [&quot;aba&quot;, &quot;bcc&quot;] 或 [&quot;ab&quot;, &quot;ab&quot;, &quot;cc&quot;] 的划分是非法的。

解释：
划分结果为 &quot;ababcbaca&quot;、&quot;defegde&quot;、&quot;hijhklij&quot; 。
每个字母最多出现在一个片段中。
像 &quot;ababcbacadefegde&quot;, &quot;hijhklij&quot; 这样的划分是错误的，因为划分的片段数较少。

示例 2：

提示：

    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/partition-labels/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">给你一个字符串 s 。我们要把这个字符串划分为尽可能多的片段，同一字母最多出现在一个片段中。例如，字符串 &quot;ababcc&quot; 能够被分为 [&quot;abab&quot;, &quot;cc&quot;]，但类似 [&quot;aba&quot;, &quot;bcc&quot;] 或 [&quot;ab&quot;, &quot;ab&quot;, &quot;cc&quot;] 的划分是非法的。

注意，划分结果需要满足：将所有划分结果按顺序连接，得到的字符串仍然是 s 。

返回一个表示每个字符串片段的长度的列表。

示例 1：

输入：s = &quot;ababcbacadefegdehijhklij&quot;
输出：[9,7,8]
解释：
划分结果为 &quot;ababcbaca&quot;、&quot;defegde&quot;、&quot;hijhklij&quot; 。
每个字母最多出现在一个片段中。
像 &quot;ababcbacadefegde&quot;, &quot;hijhklij&quot; 这样的划分是错误的，因为划分的片段数较少。

示例 2：

输入：s = &quot;eccbbbbdec&quot;
输出：[10]

提示：

• 1 &lt;= s.length &lt;= 500

• s 仅由小写英文字母组成</pre></div>
    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">把字符串切成尽可能多的片段，要求同一个字母只出现在一个片段里。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt">先记录每个字母<strong>最后出现的位置</strong>。扫描时不断把当前片段的右端点 <code>end</code> 推到「片段内所有字母的最远位置」；一旦扫到 <code>i == end</code>，说明这个片段里所有字母都不会再出现在后面，可以在这里切一刀。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(n)</code>；空间 <code>O(字符集)</code></span><span class="src">讲解见 L07-search-stack-heap.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(763)">逐行解释 ▸</button><button onclick="cp('code-763',this)">复制</button></span></div><pre id="code-763"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> partitionLabels(<span class="syn-kw">self</span>, s):
        last = {c: i <span class="syn-kw">for</span> i, c <span class="syn-kw">in</span> <span class="syn-fn">enumerate</span>(s)}
        start = end = <span class="syn-num">0</span>
        res = []
        <span class="syn-kw">for</span> i, c <span class="syn-kw">in</span> <span class="syn-fn">enumerate</span>(s):
            end = <span class="syn-fn">max</span>(end, last[c])
            <span class="syn-kw">if</span> i == end:
                res.append(i - start + <span class="syn-num">1</span>)
                start = i + <span class="syn-num">1</span>
        <span class="syn-kw">return</span> res</code></pre></div>
    <div class="blk err"><div class="lbl">易错</div><div class="txt"><code>start</code> 要在切完后更新；字典推导式 <code>{c: i for ...}</code> 天然保留每个字母最后一次的下标。</div></div>
  </div>
</article>
<article class="card" data-num="994" data-diff="中等" data-topic="回溯图论DP" data-search="腐烂的橘子网格里 &#96;0&#96; 空、&#96;1&#96; 好橘子、&#96;2&#96; 烂橘子。每分钟烂橘子会把上下左右的好橘子变烂，求全部变烂要几分钟，不可能返回 -1。在给定的 m x n 网格 grid 中，每个单元格可以有以下三个值之一：

  <div class="body" id="body-994" hidden>
    <div class="blk official"><div class="lbl">原题 · LeetCode 官方题面 · <a href='https://leetcode.cn/problems/rotting-oranges/' target='_blank'>在官网打开 ↗</a></div><pre class="statement">在给定的 m x n 网格 grid 中，每个单元格可以有以下三个值之一：

解释：因为 0 分钟时已经没有新鲜橘子了，所以答案就是 0 。

提示：

• m == grid.length

• n == grid[i].length

• 1 &lt;= m, n &lt;= 10

• grid[i][j] 仅为 0、1 或 2</pre></div>

    <div class="blk"><div class="lbl">思路</div><div class="txt"><strong>多源 BFS</strong>——把所有初始烂橘子一起入队，按「层」扩散，每层就是一分钟。同时记好橘子数量，最后没减到 0 说明有孤岛。</div></div>

<span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> orangesRotting(<span class="syn-kw">self</span>, grid):
        m, n = <span class="syn-fn">len</span>(grid), <span class="syn-fn">len</span>(grid[<span class="syn-num">0</span>])
        q = deque()
        fresh = <span class="syn-num">0</span>
        <span class="syn-kw">for</span> i <span class="syn-kw">in</span> <span class="syn-fn">range</span>(m):
            <span class="syn-kw">for</span> j <span class="syn-kw">in</span> <span class="syn-fn">range</span>(n):
                <span class="syn-kw">if</span> grid[i][j] == <span class="syn-num">2</span>:
                    q.append((i, j))
                <span class="syn-kw">elif</span> grid[i][j] == <span class="syn-num">1</span>:
                    fresh += <span class="syn-num">1</span>
        minutes = <span class="syn-num">0</span>
        dirs = [(<span class="syn-num">0</span>, <span class="syn-num">1</span>), (<span class="syn-num">0</span>, -<span class="syn-num">1</span>), (<span class="syn-num">1</span>, <span class="syn-num">0</span>), (-<span class="syn-num">1</span>, <span class="syn-num">0</span>)]
        <span class="syn-kw">while</span> q <span class="syn-kw">and</span> fresh:
            <span class="syn-kw">for</span> _ <span class="syn-kw">in</span> <span class="syn-fn">range</span>(<span class="syn-fn">len</span>(q)):        <span class="syn-comment"># 这一层 = 一分钟</span>
                r, c = q.popleft()
                <span class="syn-kw">for</span> dr, dc <span class="syn-kw">in</span> dirs:
                    nr, nc = r + dr, c + dc
                    <span class="syn-kw">if</span> <span class="syn-num">0</span> &lt;= nr &lt; m <span class="syn-kw">and</span> <span class="syn-num">0</span> &lt;= nc &lt; n <span class="syn-kw">and</span> grid[nr][nc] == <span class="syn-num">1</span>:
                        grid[nr][nc] = <span class="syn-num">2</span>
                        fresh -= <span class="syn-num">1</span>
                        q.append((nr, nc))
            minutes += <span class="syn-num">1</span>
        <span class="syn-kw">return</span> minutes <span class="syn-kw">if</span> fresh == <span class="syn-num">0</span> <span class="syn-kw">else</span> -<span class="syn-num">1</span></code></pre></div>

<article class="card" data-num="1143" data-diff="中等" data-topic="回溯图论DP" data-search="最长公共子序列两个字符串的最长公共子序列长度（不要求连续）。给定两个字符串 text1 和 text2，返回这两个字符串的最长 公共子序列 的长度。如果不存在 公共子序列 ，返回 0 。

一个字符串的 子序列 是指这样一个新的字符串：它是由原字符串在不改变字符的相对顺序的情况下删除某些字符（也可以不删除任何字符）后组成的新字符串。

• 例如，&quot;ace&quot; 是 &quot;abcde&quot; 的子序列，但 &quot;aec&quot; 不是 &quot;abcde&quot; 的子序列。

两个字符串的 公共子序列 是这两个字符串所共同拥有的子序列。

示例 1：

输入：text1 = &quot;abcde&quot;, text2 = &quot;ace&quot;
输出：3
解释：最长公共子序列是 &quot;ace&quot; ，它的长度为 3 。

示例 2：

输入：text1 = &quot;abc&quot;, text2 = &quot;abc&quot;
输出：3
解释：最长公共子序列是 &quot;abc&quot; ，它的长度为 3 。

示例 3：

输入：text1 = &quot;abc&quot;, text2 = &quot;def&quot;
输出：0
解释：两个字符串没有公共子序列，返回 0 。

    <div class="blk"><div class="lbl">一句话概括（本项目整理）</div><div class="txt">两个字符串的最长公共子序列长度（不要求连续）。</div></div>
    <div class="blk"><div class="lbl">思路</div><div class="txt"><code>dp[i][j]</code> = <code>a</code> 的前 i 个字符和 <code>b</code> 的前 j 个字符的 LCS 长度。若 <code>a[i-1] == b[j-1]</code>，可以一起用上：<code>dp[i-1][j-1] + 1</code>；否则取「去掉 a 最后一个」和「去掉 b 最后一个」里较大的。</div></div>
    <div class="meta"><span class="cost">时间 <code>O(mn)</code>；空间 <code>O(n)</code></span><span class="src">讲解见 L09-backtrack-graph-dp.md</span></div>
    <div class="codewrap"><div class="codebar"><span>Python 答案</span><span class="cbar-actions"><button class="explain-btn" onclick="openExplain(1143)">逐行解释 ▸</button><button onclick="cp('code-1143',this)">复制</button></span></div><pre id="code-1143"><code><span class="syn-kw">class</span> Solution:
    <span class="syn-kw">def</span> longestCommonSubsequence(<span class="syn-kw">self</span>, text1, text2):
        m, n = <span class="syn-fn">len</span>(text1), <span class="syn-fn">len</span>(text2)
        prev = [<span class="syn-num">0</span>] * (n + <span class="syn-num">1</span>)
        <span class="syn-kw">for</span> i <span class="syn-kw">in</span> <span class="syn-fn">range</span>(<span class="syn-num">1</span>, m + <span class="syn-num">1</span>):
            cur = [<span class="syn-num">0</span>] * (n + <span class="syn-num">1</span>)
            <span class="syn-kw">for</span> j <span class="syn-kw">in</span> <span class="syn-fn">range</span>(<span class="syn-num">1</span>, n + <span class="syn-num">1</span>):
                <span class="syn-kw">if</span> text1[i - <span class="syn-num">1</span>] == text2[j - <span class="syn-num">1</span>]:
                    cur[j] = prev[j - <span class="syn-num">1</span>] + <span class="syn-num">1</span>
                <span class="syn-kw">else</span>:
                    cur[j] = <span class="syn-fn">max</span>(prev[j], cur[j - <span class="syn-num">1</span>])
            prev = cur
        <span class="syn-kw">return</span> prev[n]</code></pre></div>

function tog(n){
  const b=document.getElementById('body-'+n), c=b.closest('.card');
  b.hidden=!b.hidden; c.classList.toggle('open',!b.hidden);
}
function expandAll(open){
  document.querySelectorAll('.card').forEach(c=>{
    if(c.style.display==='none')return;
    const b=c.querySelector('.body'); b.hidden=!open; c.classList.toggle('open',open);
  });
}
function mark(n){
  seen.has(n)?seen.delete(n):seen.add(n);
  localStorage.setItem(KEY,JSON.stringify([...seen]));
  const c=document.querySelector('.card[data-num="'+n+'"]');
  c.classList.toggle('is-done',seen.has(n));
  c.querySelector('.done').textContent=seen.has(n)?'●':'○';
  updateProgress();
  if(onlyUnseen)render();
}
function updateProgress(){
  const s=seen.size;
  document.getElementById('seenCount').textContent=s;
  document.getElementById('pct').textContent=Math.round(s)+'%';
  document.getElementById('fill').style.width=s+'%';
}
function toggleUnseen(){
  onlyUnseen=!onlyUnseen;
  const b=document.getElementById('onlyUnseen');
  b.classList.toggle('on',onlyUnseen);
  b.style.background=onlyUnseen?'var(--accent)':'#fff';
  b.style.color=onlyUnseen?'#fff':'var(--ink)';
  render();
}
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  let shown=0;
  document.querySelectorAll('.card').forEach(c=>{
    const n=+c.dataset.num;
    const okTopic=activeTopic==='全部'||c.dataset.topic===activeTopic;
    const okDiff=activeDiff==='全部'||c.dataset.diff===activeDiff;
    const okQ=!q||c.dataset.search.includes(q)||String(n).includes(q);
    const okSeen=!onlyUnseen||!seen.has(n);
    const show=okTopic&&okDiff&&okQ&&okSeen;
    c.style.display=show?'':'none';
    if(show)shown++;
  });
  let empty=document.getElementById('empty');
  if(!shown){
    if(!empty){empty=document.createElement('div');empty.id='empty';empty.className='empty';empty.textContent='没有匹配的题目';list.appendChild(empty)}
  }else if(empty)empty.remove();
}
document.getElementById('q').addEventListener('input',render);
function cp(id,btn){
  const t=document.getElementById(id).innerText;
  navigator.clipboard.writeText(t).then(()=>{btn.textContent='已复制';setTimeout(()=>btn.textContent='复制',1200)})
   .catch(()=>{btn.textContent='请手动复制';setTimeout(()=>btn.textContent='复制',1200)});
}


function mdInline(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
}
function synLine(code){
  return code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function openExplain(n){
  const x=DATA.find(a=>a.num===n); if(!x)return;
  document.getElementById('exNum').textContent=String(n).padStart(4,'0');
  document.getElementById('exTitle').textContent=x.title;
  const codeLines=(x.code||'').split('\n');
  const ex=x.lines||[];
  let h='';
  for(let i=0;i<codeLines.length;i++){
    const raw=codeLines[i];
    const exp=(ex[i]||'').trim();
    if(!raw.trim() && !exp){
      h+='<div class="exRow empty"><span class="exLn"></span><div></div></div>';
      continue;
    }
    h+='<div class="exRow"><span class="exLn">'+(i+1)+'</span><div>'+
       '<pre class="exCode">'+synLine(raw)+'</pre>'+
       '<p class="exExp'+(exp?'':' none')+'">'+(exp?mdInline(exp):'（这一行是空行或结构分隔，无单独语句）')+'</p>'+
       '</div></div>';
  }
  h+='<p class="mk-note">说明 · 代码与解释来自本项目教程；原题题面见左侧「原题」区。</p>';
  document.getElementById('exBody').innerHTML=h;
  document.getElementById('exBody').scrollTop=0;
  document.getElementById('exMask').classList.add('on');
  document.getElementById('exPanel').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeExplain(){
  document.getElementById('exMask').classList.remove('on');
  document.getElementById('exPanel').classList.remove('on');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeExplain()});
seen.forEach(n=>{const c=document.querySelector('.card[data-num="'+n+'"]');if(c){c.classList.add('is-done');c.querySelector('.done').textContent='●'}});
